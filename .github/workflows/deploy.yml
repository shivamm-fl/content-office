name: deploy
run-name: deploy ${{ github.sha }}
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check Cloudflare secrets
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_API_TOKEN" != true ] || [ "$HAS_ACCOUNT_ID" != true ]; then
            echo "::error::Add them once: gh secret set CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check generated teams registry
        run: |
          pnpm run gen:teams
          if ! git diff --exit-code -- apps/api/src/teams.generated.ts; then
            echo "::error::Commit the generated teams registry before deploying"
            exit 1
          fi
      - name: Check code and scripts
        run: |
          pnpm -r typecheck
          pnpm test
          node --test runner/bridge/ops.test.mjs
          python3 runner/scripts/test_save_work.py
          python3 runner/scripts/test_delivery.py
          python3 runner/scripts/test_item_media.py
          python3 runner/scripts/test_pick_best.py
          python3 runner/scripts/test_save_scopes.py
          python3 runner/scripts/test_script_lock.py
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
