# The studio: builds one reel, started by the office (workflow_dispatch) when a desk hands a reel over or the owner
# asks for changes. Never on a schedule. Ported from ai-course's build-reel.yml (two fix rounds), each part on its
# own machine:
#   build             agent session (no repo write access, sudo off, sandboxed shell; voice, render, cover and gate run
#                     as trusted office tools in the bridge) -> work + media artifacts (version 1)
#   review / review2  trusted: the independent mute test and fact check (scripts/ci_review_round.py) on the content
#   fix / fix2        agent session again when a review asks for it -> versions 2 and 3
#   final             trusted: a fresh review of version 3, the full gate, the video to the release
#                     office-<team>-<item>, the item's files saved, and the result to the office (owner's inbox)
name: office-studio
run-name: "office ${{ inputs.team }} studio ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "office run id", required: true, type: string }
      team: { description: "team folder", required: true, type: string, default: learnai }
      item: { description: "the reel, e.g. q101", required: true, type: string }
permissions: {}
env:
  OFFICE_URL: ${{ vars.OFFICE_URL }}
  RUN_ID: ${{ inputs.run_id }}
  TEAM: ${{ inputs.team }}
  ITEM: ${{ inputs.item }}
  PIP_PACKAGES: "edge-tts==7.2.8 numpy soundfile tiktoken"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions: { contents: read, id-token: write }
    steps:
      - name: Check inputs
        run: |
          [[ "$RUN_ID" =~ ^run_[A-Za-z0-9]{6,40}$ ]] && [[ "$TEAM" =~ ^[a-z0-9-]{2,40}$ ]] && [[ "$ITEM" =~ ^[a-z][0-9]{2,4}$ ]] || { echo "bad inputs"; exit 1; }
          [ -n "$OFFICE_URL" ] || { echo "repository variable OFFICE_URL is not set"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Studio tools
        timeout-minutes: 20
        run: bash runner/scripts/studio_tools.sh
      - name: Lock the machine
        run: bash runner/scripts/lock_machine.sh
      - name: Studio session (build)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OIDC_AUDIENCE: content-office
          OFFICE_PY: /opt/office/venv/bin/python
        run: node runner/bridge/bridge.mjs
      - name: Pack the work
        if: ${{ always() }}
        run: bash runner/scripts/pack_work.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "work-${{ inputs.run_id }}-1", path: "${{ runner.temp }}/work/", retention-days: 3, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "media-${{ inputs.run_id }}-1", path: "${{ runner.temp }}/media/", retention-days: 3, if-no-files-found: ignore }

  review:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: { contents: read }
    outputs: { fix: "${{ steps.r.outputs.fix }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: "work-${{ inputs.run_id }}-1", path: "${{ runner.temp }}/work" }
      - uses: actions/download-artifact@v4
        with: { name: "media-${{ inputs.run_id }}-1", path: "${{ runner.temp }}/media" }
      - name: Reviewer tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.301 >/dev/null
      - name: Independent reviews, round 1 (mute test, fact check)
        id: r
        working-directory: teams/${{ inputs.team }}
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          python3 -I ../../runner/scripts/apply_work.py --work "$RUNNER_TEMP/work" --team "$TEAM" --content-only --media "$RUNNER_TEMP/media"
          python3 scripts/ci_review_round.py "$ITEM" 1
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "qa-${{ inputs.run_id }}-1", path: "teams/${{ inputs.team }}/qa/", retention-days: 3, if-no-files-found: ignore }

  fix:
    needs: [build, review]
    if: ${{ needs.review.outputs.fix == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: "work-${{ inputs.run_id }}-1", path: "${{ runner.temp }}/work" }
      - uses: actions/download-artifact@v4
        with: { name: "media-${{ inputs.run_id }}-1", path: "${{ runner.temp }}/media" }
      - uses: actions/download-artifact@v4
        with: { name: "qa-${{ inputs.run_id }}-1", path: "teams/${{ inputs.team }}/qa" }
      - name: Studio tools
        timeout-minutes: 20
        run: |
          bash runner/scripts/studio_tools.sh
          # the session continues where the last one left off: all of its files, the video, the mix and the reviews
          python3 -I runner/scripts/apply_work.py --work "$RUNNER_TEMP/work" --team "$TEAM" --media "$RUNNER_TEMP/media"
      - name: Lock the machine
        run: bash runner/scripts/lock_machine.sh
      - name: Studio session (fix 1)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OIDC_AUDIENCE: content-office
          OFFICE_PY: /opt/office/venv/bin/python
        run: node runner/bridge/bridge.mjs
      - name: Pack the work
        if: ${{ always() }}
        run: bash runner/scripts/pack_work.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "work-${{ inputs.run_id }}-2", path: "${{ runner.temp }}/work/", retention-days: 3, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "media-${{ inputs.run_id }}-2", path: "${{ runner.temp }}/media/", retention-days: 3, if-no-files-found: ignore }

  review2:
    needs: fix
    if: ${{ needs.fix.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: { contents: read }
    outputs: { fix: "${{ steps.r.outputs.fix }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: "work-${{ inputs.run_id }}-2", path: "${{ runner.temp }}/work" }
      - uses: actions/download-artifact@v4
        with: { name: "media-${{ inputs.run_id }}-2", path: "${{ runner.temp }}/media" }
      - name: Reviewer tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.301 >/dev/null
      - name: Independent reviews, round 2
        id: r
        working-directory: teams/${{ inputs.team }}
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          python3 -I ../../runner/scripts/apply_work.py --work "$RUNNER_TEMP/work" --team "$TEAM" --content-only --media "$RUNNER_TEMP/media"
          python3 scripts/ci_review_round.py "$ITEM" 2
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "qa-${{ inputs.run_id }}-2", path: "teams/${{ inputs.team }}/qa/", retention-days: 3, if-no-files-found: ignore }

  fix2:
    needs: [fix, review2]
    if: ${{ needs.review2.outputs.fix == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: "work-${{ inputs.run_id }}-2", path: "${{ runner.temp }}/work" }
      - uses: actions/download-artifact@v4
        with: { name: "media-${{ inputs.run_id }}-2", path: "${{ runner.temp }}/media" }
      - uses: actions/download-artifact@v4
        with: { name: "qa-${{ inputs.run_id }}-2", path: "teams/${{ inputs.team }}/qa" }
      - name: Studio tools
        timeout-minutes: 20
        run: |
          bash runner/scripts/studio_tools.sh
          python3 -I runner/scripts/apply_work.py --work "$RUNNER_TEMP/work" --team "$TEAM" --media "$RUNNER_TEMP/media"
      - name: Lock the machine
        run: bash runner/scripts/lock_machine.sh
      - name: Studio session (fix 2)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OIDC_AUDIENCE: content-office
          OFFICE_PY: /opt/office/venv/bin/python
        run: node runner/bridge/bridge.mjs
      - name: Pack the work
        if: ${{ always() }}
        run: bash runner/scripts/pack_work.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "work-${{ inputs.run_id }}-3", path: "${{ runner.temp }}/work/", retention-days: 3, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: { name: "media-${{ inputs.run_id }}-3", path: "${{ runner.temp }}/media/", retention-days: 3, if-no-files-found: ignore }

  final:
    needs: [build, review, fix, review2, fix2]
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Which version
        id: v
        run: |
          if [ "${{ needs.fix2.result }}" = "success" ]; then echo "n=3" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.fix.result }}" = "success" ]; then echo "n=2" >> "$GITHUB_OUTPUT"
          else echo "n=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "work-${{ inputs.run_id }}-${{ steps.v.outputs.n }}", path: "${{ runner.temp }}/work" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "media-${{ inputs.run_id }}-${{ steps.v.outputs.n }}", path: "${{ runner.temp }}/media" }
      - uses: actions/download-artifact@v4
        if: ${{ steps.v.outputs.n != '3' }}
        continue-on-error: true
        with: { name: "qa-${{ inputs.run_id }}-${{ steps.v.outputs.n }}", path: "teams/${{ inputs.team }}/qa" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Gate tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m venv "teams/$TEAM/.venv" && "teams/$TEAM/.venv/bin/pip" install -q $PIP_PACKAGES
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.301 >/dev/null
      - name: Review of the last fix, then the full gate
        id: gate
        working-directory: teams/${{ inputs.team }}
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          python3 -I ../../runner/scripts/apply_work.py --work "$RUNNER_TEMP/work" --team "$TEAM" --content-only --media "$RUNNER_TEMP/media"
          if [ "${{ steps.v.outputs.n }}" = "3" ]; then python3 scripts/ci_review_round.py "$ITEM" 3 || true; fi
          mkdir -p "$RUNNER_TEMP/out"
          if .venv/bin/python scripts/ci_verify_reel.py "$ITEM" > "$RUNNER_TEMP/out/verify.json"; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          python3 -c "import json,sys; v=json.load(open(sys.argv[1])); print('gate:', 'ok' if v.get('ok') else 'FAILED', [c['name'] for c in v.get('checks', []) if not c.get('ok')])" "$RUNNER_TEMP/out/verify.json" || true
      - name: Video to the release
        if: ${{ steps.gate.outputs.ok == 'true' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/out/assets.txt"
          import json, os
          root = f"teams/{os.environ['TEAM']}"
          e = json.load(open(f"{root}/state/phase5_status.json", encoding="utf-8"))[os.environ["ITEM"]]
          name = os.path.basename(e["folder"])
          for p in (e["mp4"], e["cover"], f"brand/yt_thumbs/{name}.jpg"):
              if os.path.exists(f"{root}/{p}"): print(f"{root}/{p}")
          PY
          tag="office-$TEAM-$ITEM"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Reel $ITEM of the $TEAM team, built by the office studio (run $RUN_ID)."
          xargs -a "$RUNNER_TEMP/out/assets.txt" gh release upload "$tag" --clobber
      - name: Save the item's files
        if: ${{ always() && steps.v.outputs.n != '' }}
        run: |
          git config user.name "office-bot"
          git config user.email "office-bot@users.noreply.github.com"
          python3 -I runner/scripts/save_work.py --work "$RUNNER_TEMP/work" --team "$TEAM" --run "$RUN_ID" || echo "::warning::save failed"
      - name: Report to the office
        if: ${{ always() }}
        run: |
          rel=""; [ "${{ steps.gate.outputs.ok }}" = "true" ] && rel="--release office-$TEAM-$ITEM"
          python3 -I runner/scripts/report_final.py --team "$TEAM" --run "$RUN_ID" --item "$ITEM" --verify "$RUNNER_TEMP/out/verify.json" $rel
