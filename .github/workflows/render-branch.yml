# Render only: a push to a render/** branch renders the reels listed in render.json (repo root of that branch) on
# GitHub runners and uploads the mp4s as workflow artifacts. No agent session, no voice spend, no commit, no publishing.
#   render.json: {"team": "learnai", "audio_tag": "<draft release>", "reels": ["q144_input_vs_output", ...]}
# The voice, bed and sfx tracks are gitignored, so each reel's audio/hi/{voice,bed,sfx}.wav comes from <folder>_audio.tgz
# on the draft release named in audio_tag. See teams/learnai/docs-notes/reel-playbook-v4.md.
name: render-branch
run-name: "render ${{ github.ref_name }}"
on:
  push:
    branches: ["render/**"]
permissions: { contents: write }   # write is what lets the job token read a draft release
concurrency: { group: "render-${{ github.ref_name }}", cancel-in-progress: true }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { reels: "${{ steps.p.outputs.reels }}", team: "${{ steps.p.outputs.team }}", tag: "${{ steps.p.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 -c "import json; r=json.load(open('render.json')); print('reels='+json.dumps(r['reels'])); print('team='+r['team']); print('tag='+r['audio_tag'])" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        reel: ${{ fromJson(needs.plan.outputs.reels) }}
    env: { GH_TOKEN: "${{ github.token }}", TEAM: "${{ needs.plan.outputs.team }}", AUDIO_TAG: "${{ needs.plan.outputs.tag }}", REEL: "${{ matrix.reel }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Audio from the draft release
        run: |
          gh release download "$AUDIO_TAG" -R "$GITHUB_REPOSITORY" -p "${REEL}_audio.tgz" -D /tmp
          tar -xzf "/tmp/${REEL}_audio.tgz" -C "teams/$TEAM/reels/$REEL"
          ls -la "teams/$TEAM/reels/$REEL/audio/hi"
      - name: Render
        working-directory: teams/${{ env.TEAM }}
        run: mkdir -p out && python3 scripts/render_reel.py "reels/$REEL" "out/$REEL" hi
      - name: Check the file
        run: ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact "teams/$TEAM/out/${REEL}_hi.mp4"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.reel }}", path: "teams/${{ env.TEAM }}/out/${{ matrix.reel }}_hi.mp4", retention-days: 14 }
