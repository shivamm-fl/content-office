<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Context Window (clean example)</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="42" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="42" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="42" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D"], tag: "AI ENGINEER INTERVIEW" });   // order = scene ids from spec.json
      Viz.install(M);   // diagram templates and building blocks: see the header of kit/viz.js (a shortcut, not a menu: custom SVG/GSAP is welcome)
      const { tl, S, P, Ed, W } = M;
      // ===== CLEAN-STYLE EXAMPLE (4 scenes). Every visual starts on a spoken word via M.W(scene, "word"); no flash/glitch/burst calls. =====
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD");
      const { ACC, CYAN, HOT, GOOD } = M;
      // A: the hook is on screen from frame 0 with a picture already under it
      M.hook(["Interviewer:", "Context window?"], { size: 96, top: 250 });
      const llm = M.box(A, { x: 290, y: 600, w: 500, h: 280, label: "LLM", icon: "model", color: CYAN }); llm.show(0.05);
      M.arrow(A, { from: [540, 960], to: [540, 1080], color: CYAN, w: 10 }).show(M.W("A", "context"), 0.3);
      M.box(A, { x: 240, y: 1090, w: 600, h: 150, label: "WINDOW = ?", color: ACC }).show(M.W("A", "window"));
      M.fit(A, { y: 460, h: 840 });
      // B: one-line answer, then the mechanism as a picture (a window that fills)
      M.pill(B, "WORKING MEMORY", M.W("B", "working"), { x: 290, y: 230, size: 44 });
      const win = M.stack(B, { x: 190, y: 420, w: 700, h: 720, title: "CONTEXT WINDOW",
        items: [{ label: "PROMPT", color: CYAN, h: 230 }, { label: "HISTORY", color: "#9A8CEB", h: 230 }, { label: "ANSWER", color: GOOD, h: 170 }] });   // items stack bottom-up
      win.show(M.W("B", "Context")); win.fill(M.W("B", "Prompt"), 0.45);
      M.pill(B, "ALL IN TOKENS", M.W("B", "tokens"), { x: 330, y: 1190, size: 40, kind: "out" });
      M.fit(B, { y: 200, h: 1100 });
      // C: what breaks: overflow pushes the oldest part out
      const full = M.stack(C, { x: 190, y: 420, w: 700, h: 720, title: "WINDOW FULL", forget: "DROPPED",
        items: [{ label: "PROMPT", color: CYAN, h: 230 }, { label: "HISTORY", color: "#9A8CEB", h: 230 }, { label: "NEW TEXT", color: ACC, h: 230 }] });
      full.show(M.P("C", 0)); full.fill(M.P("C", 0), 0.15); full.overflow(M.W("C", "chhodna"), 1);
      M.fit(C, { y: 200, h: 1100 });
      // D: one save line, three short rows
      M.pill(D, "SAVE THIS", M.W("D", "Save"), { x: 380, y: 230, size: 44 });
      [["PROMPT", CYAN, "prompt"], ["HISTORY", "#9A8CEB", "history"], ["ANSWER", GOOD, "answer"]].forEach(([lab, c, w], i) =>
        M.box(D, { x: 190, y: 420 + i * 250, w: 700, h: 200, label: lab, color: c, size: 64 }).show(M.W("D", w)));
      M.fit(D, { y: 200, h: 1100 });

      M.wipe(M.S.B); M.wipe(M.S.C); M.wipe(M.S.D);   // = clean push in this style
      M.finish({ kw: { context: "cyan", window: "cyan", memory: "good", tokens: "gold", chhodna: "hot", save: "gold" } });
      window.__timelines["main"] = tl;   // register (must stay literal for the linter)
    </script>
  </body>
</html>
