<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The kinds of AI model</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="102.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sG"></div><div class="beat" id="sH"></div><div class="beat" id="sI"></div><div class="beat" id="sJ"></div><div class="beat" id="sK"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="102.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="102.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="102.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K"], tag: "150 DAYS OF AI · DAY 10" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, VIOLET, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH"), I = M.$("#sI"), J = M.$("#sJ"), K = M.$("#sK");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (list, t) => list.forEach((d) => gone(d, t));
      const dim = (list, t, op) => list.forEach((d) => tl.to(d, { opacity: op ?? 0.3, duration: 0.3, immediateRender: false }, t));
      const txt = (host, text, x, y, w, t, col, size, align, font) => { const sz = size || 36, a = align || "center";
        return show(el(host, `left:${x}px;top:${y}px;width:${w}px;text-align:${a};font:800 ${sz}px ${font || COD};letter-spacing:.04em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: 12 }); };
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 58, sz = o.size || 36, pad = o.pad || 30, tw = Math.round(String(text).length * 0.72 * sz + 2 * pad + 10); const w = el(host, `left:${540 - tw / 2}px;top:${y}px;width:${tw}px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${pad}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.12em;color:${col};white-space:nowrap">${text}</div>`;
        return show(w, t, { opacity: 0, y: -14 }); };
      const pillAt = (host, text, x, y, t, col, size) => { const sz = size || 38, h = Math.round(sz * 1.7);
        return show(el(host, `left:${x}px;top:${y}px;height:${h}px;display:flex;align-items:center;padding:0 28px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.1em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: -10 }); };
      const tile = (host, text, x, y, w, h, col, size, filled) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:16px;border:3px solid ${col};background:${ca(col, filled ? 0.28 : 0.12)};font:700 ${size}px ${COD};color:${TEXT};white-space:nowrap`, text);
      const ring = (host, x, y, w, h, col, t) => show(el(host, `left:${x - 8}px;top:${y - 8}px;width:${w + 16}px;height:${h + 16}px;box-sizing:border-box;border-radius:22px;border:4px solid ${col}`), t, { opacity: 0, scale: 1.05 }, 0.3);
      const bar = (host, x, y, w, h, col, t, dur) => { const b = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:12px;background:${ca(col, 0.55)};border:3px solid ${col};transform-origin:0 50%`);
        tl.set(b, { opacity: 0, scaleX: 0 }, 0); tl.to(b, { opacity: 1, scaleX: 1, duration: dur || 0.7, ease: "power3.out", immediateRender: false }, t); return b; };

      const gl = (host, x, y, w, h, col, rad) => glass(host, x, y, w, h, col, rad);
            const bub = (host, text, x, y, w, h, col, t, o) => { o = o || {};
        const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;display:flex;align-items:center;justify-content:${o.just || "center"};padding:0 28px;border-radius:${o.rad || "26px"};border:${o.dash ? "3px dashed" : "3px solid"} ${col};background:${o.bg || ca(col, 0.12)};font:${o.wt || 600} ${o.size || 44}px ${o.font || LAT};color:${o.tc || TEXT};white-space:nowrap`, text);
        return t == null ? d : show(d, t, o.from || { opacity: 0, y: 16 }, 0.4); };
            const IN_C = ACC, OUT_C = GOOD, MC = CYAN;
      const mono = (txt, col, size) => `<span style="font:700 ${size || 42}px ${COD};color:${col || TEXT}">${txt}</span>`;
      const chip = (host, x, y, w, h, col, t, dash) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;border-radius:26px;border:3px ${dash ? "dashed" : "solid"} ${col};background:${ca(col, 0.12)};display:flex;align-items:center;justify-content:center;gap:18px`);
        return t == null ? d : show(d, t, { opacity: 0, y: 18 }, 0.45); };
      const lines = (host, x, y, w, n, col, t) => { const g = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${n * 34}px`);
        for (let i = 0; i < n; i++) el(g, `left:0;top:${i * 34}px;width:${i === n - 1 ? Math.round(w * 0.6) : w}px;height:14px;border-radius:7px;background:${ca(col, 0.75)}`);
        return g; };
      const pic = (host, x, y, w, h, col, dash) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
        d.innerHTML = `<svg viewBox="0 0 200 140" width="${w}" height="${h}" style="overflow:visible"><rect x="4" y="4" width="192" height="132" rx="14" fill="${ca(col, 0.12)}" stroke="${col}" stroke-width="5" ${dash ? 'stroke-dasharray="14 10"' : ""}/><circle cx="148" cy="40" r="16" fill="${ACC}"/><path d="M4 112 L56 56 L96 98 L126 70 L196 128 L196 122 L196 136 L4 136 Z" fill="${ca(col, 0.45)}" stroke="${col}" stroke-width="4" stroke-linejoin="round"/></svg>`; return d; };
      const wave = (host, x, y, w, h, col) => { const hs = [0.3, 0.6, 0.9, 0.5, 1, 0.7, 0.4, 0.8, 0.55, 0.95, 0.35, 0.65]; const n = hs.length, bw = w / (n * 1.6);
        const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
        hs.forEach((v, i) => el(d, `left:${Math.round(i * bw * 1.6)}px;top:${Math.round(h * (1 - v) / 2)}px;width:${Math.round(bw)}px;height:${Math.round(h * v)}px;border-radius:${Math.round(bw / 2)}px;background:${col}`)); return d; };
      const tagIn = (host, x, y, t) => pillAt(host, "IN", x, y, t, IN_C, 36);
      const tagOut = (host, x, y, t) => pillAt(host, "OUT", x, y, t, OUT_C, 36);
      // vertical machine skeleton: returns the IN chip, OUT chip and the handles; y0 = top of the IN chip
      const col3 = (host, y0, label, icon, tBox, tIn, tOut, boxSz) => {
        const inC = chip(host, 190, y0, 700, 170, IN_C, tIn), outC = chip(host, 190, y0 + 660, 700, 170, OUT_C, tOut);
        const a1 = M.arrow(host, { from: [540, y0 + 176], to: [540, y0 + 286], color: IN_C, w: 10 }); const a2 = M.arrow(host, { from: [540, y0 + 544], to: [540, y0 + 654], color: OUT_C, w: 10 });
        const bx = M.box(host, { x: 240, y: y0 + 290, w: 600, h: 250, label, icon, color: MC, size: boxSz || 54 }); bx.show(tBox);
        tagIn(host, 190, y0 - 66, tIn); tagOut(host, 190, y0 + 594, tOut);
        a1.show(tIn + 0.15, 0.3); a1.travel(tIn + 0.2, 0.6, IN_C); a2.show(tOut - 0.05, 0.3); a2.travel(tOut, 0.6, OUT_C);
        return { inC, outC, bx }; };

      // ============ A: hook: a photo asked, text came back ============
      // diagram: A
      M.hook(["Photo maangi,", "mila sirf text?"], { size: 92, top: 230 });
      gl(A, 90, 480, 900, 560, CYAN, 28);
      show(bub(A, "Photo of a cat", 340, 520, 600, 110, ACC, null, { size: 46 }), 0.05, { opacity: 0 });
      M.icon(A, "camera", 250, 536, 80, ACC).show(0.05);
      const aDots = show(bub(A, "• • •", 130, 690, 190, 96, CYAN, null, { size: 44, wt: 700, tc: CYAN }), 0.3, { opacity: 0 });
      gone(aDots, 1.1);
      const aR = show(el(A, `left:130px;top:680px;width:620px;height:250px;box-sizing:border-box;border-radius:26px;border:3px solid ${CYAN};background:${ca(CYAN, 0.12)}`), 1.15, { opacity: 0, y: 12 });
      lines(aR, 40, 50, 540, 4, MUTED);
      const aT = pillAt(A, "TEXT ONLY", 560, 960, at("A", "sirf"), HOT, 40);
      const aPh = show(pic(A, 790, 700, 150, 105, MUTED, true), at("A", "likhkar"), { opacity: 0, y: 12 }); const aX = M.icon(A, "cross", 815, 715, 100, HOT); aX.show(at("A", "likhkar"));
      pillAt(A, "TEXT MODEL", 130, 960, at("A", "model"), CYAN, 40);
      const aM = [tile(A, "IN", 90, 1090, 220, 110, IN_C, 52, true), tile(A, "MODEL", 400, 1090, 280, 110, CYAN, 52, false), tile(A, "OUT", 770, 1090, 220, 110, OUT_C, 52, true)];
      show(aM[1], at("A", "model", 1), { opacity: 0, y: 14 }); show(aM[0], at("A", "input"), { opacity: 0, y: 14 }); show(aM[2], at("A", "output"), { opacity: 0, y: 14 });
      M.arrow(A, { from: [316, 1145], to: [394, 1145], color: IN_C, w: 8 }).show(at("A", "input"), 0.3); M.arrow(A, { from: [686, 1145], to: [764, 1145], color: OUT_C, w: 8 }).show(at("A", "output"), 0.3);
      M.fit(A, { y: 460, h: 850, maxScale: 1.4 });

      // ============ B: the kitchen, then four kinds ============
      // diagram: B
      const appl = (host, x, kind, label, t) => { const c = gl(host, x, 360, 300, 330, null); show(c, t, { opacity: 0, y: 20 });
        const s = el(c, "left:50px;top:30px;width:200px;height:200px");
        const S_ = { mixer: `<rect x="20" y="86" width="60" height="8" rx="3"/><rect x="46" y="30" width="10" height="56"/><rect x="26" y="16" width="52" height="20" rx="8"/><path d="M14 94 h72 l-8 -28 h-56z" fill="none"/>`,
          toaster: `<rect x="14" y="36" width="72" height="50" rx="12" fill="none"/><path d="M30 36 v-6 M54 36 v-6 M30 30 h24" /><rect x="28" y="46" width="44" height="6" rx="3"/><rect x="92" y="50" width="8" height="22" rx="4"/>`,
          cooker: `<rect x="20" y="42" width="60" height="44" rx="8" fill="none"/><path d="M26 42 q24 -26 48 0"/><rect x="44" y="24" width="12" height="10" rx="3"/><path d="M12 56 h8 M80 56 h8"/>` }[kind];
        s.innerHTML = `<svg viewBox="0 0 100 100" width="200" height="200" style="overflow:visible"><g stroke="${TEXT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="${ca(CYAN, 0.25)}">${S_}</g></svg>`;
        el(c, `left:0;top:250px;width:300px;text-align:center;font:700 40px ${COD};letter-spacing:.06em;color:${TEXT}`, label); return c; };
      const bApp = [appl(B, 70, "mixer", "MIXER", at("B", "Mixer")), appl(B, 390, "toaster", "TOASTER", at("B", "toaster")), appl(B, 710, "cooker", "COOKER", at("B", "toaster") + 0.5)];
      const bPow = pillAt(B, "ELECTRICITY", 340, 250, at("B", "bijli"), ACC, 38);
      const bLn = [195, 515, 835].map((x) => show(el(B, `left:${x - 2}px;top:320px;width:5px;height:40px;background:${ACC}`), at("B", "bijli") + 0.2, { opacity: 0 }));
      const bBread = show(el(B, `left:110px;top:760px;width:220px;height:90px;border-radius:30px 30px 14px 14px;border:3px solid ${ACC};background:${ca(ACC, 0.3)};display:flex;align-items:center;justify-content:center;font:700 38px ${COD};color:${TEXT}`, "BREAD"), at("B", "bread"), { opacity: 0, y: 20 });
      const bAr = M.arrow(B, { from: [220, 755], to: [220, 700], color: ACC, w: 9 }); bAr.show(at("B", "bread") + 0.2, 0.3);
      const bX = M.icon(B, "cross", 330, 760, 100, HOT); bX.show(at("B", "nahi"));
      const bOld = [...bApp, bPow, ...bLn, bBread];
      goneAll(bOld, at("B", "AI") - 0.1); bAr.hide(at("B", "AI") - 0.1); bX.hide(at("B", "AI") - 0.1);
      const KS = [["TEXT", "text", "text", "text > text"], ["IMAGE", "image", "image", "text > picture"], ["AUDIO", "speaker", "audio", "voice <> text"], ["EMBEDDING", "numbers", "embedding", "text > numbers"]];
      pillAt(B, "4 KINDS", 380, 245, at("B", "4"), ACC, 44);
      KS.forEach((k, i) => { const b = M.box(B, { x: 70 + (i % 2) * 480, y: 360 + Math.floor(i / 2) * 400, w: 460, h: 340, label: k[0], sub: k[3], icon: k[1], color: CYAN, size: k[0] === "EMBEDDING" ? 46 : 56, subsize: 36 }); b.show(at("B", k[2])); });
      M.fit(B, { y: 220, h: 1100, maxScale: 1.6 });

      // ============ C: text model ============
      // diagram: C
      const cM = col3(C, 400, "TEXT MODEL", "text", S.C + 0.05, at("C", "andar"), at("C", "bahar"));
      el(cM.inC, `font:600 46px ${LAT};color:${TEXT}`, "Write a poem");
      el(cM.outC, `font:600 46px ${LAT};color:${TEXT}`, "Roses are red...");
      M.fit(C, { y: 220, h: 1100, maxScale: 1.15 });

      // ============ D: image model ============
      // diagram: D
      const dM = col3(D, 400, "IMAGE MODEL", "image", S.D + 0.05, at("D", "andar"), at("D", "bahar"));
      el(dM.inC, `font:600 46px ${LAT};color:${TEXT}`, "A cat on a sofa");
      pic(dM.outC, 250, 14, 200, 140, OUT_C).style.left = "250px";
      M.fit(D, { y: 220, h: 1100, maxScale: 1.15 });

      // ============ E: audio model, both ways ============
      // diagram: E
      const rowE = (y, lab, labT, inT, outT, inB, outB) => {
        pillAt(E, lab, 540 - Math.round(lab.length * 13), y - 80, labT, CYAN, 38);
        const i = chip(E, 40, y, 320, 300, IN_C, inT), o = chip(E, 720, y, 320, 300, OUT_C, outT); inB(i); outB(o);
        const bx = M.box(E, { x: 400, y: y, w: 280, h: 300, label: "AUDIO", sub: "MODEL", color: MC, size: 44, subsize: 36 }); bx.show(S.E + 0.05);
        M.arrow(E, { from: [364, y + 150], to: [396, y + 150], color: IN_C, w: 8 }).show(inT + 0.15, 0.25); M.arrow(E, { from: [684, y + 150], to: [716, y + 150], color: OUT_C, w: 8 }).show(outT - 0.05, 0.25); };
      rowE(350, "SPEECH RECOGNITION", at("E", "speech"), at("E", "aavaz"), at("E", "transcript"), (c) => wave(c, 36, 60, 250, 180, ACC), (c) => lines(c, 40, 90, 240, 4, MUTED));
      rowE(850, "TEXT TO SPEECH", at("E", "ya"), at("E", "text"), at("E", "aavaz", 1), (c) => lines(c, 40, 90, 240, 4, MUTED), (c) => M.icon(c, "speaker", 90, 90, 140, OUT_C));
      M.fit(E, { y: 240, h: 1080, maxScale: 1.1 });

      // ============ F: embedding model, then the meaning map ============
      // diagram: F
      const fM = col3(F, 400, "EMBEDDING MODEL", "numbers", S.F + 0.05, at("F", "text"), at("F", "numbers"), 44);
      el(fM.inC, `font:700 50px ${COD};color:${TEXT}`, "refund");
      el(fM.outC, `font:700 42px ${COD};color:${TEXT}`, "[0.12, -0.80, 0.45, ...]");
      const fP1 = pillAt(F, "MEANING", 470, 330, at("F", "matlab"), GOOD, 40);
      const fP2 = pillAt(F, "NOT WORDS", 450, 1250, at("F", "words"), HOT, 40);
      const fOld = [fM.inC, fM.outC, fM.bx, fP1, fP2]; const fAll = [...F.querySelectorAll(":scope > *")];
      fAll.forEach((d) => gone(d, at("F", "maan") - 0.25));
      const fMap = M.map(F, { x: 80, y: 280, w: 920, h: 700, title: "MEANING MAP", pts: [
        { id: "n", label: "REFUND NOTE", x: 0.25, y: 0.3, color: GOOD, side: "t", size: 40 },
        { id: "q", label: "PAISE VAAPAS", x: 0.5, y: 0.46, color: ACC, side: "b", size: 40 },
        { id: "w", label: "WEATHER", x: 0.86, y: 0.84, color: MUTED, side: "t", size: 40 }] });
      fMap.enter(at("F", "maan")); fMap.show(at("F", "refund"), ["n"]); fMap.show(at("F", "paise"), ["q"]); fMap.show(at("F", "paise") + 0.3, ["w"]);
      pillAt(F, "EXAMPLE", 700, 1240, at("F", "refund"), ACC, 34);
      [["refund", "0.31  0.72  ...", 1010, GOOD], ["paise vaapas", "0.35  0.69  ...", 1110, ACC]].forEach((r) => { const c = chip(F, 120, r[2], 840, 84, r[3], at("F", "numbers", 1) - 0.2); c.style.justifyContent = "space-between"; c.style.padding = "0 30px"; el(c, `position:static;font:700 36px ${COD};color:${TEXT}`, r[0]); el(c, `position:static;font:700 40px ${COD};color:${r[3]}`, r[1]); });
      pillAt(F, "0 WORDS SHARED", 120, 1240, at("F", "Words"), HOT, 40);
      fMap.link(at("F", "numbers", 1), "n", "q", { label: "CLOSE", color: GOOD, size: 40 }); fMap.ring(at("F", "numbers", 1), "q", { r: 40, color: GOOD });
      M.fit(F, { y: 240, h: 1100, maxScale: 1.3 });

      // ============ G: 1,536 numbers ============
      // diagram: G
