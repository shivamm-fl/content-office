    <script>
      const M = Mo.init({ order: ["A", "B", "C", "D", "E", "F", "G", "H", "I"], tag: "150 DAYS OF AI · DAY 14" });
      Viz.install(M);
      const { tl, S } = M; const { ACC, CYAN, HOT, GOOD, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH"), I = M.$("#sI");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#101A2E", GREY = "#8FA3C7";

      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur, op) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: op == null ? 1 : op, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };

      const pillAt = (host, text, x, y, t, col, size, dash) => { const sz = size || 38, h = Math.round(sz * 1.7);

      const head = (sc, host, text) => { pillAt(host, text, 70, 215, S[sc] + 0.05, CYAN, 40); pillAt(host, "EXAMPLE", 790, 222, S[sc] + 0.05, GREY, 36); };
      const line = (host, x1, y1, x2, y2, col, w, t, dash, op) => { const pad = 8, lx = Math.min(x1, x2) - pad, ly = Math.min(y1, y2) - pad, W_ = Math.abs(x2 - x1) + 2 * pad, H_ = Math.abs(y2 - y1) + 2 * pad;

      const dial = (host, cx, cy, r, col, a0) => { const face = circ(host, cx, cy, r, col, 0.1, 6); const arm = el(host, `left:${cx - 7}px;top:${cy - r + 14}px;width:14px;height:${r - 14}px;border-radius:7px;background:${ACC}`); const hub = circ(host, cx, cy, 14, ACC, 1, 2);

      const calc = (host, y, t0, parts, res) => { const g = show(glass(host, 90, y, 900, 250, CYAN), t0, { opacity: 0 }, 0.3);
        const row = el(host, `left:130px;top:${y + 36}px;height:80px;display:flex;gap:24px;align-items:center;font:700 58px ${COD};color:${TEXT};white-space:nowrap`);

      const cell = (host, x, y, w, h, text, col, t, size, dash) => show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:16px;border:3px ${dash ? "dashed" : "solid"} ${col};background:${ca(col, 0.14)};font:800 ${size || 46}px ${COD};color:${TEXT};white-space:nowrap`, text), t, { opacity: 0, y: 14 }, 0.3);
      const stampAt = (host, txt, cx, y, col, t) => { const d = el(host, `left:${cx}px;top:${y}px;padding:12px 28px;border:3px solid ${col};border-radius:12px;background:rgba(14,18,30,.95);font:700 46px ${COD};color:${col};white-space:nowrap`, txt); gsap.set(d, { xPercent: -50 }); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const NUMS = ["0.31", "−1.20", "0.07", "2.45", "−0.88", "1.90"];


      const NAME = (host, x, y, w, text, col, t) => { show(glass(host, x, y, w, 130, col, 24), t, { opacity: 0 }, 0.35); return show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:130px;display:flex;align-items:center;justify-content:center;font:700 62px ${LAT};color:${TEXT}`, text), t, { opacity: 0 }, 0.35); };
      const part = (host, x, y, w, h, text, col, t, size) => { show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;border-radius:22px;border:4px solid ${col};background:${ca(col, 0.16)}`), t, { opacity: 0, y: 18 }, 0.4); return show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center;font:700 ${size || 52}px ${COD};color:${col};text-align:center`, text), t, { opacity: 0 }, 0.4); };
      const chip = (host, x, y, w, text, col, t, size) => { const b = show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:120px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:20px;border:3px solid ${col};background:${ca(col, 0.14)};font:700 ${size || 54}px ${LAT};color:${TEXT}`, text), t, { opacity: 0, y: 16 }, 0.35); return b; };

      const WATER = CYAN, MONEY = GOOD;
      const pct = (p) => 3 + 0.33 * p;
      const icoWaves = (host, x, y, s, col) => el(host, `left:${x}px;top:${y}px;width:${s}px;height:${s}px`, `<svg viewBox="0 0 64 64" width="${s}" height="${s}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"><path d="M6 22 q8 -9 13 0 t13 0 t13 0 t13 0"/><path d="M6 36 q8 -9 13 0 t13 0 t13 0 t13 0"/><path d="M6 50 q8 -9 13 0 t13 0 t13 0 t13 0"/></svg>`);
      const icoCoins = (host, x, y, s, col) => el(host, `left:${x}px;top:${y}px;width:${s}px;height:${s}px`, `<svg viewBox="0 0 64 64" width="${s}" height="${s}" fill="none" stroke="${col}" stroke-width="4"><ellipse cx="32" cy="48" rx="22" ry="8" fill="${ca(col, 0.18)}"/><ellipse cx="32" cy="36" rx="22" ry="8" fill="${ca(col, 0.18)}"/><ellipse cx="32" cy="24" rx="22" ry="8" fill="${ca(col, 0.18)}"/><ellipse cx="32" cy="12" rx="22" ry="8" fill="${ca(col, 0.3)}"/></svg>`);
      const light = (d, t) => tl.to(d, { opacity: 1, duration: 0.3, immediateRender: false }, t);
      const grow = (d, t, dur, axis) => { tl.set(d, axis === "x" ? { scaleX: 0, transformOrigin: "0% 50%" } : { scaleY: 0, transformOrigin: "50% 100%" }, 0);
        tl.to(d, axis === "x" ? { scaleX: 1, duration: dur || 0.6, ease: "power3.out", immediateRender: false } : { scaleY: 1, duration: dur || 0.6, ease: "power3.out", immediateRender: false }, t); return d; };
      const hdr = (host, text, t, col, x) => pillAt(host, text, x == null ? 70 : x, 215, t, col || CYAN, 44);
      const wchip = (host, x, y, w, h, text, col, font) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:20px;border:3px solid ${col};background:${ca(col, 0.14)};font:700 ${font}px ${LAT};color:${TEXT}`, text);
      const ringAt = (host, x, y, w, h, t) => show(el(host, `left:${x - 5}px;top:${y - 5}px;width:${w + 10}px;height:${h + 10}px;box-sizing:border-box;border-radius:24px;border:6px solid ${ACC}`), t, { opacity: 0 }, 0.3);
      const svgLayer = (host) => { const d = el(host, "left:0;top:0;width:1080px;height:1920px;pointer-events:none"); d.innerHTML = '<svg width="1080" height="1920" style="overflow:visible"></svg>'; return d.firstChild; };
      const addPath = (svg, dstr, col, w, t, op) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", dstr); p.setAttribute("fill", "none"); p.setAttribute("stroke", col); p.setAttribute("stroke-width", w); p.setAttribute("stroke-linecap", "round"); svg.appendChild(p);
        tl.set(p, { opacity: 0 }, 0); tl.to(p, { opacity: op == null ? 1 : op, duration: 0.4, ease: "power3.out", immediateRender: false }, t); return p; };
      const arcD = (yb, yt) => `M330 ${yb} C ${330 - Math.min(260, 70 + Math.abs(yb - yt) * 0.28)} ${yb}, ${330 - Math.min(260, 70 + Math.abs(yb - yt) * 0.28)} ${yt}, 330 ${yt}`;
      const loopD = (yb) => `M330 ${yb - 28} C 235 ${yb - 60}, 235 ${yb + 60}, 330 ${yb + 28}`;
      const numLab = (host, y, h, text, col, t) => show(el(host, `left:600px;top:${y}px;width:170px;height:${h}px;display:flex;align-items:center;justify-content:flex-end;font:800 52px ${COD};color:${col}`, text), t, { opacity: 0, x: 10 }, 0.35);
      const bar = (host, y, h, w, col, bh) => el(host, `left:790px;top:${y + h / 2 - (bh || 44) / 2}px;width:${w}px;height:${bh || 44}px;border-radius:10px;background:${ca(col, 0.85)}`);
      const stageChips = (host, words, bi, o, ts, ringT) => { const rows = words.map((w, i) => { const y = o.y0 + o.pitch * i;
          const c = show(wchip(host, 330, y, 260, o.h, w, w === words[bi] ? ACC : CYAN, o.font), ts[i], { opacity: 0, x: -20 }, 0.4);
          return { y, mid: y + o.h / 2, c }; });
        ringAt(host, 330, rows[bi].y, 260, o.h, ringT); return rows; };
      const glyph = (host, x, y, wv, mv, t, tw, tm) => { // two bars, water and money, bottom aligned in a 110 px frame
        const fr = show(el(host, `left:${x}px;top:${y}px;width:130px;height:110px;box-sizing:border-box;border-radius:14px;border:2px solid ${ca(GREY, 0.6)}`), t, { opacity: 0 }, 0.3);
        const w_ = el(host, `left:${x + 22}px;top:${y + 108 - Math.max(wv, 4)}px;width:38px;height:${Math.max(wv, 4)}px;border-radius:6px;background:${WATER}`);
        const m_ = el(host, `left:${x + 70}px;top:${y + 108 - Math.max(mv, 4)}px;width:38px;height:${Math.max(mv, 4)}px;border-radius:6px;background:${MONEY}`);
        grow(w_, tw == null ? t : tw, 0.5); grow(m_, tm == null ? t : tm, 0.5); return { fr, w_, m_ }; };
      const WORDS1 = ["I", "sat", "on", "the", "river", "bank"], PITCH = { y0: 330, pitch: 150, h: 110, font: 56 };
      const SCORE_W = [27, 34, 22, 19, 200, 108], PCT = [3, 3, 2, 2, 77, 13];

      // ============ A: hook: two phrases, one word ============
      // diagram: A
      M.hook(["River bank & bank loan:", "model ko farak kaise pata?"], { size: 68, top: 215 });
      const phrase = (host, y, h, left, right, wi, sw, t, icon, col) => { show(glass(host, 90, y, 900, h, col, 28), t, { opacity: 0 }, 0.35);
        const l = left, r = right; show(wchip(host, 130, y + h / 2 - 70, 270, 140, l, l === "bank" ? ACC : CYAN, 70), t + 0.05, { opacity: 0, y: 14 }, 0.4);
        show(wchip(host, 420, y + h / 2 - 70, 270, 140, r, r === "bank" ? ACC : CYAN, 70), t + 0.1, { opacity: 0, y: 14 }, 0.4);
        return icon(host, 740, y + h / 2 - 85, 170, col); };
      const hA1 = phrase(A, 470, 340, "river", "bank", 1, 0, 0.05, icoWaves, WATER); show(hA1, 0.1, { opacity: 0 }, 0.4);
      const hA2 = phrase(A, 920, 340, "bank", "loan", 0, 1, 0.12, icoCoins, MONEY); show(hA2, 0.15, { opacity: 0 }, 0.4);

        show(wchip(B, 410, y + 95, 250, 130, right, right === "bank" ? ACC : CYAN, 62), S.B + 0.15, { opacity: 0, y: 14 }, 0.4);
        const ic = icon(B, 730, y + 55, 170, col); show(ic, S.B + 0.2, { opacity: 0 }, 0.4, 0.35); return ic; };
      const icB1 = bCard(330, "river", "bank", icoWaves, WATER), icB2 = bCard(670, "bank", "loan", icoCoins, MONEY);
      light(icB1, at("B", "kinara")); light(icB2, at("B", "paise"));

      [[330, 255, 525], [670, 255, 535]].forEach(([y, xa, xb], k) => { const d = `M${xa} ${y + 95} C ${xa} ${y + 20}, ${xb} ${y + 20}, ${xb} ${y + 95}`;

        show(el(B, `left:${x}px;top:${y}px;width:430px;height:84px;display:flex;align-items:center;justify-content:center;border-radius:42px;border:3px solid ${ACC};background:${ca(ACC, 0.12)};font:700 42px ${COD};letter-spacing:.06em;color:${ACC};white-space:nowrap`, t_), at("B", "chaar") + k * 0.25, { opacity: 0, y: 14 }, 0.35));

      const rowsC = stageChips(C, WORDS1, 5, PITCH, tC, at("C", "Query", 0));

      line(C, 590, qy, 630, qy, ACC, 6, at("C", "Query", 0));
      show(el(C, `left:630px;top:${qy - 225}px;width:390px;height:140px;display:flex;align-items:center;justify-content:center;font:800 130px ${COD};color:${ACC}`, "?"), at("C", "sawal"), { opacity: 0, scale: 0.8 }, 0.4);
