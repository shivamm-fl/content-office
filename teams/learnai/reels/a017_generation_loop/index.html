<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>How AI builds an answer</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="66.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sG"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="66.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="66.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="66.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G"], tag: "150 DAYS OF AI" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px;background:${PANEL}` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      const pillC = (host, word, y, t, col = ACC) => {
        const w = el(host, `left:80px;top:${y}px;width:920px;height:56px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;padding:0 30px;border-radius:999px;border:2px solid ${col};background:${ca(col, .1)};font:700 36px ${COD};letter-spacing:.12em;color:${col}">${word}</div>`;
        return show(w, t, { opacity: 0, y: -14 });
      };
      const title = (host, x, y, txt, col) => el(host, `left:${x}px;top:${y}px;font:700 40px ${COD};letter-spacing:.14em;color:${col || MUTED}`, txt);
      // a text tile (a piece of text)
      const tile = (host, x, y, w, h, txt, col, size) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:18px;border:3px solid ${col};background:${ca(col, .14)};display:flex;align-items:center;justify-content:center;font:800 ${size || 60}px ${LAT};color:${TEXT};white-space:pre`, txt); return d; };
      // the growing text strip: pieces[i] = [text, width, colour, time]
      const strip = (host, y, label, pieces, h = 210) => {
        const c = glass(host, 80, y, 920, h, CYAN, 30); title(c, 34, 22, label);
        let x = 34; const out = [];
        pieces.forEach(([txt, w, col, t]) => { const k = tile(c, x, 90, w, h - 130, txt, col, 70); show(k, t, { opacity: 0, y: 20 }); out.push(k); x += w + 14; });
        return { c, out };
      };
      // two-option probability card: rows [word, pct, colour]
      const opts = (host, y, label, rows, t, t1, t2, ph = 200) => {
        const c = glass(host, 80, y, 920, ph * 2 + 130, CYAN, 30); title(c, 34, 22, label);
        const R = rows.map(([w, p, col], i) => {
          const row = el(c, `left:24px;top:${100 + i * ph}px;width:872px;height:${ph - 26}px;border-radius:20px;border:3px solid transparent`);
          el(row, `left:20px;top:0;width:200px;height:${ph - 26}px;display:flex;align-items:center;font:800 66px ${LAT};color:${TEXT}`, w);
          el(row, `left:230px;top:${(ph - 26 - 64) / 2}px;width:460px;height:64px;border-radius:14px;background:#233147`);
          const f = el(row, `left:230px;top:${(ph - 26 - 64) / 2}px;width:${p * 4.6}px;height:64px;border-radius:14px;background:${col}`);
          tl.set(f, { scaleX: 0, transformOrigin: "left center" }, 0); tl.to(f, { scaleX: 1, duration: .5, ease: "power3.out", immediateRender: false }, i ? t2 : t1);
          const n = el(row, `left:700px;top:0;width:150px;height:${ph - 26}px;display:flex;align-items:center;justify-content:flex-end;font:800 58px ${COD};color:${TEXT}`, p + "%");
          tl.set([n, row.children[0], row.children[1]], { opacity: 0 }, 0); tl.to([n, row.children[0], row.children[1]], { opacity: 1, duration: .3, immediateRender: false }, i ? t2 : t1);
          return row; });
        show(c, t); return { c, R };
      };
      const mark = (row, col, t) => tl.to(row, { borderColor: col, backgroundColor: ca(col, .12), duration: .35, immediateRender: false }, t);

      // diagram: A — the answer grows piece by piece under the question.
      M.hook(["AI poora answer", "ek saath likhta hai?"], { size: 84, top: 215, until: M.Ed("A", 1) + .25 });
      const aC = glass(A, 80, 540, 920, 720, CYAN, 32); title(aC, 36, 26, "ANSWER");
      [["The sky", 330, CYAN, 0.5], ["is", 170, ACC, 0], ["blue", 260, ACC, 0]].forEach(([txt, w, col], i) => {
        const x = [36, 380, 564][i]; el(aC, `left:${x}px;top:170px;width:${w}px;height:210px;border-radius:18px;border:3px dashed ${ca(MUTED, .6)}`);
        const k = tile(aC, x, 170, w, 210, txt, col, 66); show(k, [at("A", "ek-ek"), at("A", "piece") + .35, at("A", "jodkar") + .3][i], { opacity: 0, y: 24 });
      });
      const aAll = el(aC, `left:36px;top:480px;font:800 62px ${LAT};color:${HOT}`, "✕  ALL AT ONCE");
      tl.set(aAll, { opacity: 0 }, 0); tl.to(aAll, { opacity: 1, duration: .3, immediateRender: false }, 0.6); gone(aAll, at("A", "nahi"), .25);
      const aOne = el(aC, `left:36px;top:480px;font:800 62px ${LAT};color:${GOOD}`, "✓  ONE PIECE AT A TIME");
      show(aOne, at("A", "nahi") + .1, { opacity: 0, y: 14 });
      M.fit(A, { y: 460, h: 840 });

      // diagram: B — a prompt feeds two next-piece options.
      pillC(B, "EXAMPLE", 215, P("B", 0));
      const bp = glass(B, 80, 300, 920, 250, ACC, 30); title(bp, 34, 20, "TEXT SO FAR", ACC);
      el(bp, `left:34px;top:100px;font:800 100px ${LAT};color:${TEXT}`, "The sky...");
      show(bp, P("B", 0));
      const bo = opts(B, 600, "NEXT PIECE?", [["is", 70, CYAN], ["was", 30, CYAN]], P("B", 1), P("B", 3), P("B", 4));
      show(el(B, `left:80px;top:1260px;width:920px;text-align:center;font:700 44px ${COD};letter-spacing:.1em;color:${MUTED}`, "INVENTED NUMBERS"), P("B", 5), { opacity: 0, y: 12 });
      M.fit(B, { y: 170, h: 1130 });

      // diagram: C — the picked piece joins the text and becomes the next input.
      const co = opts(C, 220, "STEP 1", [["is", 70, ACC], ["was", 30, MUTED]], P("C", 0), P("C", 0), P("C", 0), 170);
      mark(co.R[0], ACC, P("C", 0) + .2); tl.to(co.R[1], { opacity: .35, duration: .3, immediateRender: false }, P("C", 0) + .2);
      const cs = strip(C, 720, "TEXT", [["The sky", 330, CYAN, P("C", 1) - .3], ["is", 160, ACC, P("C", 1) + .5]], 260);
      const cArr = el(C, `left:0;top:990px;width:1080px;text-align:center;font:800 100px ${LAT};color:${ACC}`, "↓");
      show(cArr, P("C", 2), { opacity: 0, y: -20 });
      const ci = glass(C, 80, 1110, 920, 230, ACC, 30); title(ci, 34, 22, "INPUT OF STEP 2", ACC);
      el(ci, `left:34px;top:90px;font:800 92px ${LAT};color:${TEXT}`, "The sky is");
      show(ci, P("C", 2) + .25);
      M.fit(C, { y: 170, h: 1130 });

      // diagram: D — the second step, then the loop.
      const dOp = opts(D, 220, "STEP 2", [["blue", 60, CYAN], ["clear", 40, CYAN]], P("D", 0), P("D", 1), P("D", 2), 170);
      mark(dOp.R[0], ACC, P("D", 3) + .6); tl.to(dOp.R[1], { opacity: .35, duration: .3, immediateRender: false }, P("D", 3) + .6);
      const dS = strip(D, 720, "TEXT", [["The sky", 330, CYAN, 0.1], ["is", 160, CYAN, 0.1], ["blue", 250, ACC, P("D", 4)]], 260);
      tl.set(dS.c, { opacity: 0 }, 0); tl.to(dS.c, { opacity: 1, duration: .4, immediateRender: false }, P("D", 3) + .4);
      tl.set([dS.out[0], dS.out[1]], { opacity: 0 }, 0); tl.to([dS.out[0], dS.out[1]], { opacity: 1, duration: .3, immediateRender: false }, P("D", 3) + .4);
      const dL = glass(D, 80, 1010, 920, 300, ACC, 30);
      el(dL, `left:60px;top:48px;font:800 190px ${LAT};color:${ACC}`, "↻");
      el(dL, `left:330px;top:70px;font:800 74px ${LAT};color:${TEXT}`, "LOOP");
      el(dL, `left:330px;top:170px;font:700 40px ${COD};letter-spacing:.1em;color:${MUTED}`, "PICK → ADD → REPEAT");
      show(dL, P("D", 5), { opacity: 0, y: 26 });
      M.fit(D, { y: 170, h: 1130 });

      // diagram: E — what a token looks like, and what stops the loop.
      pillC(E, "EXAMPLE", 205, P("E", 0));
      const eRows = [
        { y: 275, name: "WORD", tiles: [["sky", 230, CYAN]], t: P("E", 0) + .5 },
        { y: 490, name: "PART OF A WORD", tiles: [["play", 230, CYAN], ["ing", 180, ACC]], t: P("E", 1) + .9 },
        { y: 705, name: "PUNCTUATION", tiles: [[".", 130, CYAN]], t: P("E", 1) + 2.2 },
      ];
      eRows.forEach(r => { const c = glass(E, 80, r.y, 920, 195, CYAN, 28); title(c, 34, 18, r.name);
        let x = 34; r.tiles.forEach(([tx, w, col]) => { tile(c, x, 76, w, 96, tx, col, 66); x += w + 12; }); show(c, r.t); });
      const eS = glass(E, 80, 920, 920, 195, HOT, 28); title(eS, 34, 18, "STOP TOKEN", HOT);
      tile(eS, 34, 76, 340, 96, "[STOP]", HOT, 58); show(eS, P("E", 3));
      const eL = glass(E, 80, 1135, 920, 195, ACC, 28); title(eL, 34, 18, "OUTPUT LIMIT", ACC);
      el(eL, `left:34px;top:92px;width:850px;height:70px;border-radius:14px;background:#233147`);
      const eLf = el(eL, `left:34px;top:92px;width:850px;height:70px;border-radius:14px;background:${ACC}`);
      tl.set(eLf, { scaleX: 0, transformOrigin: "left center" }, 0); tl.to(eLf, { scaleX: 1, duration: 1.4, ease: "power1.inOut", immediateRender: false }, P("E", 4));
      show(eL, P("E", 4) - .1);
      M.fit(E, { y: 170, h: 1130 });

      // diagram: F — the three-step recap as three cards.
      pillC(F, "INTERVIEW RECAP", 215, P("F", 0));
      const fCard = (y, n, name, t, draw) => { const c = glass(F, 80, y, 920, 310, CYAN, 30);
        el(c, `left:30px;top:30px;width:90px;height:90px;border-radius:45px;background:${ACC};color:#0B1220;display:flex;align-items:center;justify-content:center;font:800 56px ${LAT}`, n);
        el(c, `left:150px;top:36px;font:800 60px ${LAT};color:${TEXT}`, name); draw(c); show(c, t, { opacity: 0, y: 28 }); };
      fCard(300, "1", "OPTIONS", P("F", 1), c => { [70, 30].forEach((p, i) => { el(c, `left:36px;top:${160 + i * 62}px;width:${p * 8}px;height:46px;border-radius:9px;background:${CYAN}`); el(c, `left:${36 + p * 8 + 14}px;top:${156 + i * 62}px;font:800 44px ${COD};color:${TEXT}`, p + "%"); }); });
      fCard(640, "2", "PICK + ADD", P("F", 2), c => { tile(c, 36, 160, 340, 110, "The sky", CYAN, 60); el(c, `left:392px;top:176px;font:800 64px ${LAT};color:${ACC}`, "+"); tile(c, 470, 160, 190, 110, "is", ACC, 60); });
      fCard(980, "3", "REPEAT", P("F", 3), c => { el(c, `left:40px;top:120px;font:800 150px ${LAT};color:${ACC}`, "↻"); tile(c, 240, 160, 640, 110, "The sky is blue", CYAN, 56); });
      M.fit(F, { y: 170, h: 1130 });

      // diagram: G — which text does the next step see? Comment and follow.
      pillC(G, "CHECK YOURSELF", 215, P("G", 0));
      const gC = glass(G, 80, 300, 920, 270, CYAN, 30); title(gC, 34, 20, "AFTER blue");
      tile(gC, 34, 90, 360, 150, "The sky", CYAN, 68); tile(gC, 408, 90, 170, 150, "is", ACC, 68); tile(gC, 592, 90, 270, 150, "blue", ACC, 68);
      show(gC, P("G", 0) + .2);
      const gQ = el(G, `left:0;top:600px;width:1080px;text-align:center;font:800 76px ${LAT};color:${ACC}`, "NEXT INPUT?"); show(gQ, P("G", 1) + 1.2, { opacity: 0, y: 14 });
      [["The sky", CYAN, at("G", "sky")], ["The sky is blue", ACC, at("G", "is")]].forEach(([w, col, t], i) => { const b = glass(G, 80, 710 + i * 170, 920, 145, col, 28);
        el(b, `left:0;top:36px;width:920px;text-align:center;font:800 64px ${LAT};color:${col}`, w); show(b, i ? t - .2 : P("G", 2), { opacity: 0, y: 22 }); });
      const gCm = glass(G, 80, 1075, 920, 110, CYAN, 55);
      el(gCm, `left:43px;top:30px;font:700 44px ${COD};color:#AEB9D1`, "COMMENT..."); show(gCm, at("G", "Comment"), { opacity: 0, y: 22 });
      const gH = glass(G, 80, 1215, 920, 150, ACC, 28);
      el(gH, `left:38px;top:48px;font:800 49px ${COD};color:${TEXT}`, "@ai.learnvora");
      el(gH, `left:615px;top:40px;width:240px;height:85px;border-radius:43px;background:${ACC};display:flex;align-items:center;justify-content:center;font:800 39px ${COD};color:#0B1220`, "FOLLOW");
      show(gH, at("G", "follow") - .5, { opacity: 0, y: 22 });
      M.fit(G, { y: 170, h: 1130 });

      M.wipe(S.B); M.wipe(S.C); M.wipe(S.D); M.wipe(S.E); M.wipe(S.F); M.wipe(S.G);
      M.finish({ kw: { piece: "gold", token: "gold", loop: "cyan", stop: "hot", limit: "hot", repeat: "gold", comment: "gold", blue: "cyan", is: "gold" } });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
