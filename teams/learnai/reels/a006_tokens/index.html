    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I"], tag: "150 DAYS OF AI · DAY 6" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, VIOLET, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH"), I = M.$("#sI");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (list, t) => list.forEach((d) => gone(d, t));
      const dim = (list, t, op) => list.forEach((d) => tl.to(d, { opacity: op ?? 0.3, duration: 0.3, immediateRender: false }, t));
      const txt = (host, text, x, y, w, t, col, size, align, font) => { const sz = size || 36, a = align || "center";
        return show(el(host, `left:${x}px;top:${y}px;width:${w}px;text-align:${a};font:800 ${sz}px ${font || COD};letter-spacing:.04em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: 12 }); };
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 58, sz = o.size || 36, pad = o.pad || 30, tw = Math.round(String(text).length * 0.72 * sz + 2 * pad + 10); const w = el(host, `left:${540 - tw / 2}px;top:${y}px;width:${tw}px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${pad}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.12em;color:${col};white-space:nowrap">${text}</div>`;
        return show(w, t, { opacity: 0, y: -14 }); };
      const pillAt = (host, text, x, y, t, col, size) => { const sz = size || 38, h = Math.round(sz * 1.7);
        return show(el(host, `left:${x}px;top:${y}px;height:${h}px;display:flex;align-items:center;padding:0 28px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.1em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: -10 }); };
      const tile = (host, text, x, y, w, h, col, size, filled) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:16px;border:3px solid ${col};background:${ca(col, filled ? 0.28 : 0.12)};font:700 ${size}px ${COD};color:${TEXT};white-space:nowrap`, text);
      const ring = (host, x, y, w, h, col, t) => show(el(host, `left:${x - 8}px;top:${y - 8}px;width:${w + 16}px;height:${h + 16}px;box-sizing:border-box;border-radius:22px;border:4px solid ${col}`), t, { opacity: 0, scale: 1.05 }, 0.3);
      const NSx = "http://www.w3.org/2000/svg";
      const scissors = (host, x, y, size, t) => { const w = el(host, `left:${x}px;top:${y}px;width:${size}px;height:${size}px`);
        w.innerHTML = `<svg viewBox="0 0 64 64" width="${size}" height="${size}" style="overflow:visible"><g fill="none" stroke="${ACC}" stroke-width="4.5" stroke-linecap="round"><circle cx="18" cy="48" r="8"/><circle cx="46" cy="48" r="8"/><path d="M23 42L44 8M41 42L20 8"/></g></svg>`; return show(w, t, { opacity: 0, y: -20 }, 0.35); };
      const TK = [["nam", CYAN, "12682"], ["aste", VIOLET, "5642"], ["·dost", ACC, "49415"]];
      const tkW = [220, 260, 330];

      // ============ A: hook: the bubble becomes numbers, a tokenizer sits on the way ============
      // diagram: A
      M.hook(["“namaste dost”", "ChatGPT ko kaise?"], { size: 92, top: 230 });
      show(glass(A, 190, 480, 700, 130, CYAN, 36), 0.05, { opacity: 0, y: -20 }, 0.4);
      show(el(A, `left:190px;top:480px;width:700px;height:130px;display:flex;align-items:center;justify-content:center;font:700 60px ${LAT};color:${TEXT}`, "namaste dost"), 0.1, { opacity: 0 }, 0.3);
      const aA1 = M.arrow(A, { from: [540, 615], to: [540, 700], color: CYAN, w: 10 }); aA1.show(0.3, 0.3);
      const aQ = M.box(A, { x: 290, y: 960, w: 500, h: 200, label: "CHATGPT", icon: "robot", color: CYAN, size: 46 }); aQ.show(0.2);
      const aQp = pillC(A, "READS WORDS ?", 760, at("A", "padhta"), { col: MUTED, size: 42, h: 74, pad: 36 });
      gone(aQp, at("A", "nahi") - 0.15, 0.12);
      const aNo = pillC(A, "NO", 760, at("A", "nahi"), { col: HOT, size: 48, h: 78, pad: 60 });
      gone(aNo, at("A", "numbers") - 0.1, 0.25);
      const aIds = TK.map((k, i) => { const x = [150, 410, 670][i]; const c = tile(A, k[2], x, 720, 260, 100, k[1], 46, true); return show(c, at("A", "numbers") + i * 0.14, { opacity: 0, y: -16 }, 0.35); });
      const aEx = pillC(A, "EXAMPLE", 840, at("A", "numbers") + 0.4, { col: MUTED, size: 30, h: 50, pad: 26 });
      const aA2 = M.arrow(A, { from: [540, 905], to: [540, 955], color: GOOD, w: 10 }); aA2.show(at("A", "numbers") + 0.5, 0.3);
      pillAt(A, "TOKENIZER", 600, 616, at("A", "tokenizer"), ACC, 40);
      show(el(A, `left:560px;top:640px;width:40px;height:6px;border-radius:3px;background:${ACC}`), at("A", "tokenizer"), { opacity: 0, x: 20, y: 0 }, 0.3);
      M.fit(A, { y: 460, h: 840, maxScale: 1.6 });

      // ============ B: railway ticket counter ============
      // diagram: B
      const bP = glass(B, 60, 320, 480, 150, CYAN); show(bP, at("B", "ticket"), { opacity: 0, y: -16 });
      const bU = M.icon(B, "user", 80, 345, 100, CYAN); bU.show(at("B", "destination") - 0.2);
      const bPt = txt(B, "PUNE", 190, 360, 330, at("B", "destination"), TEXT, 66, "center", LAT);
      const bC = M.box(B, { x: 60, y: 560, w: 480, h: 180, label: "COUNTER", icon: "user", color: ACC, size: 44 }); bC.show(at("B", "railway") + 0.1);
      const bAr1 = M.arrow(B, { from: [300, 475], to: [300, 555], color: CYAN, w: 9 }); bAr1.show(at("B", "destination"), 0.3);
      const bT = glass(B, 60, 830, 480, 150, ACC); show(bT, at("B", "code") - 0.1, { opacity: 0, y: -20 });
      txt(B, "4821", 60, 860, 480, at("B", "code"), ACC, 82);
      const bAr2 = M.arrow(B, { from: [300, 745], to: [300, 825], color: ACC, w: 9 }); bAr2.show(at("B", "code") - 0.2, 0.3);
      const bAr3 = M.arrow(B, { from: [300, 985], to: [300, 1055], color: GOOD, w: 9 }); bAr3.show(at("B", "System"), 0.3);
      const bS = M.box(B, { x: 60, y: 1060, w: 480, h: 180, label: "SYSTEM", icon: "db", color: GOOD, size: 44 }); bS.show(at("B", "System"));
      const bCh = tile(B, "FULL TEXT", 590, 1090, 420, 110, MUTED, 40, false); show(bCh, at("B", "poora"), { opacity: 0, x: 20, y: 0 });
      const bX = M.icon(B, "cross", 880, 1050, 110, HOT); bX.show(at("B", "nahi"));
      pillAt(B, "TOKENIZER", 580, 590, at("B", "Tokenizer"), ACC, 40);
      pillAt(B, "TEXT", 580, 357, at("B", "text"), CYAN, 40);
      pillAt(B, "TOKENS", 580, 860, at("B", "tokens"), ACC, 40);
      M.fit(B, { y: 250, h: 1050, maxScale: 1.4 });

      // ============ C: three methods ============
      // diagram: C
      txt(C, "1 · LETTERS", 60, 300, 600, at("C", "pahla"), CYAN, 44, "left");
      const cL = "namaste".split("").map((ch, i) => { const x = 119 + i * 122; const t = tile(C, ch, x, 370, 110, 100, CYAN, 56, false);
        return [show(t, at("C", "letter") + i * 0.08, { opacity: 0, y: -14 }, 0.3), txt(C, String(i + 1), x, 478, 110, at("C", "letter") + 0.7 + i * 0.05, MUTED, 34)]; }).flat();
      const cTm = pillAt(C, "TOO MANY", 330, 535, at("C", "Problem"), HOT, 44);
      const row2 = [];
      row2.push(txt(C, "2 · WORDS", 60, 640, 600, at("C", "doosra"), VIOLET, 44, "left"));
      row2.push(show(tile(C, "namaste", 60, 710, 330, 100, VIOLET, 46, false), at("C", "poore"), { opacity: 0, x: -20, y: 0 }));
      const cV = M.box(C, { x: 600, y: 700, w: 400, h: 240, label: "VOCAB", icon: "book", color: VIOLET, size: 42 }); cV.show(at("C", "poore"));
      const cAr = M.arrow(C, { from: [395, 760], to: [595, 790], color: VIOLET, w: 8 }); cAr.show(at("C", "poore") + 0.3, 0.3);
      row2.push(show(tile(C, "chaiwala", 60, 850, 330, 100, HOT, 46, false), at("C", "naya"), { opacity: 0, x: -20, y: 0 }));
      const cAr2 = M.arrow(C, { from: [395, 900], to: [595, 880], color: HOT, w: 8, dash: true }); cAr2.show(at("C", "naya") + 0.3, 0.3);

      const cNo = pillAt(C, "NO ENTRY", 600, 975, at("C", "kahan"), HOT, 40);
      const cX = M.icon(C, "cross", 500, 855, 90, HOT); cX.show(at("C", "laaoge"));
      const row3 = [];

      const cOk = M.icon(C, "check", 880, 1030, 80, GOOD); cOk.show(at("C", "todna"));
      dim([].concat(cL, [cTm]), at("C", "isliye"), 0.3);

      // ============ D: the cut ============

      [400, 588].forEach((x, i) => { const c = el(D, `left:${x}px;top:322px;width:0;height:166px;border-left:4px dashed ${ACC}`); show(c, at("D", "nam") - 0.15 + i * 0.5, { opacity: 0, scaleY: 0.2 }, 0.3); });

      const dT = [90, 340, 640].map((x, i) => { const w = tkW[i]; const tt = tile(D, TK[i][0], x, 640, w, 130, TK[i][1], 64, true); return show(tt, [at("D", "nam"), at("D", "aste"), at("D", "dost", 1)][i], { opacity: 0, y: -50 }, 0.45); });
      const dRing = ring(D, 640, 640, 330, 130, ACC, at("D", "dhyaan"));

      [["Hello", "WORD", CYAN, 90, at("D", "word")], ["aste", "PIECE", VIOLET, 400, at("D", "piece")], [".", "PUNCT.", ACC, 710, at("D", "punctuation")]].forEach(([w, l, c, x, t]) => {
        show(tile(D, w, x, 960, 280, 120, c, 56, false), t, { opacity: 0, y: 20 }); txt(D, l, x, 1095, 280, t, c, 40); });
      M.fit(D, { y: 230, h: 1070, maxScale: 1.3 });

      // ============ E: vocabulary and ids ============
      // diagram: E
      pillAt(E, "tiktoken", 90, 250, at("E", "tiktoken"), CYAN, 42);
      pillAt(E, "cl100k_base", 450, 250, at("E", "cl100k_base"), VIOLET, 42);
      pillAt(E, "EXAMPLE", 810, 262, at("E", "cl100k_base"), MUTED, 28);
      show(glass(E, 90, 420, 900, 640, CYAN), P("E", 0) + 0.05, { opacity: 0, y: 20 });
      txt(E, "VOCABULARY", 90, 360, 900, at("E", "vocabulary"), CYAN, 40);
      txt(E, "TOKEN", 130, 450, 360, at("E", "token"), MUTED, 38, "center");
      txt(E, "ID", 520, 450, 420, at("E", "ID"), MUTED, 38, "center");
      const eCells = [];
      TK.forEach((k, i) => { const y = 520 + i * 165; const tt = tile(E, k[0], 130, y, tkW[i] + 40, 120, k[1], 60, true); show(tt, at("E", "token") + 0.1 + i * 0.12, { opacity: 0, x: -20, y: 0 }, 0.35);
        const cell = tile(E, "?", 560, y, 340, 120, k[1], 56, false); show(cell, at("E", "ID") + 0.1 + i * 0.12, { opacity: 0, x: 20, y: 0 }, 0.35); gone(cell, [at("E", "12682"), at("E", "5642"), at("E", "49415")][i] - 0.02, 0.05);
        const num = tile(E, k[2], 560, y, 340, 120, k[1], 56, true); show(num, [at("E", "12682"), at("E", "5642"), at("E", "49415")][i], { opacity: 0, scale: 0.9 }, 0.3);
        eCells.push(ring(E, 560, y, 340, 120, ACC, [at("E", "12682"), at("E", "5642"), at("E", "49415")][i])); });
      const eRoll = pillC(E, "ID = ROLL NUMBER", 1100, at("E", "roll"), { col: GOOD, size: 40, h: 72, pad: 36 });
      gone(eRoll, at("E", "cl100k_base") - 0.4, 0.3);
      pillC(E, "THIS ENCODING ONLY", 1100, at("E", "universal"), { col: ACC, size: 40, h: 72, pad: 36 });
      M.fit(E, { y: 230, h: 1070, maxScale: 1.3 });

      // ============ F: model sees ids; decode ============
      // diagram: F
      const fIds = TK.map((k, i) => show(tile(F, k[2], [90, 380, 670][i], 270, 270, 100, k[1], 46, true), at("F", "token") + i * 0.12, { opacity: 0, y: -16 }, 0.35));
      txt(F, "TOKEN IDS", 90, 205, 900, at("F", "IDs"), MUTED, 34);
      const fA1 = M.arrow(F, { from: [540, 375], to: [540, 440], color: CYAN, w: 9 }); fA1.show(at("F", "Model") - 0.3, 0.3);
      const fM = M.box(F, { x: 290, y: 450, w: 500, h: 180, label: "MODEL", icon: "model", color: CYAN, size: 44 }); fM.show(at("F", "Model"));
      pillC(F, "INTERNAL", 650, at("F", "internal"), { col: CYAN, size: 38, h: 66, pad: 34 });

      gB.push(txt(G, "TOKENIZER B", 90, 960, 900, at("G", "tokenizer", 1), MUTED, 36));
      [["straw", CYAN, 90, 400], ["berry", ACC, 520, 400]].forEach(([w, c, x, wd], i) => show(tile(G, w, x, 1015, wd, 120, c, 62, true), at("G", "alag", 1) + i * 0.2, { opacity: 0, y: -30 }, 0.4));
      pillAt(G, "EXAMPLE", 380, 1160, at("G", "same", 1), MUTED, 34);
      M.fit(G, { y: 230, h: 1070, maxScale: 1.3 });

      // ============ H: recap ============
