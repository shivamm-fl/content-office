<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }

      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="129" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sG"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="129" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="129" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="129" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A", "B", "C", "D", "E", "F", "G"], tag: "150 DAYS OF AI · DAY 9" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, VIOLET, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (list, t) => list.forEach((d) => gone(d, t));
      const dim = (list, t, op) => list.forEach((d) => tl.to(d, { opacity: op ?? 0.3, duration: 0.3, immediateRender: false }, t));
      const txt = (host, text, x, y, w, t, col, size, align, font) => { const sz = size || 36, a = align || "center";
        return show(el(host, `left:${x}px;top:${y}px;width:${w}px;text-align:${a};font:800 ${sz}px ${font || COD};letter-spacing:.04em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: 12 }); };
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 58, sz = o.size || 36, pad = o.pad || 30, tw = Math.round(String(text).length * 0.72 * sz + 2 * pad + 10); const w = el(host, `left:${540 - tw / 2}px;top:${y}px;width:${tw}px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${pad}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.12em;color:${col};white-space:nowrap">${text}</div>`;
        return show(w, t, { opacity: 0, y: -14 }); };
      const pillAt = (host, text, x, y, t, col, size) => { const sz = size || 38, h = Math.round(sz * 1.7);
        return show(el(host, `left:${x}px;top:${y}px;height:${h}px;display:flex;align-items:center;padding:0 28px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.1em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: -10 }); };
      const tile = (host, text, x, y, w, h, col, size, filled) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:16px;border:3px solid ${col};background:${ca(col, filled ? 0.28 : 0.12)};font:700 ${size}px ${COD};color:${TEXT};white-space:nowrap`, text);
      const ring = (host, x, y, w, h, col, t) => show(el(host, `left:${x - 8}px;top:${y - 8}px;width:${w + 16}px;height:${h + 16}px;box-sizing:border-box;border-radius:22px;border:4px solid ${col}`), t, { opacity: 0, scale: 1.05 }, 0.3);
      const bar = (host, x, y, w, h, col, t, dur) => { const b = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:12px;background:${ca(col, 0.55)};border:3px solid ${col};transform-origin:0 50%`);
        tl.set(b, { opacity: 0, scaleX: 0 }, 0); tl.to(b, { opacity: 1, scaleX: 1, duration: dur || 0.7, ease: "power3.out", immediateRender: false }, t); return b; };

      const gl = (host, x, y, w, h, col, rad) => glass(host, x, y, w, h, col, rad);
            const bub = (host, text, x, y, w, h, col, t, o) => { o = o || {};
        const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;display:flex;align-items:center;justify-content:${o.just || "center"};padding:0 28px;border-radius:${o.rad || "26px"};border:${o.dash ? "3px dashed" : "3px solid"} ${col};background:${o.bg || ca(col, 0.12)};font:${o.wt || 600} ${o.size || 44}px ${o.font || LAT};color:${o.tc || TEXT};white-space:nowrap`, text);
        return t == null ? d : show(d, t, o.from || { opacity: 0, y: 16 }, 0.4); };
      // ===== a009 helpers: the toy chart (real run: state/runs/a009_train_infer_run_output.txt) =====
      const XS = [1, 2, 3, 4, 5], YS = XS.map((x) => 2 * x + 1);
      const px = (x) => 70 + x * 130, py = (y) => 460 - y * 35;
      const lossOf = (w, b) => XS.reduce((s, x, i) => s + (w * x + b - YS[i]) ** 2, 0) / 5;
      const fmtLoss = (l) => (l < 0.001 ? l.toFixed(4) : l.toFixed(2));
      const makeChart = (host, y) => {
        const panel = gl(host, 90, y, 900, 540, null);
        const wrap = el(panel, "left:0;top:10px;width:900px;height:520px");
        wrap.innerHTML = `<svg viewBox="0 0 900 520" width="900" height="520" style="overflow:visible">
          <line x1="70" y1="460" x2="870" y2="460" stroke="#5B6B8C" stroke-width="3"/><line x1="70" y1="30" x2="70" y2="460" stroke="#5B6B8C" stroke-width="3"/>
          <line class="tgt" x1="${px(0)}" y1="${py(1)}" x2="${px(5.6)}" y2="${py(12.2)}" stroke="${ACC}" stroke-width="4" stroke-dasharray="14 12" opacity="0"/>
          <g class="res">${XS.map((x, i) => `<line x1="${px(x)}" y1="${py(YS[i])}" x2="${px(x)}" y2="${py(0)}" stroke="${HOT}" stroke-width="6" stroke-linecap="round" opacity="0"/>`).join("")}</g>
          <line class="ml" x1="${px(0)}" y1="${py(0)}" x2="${px(5.6)}" y2="${py(0)}" stroke="${CYAN}" stroke-width="9" stroke-linecap="round" opacity="0"/>
          <g class="pts">${XS.map((x, i) => `<circle cx="${px(x)}" cy="${py(YS[i])}" r="17" fill="${ACC}" stroke="#0B1020" stroke-width="3" opacity="0"/>`).join("")}</g></svg>`;
        const q = (s) => wrap.querySelector(s), qa = (s) => Array.from(wrap.querySelectorAll(s));
        const ml = q(".ml"), res = qa(".res line"), pts = qa(".pts circle"), tgt = q(".tgt");
        const setLine = (w, b) => { ml.setAttribute("y1", py(b)); ml.setAttribute("y2", py(5.6 * w + b));
          res.forEach((r, i) => r.setAttribute("y2", py(w * XS[i] + b))); };
        return { panel, ml, res, pts, tgt, setLine, show: (t) => { show(panel, t, { opacity: 0, y: 20 }); } };
      };
      const lossRow = (host, y) => {
        const lab = txt(host, "LOSS", 90, y, 200, 0, HOT, 44, "left", LAT); // placeholder, shown by caller
        return lab; };

      // ============ A: hook: a chat, then the student ============
      // diagram: A
      M.hook(["100 baar samjhaya,", "phir bhi same galti?"], { size: 88, top: 230 });
      gl(A, 90, 480, 900, 400, CYAN, 28);
      bub(A, "No! Not like this", 390, 530, 560, 110, CYAN, null, { size: 46 });
      const aDots = show(bub(A, "• • •", 130, 680, 190, 96, CYAN, null, { size: 44, wt: 700, tc: CYAN }), 0.3, { opacity: 0 });
      gone(aDots, 1.1);
      show(bub(A, "Sorry! (same mistake)", 130, 680, 700, 96, GOOD, null, { size: 44, bg: ca(GOOD, 0.12) }), 1.15, { opacity: 0, y: 12 });
      pillAt(A, "× 100", 130, 545, at("A", "100"), ACC, 40); const aQ = pillAt(A, "SAME MISTAKE", 250, 790, at("A", "same") - 0.1, HOT, 38); 
      const aOK = pillAt(A, "LEARNED BEFORE", 250, 790, at("A", "pehle"), GOOD, 38); gone(aQ, at("A", "pehle") - 0.35, 0.2);
      const aC1 = gl(A, 90, 920, 400, 290, ACC, 24); show(aC1, at("A", "jaise") - 0.1, { opacity: 0, y: 20 });
      M.icon(A, "book", 205, 940, 140, ACC).show(at("A", "jaise"));
      txt(A, "STUDY", 90, 1105, 400, at("A", "mahinon"), ACC, 52);
      M.arrow(A, { from: [500, 1065], to: [580, 1065], color: MUTED, w: 8 }).show(at("A", "phir"), 0.3);
      const aC2 = gl(A, 590, 920, 400, 290, CYAN, 24); show(aC2, at("A", "exam") - 0.1, { opacity: 0, y: 20 });
      M.icon(A, "doc", 720, 940, 140, CYAN).show(at("A", "exam"));
      txt(A, "EXAM HALL", 590, 1105, 400, at("A", "hall"), CYAN, 52);
      pillAt(A, "TRAINING", 110, 1240, at("A", "training"), ACC, 44);
      pillAt(A, "INFERENCE", 585, 1240, at("A", "inference"), CYAN, 44);
      M.fit(A, { y: 460, h: 850, maxScale: 1.25 });

      // ============ B: the toy model ============
      // diagram: B
      pillAt(B, "EXAMPLE", 700, 245, S.B + 0.1, ACC, 34);
      const bC = makeChart(B, 300); bC.show(S.B + 0.05);
      const bBox = M.box(B, { x: 280, y: 470, w: 520, h: 220, label: "TINY MODEL", icon: "model", color: CYAN, size: 44 }); bBox.show(S.B + 0.1); bBox.hide(at("B", "5") - 0.15);
      bC.pts.forEach((p, i) => tl.to(p, { opacity: 1, duration: 0.3, immediateRender: false }, at("B", "5") + i * 0.18));
      tl.to(bC.tgt, { opacity: 1, duration: 0.6, immediateRender: false }, at("B", "line"));
      txt(B, "y = 2x + 1", 560, 340, 300, at("B", "line") + 0.2, ACC, 40, "left");
      tl.to(bC.ml, { opacity: 1, duration: 0.4, immediateRender: false }, at("B", "numbers"));
      const bW = tile(B, "w = 0.00", 90, 870, 430, 110, CYAN, 52); show(bW, at("B", "w"), { opacity: 0, y: 16 });
      const bB = tile(B, "b = 0.00", 560, 870, 430, 110, CYAN, 52); show(bB, at("B", "b"), { opacity: 0, y: 16 });
      pillC(B, "WEIGHTS", 800 + 190, at("B", "weights"), { col: CYAN, size: 40, h: 70 });
      bC.res.forEach((r, i) => tl.to(r, { opacity: 1, duration: 0.4, immediateRender: false }, at("B", "galti") + i * 0.08));
      txt(B, "LOSS", 90, 1060, 200, at("B", "Loss"), HOT, 52, "left");
      const bBar = bar(B, 290, 1075, 700, 50, HOT, at("B", "Loss") + 0.1, 0.8);
      pillAt(B, "SMALL = GOOD", 380, 1160, at("B", "kam"), GOOD, 36);
      M.fit(B, { y: 230, h: 1100, maxScale: 1.25 });

      // ============ C: training, the real run ============
      // diagram: C
      const cC = makeChart(C, 300); cC.show(S.C + 0.05);
      cC.pts.forEach((p) => tl.set(p, { opacity: 1 }, 0)); tl.set(cC.tgt, { opacity: 1 }, 0); tl.set(cC.ml, { opacity: 1 }, 0); cC.res.forEach((r) => tl.set(r, { opacity: 1 }, 0));
      const cW = tile(C, "w = 0.00", 90, 870, 430, 110, CYAN, 52); show(cW, S.C + 0.1, { opacity: 0, y: 16 });
      const cB = tile(C, "b = 0.00", 560, 870, 430, 110, CYAN, 52); show(cB, S.C + 0.1, { opacity: 0, y: 16 });
      txt(C, "LOSS", 90, 1030, 200, S.C + 0.1, HOT, 52, "left");
      const cL = txt(C, "57.00", 280, 1030, 300, S.C + 0.1, TEXT, 52, "left");
      const cBar = el(C, `left:290px;top:1105px;width:700px;height:44px;border-radius:12px;background:${ca(HOT, 0.55)};border:3px solid ${HOT};transform-origin:0 50%;box-sizing:border-box`);
      show(cBar, S.C + 0.1, { opacity: 0 });
      const st = { w: 0, b: 0 };
      const apply = () => { cC.setLine(st.w, st.b); const l = lossOf(st.w, st.b);
        cW.textContent = "w = " + st.w.toFixed(2); cB.textContent = "b = " + st.b.toFixed(2); cL.textContent = fmtLoss(l);
        cBar.style.width = Math.max(6, 700 * Math.min(1, l / 57)) + "px"; };
      const go = (t, dur, w, b) => tl.to(st, { w, b, duration: dur, ease: "power2.inOut", onUpdate: apply, immediateRender: false }, t);
      go(at("C", "sarkata") - 0.2, at("C", "Step", 0) + 0.4 - (at("C", "sarkata") - 0.2), 1.0, 0.28);
      go(at("C", "Step", 1), 0.9, 2.1037, 0.612);
      go(at("C", "Step", 2), 1.1, 2.0039, 0.9861);
      const stepTags = [["STEP 1", "Step", 0], ["STEP 10", "Step", 1], ["STEP 500", "Step", 2]].map(([tx, w, n], i, arr) => { const d = pillAt(C, tx, 660, 245, at("C", w, n), ACC, 38); if (i < 2) gone(d, at("C", "Step", n + 1) - 0.3, 0.2); return d; });
      ring(C, 90, 870, 430, 110, GOOD, at("C", "200") - 0.1); ring(C, 560, 870, 430, 110, GOOD, at("C", "099") - 0.1);
      tl.to(cC.ml, { stroke: GOOD, duration: 0.4, immediateRender: false }, at("C", "line"));
      pillAt(C, "500 STEPS", 90, 245, at("C", "500", 1) - 0.1, GOOD, 38);
      M.fit(C, { y: 230, h: 1100, maxScale: 1.25 });

      // ============ D: inference, the weights are locked ============
      // diagram: D
      const dP = gl(D, 90, 280, 900, 330, CYAN, 28); show(dP, S.D + 0.05, { opacity: 0, y: 20 });
      txt(D, "TRAINED MODEL", 90, 305, 900, S.D + 0.1, CYAN, 40);
      const dW = tile(D, "w = 2.00", 130, 380, 330, 110, CYAN, 50); show(dW, S.D + 0.1, { opacity: 0 });
      const dB = tile(D, "b = 0.99", 500, 380, 330, 110, CYAN, 50); show(dB, S.D + 0.1, { opacity: 0 });
      const dLock = M.icon(D, "lock", 860, 385, 100, ACC); dLock.show(at("D", "lock"));
      pillAt(D, "LOCKED", 370, 515, at("D", "lock") + 0.15, ACC, 40);
      const calcRow = (y, xin, out, tIn, tOut, col) => {
        bub(D, xin, 90, y, 270, 110, MUTED, tIn, { size: 46, font: COD, wt: 700 });
        M.arrow(D, { from: [370, y + 55], to: [430, y + 55], color: MUTED, w: 7 }).show(tIn + 0.2, 0.3);
        show(tile(D, "× w + b", 440, y, 250, 110, CYAN, 40), tIn + 0.35, { opacity: 0 });
        M.arrow(D, { from: [700, y + 55], to: [760, y + 55], color: MUTED, w: 7 }).show(tOut - 0.2, 0.3);
        bub(D, out, 770, y, 220, 110, GOOD, tOut, { size: 50, font: COD, wt: 800, bg: ca(GOOD, 0.14) }); };
      calcRow(680, "x = 10", "21.0", at("D", "10"), at("D", "210"), GOOD);
      calcRow(830, "x = 100", "201.4", at("D", "100"), at("D", "2014"), GOOD);
      pillAt(D, "INFERENCE", 350, 990, at("D", "inference"), CYAN, 42);
      pillAt(D, "1 MULTIPLY", 100, 1090, at("D", "multiply", 1), MUTED, 36);
      pillAt(D, "1 ADD", 560, 1090, at("D", "add", 1), MUTED, 36);
      ring(D, 130, 380, 330, 110, GOOD, at("D", "wahi")); ring(D, 500, 380, 330, 110, GOOD, at("D", "wahi"));
      pillAt(D, "SAME", 700, 515, at("D", "wahi") + 0.1, GOOD, 40);
      M.fit(D, { y: 240, h: 1100, maxScale: 1.25 });

      // ============ E: slow once vs cheap many, then the point ============
      // diagram: E
      const eT = gl(E, 90, 270, 900, 250, ACC, 24); show(eT, S.E + 0.05, { opacity: 0, y: 20 });
      M.icon(E, "clock", 120, 300, 110, ACC).show(S.E + 0.1);
      txt(E, "TRAINING", 250, 295, 700, S.E + 0.1, ACC, 46, "left");
      bar(E, 250, 380, 700, 44, ACC, at("E", "dheemi"), 1.4);
      pillAt(E, "SLOW", 250, 445, at("E", "dheemi"), ACC, 34); pillAt(E, "COSTLY", 440, 445, at("E", "mahngi"), ACC, 34); pillAt(E, "ONCE", 700, 445, at("E", "baar"), GOOD, 34);
      const eI = gl(E, 90, 550, 900, 330, CYAN, 24); show(eI, at("E", "Inference") - 0.1, { opacity: 0, y: 20 });
      M.icon(E, "bolt", 120, 575, 100, CYAN).show(at("E", "Inference"));
      txt(E, "INFERENCE", 250, 590, 700, at("E", "Inference"), CYAN, 46, "left");
      for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) { const k = r * 6 + c;
        const ch = el(E, `left:${125 + c * 142}px;top:${690 + r * 85}px;width:120px;height:62px;box-sizing:border-box;border-radius:20px 20px 20px 6px;border:3px solid ${CYAN};background:${ca(CYAN, 0.18)}`);
        show(ch, at("E", "baar-baar") + k * 0.07, { opacity: 0, scale: 0.8 }, 0.25); }
      pillAt(E, "EFFICIENT", 640, 600, at("E", "efficient"), CYAN, 34);
      // the point
      dim([eT, eI], at("E", "isliye"), 0.25);
      const eU = bub(E, "YOUR MESSAGE", 90, 960, 400, 100, CYAN, at("E", "isliye"), { size: 38 });
      M.arrow(E, { from: [500, 1010], to: [570, 1010], color: MUTED, w: 7 }).show(at("E", "message") - 0.1, 0.3);
      const eB = M.box(E, { x: 580, y: 940, w: 410, h: 140, label: "LOCKED MODEL", icon: "lock", color: CYAN, size: 36 }); eB.show(at("E", "message"));
      const eN = M.icon(E, "cross", 395, 1100, 100, HOT); eN.show(at("E", "seekhta"));
      txt(E, "LEARNS?", 90, 1120, 300, at("E", "seekhta"), HOT, 48, "left");
      pillAt(E, "w, b SAME", 580, 1110, at("E", "seekhta") + 0.2, GOOD, 36);
      M.fit(E, { y: 250, h: 1070, maxScale: 1.25 });

      // ============ F: real models are bigger; retraining is another job ============
      // diagram: F
