<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Raw model vs chat model</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="130" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sG"></div><div class="beat" id="sH"></div><div class="beat" id="sI"></div><div class="beat" id="sJ"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="130" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="130" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="130" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"], tag: "150 DAYS OF AI · DAY 8" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, VIOLET, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH"), I = M.$("#sI"), J = M.$("#sJ");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (list, t) => list.forEach((d) => gone(d, t));
      const dim = (list, t, op) => list.forEach((d) => tl.to(d, { opacity: op ?? 0.3, duration: 0.3, immediateRender: false }, t));
      const txt = (host, text, x, y, w, t, col, size, align, font) => { const sz = size || 36, a = align || "center";
        return show(el(host, `left:${x}px;top:${y}px;width:${w}px;text-align:${a};font:800 ${sz}px ${font || COD};letter-spacing:.04em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: 12 }); };
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 58, sz = o.size || 36, pad = o.pad || 30, tw = Math.round(String(text).length * 0.72 * sz + 2 * pad + 10); const w = el(host, `left:${540 - tw / 2}px;top:${y}px;width:${tw}px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${pad}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.12em;color:${col};white-space:nowrap">${text}</div>`;
        return show(w, t, { opacity: 0, y: -14 }); };
      const pillAt = (host, text, x, y, t, col, size) => { const sz = size || 38, h = Math.round(sz * 1.7);
        return show(el(host, `left:${x}px;top:${y}px;height:${h}px;display:flex;align-items:center;padding:0 28px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.1em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: -10 }); };
      const tile = (host, text, x, y, w, h, col, size, filled) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:16px;border:3px solid ${col};background:${ca(col, filled ? 0.28 : 0.12)};font:700 ${size}px ${COD};color:${TEXT};white-space:nowrap`, text);
      const ring = (host, x, y, w, h, col, t) => show(el(host, `left:${x - 8}px;top:${y - 8}px;width:${w + 16}px;height:${h + 16}px;box-sizing:border-box;border-radius:22px;border:4px solid ${col}`), t, { opacity: 0, scale: 1.05 }, 0.3);
      const bar = (host, x, y, w, h, col, t, dur) => { const b = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:12px;background:${ca(col, 0.55)};border:3px solid ${col};transform-origin:0 50%`);
        tl.set(b, { opacity: 0, scaleX: 0 }, 0); tl.to(b, { opacity: 1, scaleX: 1, duration: dur || 0.7, ease: "power3.out", immediateRender: false }, t); return b; };

      const gl = (host, x, y, w, h, col, rad) => glass(host, x, y, w, h, col, rad);
      // ===== a008 helpers =====
      const bub = (host, text, x, y, w, h, col, t, o) => { o = o || {};
        const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;display:flex;align-items:center;justify-content:${o.just || "center"};padding:0 28px;border-radius:${o.rad || "26px"};border:${o.dash ? "3px dashed" : "3px solid"} ${col};background:${o.bg || ca(col, 0.12)};font:${o.wt || 600} ${o.size || 44}px ${o.font || LAT};color:${o.tc || TEXT};white-space:nowrap`, text);
        return show(d, t, o.from || { opacity: 0, y: 16 }, 0.4); };
      const stepBar = (host, states, t0) => states.map((s, i) => { const col = s === "done" ? GOOD : s === "on" ? ACC : MUTED;
        const d = el(host, `left:${380 + i * 130}px;top:250px;width:110px;height:76px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:999px;border:3px solid ${col};background:${ca(col, 0.14)};font:800 44px ${COD};color:${col}`, s === "done" ? "✓" : String(i + 1));
        return show(d, t0 + i * 0.12, { opacity: 0, y: -10 }, 0.3); });
      const actStep = (d, t) => tl.to(d, { borderColor: ACC, color: ACC, backgroundColor: ca(ACC, 0.14), duration: 0.3, immediateRender: false }, t);
      const hbar = (host, label, x, y, w, h, col, t, dur) => [txt(host, label, x, y - 56, 700, t, col, 40, "left"), bar(host, x, y, w, h, col, t, dur)];

      // ============ A: hook: a worksheet that continues itself ============
      // diagram: A
      M.hook(["Asked a question,", "AI wrote more?"], { size: 88, top: 230 });
      show(gl(A, 90, 480, 900, 640, CYAN, 28), 0.05, { opacity: 0, y: -20 }, 0.4);
      pillAt(A, "YOU", 130, 515, 0.15, CYAN, 36);
      bub(A, "What is the capital of India?", 130, 600, 820, 110, CYAN, 0.2, { size: 42 });
      pillAt(A, "AI WROTE", 130, 745, 0.7, HOT, 36); pillAt(A, "RAW MODEL", 560, 745, 0.8, CYAN, 36);
      ["What is the capital of Pakistan?", "What is the capital of China?", "What is the capital of Japan?"].forEach((q, i) => bub(A, q, 130, 830 + i * 100, 820, 84, HOT, 0.9 + i * 0.5, { size: 38, bg: ca(HOT, 0.10) }));
      M.fit(A, { y: 460, h: 840, maxScale: 1.3 });

      // ============ B: the friend keeps writing the quiz ============
      // diagram: B
      pillAt(B, "YOU", 130, 260, S.B + 0.1, CYAN, 34);
      bub(B, "Capital of India?", 380, 320, 600, 100, CYAN, S.B + 0.2, { size: 42 });
      const bGhost = bub(B, "New Delhi", 90, 480, 460, 100, MUTED, at("B", "jawab"), { size: 42, dash: true, tc: MUTED, bg: "transparent" });
      const bX = M.icon(B, "cross", 570, 490, 80, HOT); bX.show(at("B", "jagah"));
      show(gl(B, 90, 640, 900, 330, ACC, 28), at("B", "quiz") - 0.1, { opacity: 0, y: 20 });
      pillAt(B, "QUIZ PAPER", 130, 665, at("B", "quiz") - 0.05, ACC, 34);
      bub(B, "Q2. Capital of China?", 130, 750, 820, 84, HOT, at("B", "agla"), { size: 38, bg: ca(HOT, 0.10) });
      bub(B, "Q3. Capital of Japan?", 130, 850, 820, 84, HOT, at("B", "likhne"), { size: 38, bg: ca(HOT, 0.10) });
      pillC(B, "READ MOST", 1010, at("B", "sabse"), { col: MUTED, size: 38, h: 66, pad: 34 });
      const bM = M.box(B, { x: 290, y: 1110, w: 500, h: 170, label: "RAW MODEL", icon: "model", color: CYAN, size: 46 }); bM.show(at("B", "raw"));
      M.fit(B, { y: 240, h: 1150, maxScale: 1.8 });

      // ============ C: continue the text ============
      // diagram: C
      [0, 1, 2].forEach((k) => M.icon(C, "doc", 70 + k * 160, 300, 140, CYAN).show(S.C + 0.1 + k * 0.1));
      pillAt(C, "INTERNET TEXT", 70, 455, S.C + 0.3, CYAN, 32);
      M.arrow(C, { from: [545, 370], to: [640, 370], color: CYAN, w: 9 }).show(at("C", "intarnet"), 0.4);
      const cM = M.box(C, { x: 650, y: 290, w: 370, h: 170, label: "RAW MODEL", icon: "model", color: CYAN, size: 36 }); cM.show(S.C + 0.1);
      pillAt(C, "TEXT SO FAR", 90, 580, at("C", "text"), MUTED, 36);
      bub(C, "Once upon a", 90, 660, 560, 120, CYAN, at("C", "text"), { size: 50 });
      const cCur = show(el(C, `left:620px;top:682px;width:8px;height:66px;background:${ACC}`), at("C", "text") + 0.2, { opacity: 0 }, 0.2);
      M.arrow(C, { from: [835, 465], to: [835, 650], color: ACC, w: 9 }).show(at("C", "aage") - 0.2, 0.4);
      const cNext = bub(C, "time", 690, 660, 280, 120, ACC, at("C", "aage"), { size: 50, wt: 800, tc: ACC, bg: ca(ACC, 0.16) });
      pillAt(C, "NEXT WORD", 690, 810, at("C", "likhna"), ACC, 38);
      pillC(C, "PRETRAINING", 960, at("C", "pretraining"), { col: ACC, size: 52, h: 90, pad: 48 });
      M.fit(C, { y: 240, h: 1150, maxScale: 1.8 });

      // ============ D: more questions is the likely text ============
      // diagram: D
      pillC(D, "QUIZ SHEETS", 270, S.D + 0.05, { col: ACC, size: 44, h: 76, pad: 40 });
      [0, 1, 2].forEach((k) => M.icon(D, "doc", 330 + k * 160, 365, 110, ACC).show(S.D + 0.2 + k * 0.15));
      pillAt(D, "PROMPT", 120, 530, at("D", "What"), CYAN, 32);
      bub(D, "What is the capital of India?", 90, 600, 900, 100, CYAN, at("D", "What"), { size: 42 });
      const dB = [hbar(D, "MORE QUESTIONS", 90, 810, 780, 80, HOT, at("D", "sabse"), 0.8), hbar(D, "ANSWER", 90, 960, 150, 80, CYAN, at("D", "sabse") + 0.3, 0.5)];
      goneAll(dB.flat(), at("D", "maan") - 0.1);
      const dOut = [pillAt(D, "AI WROTE", 120, 770, at("D", "likha"), HOT, 32), bub(D, "What is the capital of Pakistan?", 90, 840, 900, 90, HOT, at("D", "Pakistan"), { size: 40, bg: ca(HOT, 0.10) }), bub(D, "What is the capital of China?", 90, 950, 900, 90, HOT, at("D", "China"), { size: 40, bg: ca(HOT, 0.10) })];
      pillC(D, "EXAMPLE", 1085, at("D", "example"), { col: MUTED, size: 34, h: 58, pad: 30 });
      pillC(D, "NEVER TAUGHT", 1170, at("D", "sikhaya"), { col: HOT, size: 50, h: 88, pad: 46 });
      M.fit(D, { y: 240, h: 1150, maxScale: 1.8 });

      // ============ E: step 1 instruction tuning ============
      // diagram: E
      const eS = stepBar(E, ["off", "off", "off"], S.E + 0.05);
      actStep(eS[0], at("E", "pahla"));
      const eM = M.box(E, { x: 300, y: 350, w: 480, h: 150, label: "BASE MODEL", icon: "model", color: CYAN, size: 44 }); eM.show(S.E + 0.1);
      pillC(E, "INSTRUCTION TUNING", 510, at("E", "instruction"), { col: ACC, size: 42, h: 74, pad: 36 });
      const eRows = [["Capital of India?", "New Delhi"], ["Translate hello", "Namaste"], ["2 + 2 ?", "4"]];
      eRows.forEach(([q, a], i) => { const y = 690 + i * 125, t = [at("E", "examples"), at("E", "sawal"), at("E", "achha")][i];
        bub(E, q, 60, y, 440, 104, CYAN, t, { size: 40 }); M.arrow(E, { from: [510, y + 52], to: [570, y + 52], color: MUTED, w: 7 }).show(t + 0.1, 0.3);
        bub(E, a, 580, y, 440, 104, GOOD, t + 0.15, { size: 42, bg: ca(GOOD, 0.14) }); });
      pillAt(E, "EXAMPLE", 60, 598, at("E", "examples"), MUTED, 30);
      M.arrow(E, { from: [540, 1060], to: [540, 1120], color: GOOD, w: 9 }).show(at("E", "pattern") - 0.3, 0.3);
      M.box(E, { x: 250, y: 1125, w: 580, h: 170, label: "TUNED MODEL", sub: "Q > A  =  LIKELY", icon: "model", color: GOOD, size: 44, subsize: 34 }).show(at("E", "pattern"));
      M.fit(E, { y: 240, h: 1150, maxScale: 1.5 });

      // ============ F: step 2 human feedback ============
      // diagram: F
      stepBar(F, ["done", "on", "off"], S.F + 0.05);
      const fG1 = [];
      fG1.push(bub(F, "Capital of India?", 250, 370, 580, 90, CYAN, at("F", "sawal"), { size: 40 }));
      const fAns = [["Mumbai", MUTED], ["New Delhi", GOOD], ["Not sure", MUTED]];
      const fCards = fAns.map(([a, c], i) => bub(F, a, 90, 500 + i * 120, 520, 96, c, at("F", "kai") + i * 0.25, { size: 40 }));
      fG1.push(...fCards);
      const fU = M.icon(F, "user", 760, 610, 170, CYAN); fU.show(at("F", "log")); fG1.push(pillAt(F, "PERSON", 760, 800, at("F", "log"), CYAN, 32));
      const fRing = ring(F, 90, 620, 520, 96, GOOD, at("F", "behtar")); const fChk = M.icon(F, "check", 640, 628, 80, GOOD); fChk.show(at("F", "behtar"));
      [0, 2].forEach((k) => tl.to(fCards[k], { opacity: 0.3, duration: 0.3, immediateRender: false }, at("F", "behtar") + 0.3));
      const fArr = M.arrow(F, { from: [650, 720], to: [650, 930], color: GOOD, w: 8 }); fArr.show(at("F", "dhalta") - 0.5, 0.3);
      const fMod = M.box(F, { x: 450, y: 940, w: 400, h: 140, label: "MODEL", icon: "model", color: CYAN, size: 40 }); fMod.show(at("F", "dhalta") - 0.4);
      const fExp = pillC(F, "EXAMPLE", 1100, at("F", "kai"), { col: MUTED, size: 30, h: 50, pad: 26 });
      const fG1all = [...fG1, fU, fRing, fChk, fArr, fMod, fExp];
      const fHandles = [fU, fChk, fArr, fMod];
      goneAll(fG1all.filter((d) => d && d.nodeType), at("F", "asar") - 0.3); fHandles.forEach((h) => h.hide(at("F", "asar") - 0.3));
      txt(F, "1.3B  TUNED", 90, 350, 700, at("F", "13"), GOOD, 50, "left");
      bar(F, 90, 420, 14, 100, GOOD, at("F", "13"), 0.4);
      bub(F, "1.3B", 130, 420, 220, 100, GOOD, at("F", "13") + 0.2, { size: 46, wt: 800, bg: ca(GOOD, 0.14) });
      const fCk2 = M.icon(F, "check", 380, 425, 90, GOOD); fCk2.show(at("F", "pasand"));
      txt(F, "175B  RAW GPT-3", 90, 570, 800, at("F", "175"), HOT, 50, "left");
      bar(F, 90, 640, 840, 100, HOT, at("F", "175"), 0.9);
      txt(F, "175B", 130, 655, 300, at("F", "175") + 0.5, TEXT, 54, "left");
      pillAt(F, "TO SCALE", 90, 765, at("F", "175") + 0.8, MUTED, 34);
      pillC(F, "PEOPLE PICK 1.3B", 870, at("F", "pasand"), { col: GOOD, size: 48, h: 84, pad: 44 });
      pillC(F, "PARAMETERS = NUMBERS", 1000, at("F", "Parameters"), { col: ACC, size: 42, h: 74, pad: 38 });
      ["0.7", "-1.2", "0.3", "2.4", "-0.5", "1.1"].forEach((n, k) => show(tile(F, n, 70 + k * 155, 1110, 140, 100, ACC, 40, true), at("F", "numbers") - 0.6 + k * 0.1, { opacity: 0, y: -10 }, 0.3));
      M.fit(F, { y: 240, h: 1150, maxScale: 1.3 });

      // ============ G: step 3 chat template ============
      // diagram: G
      stepBar(G, ["done", "done", "on"], S.G + 0.05);
      pillC(G, "ALL TEXT", 360, S.G + 0.1, { col: MUTED, size: 40, h: 66, pad: 36 });
      show(gl(G, 70, 460, 940, 690, VIOLET, 28), S.G + 0.3, { opacity: 0, y: 20 });
      const gRow = (y, lab, col, t) => { pillAt(G, lab, 90, y + 4, t, col, 38); };
      gRow(500, "SYSTEM", ACC, at("G", "system")); bub(G, "be helpful", 490, 490, 500, 90, ACC, at("G", "system"), { size: 38, bg: ca(ACC, 0.10) });
      gRow(640, "USER", CYAN, at("G", "user")); bub(G, "Capital of India?", 490, 630, 500, 90, CYAN, at("G", "bhaarat"), { size: 38 });
      gRow(780, "ASSISTANT", VIOLET, at("G", "assistant"));
      const gSlot = bub(G, "▍", 490, 770, 500, 90, VIOLET, at("G", "assistant"), { size: 38, dash: true, tc: VIOLET, bg: "transparent" });
      const gAns = bub(G, "New Delhi", 490, 770, 500, 90, GOOD, at("G", "bharta"), { size: 42, bg: ca(GOOD, 0.16) });
      gone(gSlot, at("G", "bharta"), 0.2);
      const gNo = pillC(G, "NO MARKER", 925, at("G", "marker"), { col: HOT, size: 42, h: 72, pad: 38 });
      const gExt = bub(G, "…Capital of China?", 490, 1010, 500, 90, HOT, at("G", "aage"), { size: 38, dash: true, bg: ca(HOT, 0.10) });
      pillAt(G, "USER?", 90, 1024, at("G", "aage"), HOT, 38);
      M.fit(G, { y: 240, h: 1150, maxScale: 1.3 });

      // ============ H: same engine, two tuned versions ============
      // diagram: H
      const hE = M.box(H, { x: 250, y: 300, w: 580, h: 190, label: "BASE MODEL", sub: "MISTRAL-7B", icon: "model", color: CYAN, size: 46, subsize: 36 }); hE.show(S.H + 0.1);
      const hI = M.box(H, { x: 60, y: 720, w: 470, h: 170, label: "INSTRUCT", sub: "TUNED", icon: "chat", color: GOOD, size: 44 }); hI.show(at("H", "Mistral-7B-Instruct") - 0.1);
      const hZ = M.box(H, { x: 550, y: 720, w: 470, h: 170, label: "ZEPHYR", sub: "TUNED", icon: "chat", color: GOOD, size: 44 }); hZ.show(at("H", "Zephyr") - 0.1);
