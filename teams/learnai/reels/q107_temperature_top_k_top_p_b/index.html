<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Temperature, top-k and top-p</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="127.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sG"></div><div class="beat" id="sH"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="127.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="127.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="127.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H"], tag: "AI ENGINEER INTERVIEW" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const NSx = "http://www.w3.org/2000/svg";
      const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NSx, tag); Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k])); if (parent) parent.appendChild(e); return e; };
      const svgLayer = (host) => { const s = svgEl("svg", { viewBox: "0 0 1080 1920" }, host); s.setAttribute("class", "ln"); return s; };
      const pol = (cx, cy, R, deg) => [cx + R * Math.sin(deg * Math.PI / 180), cy - R * Math.cos(deg * Math.PI / 180)];
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      // a value that changes on the spoken word: one element per state, swapped instantly (seek-safe)
      const states = (host, css, list) => list.map(([t, html], i) => { const d = el(host, css, html); tl.set(d, { opacity: 0 }, 0); tl.set(d, { opacity: 1 }, t);
        if (i < list.length - 1) tl.set(d, { opacity: 0 }, list[i + 1][0]); tl.fromTo(d, { y: 10 }, { y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, t); return d; });
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 56; const w = el(host, `left:0;top:${y}px;width:1080px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${o.pad || 30}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${o.size || 34}px ${COD};letter-spacing:.14em;color:${col};white-space:nowrap">${text}</div>`;
        return o.static ? w : show(w, t, { opacity: 0, y: -14 }); };
      const labelC = (host, text, y, t, o) => { o = o || {}; const w = el(host, `left:0;top:${y}px;width:1080px;text-align:center;font:${o.weight || 700} ${o.size || 36}px ${o.font || COD};letter-spacing:${o.ls || ".18em"};color:${o.col || MUTED};white-space:nowrap`, text); return show(w, t, { opacity: 0, y: 12 }); };

      // ============ shared pieces of q107 (question 105, version B) (numbers: toy_run.py, seeded, invented logits = EXAMPLE) ============
      const WORDS = ["ACHHA", "GARAM", "THANDA", "SUNDAR", "KHARAB", "AJEEB", "NEELA", "NAMKIN"];
      const P1 = [36.7, 24.6, 16.5, 11.1, 6.1, 3.0, 1.4, 0.6];      // temperature 1.0
      const P05 = [56.3, 25.3, 11.4, 5.1, 1.5, 0.4, 0.1, 0.0];      // temperature 0.5
      const P15 = [28.8, 22.1, 16.9, 13.0, 8.7, 5.4, 3.2, 1.9];     // temperature 1.5
      const K3 = [47.2, 31.6, 21.2];                                // top-k 3, renormalised
      const CUM = [36.7, 61.4, 77.9, 88.9, 95.0, 98.0, 99.4, 100.0];
      const pct = (v) => (v < 0.1 ? "<0.1%" : v < 10 ? v.toFixed(1) + "%" : Math.round(v) + "%");
      const sub = (host, text, x, y, w, t, col, size, align) => show(el(host, `left:${x}px;top:${y}px;width:${w}px;text-align:${align || "center"};font:800 ${size || 34}px ${COD};letter-spacing:.06em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: 12 });
      // eight horizontal bars, one per candidate word, with their chance; morph() reshapes some or all of them
      const barRows = (host, o) => {
        const cur = o.vals.slice();
        const rows = WORDS.map((w, i) => {
          const y = o.y0 + i * o.pitch, last = i === 7;
          const lab = el(host, `left:${o.lx}px;top:${y}px;width:${o.labW}px;height:${o.h}px;display:flex;align-items:center;font:800 ${o.lsize || 36}px ${LAT};letter-spacing:.04em;color:${last ? HOT : TEXT}`, w);
          const bar = el(host, `left:${o.x0}px;top:${y + 9}px;width:${cur[i] * o.scale}px;height:${o.h - 18}px;border-radius:14px;background:${last ? HOT : i === 0 ? ACC : CYAN}`);
          const val = el(host, `left:${o.x0}px;top:${y}px;height:${o.h}px;display:flex;align-items:center;font:700 ${o.vsize || 34}px ${COD};color:${TEXT};white-space:nowrap`, pct(cur[i]));
          gsap.set(val, { x: cur[i] * o.scale + 18 });
          tl.set([lab, bar, val], { opacity: 0 }, 0);
          tl.to([lab, bar, val], { opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, o.t0 + i * (o.each ?? 0.12));
          return { lab, bar, val, y };
        });
        const morph = (t, vals, dur, idx) => (idx || rows.map((_, i) => i)).forEach((i) => {
          const r = rows[i], from = cur[i], to = vals[i], p = { v: from };
          tl.fromTo(r.bar, { width: from * o.scale }, { width: to * o.scale, duration: dur, ease: "power3.inOut", immediateRender: false }, t);
          tl.fromTo(r.val, { x: from * o.scale + 18 }, { x: to * o.scale + 18, duration: dur, ease: "power3.inOut", immediateRender: false }, t);
          tl.fromTo(p, { v: from }, { v: to, duration: dur, ease: "power3.inOut", immediateRender: false, onUpdate: () => { r.val.textContent = pct(p.v); } }, t);
          cur[i] = to;
        });
        const fade = (t, idx, op) => idx.forEach((i) => tl.to([rows[i].lab, rows[i].bar, rows[i].val], { opacity: op, duration: 0.4, ease: "power2.out", immediateRender: false }, t));
        return { rows, morph, fade, y: (i) => rows[i].y };
      };
      const BAR = { lx: 60, labW: 220, x0: 290, pitch: 96, h: 78 };

      // ============ A: the chat that went wrong, the question, the answer first ============
      // diagram: A
      M.hook(["Bot ne bola:", "mausam bahut namkin"], { size: 100, top: 210 });
      pillC(A, "EXAMPLE CHAT", 495, 0.1, { size: 30, h: 50, col: MUTED });
      const ub = el(A, `left:290px;top:575px;width:690px;height:104px;border-radius:30px;background:${ca(CYAN, 0.16)};border:2px solid ${ca(CYAN, 0.6)};display:flex;align-items:center;padding:0 32px;font:600 38px ${LAT};color:${TEXT}`, "Aaj mausam kaisa hai?");
      show(ub, 0.1, { opacity: 0, y: 24 });
      const bb = el(A, `left:60px;top:715px;width:820px;height:128px;border-radius:30px;background:${ca(HOT, 0.10)};border:2.5px solid ${ca(HOT, 0.85)};display:flex;align-items:center;padding:0 32px;font:600 38px ${LAT};color:${TEXT}`, "Aaj mausam bahut namkin hai.");
      show(bb, 0.6, { opacity: 0, y: 24 });
      M.icon(A, "warn", 895, 735, 90, HOT).show(1.2);
      const kn = [[60, "TEMPERATURE", "bolt", CYAN, "temperature"], [390, "TOP-K", "numbers", ACC, "top-k"], [720, "TOP-P", "star", ACC, "top-p"]]
        .map(([x, lab, ic, col, w]) => { const b = M.box(A, { x, y: 930, w: 300, h: 240, label: lab, icon: ic, color: col, size: 32, isize: 80 }); b.show(at("A", w)); return b; });
      kn[1].glow(at("A", "options")); kn[2].glow(at("A", "options")); kn[0].glow(at("A", "options", 1));
      sub(A, "CUT THE LIST", 390, 1190, 630, at("A", "list"), ACC, 32);
      sub(A, "CHANGE CHANCES", 60, 1190, 300, at("A", "chance"), CYAN, 28);
      pillC(A, "3 STEPS", 1255, at("A", "3"), { size: 34, h: 56 });
      M.fit(A, { y: 460, h: 840 });

      // ============ B: the model gives every next word a chance; temperature changes chances, removes nothing ============
      // diagram: B
      pillC(B, "EXAMPLE DATA", 230, P("B", 0), { size: 32, h: 52, col: MUTED });
      const RB = barRows(B, { ...BAR, y0: 330, scale: 13, vals: P1, t0: at("B", "aaj"), each: 0.14 });
      tl.to(RB.rows[0].val, { color: ACC, duration: 0.3, immediateRender: false }, at("B", "achha"));
      tl.to(RB.rows[7].val, { color: HOT, duration: 0.3, immediateRender: false }, at("B", "namkin"));
      states(B, `left:60px;top:1130px;width:960px;text-align:center;font:800 56px ${COD};color:${ACC}`, [[at("B", "temperature"), "T = 1.0"], [at("B", "15"), "T = 1.5"]]);
      RB.morph(at("B", "15"), P15, 1.0);
      show(el(B, `left:600px;top:1006px;height:56px;padding:0 28px;border-radius:999px;border:2px solid ${HOT};background:${ca(HOT, 0.10)};display:flex;align-items:center;font:700 32px ${COD};letter-spacing:.1em;color:${HOT};white-space:nowrap`, "3X CHANCE"), at("B", "guna"), { opacity: 0, y: -14 });
      pillC(B, "ALL 8 STILL THERE", 1205, at("B", "koi"), { size: 32, h: 54, col: GOOD });
      M.fit(B, { y: 200, h: 1100 });

      // ============ C: step 1, top-k ============
      // diagram: C
      pillC(C, "STEP 1/3 · TOP-K", 230, P("C", 0), { size: 34, h: 56 });
      const RC = barRows(C, { ...BAR, y0: 330, scale: 13, vals: P1, t0: P("C", 0) + 0.3, each: 0.1 });
      const cutY = 330 + 3 * 96 - 9;
      show(el(C, `left:50px;top:${cutY}px;width:980px;height:0;border-top:5px dashed ${ACC}`), at("C", "3"), { opacity: 0, y: -10 });
      sub(C, "K = 3", 720, cutY - 58, 300, at("C", "3"), ACC, 40, "right");
      RC.fade(at("C", "rakha") + 0.2, [3, 4, 5, 6, 7], 0.2);
      RC.morph(at("C", "bache"), [...K3, 0, 0, 0, 0, 0], 0.9, [0, 1, 2]);
      M.icon(C, "cross", 470, RC.y(7) - 11, 100, HOT).show(at("C", "namkin"));
      sub(C, "CUT BY COUNT", 60, 1160, 960, at("C", "rakho"), ACC, 40);
      M.fit(C, { y: 200, h: 1100 });

      // ============ D: step 2, top-p ============
      // diagram: D
      pillC(D, "STEP 2/3 · TOP-P", 230, P("D", 0), { size: 34, h: 56 });
      const RD = barRows(D, { ...BAR, y0: 400, scale: 9, vals: P1, t0: P("D", 0) + 0.3, each: 0.1, vsize: 32 });
      const chips = CUM.slice(0, 5).map((c, i) => { const ch = el(D, `left:790px;top:${400 + i * 96 + 8}px;width:230px;height:62px;border-radius:31px;border:2.5px solid ${ca(MUTED, 0.7)};background:${ca(MUTED, 0.08)};display:flex;align-items:center;justify-content:center;font:700 36px ${COD};color:${TEXT}`, "= " + Math.round(c) + "%"); tl.set(ch, { opacity: 0 }, 0); return ch; });
      [60.9, 61.4, 61.9, at("D", "89"), at("D", "paanchvan")].forEach((t, i) => tl.fromTo(chips[i], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, t));
      pillC(D, "TARGET 90%", 305, at("D", "90"), { size: 32, h: 52, col: ACC });
      tl.to(chips[4], { borderColor: ca(ACC, 1), backgroundColor: ca(ACC, 0.2), color: ACC, duration: 0.3, immediateRender: false }, at("D", "paanchvan") + 0.2);
      const cutDY = 400 + 5 * 96 - 9;
      show(el(D, `left:50px;top:${cutDY}px;width:980px;height:0;border-top:5px dashed ${ACC}`), at("D", "paanchvan") + 0.3, { opacity: 0, y: -10 });
      RD.fade(at("D", "paanchvan") + 0.4, [5, 6, 7], 0.2);
      gone(pillC(D, "SURE: FEW WORDS", 1190, at("D", "bharosa"), { size: 32, h: 54, col: GOOD }), at("D", "uljha") - 0.45);
      pillC(D, "UNSURE: MORE WORDS", 1190, at("D", "uljha"), { size: 32, h: 54, col: HOT });
      M.fit(D, { y: 200, h: 1100 });

      // ============ E: step 3, temperature ============
      // diagram: E
      pillC(E, "STEP 3/3 · TEMPERATURE", 230, P("E", 0), { size: 34, h: 56 });
      const RE = barRows(E, { ...BAR, y0: 330, scale: 9, vals: P1, t0: at("E", "Temperature"), each: 0.1 });
      states(E, `left:60px;top:1125px;width:960px;text-align:center;font:800 56px ${COD};color:${ACC}`, [[at("E", "Temperature"), "T = 1.0"], [at("E", "05"), "T = 0.5"], [at("E", "15"), "T = 1.5"]]);
      RE.morph(at("E", "05"), P05, 1.1);
      RE.morph(at("E", "15"), P15, 1.1);
      const trk = el(E, `left:200px;top:1233px;width:680px;height:8px;border-radius:4px;background:${ca(MUTED, 0.5)}`); show(trk, at("E", "Temperature") + 0.3, { opacity: 0, y: 8 });
      [["0.5", 200], ["1.0", 540], ["1.5", 880]].forEach(([t, x]) => show(el(E, `left:${x - 60}px;top:1256px;width:120px;text-align:center;font:700 34px ${COD};color:${MUTED}`, t), at("E", "Temperature") + 0.3, { opacity: 0, y: 8 }));
      const knob = el(E, `left:0;top:1215px;width:44px;height:44px;border-radius:50%;background:${ACC}`); gsap.set(knob, { x: 540 - 22 });
      tl.set(knob, { opacity: 0 }, 0); tl.to(knob, { opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, at("E", "Temperature") + 0.3);
      tl.fromTo(knob, { x: 540 - 22 }, { x: 200 - 22, duration: 1.0, ease: "power3.inOut", immediateRender: false }, at("E", "05"));
      tl.fromTo(knob, { x: 200 - 22 }, { x: 880 - 22, duration: 1.2, ease: "power3.inOut", immediateRender: false }, at("E", "15"));
      M.fit(E, { y: 200, h: 1100 });

      // ============ F: all three together change each other ============
      // diagram: F
      const colsPanel = (host, o) => {
        const w = 84, gap = 28, x0 = 106;
        const cols = o.vals.map((v, i) => {
          const h = v * o.scale;
          const c = el(host, `left:${x0 + i * (w + gap)}px;top:${o.base - h}px;width:${w}px;height:${h}px;border-radius:12px 12px 4px 4px;background:${ca(CYAN, 0.55)}`);
          const r = el(host, `left:${x0 + i * (w + gap) - 14}px;top:${o.base + 8}px;width:${w + 28}px;text-align:center;font:700 36px ${COD};color:${MUTED}`, String(i + 1));
          tl.set([c, r], { opacity: 0 }, 0);
          tl.to([c, r], { opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, o.t0 + i * 0.08);
          return c;
        });
        return { cols, keep: (t, n) => { tl.to(cols.slice(0, n), { backgroundColor: ca(ACC, 1), duration: 0.4, immediateRender: false }, t); tl.to(cols.slice(n), { opacity: 0.35, duration: 0.4, immediateRender: false }, t); } };
      };
      pillC(F, "T = 1.0 · TOP-P 0.9", 270, at("F", "Top-p"), { size: 32, h: 52 });
      const F1 = colsPanel(F, { base: 660, vals: P1, scale: 8, t0: at("F", "Top-p") + 0.2 });
      F1.keep(at("F", "5"), 5);
      sub(F, "5 WORDS", 700, 340, 320, at("F", "5"), ACC, 40, "right");
      pillC(F, "T = 1.5 · TOP-P 0.9", 760, at("F", "temperature"), { size: 32, h: 52 });
      const F2 = colsPanel(F, { base: 1120, vals: P15, scale: 8, t0: at("F", "temperature") + 0.2 });
      F2.keep(at("F", "6"), 6);
      sub(F, "6 WORDS", 700, 850, 320, at("F", "6"), ACC, 40, "right");
      pillC(F, "FLATTER: MORE WORDS", 1215, at("F", "chance"), { size: 32, h: 54, col: ACC });
      M.fit(F, { y: 200, h: 1100 });

      // ============ G: say it in the interview ============
      // diagram: G
      const gB = [[260, "TOP-K", "CUTS BY COUNT", CYAN, "numbers", at("G", "top-k")], [505, "TOP-P", "CUTS BY CHANCE", CYAN, "star", at("G", "top-p")], [750, "TEMPERATURE", "CHANGES CHANCE", ACC, "bolt", at("G", "Temperature")]]
        .map(([y, lab, sb, col, ic, t]) => { const b = M.box(G, { x: 100, y, w: 880, h: 215, label: lab, sub: sb, icon: ic, color: col, size: 52, subsize: 34, isize: 70 }); b.show(t); return b; });
      gB.forEach((b) => b.glow(at("G", "badalte")));
      pillC(G, "THEY INTERACT", 1010, at("G", "teenon"), { size: 38, h: 62, col: ACC });
      M.fit(G, { y: 200, h: 1100 });

      // ============ H: check yourself, comment, follow ============
      // diagram: H
      pillC(H, "CHECK YOURSELF", 240, at("H", "batao") - 0.1, { size: 34, h: 56 });
      const hl1 = el(H, `left:60px;top:380px;width:240px;height:70px;display:flex;align-items:center;font:800 40px ${LAT};color:${HOT}`, "NAMKIN"); show(hl1, at("H", "temperature"), { opacity: 0, y: 14 });
      const hl2 = el(H, `left:60px;top:470px;width:240px;height:70px;display:flex;align-items:center;font:700 34px ${COD};color:${MUTED}`, "T = 1.0"); show(hl2, at("H", "temperature") + 0.2, { opacity: 0, y: 14 });
      const hb1 = el(H, `left:300px;top:480px;width:36px;height:50px;border-radius:12px;background:${HOT}`); show(hb1, at("H", "temperature") + 0.3, { opacity: 0, y: 14 });
