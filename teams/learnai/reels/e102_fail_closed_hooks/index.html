<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Safety check crash hua, phir bhi AI ka kaam ho gaya</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="39.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="39.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="39.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D"], tag: "WHAT'S NEW IN AI" });   // order = scene ids from spec.json
      Viz.install(M);   // diagram templates and building blocks: see the header of kit/viz.js (a shortcut, not a menu: custom SVG/GSAP is welcome)
      const { tl, S, P, Ed, W } = M;
      // ===== build beats + timeline here (API lists: top of kit/motion.js and kit/viz.js). M.hook([...]) first, then one picture per beat as planned in visual_plan.md. =====


      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD");
      const { ACC, CYAN, HOT, GOOD } = M;
      // A: hook. agent -> guard (crashed) -> action still goes through
      M.hook(["Guard crash,", "agent ne kaam kiya"], { size: 90, top: 250 });
      M.box(A, { x: 110, y: 470, w: 860, h: 260, label: "AGENT", icon: "robot", color: CYAN, size: 54 }).show(0.05);
      M.arrow(A, { from: [540, 740], to: [540, 810], color: CYAN, w: 12 }).show(0.05, 0.3);
      M.box(A, { x: 110, y: 820, w: 860, h: 260, label: "GUARD", icon: "shield", color: HOT, size: 54 }).show(0.05);
      M.icon(A, "cross", 800, 830, 160, HOT).show(0.05);
      M.arrow(A, { from: [540, 1090], to: [540, 1160], color: HOT, w: 12 }).show(M.W("A", "kaam"), 0.3);
      M.box(A, { x: 110, y: 1170, w: 860, h: 260, label: "ACTION DONE", icon: "bolt", color: HOT, size: 54 }).show(0.6);
      M.fit(A, { y: 460, h: 980 });
      // B: what a hook is, fail-open
      M.box(B, { x: 110, y: 300, w: 860, h: 240, label: "AGENT", icon: "robot", color: CYAN, size: 54 }).show(0.05);
      M.arrow(B, { from: [540, 550], to: [540, 650], color: CYAN, w: 12 }).show(M.W("B", "hook"), 0.3);
      M.box(B, { x: 110, y: 660, w: 600, h: 300, label: "HOOK = CHECK", icon: "gear", color: ACC, size: 54 }).show(M.W("B", "hook"));
      M.icon(B, "clock", 770, 680, 200, HOT).show(M.W("B", "time"));
      M.pill(B, "TIMEOUT", M.W("B", "out"), { x: 730, y: 900, size: 44 });
      M.arrow(B, { from: [540, 970], to: [540, 1090], color: HOT, w: 12, dash: true }).show(M.W("B", "nikal"), 0.3);
      M.box(B, { x: 110, y: 1100, w: 860, h: 240, label: "ACTION", icon: "bolt", color: HOT, size: 54 }).show(M.W("B", "action", 2));
      M.pill(B, "FAIL-OPEN", M.W("B", "fail-open"), { x: 300, y: 1390, size: 64 });
      M.fit(B, { y: 300, h: 1100 });
      // C: onFailure block, three cases, fail-closed
      M.pill(C, "onFailure: block", 0.05, { x: 260, y: 230, size: 52 });
      M.box(C, { x: 140, y: 440, w: 800, h: 190, label: "NO START", icon: "cross", color: HOT }).show(0.2);
      M.box(C, { x: 140, y: 670, w: 800, h: 190, label: "TIMEOUT", icon: "clock", color: HOT }).show(0.4);
      M.box(C, { x: 140, y: 900, w: 800, h: 190, label: "BAD EXIT", icon: "warn", color: HOT }).show(0.6);
      [440, 670, 900].forEach((y, i) => M.icon(C, "lock", 820, y + 55, 80, GOOD).show(M.W("C", ["pahla", "doosra", "teesra"][i]) + 0.3));
      M.box(C, { x: 240, y: 1140, w: 600, h: 190, label: "FAIL-CLOSED", icon: "lock", color: GOOD }).show(M.W("C", "fail-closed"));
      M.fit(C, { y: 200, h: 1150 });
      // D: rule + UPI example + comment / follow
      M.box(D, { x: 110, y: 230, w: 860, h: 230, label: "DEFAULT: STOP", icon: "lock", color: GOOD, size: 54 }).show(0.05);
      M.pill(D, "EXAMPLE", 0.5, { x: 410, y: 520, size: 40 });
      M.box(D, { x: 110, y: 620, w: 370, h: 280, label: "PAYMENT", icon: "coin", color: CYAN, size: 44 }).show(0.5);
      M.arrow(D, { from: [485, 760], to: [595, 760], color: CYAN, w: 8 }).show(M.W("D", "fraud"), 0.3);
      M.box(D, { x: 600, y: 620, w: 370, h: 280, label: "FRAUD CHECK", icon: "shield", color: ACC, size: 40 }).show(M.W("D", "fraud"));
      M.icon(D, "cross", 860, 590, 100, HOT).show(M.W("D", "down"));
      M.pill(D, "PAY?", M.W("D", "payment"), { x: 220, y: 960, size: 72 });
      M.pill(D, "WAIT?", M.W("D", "ruke"), { x: 580, y: 960, size: 72 });
      M.box(D, { x: 110, y: 1090, w: 860, h: 180, label: "COMMENT: PAY / WAIT", icon: "chat", color: CYAN, size: 48 }).show(M.W("D", "Comment"));
      M.pill(D, "+ FOLLOW  @ig.learnai", M.W("D", "follow"), { x: 110, y: 1310, size: 52 });
      M.fit(D, { y: 200, h: 1200 });
      M.wipe(M.S.B); M.wipe(M.S.C); M.wipe(M.S.D);
      M.finish({ kw: { crash: "hot", "fail-open": "hot", "fail-closed": "good", rukta: "good", block: "gold", timeout: "hot", fraud: "cyan", rukna: "good" } });
      window.__timelines["main"] = tl;   // register (must stay literal for the linter)
    </script>
  </body>
</html>
