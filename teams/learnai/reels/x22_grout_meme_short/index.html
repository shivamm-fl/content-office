  </head>

        <div class="win" id="con" style="top:420px; height:640px;">

    <script>
      const tl = gsap.timeline({ paused: true });
      const T = "why this test is failing?";
      const typed = document.getElementById("typed");
      T.split("").forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch; s.style.display = "none"; typed.appendChild(s); });
      [...typed.children].forEach((s, i) => tl.set(s, { display: "inline" }, 0.75 + i * 0.048));
      tl.fromTo("#con", { scale: 1.03 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#f1", { scale: 1 }, { scale: 1.08, transformOrigin: "0% 50%", duration: 0.14, yoyo: true, repeat: 1 }, 0.12);
      tl.to("#caret", { opacity: 0, duration: 0.01, repeat: 9, yoyo: true, repeatDelay: 0.25 }, 0);
      tl.to("#prompt", { borderColor: "#F2B544", duration: 0.2 }, 0.7);
      tl.fromTo("#think", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.7)" }, 2.15);
      ["#d1", "#d2", "#d3"].forEach((el, i) => tl.fromTo(el, { opacity: 0.15 }, { opacity: 1, duration: 0.15, repeat: 1, yoyo: true }, 2.3 + i * 0.15));
      tl.set("#sA", { opacity: 0 }, 3.0);
      tl.set("#sB", { opacity: 1 }, 3.0);
      tl.fromTo("#cchip", { scale: 1.25 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 3.0);
      tl.to({}, { duration: 0.01 }, 8.22);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
