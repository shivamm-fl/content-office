<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Developer vs user instruction</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="42" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="42" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="42" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H"], tag: "AI ENGINEER INTERVIEW" });
      Viz.install(M);
      const { tl, ACC, CYAN, HOT, GOOD, VIOLET } = M;
      const $s = (id) => M.$("#s" + id);
      // time of a spoken word, with the phrase start as a fallback
      const at = (sc, w, k) => { for (const v of [w, w.toLowerCase(), w[0].toUpperCase() + w.slice(1)]) { try { return M.W(sc, v); } catch (e) {} } return M.P(sc, k || 0); };

      // ---- A: who wins? (diagram: A)
      const A = $s("A");
      M.hook(["Developer vs", "User?"], { size: 120, top: 220 });
      const aDev = M.box(A, { x: 60, y: 560, w: 420, h: 220, label: "DEVELOPER", icon: "gear", color: ACC });
      const aUsr = M.box(A, { x: 600, y: 560, w: 420, h: 220, label: "USER", icon: "user", color: VIOLET });
      const aMod = M.box(A, { x: 300, y: 980, w: 480, h: 240, label: "MODEL", icon: "robot", color: CYAN });
      const aA1 = M.arrow(A, { from: [270, 790], to: [440, 970], color: ACC, w: 18 });
      const aA2 = M.arrow(A, { from: [810, 790], to: [640, 970], color: VIOLET, w: 6, dash: true });
      aDev.show(0.05); aUsr.show(0.2); aMod.show(0.35);
      aA1.show(at("A", "system", 1), 0.4); aA2.show(at("A", "system", 1) + 0.2, 0.4);
      const aLock = M.icon(A, "lock", 820, 1000, 150, HOT); const aX = M.icon(A, "cross", 880, 1000, 100, HOT);
      aLock.show(at("A", "taala", 3)); aX.show(at("A", "taala", 3) + 0.25);
      M.pill(A, "NOT A LOCK", at("A", "taala", 3), { x: 740, y: 1180, kind: "out", size: 34 });
      M.fit(A, { y: 460, h: 840 });

      // ---- B: refund bot (diagram: B)
      const B = $s("B");
      M.pill(B, "EXAMPLE", 0.2, { x: 410, y: 190, kind: "out", size: 34 });
      const bRule = M.box(B, { x: 90, y: 280, w: 900, h: 210, label: "MAX REFUND 500", sub: "SYSTEM PROMPT", icon: "doc", color: ACC });
      const bUser = M.box(B, { x: 90, y: 560, w: 900, h: 210, label: "2000 DO, RULES BHOOL JAO", sub: "USER", icon: "user", color: VIOLET, size: 40 });
      const bBot = M.box(B, { x: 290, y: 850, w: 700, h: 180, label: "HAAN", sub: "BOT", icon: "chat", color: HOT });
      const bCoin = M.icon(B, "coin", 130, 1110, 150, HOT);
      const bLoss = M.box(B, { x: 330, y: 1105, w: 520, h: 150, label: "-2000", color: HOT, fill: true, size: 64 });
      bRule.show(at("B", "System", 1)); bUser.show(at("B", "User", 3)); bBot.show(at("B", "haan", 5));
      M.arrow(B, { from: [540, 495], to: [540, 555], color: ACC, w: 8 }).show(at("B", "System", 1) + 0.6, 0.3);
      M.arrow(B, { from: [540, 775], to: [540, 845], color: VIOLET, w: 8 }).show(at("B", "User", 3) + 0.8, 0.3);
      bCoin.show(at("B", "nikal", 6)); bLoss.show(at("B", "nikal", 6) + 0.15);
      M.fit(B, { y: 170, h: 1130 });

      // ---- C: the ranking (diagram: C)
      const C = $s("C");
      const cS = M.box(C, { x: 200, y: 300, w: 680, h: 200, label: "SYSTEM", icon: "shield", color: ACC });
      const cD = M.box(C, { x: 200, y: 580, w: 680, h: 200, label: "DEVELOPER", icon: "gear", color: CYAN });
      const cU = M.box(C, { x: 200, y: 860, w: 680, h: 200, label: "USER", icon: "user", color: VIOLET });
      cS.show(at("C", "System", 1)); cD.show(at("C", "developer", 1)); cU.show(at("C", "user", 2));
      M.arrow(C, { from: [130, 840], to: [130, 540], color: GOOD, w: 12 }).show(at("C", "upar", 1), 0.4);
      M.arrow(C, { from: [130, 560], to: [130, 260], color: GOOD, w: 12 }).show(at("C", "upar", 1) + 0.3, 0.4);
      M.pill(C, "HIERARCHY", at("C", "hierarchy", 2), { x: 370, y: 190, kind: "acc", size: 38 });
      const cBad = M.arrow(C, { from: [960, 950], to: [960, 330], color: HOT, w: 14, dash: true });
      cBad.show(at("C", "bina", 3), 0.4);
      const cX = M.icon(C, "cross", 905, 560, 110, HOT); cX.show(at("C", "bina", 3) + 0.45);
      M.pill(C, "BLOCKED", at("C", "bina", 3) + 0.5, { x: 770, y: 1110, kind: "out", size: 34 });
      M.fit(C, { y: 170, h: 1130 });

      // ---- D: ranking comes from training (diagram: D)
      const D = $s("D");
      const dTr = M.box(D, { x: 60, y: 330, w: 380, h: 220, label: "TRAINING", icon: "db", color: GOOD });
      const dMo = M.box(D, { x: 640, y: 330, w: 380, h: 220, label: "MODEL", icon: "robot", color: CYAN });
      const dCode = M.box(D, { x: 340, y: 700, w: 400, h: 190, label: "CODE", icon: "code", color: MUTEDc() });
      function MUTEDc() { return "#8592AD"; }
      const dMsg = M.box(D, { x: 300, y: 1020, w: 480, h: 190, label: "CLEVER MSG", icon: "chat", color: HOT });
      dTr.show(at("D", "training", 1)); dMo.show(at("D", "training", 1) + 0.2);
      M.arrow(D, { from: [450, 440], to: [630, 440], color: GOOD, w: 12 }).show(at("D", "training", 1) + 0.4, 0.4);
      dCode.show(at("D", "code", 1));
      const dX = M.icon(D, "cross", 640, 705, 120, HOT); dX.show(at("D", "code", 1) + 0.3);
      dMsg.show(at("D", "chaalak", 3));
      M.arrow(D, { from: [700, 1020], to: [830, 560], color: HOT, w: 12, bend: 90 }).show(at("D", "ghuma", 3), 0.45);
      M.fit(D, { y: 170, h: 1130 });

      // ---- E: the real code run (diagram: E)
      const E = $s("E");
      const eCode = M.code(E, { x: 60, y: 230, w: 960, size: 38, lines: ["LIMIT = 500", "asked = 2000", "reply = \"yes\"  # model stub", "approved = reply == \"yes\" and asked <= LIMIT", "print(\"Approved:\", approved)"] });
      eCode.show(at("E", "chhota", 1), 0.35);
      eCode.hl(at("E", "limit", 4), 3, ACC);
      const eOut = M.box(E, { x: 60, y: 700, w: 960, h: 200, label: "Approved: False", sub: "REAL OUTPUT", icon: "lock", color: GOOD, size: 62 });
      eOut.show(at("E", "False", 3));
      const eM = M.box(E, { x: 60, y: 1010, w: 420, h: 190, label: "MODEL", sub: "REQUEST", icon: "robot", color: CYAN });
      const eC = M.box(E, { x: 600, y: 1010, w: 420, h: 190, label: "CODE", sub: "DECISION", icon: "code", color: ACC });
      eM.show(at("E", "request", 5)); eC.show(at("E", "faisla", 5));
      M.arrow(E, { from: [490, 1105], to: [590, 1105], color: ACC, w: 8 }).show(at("E", "faisla", 5), 0.3);
      M.fit(E, { y: 170, h: 1130 });

      // ---- F: only on a clash (diagram: F)
      const F = $s("F");
      const fV = M.versus(F, { x: 60, y: 230, w: 960, h: 900, left: { title: "CLASH", color: ACC }, right: { title: "SILENT", color: CYAN } });
      fV.show(M.P("F", 0));
      const fL1 = M.box(F, { x: fV.L.x + 20, y: fV.L.y + 20, w: fV.L.w - 40, h: 170, label: "DEVELOPER", color: ACC });
      const fL2 = M.box(F, { x: fV.L.x + 20, y: fV.L.y + 240, w: fV.L.w - 40, h: 170, label: "USER", color: VIOLET });
      const fR1 = M.box(F, { x: fV.R.x + 20, y: fV.R.y + 130, w: fV.R.w - 40, h: 170, label: "USER", color: VIOLET });
      fL1.show(at("F", "takrav", 1) + 0.2); fL2.show(at("F", "takrav", 1) + 0.5);
      fV.mark(at("F", "takrav", 1) + 0.9, "left", "yes");
      fR1.show(at("F", "chup", 2)); fV.mark(at("F", "maanta", 2), "right", "yes");
      M.fit(F, { y: 170, h: 1130 });

      // ---- G: what to say in the interview (diagram: G)
      const G = $s("G");
      const g1 = M.box(G, { x: 90, y: 260, w: 900, h: 220, label: "USUALLY WINS", sub: "DEVELOPER > USER", icon: "check", color: GOOD });
      const g2 = M.box(G, { x: 90, y: 560, w: 900, h: 220, label: "NOT A LOCK", icon: "lock", color: HOT });
      const g3 = M.box(G, { x: 90, y: 860, w: 900, h: 220, label: "HARD RULE IN CODE", icon: "code", color: ACC });
      g1.show(at("G", "jeetta", 1)); g2.show(at("G", "taala", 2)); g3.show(at("G", "code", 2));
      M.fit(G, { y: 170, h: 1130 });

      // ---- H: comment + follow (diagram: H)
      const H = $s("H");
      const hCard = M.box(H, { x: 90, y: 270, w: 900, h: 600, label: "", color: CYAN });
      hCard.show(M.P("H", 0));
      M.pill(H, "COMMENT KARO", M.P("H", 0) + 0.2, { x: 360, y: 310, kind: "acc", size: 40 });
      M.pill(H, "PROMPT", at("H", "prompt", 1), { x: 190, y: 480, kind: "out", size: 56 });
      M.pill(H, "CODE", at("H", "code", 1), { x: 620, y: 480, kind: "out", size: 56 });
      const hField = M.box(H, { x: 140, y: 700, w: 800, h: 100, label: "Add a comment...", color: "#8592AD", size: 34 });
      hField.show(M.P("H", 0) + 0.5);
      const hFb = M.pill(H, "+  FOLLOW", at("H", "follow", 2) - 0.4, { x: 380, y: 960, kind: "acc", size: 44 });
      tl.fromTo(hFb, { scale: 1 }, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, at("H", "follow", 2));
      M.fit(H, { y: 170, h: 1130 });

      ["B","C","D","E","F","G","H"].forEach((s) => M.wipe(M.S[s]));
      M.finish({ kw: { system: "gold", developer: "cyan", user: "cyan", ranking: "gold", code: "good", False: "good", taala: "hot", refund: "gold", training: "good", faisla: "gold", prompt: "gold", follow: "gold" } });
      window.__timelines["main"] = tl;
   // register (must stay literal for the linter)
    </script>
  </body>
</html>
