      const tobj = { v: 0 }; tl.to(tobj, { v: 20, duration: 2.5, ease: "none", onUpdate: () => { tnum.textContent = fmt(tobj.v) + " s"; }, immediateRender: false }, 0.1);
      const abar = el(A, `left:60px;top:1060px;width:960px;height:120px;border-radius:16px;border:3px solid ${ca(MUTED, 0.8)};background:${ca(MUTED, 0.25)};display:flex;align-items:center;justify-content:center;font:800 80px ${COD};color:${TEXT}`, "?");
      show(abar, at("A", "time"), { opacity: 0, y: 18 });

      M.fit(A, { y: 460, h: 840 });

      tag(B, "TRACE", 0, 300, 1080, at("B", "trace"), CYAN, 112);

      const bone = el(B, `left:60px;top:470px;width:960px;height:130px;border-radius:16px;border:3px solid ${ca(MUTED, 0.8)};background:${ca(MUTED, 0.25)}`); show(bone, P("B", 0) + 0.2, { opacity: 0 });
      let sx = 60; const bsegs = SEG.map(([d, n], i) => { const w = d / 20 * 960; const e = el(B, `left:${sx}px;top:470px;width:${Math.max(8, w - 4)}px;height:130px;border-radius:12px;border:3px solid ${i >= 3 && i < 5 ? HOT : CYAN};background:${ca(i >= 3 && i < 5 ? HOT : CYAN, 0.8)}`); sx += w; tl.set(e, { opacity: 0 }, 0); return e; });
      bsegs.forEach((e, i) => tl.to(e, { opacity: 1, duration: 0.3, immediateRender: false }, at("B", "har") + i * 0.1));
      tl.to(bone, { opacity: 0, duration: 0.3, immediateRender: false }, at("B", "har") + 0.7);
      paint(bsegs[1], ACC, at("B", "sabse"), 0.9); tl.to(bsegs[1], { backgroundColor: ca(ACC, 0.9), duration: 0.3, immediateRender: false }, at("B", "sabse"));

      pillC(B, "FIX FIRST", 700, at("B", "pehle"), { size: 44, h: 70 });
      [["1", "SPAN"], ["2", "TRACE ID"], ["3", "SORT"]].forEach(([n, l], i) => { const c = glass(B, 140, 840 + i * 150, 800, 124, i === 0 ? CYAN : i === 1 ? VIOLET : ACC); show(c, at("B", "teen") + i * 0.35, { opacity: 0, y: 20 });
        el(c, `left:30px;top:0;height:124px;display:flex;align-items:center;font:800 70px ${COD};color:${ACC}`, n); el(c, `left:130px;top:0;height:124px;display:flex;align-items:center;font:800 58px ${COD};color:${TEXT};letter-spacing:.06em`, l); });
      M.fit(B, { y: 200, h: 1110 });

      // ============ C: the app + the total ============

      const cq = tag(C, "LLM SLOW?", 0, 1190, 1080, at("C", "LLM", 2), HOT, 64); gone(cq, at("C", "LLM", 3) - 0.1);
      [1, 3].forEach((i) => 0); colorBar(cw[2], CYAN, at("C", "LLM", 3)); colorBar(cw[4], CYAN, at("C", "LLM", 3) + 0.15);
      const s1 = glass(C, 60, 1150, 460, 150, CYAN), s2 = glass(C, 560, 1150, 460, 150, ACC);
      show(s1, at("C", "72")); show(s2, at("C", "128"));
      el(s1, `left:0;top:8px;width:460px;text-align:center;font:800 70px ${COD};color:${CYAN}`, "7.2 s"); el(s1, `left:0;top:92px;width:460px;text-align:center;font:700 38px ${COD};color:${TEXT}`, "LLM · 36 %");
      el(s2, `left:0;top:8px;width:460px;text-align:center;font:800 70px ${COD};color:${ACC}`, "12.8 s"); el(s2, `left:0;top:92px;width:460px;text-align:center;font:700 38px ${COD};color:${TEXT}`, "EVERYTHING ELSE");
      [0, 1, 3].forEach((i) => paint(cw[i].trk, ACC, at("C", "128"), 0.12));

      // ============ E: trace id ============

      const ER = DR.map((r) => Object.assign({}, r));
      const ew = wf(E, { x0: XS, labW: LW, sc: 28, y0: 330, pitch: 98, rowH: 82, rows: ER, ls: 36, ds: 34, minIn: 120 });
      ew.forEach((w, i) => { rowIn(w, P("E", 0) + i * 0.05); barIn(w, P("E", 0) + 0.1 + i * 0.07); durIn(w, P("E", 0) + 0.5 + i * 0.05); });

      ew.forEach((w, i) => { const c = el(E, `left:890px;top:${w.y}px;width:130px;height:82px;border-radius:41px;border:2.5px solid ${VIOLET};background:${ca(VIOLET, 0.15)};display:flex;align-items:center;justify-content:center;font:800 38px ${COD};color:${VIOLET}`, "a91f"); show(c, at("E", "spans", 0) + i * 0.1, { opacity: 0, x: 20 }, 0.3); });

        segs.forEach((d, i) => { const w = d * 28; const s = el(E, `left:${x}px;top:${y}px;width:${w - 4}px;height:64px;border-radius:10px;border:2px solid ${ca(MUTED, 0.9)};background:${ca(MUTED, 0.3)}`); x += w; show(s, at("E", "hazaron") + k * 0.2 + i * 0.04, { opacity: 0 }, 0.3); }); });
