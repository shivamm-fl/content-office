<!doctype html>

  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="174" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sG"></div><div class="beat" id="sH"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="174" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="174" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="174" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H"], tag: "150 DAYS OF AI · DAY 1" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const NSx = "http://www.w3.org/2000/svg";
      const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NSx, tag); Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k])); if (parent) parent.appendChild(e); return e; };
      const svgLayer = (host) => { const s = svgEl("svg", { viewBox: "0 0 1080 1920" }, host); s.setAttribute("class", "ln"); return s; };
      const pol = (cx, cy, R, deg) => [cx + R * Math.sin(deg * Math.PI / 180), cy - R * Math.cos(deg * Math.PI / 180)];
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      // a value that changes on the spoken word: one element per state, swapped instantly (seek-safe)
      const states = (host, css, list) => list.map(([t, html], i) => { const d = el(host, css, html); tl.set(d, { opacity: 0 }, 0); tl.set(d, { opacity: 1 }, t);
        if (i < list.length - 1) tl.set(d, { opacity: 0 }, list[i + 1][0]); tl.fromTo(d, { y: 10 }, { y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, t); return d; });
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 56; const w = el(host, `left:0;top:${y}px;width:1080px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${o.pad || 30}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${o.size || 34}px ${COD};letter-spacing:.14em;color:${col};white-space:nowrap">${text}</div>`;
        return o.static ? w : show(w, t, { opacity: 0, y: -14 }); };
      const labelC = (host, text, y, t, o) => { o = o || {}; const w = el(host, `left:0;top:${y}px;width:1080px;text-align:center;font:${o.weight || 700} ${o.size || 36}px ${o.font || COD};letter-spacing:${o.ls || ".18em"};color:${o.col || MUTED};white-space:nowrap`, text); return show(w, t, { opacity: 0, y: 12 }); };
      const stepper = (host, n, word, t) => { const w = el(host, "left:0;top:240px;width:1080px;height:64px;display:flex;justify-content:center");
        w.innerHTML = `<div style="display:flex;align-items:center;gap:22px;height:64px;padding:0 32px;border-radius:32px;border:2px solid ${ACC};background:${ca(ACC, 0.10)}"><span style="font:800 36px ${COD};color:${ACC};letter-spacing:.06em">STEP ${n}/3</span><span style="width:2px;height:30px;background:${ca(ACC, 0.5)}"></span><span style="font:800 36px ${LAT};color:${TEXT};letter-spacing:.1em">${word}</span><span style="display:flex;gap:8px;margin-left:6px">${[1, 2, 3].map((i) => `<i style="display:block;width:26px;height:8px;border-radius:4px;background:${i <= n ? ACC : ca(MUTED, 0.4)}"></i>`).join("")}</span></div>`;
        return show(w, t, { opacity: 0, y: -16 }); };

      // dial: the weight w. Angle from the top, clockwise: w / 4 * 120 degrees, clamped to the end stops (+-120).
      const ang = (w) => Math.max(-120, Math.min(120, w / 4 * 120));
      const dial = (host, cx, cy, r, o) => { o = o || {};
        const wrap = el(host, `left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px`);
        const sv = svgEl("svg", { viewBox: `0 0 ${2 * r} ${2 * r}`, width: 2 * r, height: 2 * r }, wrap); sv.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
        svgEl("circle", { cx: r, cy: r, r: r - 2, fill: PANEL, stroke: "rgba(150,175,215,.34)", "stroke-width": Math.max(2, r * 0.03) }, sv);
        const Rt = r * 0.80, p0 = pol(r, r, Rt, -120), p1 = pol(r, r, Rt, 120);
        svgEl("path", { d: `M${p0[0]} ${p0[1]} A${Rt} ${Rt} 0 1 1 ${p1[0]} ${p1[1]}`, fill: "none", stroke: "rgba(150,175,215,.24)", "stroke-width": r * 0.1, "stroke-linecap": "round" }, sv);
        if (!o.mini) for (let a = -120; a <= 120; a += 30) { const i = pol(r, r, r * (a === 0 ? 0.88 : 0.91), a), j = pol(r, r, r * 0.96, a);
          svgEl("line", { x1: i[0], y1: i[1], x2: j[0], y2: j[1], stroke: a === 0 ? "rgba(232,237,246,.75)" : "rgba(150,175,215,.55)", "stroke-width": r * 0.025, "stroke-linecap": "round" }, sv); }
        const nl = r * 0.74, nw = Math.max(4, r * 0.075);
        const needle = el(wrap, `left:${r - nw / 2}px;top:${r - nl}px;width:${nw}px;height:${nl}px;border-radius:${nw / 2}px;background:${ACC}`);
        el(wrap, `left:${r - r * 0.12}px;top:${r - r * 0.12}px;width:${r * 0.24}px;height:${r * 0.24}px;border-radius:50%;background:${ACC};border:${Math.max(2, r * 0.035)}px solid ${PANEL}`);
        if (o.letter) el(wrap, `left:0;top:${r * 1.28}px;width:${2 * r}px;text-align:center;font:800 ${r * 0.34}px ${COD};color:${ACC};line-height:1`, "w");
        gsap.set(needle, { transformOrigin: "50% 100%", rotation: o.a0 || 0 });
        const api = { wrap, needle, r, cx, cy,
          aim: (t, a0, a1, dur, ease) => tl.fromTo(needle, { rotation: a0 }, { rotation: a1, duration: dur, ease: ease || "power3.inOut", immediateRender: false }, t),
          show: (t) => show(wrap, t, { opacity: 0, scale: 0.92 }),
          ring: (t) => { const rg = el(wrap, `left:-9px;top:-9px;width:${2 * r + 18}px;height:${2 * r + 18}px;border-radius:50%;border:5px solid ${ACC}`); tl.set(rg, { opacity: 0 }, 0); tl.to(rg, { opacity: 1, duration: 0.3, immediateRender: false }, t); return rg; },
          target: (t, a, label) => { const i = pol(r, r, r * 0.62, a), j = pol(r, r, r * 0.99, a), q = pol(r, r, r * 1.2, a);
            const g = svgEl("svg", { viewBox: `0 0 ${2 * r} ${2 * r}`, width: 2 * r, height: 2 * r }, wrap); g.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
            svgEl("line", { x1: i[0], y1: i[1], x2: j[0], y2: j[1], stroke: ACC, "stroke-width": r * 0.05, "stroke-linecap": "round" }, g);
            const lb = el(wrap, `left:${q[0] - 30}px;top:${q[1] - 26}px;width:60px;text-align:center;font:800 ${Math.max(36, r * 0.32)}px ${COD};color:${ACC};line-height:52px`, label);
            tl.set([g, lb], { opacity: 0 }, 0); tl.to([g, lb], { opacity: 1, duration: 0.3, immediateRender: false }, t); },
          nudge: (t, a0, a1, tOut) => { const R = r * 1.2, s0 = pol(r, r, R, a0), s1 = pol(r, r, R, a1), th = a1 * Math.PI / 180, tx = Math.cos(th), ty = Math.sin(th), nx = -ty, ny = tx;
            const g = svgEl("svg", { viewBox: `0 0 ${2 * r} ${2 * r}`, width: 2 * r, height: 2 * r }, wrap); g.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
            svgEl("path", { d: `M${s0[0]} ${s0[1]} A${R} ${R} 0 0 1 ${s1[0] - tx * 4} ${s1[1] - ty * 4}`, fill: "none", stroke: ACC, "stroke-width": Math.max(5, r * 0.05), "stroke-linecap": "round" }, g);
            svgEl("polygon", { points: `${s1[0] + tx * 22},${s1[1] + ty * 22} ${s1[0] + nx * 13},${s1[1] + ny * 13} ${s1[0] - nx * 13},${s1[1] - ny * 13}`, fill: ACC }, g);
            tl.set(g, { opacity: 0 }, 0); tl.to(g, { opacity: 1, duration: 0.35, immediateRender: false }, t); if (tOut) gone(g, tOut); return g; } };
        return api; };

      // hoop (rim centre at cx,cy; scale s) and ball
      const hoop = (host, cx, cy, s, poleBottom) => { const bw = Math.max(2, 3 * s);
        const bb = el(host, `left:${cx + 66 * s}px;top:${cy - 210 * s}px;width:${26 * s}px;height:${232 * s}px;border-radius:${6 * s}px;border:${bw}px solid rgba(232,237,246,.8);background:rgba(232,237,246,.10)`);
        const pole = el(host, `left:${cx + 73 * s}px;top:${cy + 22 * s}px;width:${12 * s}px;height:${poleBottom - (cy + 22 * s)}px;border-radius:${4 * s}px;background:rgba(133,146,173,.42)`);
        const rim = el(host, `left:${cx - 70 * s}px;top:${cy - 6 * s}px;width:${142 * s}px;height:${12 * s}px;border-radius:${6 * s}px;background:${ACC}`);
        return [bb, pole, rim]; };
      const hoopNet = (host, cx, cy, s) => { const sv = svgLayer(host); const g = svgEl("g", {}, sv);
        const L = (x1, y1, x2, y2) => svgEl("line", { x1: cx + x1 * s, y1: cy + y1 * s, x2: cx + x2 * s, y2: cy + y2 * s, stroke: "rgba(232,237,246,.55)", "stroke-width": Math.max(2, 3 * s), "stroke-linecap": "round" }, g);
        for (let i = 0; i < 5; i++) L(-62 + 31 * i, 6, -34 + 17 * i, 100);
        [0.35, 0.7, 1].forEach((f) => { const y = 6 + 94 * f, hw = 62 - 28 * f; L(-hw, y, hw, y); });
        return g; };
      const ballEl = (host, d, p, visible) => { const b = el(host, `left:0;top:0;width:${d}px;height:${d}px`);
        b.innerHTML = `<svg viewBox="0 0 100 100" width="${d}" height="${d}"><circle cx="50" cy="50" r="47" fill="${ACC}"/><g fill="none" stroke="#0B1220" stroke-width="4" stroke-linecap="round"><path d="M50 3V97M3 50H97"/><path d="M14 17C34 33 34 67 14 83M86 17C66 33 66 67 86 83"/></g></svg>`;
        gsap.set(b, { x: p[0] - d / 2, y: p[1] - d / 2, opacity: visible ? 1 : 0, scale: visible ? 1 : 0.4 }); return b; };
      const fly = (b, d, p0, p1, h, t, dur, ease) => { const o = { u: 0 };
        tl.fromTo(o, { u: 0 }, { u: 1, duration: dur, ease: ease || "none", immediateRender: false, onUpdate: () => {
          gsap.set(b, { x: p0[0] + (p1[0] - p0[0]) * o.u - d / 2, y: p0[1] + (p1[1] - p0[1]) * o.u - 4 * h * o.u * (1 - o.u) - d / 2 }); } }, t); };
      const arcPts = (p0, p1, h, n) => { const a = []; for (let i = 0; i <= n; i++) { const u = i / n; a.push([p0[0] + (p1[0] - p0[0]) * u, p0[1] + (p1[1] - p0[1]) * u - 4 * h * u * (1 - u)]); } return a; };

      // ---------- the running example: three cards hours -> marks, large in B and C, a strip from D on ----------
      const cardX = [60, 390, 720];
      const bigCard = (host, k, y, o) => { o = o || {}; const hrs = k + 1, ym = (o.mult || 2) * hrs, H = o.pred ? 410 : 250;
        const root = el(host, `left:${cardX[k]}px;top:${y}px;width:300px;height:${H}px`); glass(root, 0, 0, 300, H, null, 28);
        el(root, `left:0;top:12px;width:300px;height:84px;text-align:center;line-height:84px;white-space:nowrap`, `<span style="font:700 76px ${COD};color:${CYAN}">${hrs}</span><span style="font:700 32px ${COD};color:${MUTED};letter-spacing:.1em;margin-left:14px">${hrs === 1 ? "HOUR" : "HOURS"}</span>`);
        el(root, `left:30px;top:104px;width:240px;height:2px;background:${ca(MUTED, 0.3)}`);
        const yv = el(root, `left:0;top:114px;width:300px;height:116px;text-align:center;line-height:116px;white-space:nowrap`, `<span style="font:700 100px ${COD};color:${ACC}">${ym}</span><span style="font:700 32px ${COD};color:${MUTED};letter-spacing:.1em;margin-left:14px">MARKS</span>`);
        const r = { root, yv, ys: [yv.children[0], yv.children[1]] };
        if (o.pred) { r.aLab = el(root, `left:0;top:246px;width:300px;text-align:center;font:700 34px ${COD};color:${MUTED};letter-spacing:.1em`, "PREDICTION");
          r.slot = el(root, `left:75px;top:294px;width:150px;height:100px;border-radius:18px;border:3px dashed ${ca(MUTED, 0.75)};text-align:center;line-height:92px;font:700 64px ${COD};color:${MUTED}`, "?");
          r.val = el(root, `left:0;top:286px;width:300px;height:112px;text-align:center;line-height:112px;font:700 104px ${COD};color:${TEXT}`, "0"); }
        return r; };
      const miniCard = (host, k, y, preds, ym) => { const root = el(host, `left:${cardX[k]}px;top:${y}px;width:300px;height:150px`); const panel = glass(root, 0, 0, 300, 150, null, 24);
        states(root, `left:0;top:8px;width:300px;height:80px;text-align:center;line-height:80px;font:700 60px ${COD};color:${TEXT};white-space:nowrap`, preds);
        const tr = el(root, `left:0;top:96px;width:300px;text-align:center;font:700 34px ${COD};white-space:nowrap;letter-spacing:.04em`, `<span class="tv" style="color:${HOT}">MARKS ${ym}</span>`); const tv = tr.querySelector(".tv");
        return { root, panel, tv, border: (t, col) => tl.to(panel, { borderColor: ca(col, 0.9), duration: 0.3, immediateRender: false }, t), tint: (t, col) => tl.to(tv, { color: col, duration: 0.3, immediateRender: false }, t) }; };

      // the loss curve (a bowl): loss(w) = 14/3 * (w - 2)^2 for the cards (1,2),(2,4),(3,6); its slope at w = 0 is -18.667, the printed gradient
      const bowl = (host, X, Y, o) => { const W = 580, HH = 315, px = (w) => 26 + (w + 0.5) * 105.6, py = (l) => 262 - l * 6.5, lossAt = (w) => 14 / 3 * (w - 2) * (w - 2);
        const root = el(host, `left:${X}px;top:${Y}px;width:${W}px;height:${HH}px`); glass(root, 0, 0, W, HH, CYAN, 24); show(root, o.tShow, { opacity: 0, y: 30 });
        el(root, `left:22px;top:12px;font:800 34px ${LAT};letter-spacing:.14em;color:${TEXT}`, "LOSS");
        states(root, `left:150px;top:4px;width:408px;text-align:right;font:700 48px ${COD};line-height:58px;white-space:nowrap`, o.read);
        const sv = svgEl("svg", { viewBox: `0 0 ${W} ${HH}`, width: W, height: HH }, root); sv.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
        svgEl("line", { x1: 26, y1: 262, x2: 554, y2: 262, stroke: "rgba(150,175,215,.4)", "stroke-width": 3 }, sv);
        el(root, `left:526px;top:268px;font:700 34px ${COD};color:${MUTED}`, "w");
        const pts = []; for (let i = 0; i <= 50; i++) { const w = -0.5 + i * 0.1; pts.push([px(w), py(lossAt(w))]); }
        let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        const curve = svgEl("path", { d: "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L"), fill: "none", stroke: CYAN, "stroke-width": 6, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": L + 4 }, sv);
        tl.set(curve, { strokeDashoffset: L + 4, opacity: 0 }, 0); tl.set(curve, { opacity: 1 }, o.tCurve); tl.to(curve, { strokeDashoffset: 0, duration: o.curveDur || 0.9, ease: "power2.out", immediateRender: false }, o.tCurve);
        const dot = el(root, `left:0;top:0;width:24px;height:24px;border-radius:50%;background:${ACC};border:3px solid ${PANEL}`); gsap.set(dot, { x: px(0) - 12, y: py(lossAt(0)) - 12, opacity: 0 });
        tl.to(dot, { opacity: 1, duration: 0.3, immediateRender: false }, o.tDot);
        const api = { root, px, py, lossAt, dot,
          roll: (t, w0, w1, dur) => { const q = { w: w0 }; tl.fromTo(q, { w: w0 }, { w: w1, duration: dur, ease: "power2.inOut", immediateRender: false, onUpdate: () => gsap.set(dot, { x: px(q.w) - 12, y: py(lossAt(q.w)) - 12 }) }, t); },
          jump: (t, p0, p1, dur) => { const q = { u: 0 }; tl.fromTo(q, { u: 0 }, { u: 1, duration: dur, ease: "power2.inOut", immediateRender: false, onUpdate: () => gsap.set(dot, { x: p0[0] + (p1[0] - p0[0]) * q.u - 12, y: p0[1] + (p1[1] - p0[1]) * q.u - 12 }) }, t);
            const ln = svgEl("line", { x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1], stroke: HOT, "stroke-width": 4, "stroke-dasharray": "10 10", "stroke-linecap": "round" }, sv); tl.set(ln, { opacity: 0 }, 0); tl.to(ln, { opacity: 0.9, duration: 0.25, immediateRender: false }, t); },
          downhill: (t, tOut) => { const q = []; for (let w = 0.12; w <= 1.15; w += 0.05) q.push([px(w), py(lossAt(w))]); const n = q.length;
