      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH");
      const at = (sc, w, n) => M.W(sc, w, n);

        const upd = (l) => { const a = Math.min(l, 30); const bx = ox + dx * (l - a), by = oy + dy * (l - a); ln.setAttribute("x2", bx); ln.setAttribute("y2", by);

          morph: (t, from, to, dur) => { tl.fromTo(o, { l: from }, { l: to, duration: dur, ease: "power2.inOut", immediateRender: false, onUpdate: () => upd(o.l) }, t); return api; },

        return api; };
      const line = (svg, x1, y1, x2, y2, col, w, dash) => sv(svg, "line", { x1, y1, x2, y2, stroke: col, "stroke-width": w, "stroke-linecap": "round", ...(dash ? { "stroke-dasharray": dash } : {}) });
      // person: head, body, pointing arm toward (dx,dy)
      const person = (svg, x, y, col, dx, dy) => { const g = sv(svg, "g", {}); sv(g, "circle", { cx: x, cy: y, r: 26, fill: "none", stroke: col, "stroke-width": 8 });
        line(g, x, y + 26, x, y + 120, col, 8); line(g, x, y + 120, x - 24, y + 190, col, 8); line(g, x, y + 120, x + 24, y + 190, col, 8);
        line(g, x, y + 52, x + dx * 80, y + 52 + dy * 80, col, 8); return g; };

      // ============ A: wrong ranking, from frame 0 ============

      M.hook(["Refund search:", "cricket note #1!"], { size: 96, top: 215 });
      const sb = glass(A, 90, 480, 900, 150, CYAN, 75); show(sb, 0.05, { opacity: 0, y: 10 });

      el(sb, `left:44px;top:66px;font:700 52px ${LAT};white-space:nowrap`, "refund payment");

      show(r1, 0.15, { opacity: 0, y: 14 }); show(r2, 0.3, { opacity: 0, y: 14 });

      el(r1, `left:150px;top:108px;font:600 38px ${COD};color:${MUTED}`, "match score, tomorrow");
      const x1 = el(r1, `right:34px;top:36px;font:800 84px ${COD};color:${HOT};opacity:0`, "✗"); tl.set(x1, { opacity: 0 }, 0); tl.set(x1, { opacity: 1 }, at("A", "upar"));

      el(r2, `left:150px;top:108px;font:600 38px ${COD};color:${MUTED}`, "refund policy, repeated");
      tag(A, "BY DISTANCE", 90, 1170, 900, 0.5, ACC, 48);
      M.fit(A, { y: 460, h: 840 });

      // ============ B: the question, then the answer ============
      // diagram: B
      const pq = pillC(B, "INTERVIEW QUESTION", 200, P("B", 0), { size: 34, h: 56 });
      const bq0 = M.box(B, { x: 140, y: 290, w: 800, h: 210, label: "EMBEDDINGS", icon: "model", color: ACC, size: 60 }); bq0.show(P("B", 0) + 0.2);
      const bq1 = M.box(B, { x: 140, y: 560, w: 800, h: 230, label: "COSINE", icon: "check", color: VIOLET, size: 64 });
      const bq2 = M.box(B, { x: 140, y: 960, w: 800, h: 230, label: "DISTANCE", icon: "model", color: CYAN, size: 64 });
      bq1.show(at("B", "cosine")); const why = tag(B, "WHY NOT?", 140, 830, 800, at("B", "kyun"), ACC, 72); bq2.show(at("B", "distance"));
      const tAns = at("B", "tumhara") - 0.1;
      [bq0, bq1, bq2].forEach((b) => b.parts.forEach((d) => gone(d, tAns))); gone(pq, tAns); gone(why, tAns);
      pillC(B, "YOUR ANSWER", 200, tAns + 0.3, { size: 34, h: 56, col: GOOD });
      M.box(B, { x: 100, y: 310, w: 880, h: 340, label: "DIRECTION", sub: "= SAME TOPIC", icon: "check", color: GOOD, size: 72, subsize: 48 }).show(at("B", "cosine", 1));
      M.box(B, { x: 100, y: 710, w: 880, h: 340, label: "LENGTH TOO", sub: "DISTANCE COUNTS IT", icon: "cross", color: HOT, size: 72, subsize: 44 }).show(at("B", "Distance"));
      stamp(B, "TOPIC UNCHANGED", 540, 1120, GOOD, at("B", "topic"), 56);
      M.fit(B, { y: 200, h: 1100 });

      // the plane (to scale): topic axis U points up-right, cricket axis V up-left (perpendicular); K px per unit
      const TH = Math.PI / 3, Ux = Math.cos(TH), Uy = -Math.sin(TH), Vx = -Math.sin(TH), Vy = -Math.cos(TH);
      const plane = (host, x, y, w, h, ox, oy, K) => { const s = svgAt(host, x, y, w, h); const Pt = (a, b) => [ox + K * (a * Ux + b * Vx), oy + K * (a * Uy + b * Vy)];
        const a1 = Pt(-0.5, 0), a2 = Pt(7.5, 0), b1 = Pt(0, -0.5), b2 = Pt(0, 2.2);
        line(s, a1[0], a1[1], a2[0], a2[1], "rgba(150,175,215,.25)", 3); line(s, b1[0], b1[1], b2[0], b2[1], "rgba(150,175,215,.25)", 3);
        sv(s, "circle", { cx: ox, cy: oy, r: 11, fill: TEXT }); return { s, Pt, ox, oy, K }; };
      const brace = (pl, a1, a2, b, col) => { const g = sv(pl.s, "g", {}); const p1 = pl.Pt(a1, b), p2 = pl.Pt(a2, b);
        [[p1, a1], [p2, a2]].forEach(([p, a]) => { const t1 = pl.Pt(a, b + 0.2), t2 = pl.Pt(a, b - 0.2); line(g, t1[0], t1[1], t2[0], t2[1], col, 5); });
        line(g, p1[0], p1[1], p2[0], p2[1], col, 5); return g; };

      // ============ C: arrows, counts, nearest wins ============
      // diagram: C
      const ci1 = M.box(C, { x: 140, y: 290, w: 800, h: 200, label: "refund payment", icon: "doc", color: TEXT, size: 54 }); ci1.show(P("C", 0) + 0.1);
      const ci2 = M.box(C, { x: 140, y: 530, w: 800, h: 200, label: "1 · 1 · 0", icon: "model", color: CYAN, size: 66 }); ci2.show(at("C", "numbers") - 0.2);
      const ci3 = tag(C, "VECTOR", 140, 770, 800, at("C", "vector"), ACC, 52);
      const K1 = 80, plC = plane(C, 80, 650, 920, 640, 300, 590, K1), PC = plC.Pt; fade(plC.s, at("C", "teer") - 0.1);

      ci1.parts.forEach((d) => gone(d, at("C", "EXAMPLE") - 0.1)); ci2.parts.forEach((d) => gone(d, at("C", "EXAMPLE") - 0.1)); gone(ci3, at("C", "EXAMPLE") - 0.1);
      const exC = pillC(C, "EXAMPLE", 200, at("C", "EXAMPLE"), { size: 36, h: 58, col: MUTED }); gone(exC, at("C", "Tempting") - 0.1);
      const tbl = [tag(C, "REFUND · PAYMENT · CRICKET", 60, 280, 960, at("C", "teen"), MUTED, 36)];
      const rowsC = [["QUERY", "1 · 1 · 0", ACC, at("C", "Query")], ["SHORT", "1 · 1 · 0", ACC, at("C", "short")], ["LONG ×5", "5 · 5 · 0", CYAN, at("C", "5", 1)], ["CRICKET", "0 · 0 · 1", HOT, at("C", "Cricket")]];
      rowsC.forEach(([a, b, col, t], i) => tbl.push(rowTile(C, 110, 335 + i * 74, 860, 66, a, b, col, t - 0.15, 38, 42)));
      const qp = PC(2.6, 0.45), qlab = txt(plC.s, qp[0], qp[1], "QUERY = SHORT", ACC, 38, "end"); show(qlab, at("C", "Query"), { opacity: 0 });
      const vl = vec(plC.s, 300, 590, Ux, Uy, CYAN, 8), vc = vec(plC.s, 300, 590, Vx, Vy, HOT, 10);
      vl.grow(at("C", "5", 1), 7.071 * K1, 0.7); vc.grow(at("C", "Cricket"), K1, 0.5);
      const lp = PC(7.071, 0), llab = txt(plC.s, lp[0] + 24, lp[1] + 16, "LONG ×5", CYAN, 38); show(llab, at("C", "5", 1) + 0.5, { opacity: 0 });
      const cp0 = PC(0, 1), clab = txt(plC.s, cp0[0] - 6, cp0[1] - 20, "CRICKET", HOT, 38, "end"); show(clab, at("C", "Cricket"), { opacity: 0 });
      const tT = at("C", "Tempting") - 0.1; tbl.forEach((d) => gone(d, tT));
      tl.to(plC.s, { y: -415, x: -90, scale: 1.3, transformOrigin: "0 0", duration: 0.6, ease: "power2.inOut", immediateRender: false }, tT);
      pillC(C, "CLOSEST = BEST?", 215, at("C", "Tempting") + 0.3, { size: 44, h: 70, col: ACC });
      const brk = brace(plC, 1.414, 7.071, -0.4, TEXT); fade(brk, at("C", "566") - 0.3);
      const q0 = PC(1.414, -0.9), d0 = txt(plC.s, q0[0], q0[1] + 12, "0", GOOD, 60); show(d0, at("C", "0", 4), { opacity: 0 });
      const p566 = PC(4.2, -1.0), d566 = txt(plC.s, p566[0], p566[1], "5.66", CYAN, 64); show(d566, at("C", "566"), { opacity: 0 });
      const qt = PC(1.414, 0), dcl = line(plC.s, qt[0], qt[1], cp0[0], cp0[1], HOT, 6, "12 10"); fade(dcl, at("C", "173") - 0.3);
      const d173 = txt(plC.s, 215, 600, "1.73", HOT, 64, "end"); show(d173, at("C", "173"), { opacity: 0 });

      // ============ D: cosine reads the angle ============

      const K2 = 100, OXD = 230, OYD = 700, plD = plane(D, 40, 330, 580, 800, OXD, OYD, K2), PD = plD.Pt; fade(plD.s, P("D", 0) + 0.2);

      dq.grow(at("D", "matlab"), 1.414 * K2, 0.5); dl.grow(at("D", "direction"), 7.071 * K2, 0.7); dc.grow(at("D", "length"), K2, 0.5);
      const labs = [[PD(2.4, 0.45), "SHORT", ACC, "end", 0], [PD(7.071, 0.3), "LONG ×5", CYAN, "end", 0], [PD(0, 1), "CRICKET", HOT, "start", 0]];
      labs.forEach(([p, s2, col, an], i) => { const x = i === 2 ? OXD - 50 : p[0], y = i === 2 ? p[1] + 56 : p[1]; show(txt(plD.s, x, y, s2, col, 36, i === 2 ? "end" : an), at("D", "length") + 0.3, { opacity: 0 }); });
      const aU = PD(0, 0), arcS = [OXD + 90 * Ux, OYD + 90 * Uy], arcE = [OXD + 90 * Vx, OYD + 90 * Vy];
      const arc90 = sv(plD.s, "path", { d: `M ${arcS[0]} ${arcS[1]} A 90 90 0 0 0 ${arcE[0]} ${arcE[1]}`, fill: "none", stroke: HOT, "stroke-width": 7 }); fade(arc90, at("D", "angle"));
      const l90 = txt(plD.s, OXD - 35, OYD - 130, "90°", HOT, 48, "middle"); show(l90, at("D", "angle") + 0.2, { opacity: 0 });
      const z0 = PD(2.6, -0.45), l0 = txt(plD.s, z0[0], z0[1], "0°", GOOD, 52); show(l0, at("D", "angle") + 0.35, { opacity: 0 });
      const chA = rowTile(D, 640, 330, 390, 78, "1", "SAME WAY", GOOD, at("D", "1"), 44, 34), chB = rowTile(D, 640, 420, 390, 78, "0", "DIFFERENT", HOT, at("D", "0"), 44, 34);
      const sbD = [["SHORT", "1.00", ACC, at("D", "100")], ["LONG ×5", "1.00", CYAN, at("D", "100", 1)], ["CRICKET", "0.00", HOT, at("D", "000")]].map(([a, b, col, t], i) => rowTile(D, 640, 540 + i * 88, 390, 76, a, b, col, t - 0.1, 38, 46));
      const tK = at("D", "kyun") - 0.15;
      [chA, chB, ...sbD].forEach((d) => gone(d, tK)); gone(l90, tK); gone(l0, tK); gone(arc90, tK);
      // two people pointing the same way, one near, one far
      const ps = svgAt(D, 640, 330, 390, 480); fade(ps, at("D", "log"));
      sv(ps, "circle", { cx: 345, cy: 50, r: 34, fill: "none", stroke: ACC, "stroke-width": 8 }); sv(ps, "circle", { cx: 345, cy: 50, r: 12, fill: ACC });
      person(ps, 240, 190, CYAN, 0.8, -0.6); person(ps, 60, 190, CYAN, 0.8, -0.6);
      show(txt(ps, 240, 440, "NEAR", TEXT, 44, "middle"), at("D", "paas"), { opacity: 0 }); show(txt(ps, 60, 440, "FAR", TEXT, 44, "middle"), at("D", "door"), { opacity: 0 });
      gone(ps, at("D", "Note") - 0.1);
      const sd = stamp(D, "SAME DIRECTION", 835, 850, GOOD, at("D", "hai", 2), 36); gone(sd, at("D", "Note") - 0.1);
      const ext = brace(plD, 1.414, 7.071, -0.7, ACC); fade(ext, at("D", "dohrane"));

      // ============ E: remove the length ============
