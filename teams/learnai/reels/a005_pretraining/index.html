<!doctype html>
<html lang="hi" data-composition-variables='[

    <style>

  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="98.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div><div class="beat" id="sI"></div><div class="beat" id="sJ"></div><div class="beat" id="sK"></div><div class="beat" id="sL"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="98.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="98.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="98.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J","K","L"], tag: "150 DAYS OF AI · DAY 5" });
      Viz.install(M);
      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, MUTED, TEXT } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH"), I = M.$("#sI"), J = M.$("#sJ"), K = M.$("#sK"), L = M.$("#sL");
      const at = (sc, w, n) => M.W(sc, w, n);
      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#0E1626";

      // ============ helpers ============
      const grab = (host) => { const i0 = host.children.length; return () => [...host.children].slice(i0); };
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const glass = (host, x, y, w, h, col, rad) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad || 24}px` + (col ? `;border-color:${ca(col, 0.55)}` : ""); return d; };
      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t, dur) => { tl.to(d, { opacity: 0, duration: dur || 0.3, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (list, t) => list.forEach((d) => gone(d, t));
      const txt = (host, text, x, y, w, t, col, size, align, font) => { const sz = size || 36, tw = Math.min(w, Math.round(String(text).length * 0.68 * sz) + 12), a = align || "center";
        const lx = a === "left" ? x : (a === "right" ? x + w - tw : x + (w - tw) / 2);
        return show(el(host, `left:${lx}px;top:${y}px;width:${tw}px;text-align:${a};font:800 ${sz}px ${font || COD};letter-spacing:.04em;color:${col};white-space:nowrap`, text), t, { opacity: 0, y: 12 }); };
      const pillC = (host, text, y, t, o) => { o = o || {}; const col = o.col || ACC, h = o.h || 58, sz = o.size || 36, pad = o.pad || 30, tw = Math.round(String(text).length * 0.72 * sz + 2 * pad + 10); const w = el(host, `left:${540 - tw / 2}px;top:${y}px;width:${tw}px;height:${h}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${h}px;padding:0 ${pad}px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.12em;color:${col};white-space:nowrap">${text}</div>`;
        return show(w, t, { opacity: 0, y: -14 }); };
      // one label slot whose text changes on the spoken word: [[t, text, colour], ...]
      const slot = (host, y, list, o) => { o = o || {}; return list.map(([t, text, col], i) => { const sz = o.size || 36, tw = Math.round(String(text).length * 0.72 * sz + 74), w = el(host, `left:${540 - tw / 2}px;top:${y}px;width:${tw}px;height:${o.h || 60}px;display:flex;justify-content:center`);
        w.innerHTML = `<div style="display:flex;align-items:center;height:${o.h || 60}px;padding:0 32px;border-radius:999px;border:2px solid ${col};background:${ca(col, 0.10)};font:700 ${sz}px ${COD};letter-spacing:.12em;color:${col};white-space:nowrap">${text}</div>`;
        tl.set(w, { opacity: 0 }, 0); tl.set(w, { opacity: 1 }, t); if (i < list.length - 1) tl.set(w, { opacity: 0 }, list[i + 1][0]); tl.fromTo(w, { y: 10 }, { y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t); return w; }); };
      // word chips in a centred row (mono, fixed width per char so the row can be planned before the chips show)
      const chipW = (word, size, pad) => Math.round(word.length * 0.6 * size + 2 * pad + 5);
      const rowPos = (words, size, pad, gap, cx) => { const ws = words.map((w) => chipW(w, size, pad)); const total = ws.reduce((a, b) => a + b, 0) + gap * (words.length - 1); let x = cx - total / 2;
        return ws.map((w) => { const r = { x: Math.round(x), w }; x += w + gap; return r; }); };
      const chip = (host, word, x, y, w, size, col, filled) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${Math.round(size * 1.75)}px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:14px;border:2.5px solid ${col};background:${ca(col, filled ? 0.24 : 0.10)};font:700 ${size}px ${COD};color:${TEXT};white-space:nowrap`, word);
      // bar row: word label, bar (true length, px per percent), fraction and percent that appear on their spoken words
      const barRow = (host, x, y, word, pct, k, n, scale, o) => { o = o || {}; const h = o.h || 76, fs = o.fs || 54;
        const lab = el(host, `left:${x}px;top:${y}px;width:${o.lw || 200}px;height:${h}px;display:flex;align-items:center;font:700 ${fs}px ${COD};color:${TEXT}`, word);
        const bar = el(host, `left:${x + (o.lw || 200) + 10}px;top:${y}px;width:${Math.round(pct * scale)}px;height:${h}px;border-radius:12px;background:${ca(CYAN, 0.85)};transform-origin:0 50%`);
        const val = el(host, `left:${x + (o.lw || 200) + 34 + Math.round(pct * scale)}px;top:${y}px;height:${h}px;display:flex;align-items:center;font:700 ${o.vs || 44}px ${COD};color:${ACC};white-space:nowrap`, `<span class="f" style="color:${MUTED}">${k}/${n}</span><span class="p">&nbsp;= ${pct} %</span>`);
        return { lab, bar, val, f: val.querySelector(".f"), p: val.querySelector(".p") }; };
      const barTimes = (r, tLab, tBar, tFrac, tPct) => { show(r.lab, tLab, { opacity: 0, x: -20, y: 0 }); tl.set(r.bar, { opacity: 0, scaleX: 0 }, 0); tl.set(r.bar, { opacity: 1 }, tBar); tl.to(r.bar, { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, tBar);
        tl.set(r.val, { opacity: 0 }, 0); tl.set(r.val, { opacity: 1 }, tFrac); tl.set(r.p, { opacity: 0 }, 0); tl.set(r.p, { opacity: 1 }, tPct); };


      // ============ extra helpers ============
      const NSx = "http://www.w3.org/2000/svg";
      const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NSx, tag); Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k])); if (parent) parent.appendChild(e); return e; };
      const LOSS = [3.585, 3.585, 3.544, 3.514, 3.429, 3.344, 3.338, 3.304, 3.185, 3.139, 3.09, 3.044, 2.998, 2.988, 2.954, 2.89, 2.872, 2.842, 2.791, 2.778, 2.744, 2.701, 2.68, 2.669, 2.641, 2.645, 2.628, 2.597, 2.587, 2.572, 2.542, 2.511, 2.513, 2.496, 2.472, 2.46, 2.434, 2.412, 2.39, 2.386, 2.368, 2.349, 2.342, 2.327, 2.309, 2.304, 2.285, 2.27, 2.262, 2.245, 2.228, 2.211, 2.205, 2.187];
      const sentence = (host, y, t0) => { const w = ["the", "dog", "sat", "on", "the", "rug"], p = rowPos(w, 52, 22, 14, 540);
        return { w, p, chips: w.map((x, i) => show(chip(host, x, p[i].x, y, p[i].w, 52, CYAN, false), t0 + i * 0.08, { opacity: 0, y: 14 }, 0.3)) }; };

      // ============ A: the interviewer's question: who put labels on the data? ============
      // diagram: A
      M.hook(["Interviewer ne poocha:", "labels kisne lagae?"], { size: 92, top: 230 });
      [0, 1, 2].forEach((i) => { const w = [640, 580, 620][i], x = Math.round(540 - w / 2) + [0, 34, -22][i], y = 560 + i * 110, t = 0.05 + i * 0.15;
        show(glass(A, x, y, w, 92, CYAN, 14), t, { opacity: 0, y: -40 }, 0.45);
        show(el(A, `left:${x + 34}px;top:${y + 24}px;width:${w - 68}px;height:10px;border-radius:5px;background:${ca(CYAN, 0.55)}`), t + 0.1, { opacity: 0 });
        show(el(A, `left:${x + 34}px;top:${y + 52}px;width:${Math.round((w - 68) * 0.66)}px;height:10px;border-radius:5px;background:${ca(CYAN, 0.35)}`), t + 0.15, { opacity: 0 }); });
      txt(A, "DATASET", 90, 490, 900, 0.1, CYAN, 42);
      M.arrow(A, { from: [540, 900], to: [540, 1000], color: CYAN, w: 10 }).show(at("A", "ChatGPT"), 0.3);
      M.box(A, { x: 290, y: 1010, w: 500, h: 200, label: "CHATGPT", icon: "robot", color: CYAN, size: 46 }).show(at("A", "ChatGPT"));
      pillC(A, "PRETRAINING", 1250, at("A", "pretrain"), { col: ACC, size: 46, h: 78, pad: 40 });
      pillC(A, "LABELS ?", 1350, at("A", "labels"), { col: HOT, size: 46, h: 78, pad: 44 });
      M.fit(A, { y: 500, h: 920, maxScale: 2.2 });

      // ============ B: not humans; the text is the answer key ============
      // diagram: B
      const bU = M.icon(B, "user", 330, 340, 260, CYAN); bU.show(at("B", "humans"));
      const bT = txt(B, "HUMANS", 90, 630, 900, at("B", "humans"), CYAN, 46);
      const bX = M.icon(B, "cross", 590, 380, 180, HOT); bX.show(at("B", "reject"));
      const bR = pillC(B, "REJECTED", 720, at("B", "reject"), { col: HOT, size: 50, h: 84, pad: 46 });
      const bN = pillC(B, "NO HUMAN LABELER", 840, at("B", "koi"), { col: HOT, size: 40, h: 72, pad: 40 });
      const tB = at("B", "Text") - 0.2; goneAll([bT, bX.el, bU.el, bR, bN], tB);
      const bP = glass(B, 90, 330, 900, 330, CYAN); show(bP, at("B", "Text"), { opacity: 0, y: 20 });
      const bS = sentence(B, 440, at("B", "Text") + 0.1);
      const bRing = el(B, `left:${bS.p[0].x - 12}px;top:424px;width:${bS.p[5].x + bS.p[5].w - bS.p[0].x + 24}px;height:123px;box-sizing:border-box;border-radius:22px;border:4px solid ${ACC}`); show(bRing, at("B", "key"), { opacity: 0, scale: 1.04 }, 0.35);
      pillC(B, "TEXT = ANSWER KEY", 740, at("B", "answer"), { col: GOOD, size: 46, h: 80, pad: 42 });
      M.fit(B, { y: 250, h: 1050, maxScale: 2.2 });

      // ============ C: the mechanism: hide the next word ============
      // diagram: C
      const cP = glass(C, 90, 330, 900, 330, CYAN); show(cP, P("C", 0) + 0.05, { opacity: 0, y: 20 });
      const cS = sentence(C, 440, P("C", 0) + 0.1);
      const cCov = show(el(C, `left:${cS.p[5].x}px;top:440px;width:${cS.p[5].w}px;height:91px;box-sizing:border-box;border-radius:14px;border:2.5px solid ${ACC};background:${PANEL};display:flex;align-items:center;justify-content:center;font:700 52px ${COD};color:${ACC}`, "?"), at("C", "chhupa"), { opacity: 0, scale: 1.1 }, 0.3);
      gone(cS.chips[5], at("C", "chhupa"), 0.1);
      slot(C, 720, [[at("C", "agla"), "HIDE NEXT WORD", ACC], [at("C", "aur"), "MODEL GUESSES", CYAN]], { size: 42, h: 74 });
      ["rug", "mat", "bed", "door", "park", "cat"].forEach((w, i) => { const x = 155 + i * 132, t = at("C", "guess") + i * 0.07;
        const b = el(C, `left:${x}px;top:860px;width:110px;height:180px;border-radius:12px;background:${ca(CYAN, 0.85)};transform-origin:50% 100%`); tl.set(b, { opacity: 0, scaleY: 0.2 }, 0); tl.to(b, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
        txt(C, w, x - 15, 1050, 140, t, TEXT, 34); });
      M.fit(C, { y: 250, h: 1050, maxScale: 2.2 });

      // ============ D: the toy model and its text ============
      // diagram: D
      slot(D, 240, [[at("D", "toy"), "TOY MODEL", CYAN], [at("D", "ek", 1), "EXAMPLE", MUTED]], { size: 42, h: 72 });
      show(glass(D, 90, 340, 900, 470, MUTED, 22), at("D", "toy"), { opacity: 0, y: 20 }); txt(D, "toy_model.py", 120, 358, 500, at("D", "toy"), MUTED, 34, "left");
      ["the cat sat on the mat .", "the dog sat on the rug .", "the cat ate the fish .", "the dog ate the bone .", "..."].forEach((l, i) =>
        show(el(D, `left:130px;top:${430 + i * 66}px;font:600 40px ${COD};color:${TEXT};white-space:pre`, l), at("D", "chhota") + i * 0.14, { opacity: 0, y: 10 }, 0.3));
      [[90, "53", "WORDS", at("D", "53")], [560, "12", "UNIQUE", at("D", "12")]].forEach(([x, v, lab, t]) => {
        show(glass(D, x, 870, 430, 270, CYAN), t - 0.1, { opacity: 0, y: 20 }); M.count(D, +v, t, { x, y: 900, w: 430, size: 130, dec: 0, dur: 0.6, color: ACC }); txt(D, lab, x, 1060, 430, t, CYAN, 40); });
      M.fit(D, { y: 220, h: 1080, maxScale: 2.2 });

      // ============ E: random weights, equal chances ============
      // diagram: E
      const eM = M.box(E, { x: 290, y: 300, w: 500, h: 210, label: "MODEL", icon: "model", color: CYAN, size: 46 }); eM.show(P("E", 0) + 0.1);
      const wv = ["0.31", "-0.72", "0.05", "0.88", "-0.14", "0.47"], wP = rowPos(wv, 40, 14, 10, 540);
      wv.forEach((v, i) => show(chip(E, v, wP[i].x, 620, wP[i].w, 40, CYAN, false), at("E", "weights") + i * 0.09, { opacity: 0, y: 14 }, 0.3));
      txt(E, "WEIGHTS", 90, 560, 900, at("E", "weights"), CYAN, 38);
      pillC(E, "RANDOM", 740, at("E", "random"), { col: ACC, size: 44, h: 70, pad: 40 });
      pillC(E, "ZERO IDEA", 840, at("E", "zero"), { col: HOT, size: 44, h: 70, pad: 40 });
      for (let i = 0; i < 12; i++) { const x = 114 + i * 72, t = at("E", "12") + i * 0.04;
        const b = el(E, `left:${x}px;top:990px;width:60px;height:120px;border-radius:8px;background:${ca(CYAN, 0.85)};transform-origin:50% 100%`); tl.set(b, { opacity: 0, scaleY: 0.2 }, 0); tl.to(b, { opacity: 1, scaleY: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, t); }
      pillC(E, "EQUAL: 1/12 EACH", 1140, at("E", "equal"), { col: MUTED, size: 40, h: 70, pad: 40 });
      M.fit(E, { y: 220, h: 1080, maxScale: 2.2 });

      // ============ F: the loss number ============
      // diagram: F
      const fC = glass(F, 140, 420, 800, 420, ACC); show(fC, at("F", "error"), { opacity: 0, y: 20 });
      txt(F, "LOSS", 140, 450, 800, at("F", "loss"), ACC, 56); M.count(F, 3.58, at("F", "358"), { x: 140, y: 540, w: 800, size: 220, dec: 2, dur: 0.7, color: ACC });
      txt(F, "ERROR SCORE", 140, 770, 800, at("F", "error"), MUTED, 38);
      show(el(F, `left:150px;top:930px;width:780px;height:30px;border-radius:15px;background:linear-gradient(90deg,${ca(GOOD, 0.45)},${ca(HOT, 0.45)})`), at("F", "loss"), { opacity: 0 });
      txt(F, "LOW", 150, 975, 200, at("F", "loss"), GOOD, 34, "left"); txt(F, "HIGH", 730, 975, 200, at("F", "loss"), HOT, 34, "right");
      show(el(F, `left:${905 - 25}px;top:920px;width:50px;height:50px;border-radius:50%;background:${ACC};border:4px solid ${PANEL};box-sizing:border-box`), at("F", "358"), { opacity: 0, y: 0 }, 0.3);
      M.fit(F, { y: 300, h: 900, maxScale: 2.2 });

      // ============ G: one cycle: guess, reveal, loss, update ============
      // diagram: G
      pillC(G, "ONE CYCLE", 250, at("G", "cycle"), { col: ACC, size: 46, h: 78, pad: 42 });
      const gL = M.loop(G, { cx: 540, cy: 740, r: 280, nodes: [{ label: "GUESS", color: CYAN, w: 300 }, { label: "REVEAL", color: ACC, w: 300 }, { label: "LOSS", color: HOT, w: 300 }, { label: "UPDATE", color: GOOD, w: 300 }] });
      gL.show(at("G", "guess"), 1.1);
      M.fit(G, { y: 220, h: 1080, maxScale: 2.2 });

      // ============ H: the real chart ============
      // diagram: H
      const CW = 960, CH = 760, PL = 110, PT = 80, PH = 520, PWd = 810;
      const X = (n) => PL + (n / 53) * PWd, Y = (v) => PT + (1 - v / 4) * PH;
      const hWrap = el(H, `left:60px;top:230px;width:${CW}px;height:${CH}px;border-radius:24px;overflow:hidden;background:${ca(PANEL, 0.92)};border:1.5px solid rgba(150,175,215,.28)`);
      tl.set(hWrap, { opacity: 0 }, 0); tl.to(hWrap, { opacity: 1, duration: 0.3, immediateRender: false }, P("H", 0) + 0.05);
      const svg = svgEl("svg", { viewBox: `0 0 ${CW} ${CH}`, width: CW, height: CH }, hWrap); svg.style.cssText = "position:absolute;left:0;top:0";
      const sTxt = (s, x, y, col, size, anchor, t) => { const e = svgEl("text", { x, y, fill: col, "font-size": size, "font-family": "JetBrains Mono, monospace", "font-weight": 700, "text-anchor": anchor || "middle" }, svg); e.textContent = s; tl.set(e, { opacity: 0 }, 0); tl.to(e, { opacity: 1, duration: 0.3, immediateRender: false }, t); return e; };
      const axes = svgEl("path", { d: `M${PL} ${PT}V${Y(0)}H${PL + PWd + 10}M${PL} ${Y(2)}H${PL + PWd}M${PL} ${Y(4)}H${PL + PWd}`, stroke: "rgba(150,175,215,.35)", "stroke-width": 3, fill: "none" }, svg);
      tl.set(axes, { opacity: 0 }, 0); tl.to(axes, { opacity: 1, duration: 0.3, immediateRender: false }, P("H", 0) + 0.05);
