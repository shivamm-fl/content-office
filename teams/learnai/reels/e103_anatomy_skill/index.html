<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Ek line likho, agent poori machine ka exploded drawing bana de</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="40" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="40" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="40" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F"], tag: "WHAT'S NEW IN AI" });
      Viz.install(M);
      const { tl } = M; const at = (sc, w, n) => M.W(sc, w, n);
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF");
      const { ACC, CYAN, HOT, GOOD } = M;
      const GREY = "#8592AD";
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:26px;top:20px;font-size:36px;color:${col};text-align:left`; } return d; };
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const stamp = (host, txt, x, y, col, t) => { const d = el(host, `left:${x}px;top:${y}px;padding:14px 30px;border:2.5px solid ${col};border-radius:12px;background:rgba(14,18,30,.95);font:700 48px var(--code);color:${col};white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.5)`, txt);
        gsap.set(d, { xPercent: -50 }); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const bars = (host, x, y, w, n, col, gap) => { for (let i = 0; i < n; i++) el(host, `left:${x}px;top:${y + i * (gap || 46)}px;width:${w - (i % 2) * 90}px;height:18px;border-radius:9px;background:${M.ca(col, 0.35)}`); };
      const labEl = (host, txt, x, y, col, size) => el(host, `left:${x}px;top:${y}px;font:700 ${size || 46}px var(--lat);color:${col};white-space:nowrap`, txt);
      const file = (host, name, x, y, w, h, t, nb) => { const p = show(panel(host, x, y, w, h, GREY), t);
        el(p, `left:34px;top:22px;font:700 40px var(--code);color:#E6ECF8;white-space:nowrap`, name); bars(p, 34, 92, w - 68, nb || 3, GREY, 38); return p; };

      // iso plates: an exploded-view stack (REQUEST, GATE, BUCKET, REFILL)
      const PARTS = [["REQUEST", CYAN], ["GATE", GOOD], ["BUCKET", ACC], ["REFILL", CYAN]];
      const plates = (host, o) => {
        const s = o.s || 1, W = 420 * s, H = 150 * s, T = 28 * s, els = [], labs = [];
        for (let i = 3; i >= 0; i--) {
          const col = PARTS[i][1], d = el(host, `left:${o.x}px;top:${o.y + i * o.gapA}px;width:${W}px;height:${H + T}px`);
          const top = `${W / 2},0 ${W},${H / 2} ${W / 2},${H} 0,${H / 2}`;
          const left = `0,${H / 2} ${W / 2},${H} ${W / 2},${H + T} 0,${H / 2 + T}`;
          const right = `${W},${H / 2} ${W / 2},${H} ${W / 2},${H + T} ${W},${H / 2 + T}`;
          const k = 0.55, cx = W / 2, cy = H / 2, inner = [[cx, cy - cy * k], [cx + cx * k, cy], [cx, cy + cy * k], [cx - cx * k, cy]].map((p) => p.join(",")).join(" ");
          let extra = `<polygon points="${inner}" fill="none" stroke="${col}" stroke-width="${3 * s}" opacity=".7"/>`;
          if (i === 2) extra = [-1, 0, 1].map((j) => `<ellipse cx="${cx + j * 78 * s}" cy="${cy + (j % 2) * 8 * s}" rx="${26 * s}" ry="${13 * s}" fill="${ACC}"/>`).join("");
          if (i === 1) extra = `<polygon points="${cx},${cy - 22 * s} ${cx + 60 * s},${cy} ${cx},${cy + 22 * s} ${cx - 60 * s},${cy}" fill="#0b1020" stroke="${col}" stroke-width="${3 * s}"/>`;
          d.innerHTML = `<svg viewBox="0 0 ${W} ${H + T}" width="${W}" height="${H + T}" style="overflow:visible"><g stroke-linejoin="round"><polygon points="${left}" fill="#101828" stroke="${col}" stroke-width="${3 * s}"/><polygon points="${left}" fill="${M.ca(col, 0.2)}"/><polygon points="${right}" fill="#101828" stroke="${col}" stroke-width="${3 * s}"/><polygon points="${right}" fill="${M.ca(col, 0.1)}"/><polygon points="${top}" fill="#141d33" stroke="${col}" stroke-width="${3 * s}"/><polygon points="${top}" fill="${M.ca(col, 0.28)}"/>${extra}</g></svg>`;
          els[i] = d;
          if (o.labels) { labs[i] = labEl(host, PARTS[i][0], o.x + W + 24, o.y + (o.yShift || 0) + i * o.gapB + (H + T) / 2 - 30, col, 46); tl.set(labs[i], { opacity: 0 }, 0); }
        }
        return { els, labs, explode: (t, dur) => { els.forEach((d, i) => tl.to(d, { y: i * (o.gapB - o.gapA) + (o.yShift || 0), x: o.dx || 0, duration: dur || 0.7, ease: "power3.inOut", immediateRender: false }, t));
          labs.forEach((l, i) => tl.fromTo(l, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t + 0.45 + i * 0.12)); } };
      };

      // diagram: A  hook: a pile of md files nobody wants to read
      M.hook(["Claude ki md files", "padh-padh thake?"], { size: 92, top: 250 });
      M.box(A, { x: 110, y: 470, w: 860, h: 170, label: "CLAUDE", icon: "robot", color: CYAN, size: 50 }).show(0.05);
      M.arrow(A, { from: [540, 650], to: [540, 710], color: CYAN, w: 10 }).show(0.15, 0.25);
      file(A, "ARCHITECTURE.md", 120, 720, 840, 190, 0.1, 3);
      file(A, "DATA_FLOW.md", 120, 930, 840, 190, 0.2, 3);
      file(A, "NOTES.md", 120, 1140, 840, 190, 0.3, 3);
      const qa = el(A, `left:850px;top:830px;font:800 280px var(--code);color:${HOT}`, "?"); show(qa, at("A", "pareshan"), { opacity: 0, scale: 0.6 });
      M.fit(A, { y: 470, h: 860, maxScale: 1.8 });

      // diagram: B  the agent writes many files; too much text
      M.box(B, { x: 110, y: 230, w: 860, h: 180, label: "CLAUDE", icon: "robot", color: CYAN, size: 54 }).show(0.05);
      M.arrow(B, { from: [540, 420], to: [540, 490], color: CYAN, w: 12 }).show(0.2, 0.3);
      [0, 1, 2].forEach((k) => { const ph = panel(B, 150, 500 + k * 170, 780, 150, GREY); ph.style.borderStyle = "dashed"; show(ph, 0.1 + k * 0.1); });
      const fb1 = file(B, "ARCHITECTURE.md", 150, 500, 780, 150, at("B", "architecture"), 2);
      const fb2 = file(B, "DATA_FLOW.md", 150, 670, 780, 150, at("B", "data"), 2);
      const fb3 = file(B, "NOTES.md", 150, 840, 780, 150, at("B", "kai"), 2);
      [500, 670, 840].forEach((y, k) => M.pill(B, "WRITES", [at("B", "architecture"), at("B", "data"), at("B", "kai")][k] + 0.1, { x: 720, y: y - 28, kind: "out", size: 36 }));
      M.box(B, { x: 250, y: 1030, w: 580, h: 200, label: "YOU READ", icon: "eye", color: HOT, size: 54 }).show(at("B", "padhna"));
      [fb1, fb2, fb3].forEach((f) => tl.to(f, { opacity: 0.75, duration: 0.3, immediateRender: false }, at("B", "boring")));
      stamp(B, "TOO MUCH TEXT", 540, 1270, HOT, at("B", "boring"));
      M.fit(B, { y: 220, h: 1100, maxScale: 1.8 });

      // diagram: C  anatomy skill = a folder of instructions that teaches the agent
      M.pill(C, "ANATOMY SKILL", M.P("C", 0) + 0.1, { x: 250, y: 200, size: 56 });
      const fold = show(panel(C, 190, 360, 700, 330, ACC), 0.15);
      el(fold, `left:40px;top:60px;font:700 46px var(--code);color:#E6ECF8;line-height:1.7;white-space:nowrap`, `SKILL.md<br>references/<br>README.md`); M.icon(fold, "doc", 520, 90, 130, ACC).show(0.2);
      const tab = el(C, `left:190px;top:322px;width:260px;height:40px;border-radius:14px 14px 0 0;border:1.5px solid ${M.ca(ACC, 0.6)};border-bottom:none;background:${M.ca(ACC, 0.25)}`); show(tab, 0.15);
      M.box(C, { x: 110, y: 830, w: 860, h: 280, label: "CODING AGENT", icon: "robot", color: CYAN, size: 54 }).show(0.2);
      M.arrow(C, { from: [540, 700], to: [540, 820], color: ACC, w: 12 }).show(at("C", "agent"), 0.3);
      M.icon(C, "gear", 780, 880, 120, ACC).show(at("C", "naya"));
      M.pill(C, "NEW", at("C", "kaam"), { x: 765, y: 1010, size: 40 });
      M.fit(C, { y: 220, h: 1080, maxScale: 1.8 });

      // diagram: D  the example prompt typed word by word, from the README, and the part it draws
      const pc = show(panel(D, 70, 300, 940, 400, CYAN, "CLAUDE CODE"), M.P("D", 0));
      el(pc, `left:44px;top:90px;font:700 56px var(--code);color:${ACC}`, "/anatomy");
      const wrap = el(pc, "left:44px;top:170px;width:850px;font:600 54px var(--code);line-height:1.35");
      ["explain", "how", "a", "token", "bucket", "rate", "limiter", "works,", "interactive"].forEach((w) => { const sp = document.createElement("span"); sp.textContent = w + " "; wrap.appendChild(sp);
        tl.set(sp, { opacity: 0 }, 0); tl.to(sp, { opacity: 1, duration: 0.15, immediateRender: false }, at("D", w.replace(",", ""))); });
      M.arrow(D, { from: [540, 710], to: [540, 790], color: ACC, w: 12 }).show(M.P("D", 0) + 0.4, 0.3);
      const pk = plates(D, { x: 372, y: 810, s: 0.8, gapA: 36, gapB: 36 });
      pk.els.forEach((d) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, { opacity: 0, y: -30 }, { opacity: 0.35, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, M.P("D", 0) + 0.5);
        tl.to(d, { opacity: 1, duration: 0.35, immediateRender: false }, at("D", "interactive") + 0.5); });
      const rd = show(panel(D, 70, 1110, 940, 190, ACC), M.P("D", 0) + 0.6); M.icon(rd, "doc", 40, 25, 130, ACC).show(M.P("D", 0) + 0.6);
      el(rd, "left:200px;top:30px;font:700 52px var(--lat)", "README: OWN EXAMPLE"); el(rd, `left:200px;top:110px;font:600 40px var(--code);color:#B8C4DC`, "Source: GitHub");
      M.pill(D, "EXAMPLE", at("D", "example"), { x: 690, y: 255, size: 44 });
      M.fit(D, { y: 280, h: 1000 });

      // diagram: E  not text, an isometric drawing whose parts pull apart
      const dt = show(panel(E, 110, 520, 860, 400, GREY, "TEXT"), 0.1); bars(dt, 50, 110, 760, 6, GREY, 52);
      const dx = M.icon(E, "cross", 410, 570, 300, HOT); dx.show(at("E", "nahi"));
      M.out(dt, at("E", "ek") - 0.2); dx.hide(at("E", "ek") - 0.2);
      const pD = plates(E, { x: 330, y: 587, gapA: 40, gapB: 205, labels: true, dx: -140, yShift: -247 });
      pD.els.forEach((d, i) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, at("E", "isometric") + (3 - i) * 0.13); });
      pD.explode(at("E", "alag") - 0.1, 0.8);
      M.pill(E, "ILLUSTRATION", at("E", "illustration"), { x: 300, y: 250, size: 44 });
      M.fit(E, { y: 230, h: 1070 });

      // diagram: F  follow, comment the keyword, the skill arrives in your DM
      const flw = M.pill(F, "+  FOLLOW", M.P("F", 0) + 0.05, { x: 345, y: 230, kind: "acc", size: 56 });
      tl.fromTo(flw, { scale: 1 }, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, at("F", "follow"));
      const cmF = show(panel(F, 110, 420, 860, 300, CYAN, "COMMENT"), M.P("F", 0) + 0.25);
      const inp = el(cmF, "left:40px;top:120px;width:780px;height:110px;border-radius:55px;border:1.5px solid rgba(150,175,215,.4);display:flex;align-items:center;padding:0 40px;font:600 60px var(--code);white-space:nowrap");
      const kwd = document.createElement("span"); kwd.style.color = ACC; kwd.textContent = "skill"; inp.appendChild(kwd);
      tl.set(kwd, { opacity: 0 }, 0); tl.to(kwd, { opacity: 1, duration: 0.2, immediateRender: false }, at("F", "skill", 1));
      M.arrow(F, { from: [540, 740], to: [540, 850], color: ACC, w: 12 }).show(M.P("F", 0) + 0.45, 0.3);
      const dmb = M.box(F, { x: 110, y: 860, w: 860, h: 260, label: "DM: SKILL", icon: "chat", color: GOOD, size: 56 }); dmb.show(M.P("F", 0) + 0.55); dmb.glow(at("F", "DM"), GOOD);
      M.fit(F, { y: 200, h: 1100, maxScale: 1.8 });

      M.wipe(M.S.B); M.wipe(M.S.C); M.wipe(M.S.D); M.wipe(M.S.E); M.wipe(M.S.F);
      M.finish({ kw: { files: "gold", pareshan: "hot", boring: "hot", anatomy: "gold", skill: "cyan", text: "hot", illustration: "gold", part: "cyan", npx: "gold", install: "gold", "/anatomy": "gold", comment: "cyan", follow: "gold", dm: "good" } });
      window.__timelines["main"] = tl;   // register (must stay literal for the linter)
    </script>
  </body>
</html>
