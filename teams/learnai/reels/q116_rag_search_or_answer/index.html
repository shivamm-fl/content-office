    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J"], tag: "AI ENGINEER INTERVIEW" });

      const { tl, S, P } = M; const { ACC, CYAN, HOT, GOOD, MUTED, TEXT, VIOLET } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH"), I = M.$("#sI"), J = M.$("#sJ");

      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };

      const show = (d, t, from, dur) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };

      show(el(chat, `right:30px;top:100px;padding:20px 30px;border-radius:28px 28px 6px 28px;background:#26324A;font:600 42px ${LAT};white-space:nowrap`, "Refund kab milega?"), 0.15, { opacity: 0, y: 12 });
      const botA = bubble(chat, 30, 250, 790, 120, `Refund <b style="color:${CYAN}">30 din</b> mein milega <span class="ok" style="color:${GOOD}">✓</span><span class="no" style="color:${HOT};margin-left:-.62em;opacity:0">✗</span>`, CYAN, at("A", "refund") - 0.1);
      const flipA = at("A", "galat");

      tl.to(botA, { borderColor: ca(HOT, 0.9), backgroundColor: ca(HOT, 0.12), duration: 0.25, immediateRender: false }, flipA);
      const sA = tileEl(A, 110, 1010, 410, 170, "SEARCH ?", CYAN, at("A", "diya") + 0.1, 46);
      const aA = tileEl(A, 560, 1010, 410, 170, "ANSWER ?", CYAN, at("A", "diya") + 0.25, 46);
      ring(sA, ACC, at("A", "kasur")); ring(aA, ACC, at("A", "kasur") + 0.15);
      M.fit(A, { y: 460, h: 840 });

      // ============ B: the question, how RAG works, retrieval vs generation, chunk ============
      // diagram: B
      const bq = M.box(B, { x: 100, y: 220, w: 560, h: 130, label: "QUESTION", icon: "user", color: CYAN, size: 46 }); bq.show(P("B", 0) + 0.05);
      const bs = M.box(B, { x: 100, y: 410, w: 560, h: 170, label: "SEARCH", icon: "search", color: ACC, size: 52 }); bs.show(P("B", 0) + 0.2);
      const ba = M.box(B, { x: 100, y: 900, w: 560, h: 170, label: "ANSWER", icon: "robot", color: GOOD, size: 52 }); ba.show(P("B", 0) + 0.35);
      const wb = bubble(B, 100, 1130, 560, 110, BAD, HOT, at("B", "galat") - 0.1);
      const ch = [0, 1, 2].map((i) => tileEl(B, 100 + i * 195, 690, 170, 110, "CHUNK", CYAN, at("B", "mila") + i * 0.12, 34));
      bs.glow(at("B", "retrieval"), HOT); ba.glow(at("B", "generation"), HOT);
      bs.unglow(at("B", "RAG", 1) - 0.2); ba.unglow(at("B", "RAG", 1) - 0.2);
      M.arrow(B, { from: [380, 355], to: [380, 405], color: CYAN, w: 9 }).show(at("B", "documents"), 0.3);
      bs.glow(at("B", "search"), ACC); bs.unglow(at("B", "mila") + 0.3);
      M.arrow(B, { from: [380, 585], to: [380, 685], color: ACC, w: 9 }).show(at("B", "mila") - 0.1, 0.3);
      M.arrow(B, { from: [380, 805], to: [380, 895], color: GOOD, w: 9 }).show(at("B", "likhta") - 0.3, 0.3);
      ba.glow(at("B", "likhta"), GOOD);
      M.arrow(B, { from: [380, 1075], to: [380, 1125], color: GOOD, w: 9 }).show(at("B", "likhta") + 0.3, 0.3);
      tag(B, "RETRIEVAL", 700, 470, 320, at("B", "retrieval", 1), ACC, 40);
      tag(B, "GENERATION", 700, 960, 320, at("B", "generation", 1), GOOD, 40);
      ring(ch[1], ACC, at("B", "chunk")); tl.to(ch[1], { scale: 1.12, duration: 0.3, ease: "power3.out", immediateRender: false }, at("B", "chunk"));
      M.fit(B, { y: 200, h: 1100 });

      // ============ C: look at the chunks, not the final answer; the fork; three steps ============
      // diagram: C
      const bc = bubble(C, 110, 230, 640, 120, BAD, HOT, P("C", 0) + 0.05);
      const skip = tag(C, "NOT THIS", 770, 262, 250, at("C", "mat"), HOT, 38);
      dim(bc, at("C", "mat"), 0.3);
      M.icon(C, "search", 70, 470, 120, ACC).show(at("C", "pehle"));
      const cc1 = tileEl(C, 230, 470, 230, 130, "CHUNK", CYAN, at("C", "chunks"), 40), cc2 = tileEl(C, 480, 470, 230, 130, "CHUNK", CYAN, at("C", "chunks") + 0.12, 40);
      const slot = show(el(C, `left:730px;top:470px;width:230px;height:130px;border-radius:24px;border:3px dashed ${ca(ACC, 0.9)};display:flex;align-items:center;justify-content:center;font:800 36px ${COD};color:${ACC}`, "RIGHT?"), at("C", "sahi"), { opacity: 0, y: 16 });
      const noX = M.icon(C, "cross", 785, 475, 110, HOT); noX.show(at("C", "nahi"));

      tl.set(slot, { borderStyle: "solid" }, at("C", "mila", 1));
      M.icon(C, "check", 800, 610, 70, GOOD).show(at("C", "mila", 1) + 0.1);
      dim(bc, at("C", "galat") - 0.2, 1); gone(skip, at("C", "galat") - 0.2);
      tl.to(bc, { borderColor: ca(HOT, 0.95), duration: 0.2, immediateRender: false }, at("C", "galat"));
      stamp(C, "GENERATION FAIL", 540, 800, HOT, at("C", "generation"), 52);

      const QS = [["Refund window?", 1], ["Shipping free?", 0], ["Gift card cash?", 0], ["Exchange time?", 1], ["Invoice copy?", 1], ["Cancel order?", 0]];
      const dRows = QS.map(([q, ok], i) => { const r = el(D, `left:80px;top:${300 + i * 112}px;width:920px;height:96px;border-radius:20px;border:2.5px solid ${ca(CYAN, 0.5)};background:${ca(CYAN, 0.07)}`);

      const OK6 = [1, 0, 1, 1, 1, 1];
      const cells = OK6.map((ok, i) => { const c = tileEl(F, 70 + i * 160, 330, 140, 140, "Q" + (i + 1), CYAN, at("F", "question") + i * 0.08, 44);
        const m = el(F, `left:${70 + i * 160}px;top:490px;width:140px;text-align:center;font:800 64px ${COD}`, mark(ok)); show(m, at("F", "aaya") + i * 0.1, { opacity: 0, scale: 0.7 });
        ring(c, ACC, at("F", "tay")); tl.to(c, { borderColor: ca(ok ? GOOD : HOT, 0.95), backgroundColor: ca(ok ? GOOD : HOT, 0.16), color: ok ? GOOD : HOT, duration: 0.25, immediateRender: false }, at("F", "aaya") + i * 0.1);

      const track = el(F, `left:110px;top:970px;width:860px;height:60px;border-radius:30px;background:${ca(CYAN, 0.12)}`); show(track, at("F", "5"), { opacity: 0 });
      const fillF = el(F, `left:110px;top:970px;width:717px;height:60px;border-radius:30px;background:${ca(GOOD, 0.85)};transform-origin:0 50%`);

      // diagram: G
      const g1 = glass(G, 60, 230, 960, 400, HOT); show(g1, P("G", 0) + 0.05, { opacity: 0, y: 16 });

      tileEl(g1, 36, 140, 280, 110, "Returns", CYAN, at("G", "Shipping") + 0.1, 40); tileEl(g1, 336, 140, 280, 110, "Gift cards", CYAN, at("G", "Shipping") + 0.2, 40);

      const ghost = show(el(g1, `left:676px;top:140px;width:250px;height:110px;border-radius:24px;border:3px dashed ${ca(ACC, 0.9)};display:flex;align-items:center;justify-content:center;font:800 36px ${COD};color:${ACC}`, "RIGHT"), at("G", "sahi"), { opacity: 0, y: 12 });

      const g2 = glass(G, 60, 670, 960, 400, ACC); show(g2, at("G", "Gift") - 0.2, { opacity: 0, y: 16 });
      el(g2, `left:36px;top:22px;font:700 46px ${LAT};white-space:nowrap`, "Gift card cash?");
      tag(g2, "TOP 2", 36, 92, 500, at("G", "Gift"), MUTED, 36); g2.lastChild.style.textAlign = "left";
