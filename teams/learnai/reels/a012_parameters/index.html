      const ca = M.ca; const LAT = "var(--lat)", COD = "var(--code)", PANEL = "#101A2E", GREY = "#8FA3C7";

      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };

      const show = (d, t, from, dur, op) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: op == null ? 1 : op, x: 0, y: 0, scale: 1, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, t); return d; };

        show(glass(gA, 90, y, 900, 340, col, 26), 0.05, { opacity: 0 }, 0.4);
        show(el(gA, `left:130px;top:${y + 24}px;font:800 110px ${COD};color:${col}`, lab), 0.1, { opacity: 0 });
        show(el(gA, `left:130px;top:${y + 160}px;font:600 34px ${COD};color:${GREY}`, fname + ".safetensors"), 0.15, { opacity: 0 });
        const cn = el(gA, `left:340px;top:${y + 40}px;width:600px;text-align:right;font:800 62px ${COD};color:${TEXT};white-space:nowrap`, "?"); show(cn, 0.2, { opacity: 0 });
        counter(cn, at("A", "arab", k), 1.0, target);
        NUMS.slice(0, 5).forEach((n, i) => show(el(gA, `left:${125 + i * 112}px;top:${y + 250}px;width:110px;text-align:center;font:700 33px ${COD};color:${n[0] === "−" ? "#FF8A9C" : GREY};white-space:nowrap`, n), 0.3 + i * 0.1 + k * 0.3, { opacity: 0, y: 8 }, 0.3));
        show(el(gA, `left:332px;top:${y + 28}px;width:616px;height:96px;box-sizing:border-box;border-radius:20px;border:4px solid ${ACC}`), at("A", "parameters"), { opacity: 0, scale: 1.04 }, 0.3);

      pillAt(gA, "B = BILLION", 90, 1310, at("A", "billion"), CYAN, 44);
      pillAt(gA, "PARAMETERS", 560, 1310, at("A", "parameters"), ACC, 44);

      // diagram: B
      head("B", B, "PARAMETER");
      const g1 = el(B, "left:0;top:0;width:1080px;height:1920px");
      show(glass(g1, 90, 340, 440, 360, CYAN, 26), S.B + 0.1, { opacity: 0 }, 0.4);
      show(el(g1, `left:90px;top:430px;width:440px;text-align:center;font:800 150px ${COD};color:${TEXT}`, "0.31"), S.B + 0.15, { opacity: 0 });
      show(el(g1, `left:84px;top:334px;width:452px;height:372px;box-sizing:border-box;border-radius:32px;border:5px solid ${ACC}`), at("B", "number"), { opacity: 0, scale: 1.04 }, 0.3);

      pillAt(g1, "WEIGHT", 650, 690, at("B", "weight", 0), ACC, 46);

      cell(g1, 90, 770, 440, 170, "+ 2", ACC, at("B", "bias", 0), 90, true);
      pillAt(g1, "BIAS", 580, 805, at("B", "bias", 0), ACC, 42, true);

      tl.to(bd.arm, { rotation: -70, duration: 0.6, ease: "power3.out", immediateRender: false }, at("B", "seekhti"));
      pillAt(g1, "TRAINING", 400, 985, at("B", "Training"), CYAN, 42);
      [250, 540, 830].forEach((cx, k) => { const dd = dial(g1, cx, 1160, 80, CYAN, -50 + k * 20); dd.all.forEach((d) => show(d, at("B", "Training") + 0.1, { opacity: 0 }, 0.4));
        tl.to(dd.arm, { rotation: [60, -70, 30][k], duration: 0.6, ease: "power3.out", immediateRender: false }, at("B", "seekhti") + 0.1 + k * 0.12); });
      gone(g1, at("B", "Google") - 0.15, 0.3);
      const NP = { i0: [130, 520], i1: [130, 680], i2: [130, 840], h0: [330, 460], h1: [330, 590], h2: [330, 720], h3: [330, 850], o: [530, 655] };
      const nEdges = [];
      ["i0", "i1", "i2"].forEach((a) => ["h0", "h1", "h2", "h3"].forEach((h) => nEdges.push([a, h]))); ["h0", "h1", "h2", "h3"].forEach((h) => nEdges.push([h, "o"]));

      pillAt(B, "GOOGLE EXAMPLE", 90, 345, at("B", "Google"), GREY, 40);

      Object.keys(NP).forEach((k) => nAll.push(show(circ(B, NP[k][0], NP[k][1], 44, k[0] === "i" ? GREY : CYAN, 0.3, 5), at("B", "Google"), { opacity: 0, scale: 0.9 }, 0.3)));
      nAll.push(show(el(B, `left:640px;top:560px;width:350px;text-align:center;font:800 200px ${COD};color:${ACC}`, "21"), at("B", "21"), { opacity: 0, scale: 0.9 }, 0.4));

      show(el(B, `left:90px;top:1020px;width:900px;height:270px;box-sizing:border-box;border-radius:18px;border:3px solid ${CYAN};background-color:${ca(CYAN, 0.12)};background-image:linear-gradient(${ca(CYAN, 0.6)} 1.5px, transparent 1.5px),linear-gradient(90deg,${ca(CYAN, 0.6)} 1.5px, transparent 1.5px);background-size:15px 15px`), at("B", "arbon") - 0.1, { opacity: 0, scale: 0.96 }, 0.5);
      pillAt(B, "BILLIONS", 380, 930, at("B", "arbon"), ACC, 48);

      // ============ C: the file is a list; bytes; 14 GB and 140 GB ============
      // diagram: C
      pillAt(C, "FILE SIZE", 70, 215, S.C + 0.05, CYAN, 40); pillAt(C, "WEIGHTS ONLY", 400, 218, at("C", "weights"), GREY, 36); pillAt(C, "EXAMPLE", 790, 222, S.C + 0.05, GREY, 36);
      show(glass(C, 90, 320, 900, 400, CYAN, 26), S.C + 0.1, { opacity: 0 }, 0.4);
      show(el(C, `left:130px;top:335px;font:700 38px ${COD};color:${TEXT};white-space:nowrap`, "model file"), S.C + 0.15, { opacity: 0 });
      NUMS.forEach((n, i) => { const cx = 118 + i * 142;

        pillAt(C, "2 B", cx + 6, 590, at("C", "2", 0) + i * 0.05, ACC, 36); });
      const cc = el(C, `left:110px;top:760px;height:90px;display:flex;gap:22px;align-items:center;font:800 62px ${COD};color:${TEXT};white-space:nowrap`);
      [["7B", at("C", "7"), CYAN], ["× 2 BYTES", at("C", "2", 1), ACC], ["= 14 GB", at("C", "14"), GOOD]].forEach(([h, t, col]) => { const s = document.createElement("span"); s.style.color = col; s.textContent = h; cc.appendChild(s); show(s, t, { opacity: 0, y: 12 }, 0.3); });
      const barC = (y, lab, w, col, t, size) => { show(el(C, `left:90px;top:${y}px;font:800 54px ${COD};color:${col}`, lab), S.C + 0.5, { opacity: 0 });
        const q = show(el(C, `left:300px;top:${y}px;width:690px;text-align:right;font:800 54px ${COD};color:${GREY}`, "? GB"), S.C + 0.5, { opacity: 0 }); q.setAttribute("data-layout-allow-overlap", ""); gone(q, t, 0.15);

        const b = el(D, `left:90px;top:${y + 80}px;width:${w0}px;height:84px;border-radius:14px;background:${col}`); tl.set(b, { opacity: 0 }, 0);
