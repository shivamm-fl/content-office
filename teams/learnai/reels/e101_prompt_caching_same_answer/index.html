<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Prompt caching se AI ka jawab badal jata hai?</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div><div class="beat" id="sB"></div><div class="beat" id="sC"></div><div class="beat" id="sD"></div><div class="beat" id="sE"></div><div class="beat" id="sF"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="45" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="45" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="45" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F"], tag: "WHAT'S NEW IN AI" });
      Viz.install(M);
      const { tl } = M; const at = (sc, w, n) => M.W(sc, w, n);
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF");
      const { ACC, CYAN, HOT, GOOD } = M;
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:26px;top:18px;font-size:34px;color:${col};text-align:left`; } return d; };
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const bubble = (host, x, y, w, col, lab, t, from) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:190px;border-radius:36px 36px 36px 8px;background:${M.ca(col, .14)};border:2.5px solid ${M.ca(col, .6)}`);
        el(d, "left:34px;top:18px;font:700 34px var(--lat);color:" + col, lab); el(d, "left:34px;top:84px;font:600 48px var(--lat);white-space:nowrap", "Paris is the capital."); return show(d, t, from); };

      M.hook(["Caching se", "jawab badla?"], { size: 96, top: 230 });
      // diagram: A
      bubble(A, 160, 520, 760, CYAN, "NO CACHE", 0, { opacity: 1 });
      bubble(A, 160, 860, 760, GOOD, "WITH CACHE", 0, { opacity: 1 });
      const eq = show(el(A, `left:430px;top:735px;width:220px;height:110px;border-radius:55px;background:#0E121E;border:2.5px solid ${ACC};font:800 76px var(--code);color:${ACC};text-align:center;line-height:104px`, '<span class="q">?</span>'), 0, { opacity: 1 });
      const eq2 = show(el(A, `left:430px;top:735px;width:220px;height:110px;border-radius:55px;background:${M.ca(GOOD, .2)};border:2.5px solid ${GOOD};font:800 76px var(--code);color:${GOOD};text-align:center;line-height:104px`, "="), at("A", "nahi"), { opacity: 0, scale: 0.9 });
      tl.set(eq, { opacity: 0 }, at("A", "nahi"));
      M.pill(A, "EXAMPLE", 0.6, { x: 400, y: 1130, kind: "out", size: 34 });
      M.fit(A, { y: 460, h: 840 });

      // diagram: B
      const pr = panel(B, 190, 230, 700, 210, CYAN, "PROMPT"); show(pr, M.P("B",0)+0.1);
      [0, 1, 2].forEach((i) => el(pr, `left:34px;top:${86 + i * 36}px;width:${i == 2 ? 360 : 620}px;height:16px;border-radius:8px;background:${M.ca(CYAN, .45)}`));
      const gear = M.box(B, { x: 290, y: 520, w: 500, h: 200, label: "PROCESS", sub: "once", icon: "gear", color: ACC }); gear.show(M.P("B",0)+0.5);
      M.arrow(B, { from: [540, 440], to: [540, 515], color: CYAN, w: 10 }).show(at("B", "process") - 0.5, 0.3);
      const cache = M.box(B, { x: 240, y: 830, w: 600, h: 200, label: "CACHE", sub: "reuse", icon: "db", color: CYAN }); cache.show(M.P("B",0)+0.9);
      M.arrow(B, { from: [540, 725], to: [540, 825], color: ACC, w: 10 }).show(at("B", "chuka"), 0.3);
      const st = el(B, `left:540px;top:775px;padding:8px 24px;border:2.5px solid ${GOOD};border-radius:12px;background:rgba(14,18,30,.95);font:700 36px var(--code);color:${GOOD};white-space:nowrap`, "PROCESSED"); gsap.set(st, { xPercent: -50 }); show(st, at("B", "chuka"), { opacity: 0, scale: 1.08 });
      const out = el(B, `left:240px;top:1120px;width:600px;height:140px;border-radius:30px;background:${M.ca(GOOD, .14)};border:2.5px solid ${GOOD};font:700 44px var(--lat);color:${GOOD};text-align:center;line-height:136px`, "SAME OUTPUT ✓"); show(out, M.P("B",0)+1.3);
      M.arrow(B, { from: [540, 1035], to: [540, 1115], color: GOOD, w: 10 }).show(at("B", "dobara"), 0.3);
      M.fit(B);

      // diagram: C
      [["BASE INPUT", "1x", 1.0, CYAN, "price"], ["5-MIN WRITE", "1.25x", 1.25, ACC, "125"], ["CACHE READ", "0.1x", 0.1, GOOD, "01"]].forEach(([lab, num, v, col, w], i) => {
        const y = 300 + i * 290; show(el(C, `left:140px;top:${y}px;font:700 40px var(--lat);color:${col}`, lab), M.P("C",0)+0.1+i*0.25);
        show(el(C, `left:140px;top:${y + 60}px;width:400px;height:110px;border-radius:14px;border:2px dashed ${M.ca(col, .4)}`), M.P("C",0)+0.2+i*0.25);
        const bar = el(C, `left:140px;top:${y + 60}px;width:${Math.round(v * 400)}px;height:110px;border-radius:14px;background:${M.ca(col, .85)};transform-origin:0 50%`);
        tl.set(bar, { scaleX: 0 }, 0); tl.to(bar, { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, at("C", w));
        show(el(C, `left:${140 + Math.round(v * 400) + 24}px;top:${y + 80}px;font:800 60px var(--code);color:${col}`, num), at("C", w) + 0.2); });
      M.pill(C, "MOST MODELS", 0.3, { x: 400, y: 1200, kind: "out", size: 34 });
      M.fit(C);

      // diagram: D
      const P0 = M.P("D", 0);
      const ring = el(D, `left:310px;top:220px;width:460px;height:460px;border-radius:50%;border:10px solid ${M.ca(CYAN, .7)}`); show(ring, P0 + 0.1);
      show(el(D, `left:310px;top:150px;width:460px;text-align:center;font:700 40px var(--code);color:${CYAN}`, "1 HOUR"), P0 + 0.1);
      const hand = el(D, `left:536px;top:260px;width:10px;height:190px;border-radius:5px;background:${ACC};transform-origin:50% 190px`);
      show(hand, P0 + 0.2); tl.fromTo(hand, { rotation: 0 }, { rotation: 324, duration: at("D", "compact") - at("D", "200K"), ease: "none", immediateRender: false }, at("D", "200K"));
      M.pill(D, "54 MIN IDLE", at("D", "54"), { x: 330, y: 720, kind: "acc", size: 50 });
      const big = el(D, `left:160px;top:830px;width:760px;height:400px;border-radius:24px;border:2.5px solid ${M.ca(CYAN, .6)};background:${M.ca(CYAN, .14)};transform-origin:50% 100%`); show(big, P0 + 0.3);
      const bt = [el(big, "left:0;right:0;top:140px;text-align:center;font:800 100px var(--code)", "200K"), el(big, `left:0;right:0;top:270px;text-align:center;font:700 48px var(--lat);color:${CYAN}`, "TOKENS")];
      tl.to(bt, { opacity: 0, duration: 0.2, immediateRender: false }, at("D", "compact") - 0.05);
      show(el(D, `left:0;width:1080px;top:1250px;text-align:center;font:700 44px var(--lat);color:${CYAN}`, "CLAUDE CODE · TERMINAL"), P0 + 0.5);
      tl.to(big, { scaleY: 0.25, borderColor: M.ca(GOOD, .9), backgroundColor: M.ca(GOOD, .18), duration: 0.6, ease: "power3.inOut", immediateRender: false }, at("D", "compact"));
      show(el(D, `left:0;width:1080px;top:1050px;text-align:center;font:800 56px var(--lat);color:${GOOD}`, "COMPACTED ✓"), at("D", "compact") + 0.4);
      M.fit(D);

      // diagram: E
      bubble(E, 160, 320, 760, CYAN, "NO CACHE", 0.05);
      bubble(E, 160, 650, 760, GOOD, "WITH CACHE", 0.05);
      show(el(E, `left:430px;top:540px;width:220px;height:90px;border-radius:45px;background:${M.ca(GOOD, .2)};border:2.5px solid ${GOOD};font:800 60px var(--code);color:${GOOD};text-align:center;line-height:86px`, "="), 0.1);
      show(el(E, `left:160px;top:900px;font:700 48px var(--lat);color:${ACC}`, "COST"), M.P("E",0)+0.3);
      const cb = el(E, `left:160px;top:970px;width:760px;height:100px;border-radius:14px;background:${M.ca(ACC, .85)};transform-origin:0 50%`);
      tl.set(cb, { scaleX: 0 }, 0); tl.to(cb, { scaleX: 1, duration: 0.3, immediateRender: false }, at("E", "cost"));
      tl.to(cb, { scaleX: 0.1, duration: 0.6, ease: "power3.inOut", immediateRender: false }, at("E", "badalti"));
      M.fit(E);

      // diagram: F
      const cc = panel(F, 120, 330, 840, 560, CYAN, "COMMENT KARO"); show(cc, M.P("F", 0));
      M.pill(cc, "5 MIN", at("F", "5"), { x: 190, y: 220, kind: "out", size: 40 });
      M.pill(cc, "1 HOUR", at("F", "hour"), { x: 470, y: 220, kind: "out", size: 40 });
      show(el(cc, "left:40px;right:40px;bottom:36px;height:76px;border-radius:38px;border:1.5px solid rgba(150,175,215,.35);font:600 38px var(--code);color:#E6ECFA;display:flex;align-items:center;padding:0 30px", "Add a comment..."), M.P("F", 0) + 0.4, { opacity: 0 });
      const fb = M.pill(F, "+  FOLLOW", at("F", "follow") - 0.4, { x: 400, y: 1035, kind: "acc", size: 36 });
      tl.fromTo(fb, { scale: 1 }, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, at("F", "follow"));
      M.fit(F);

      M.wipe(M.S.B); M.wipe(M.S.C); M.wipe(M.S.D); M.wipe(M.S.E); M.wipe(M.S.F);
      M.finish({ kw: { caching: "cyan", nahi: "good", identical: "good", price: "gold", cost: "gold", jawab: "good", compact: "cyan", follow: "gold" } });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
