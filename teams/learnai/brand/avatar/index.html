<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1080" /><title>Avatar</title>
<script src="gsap.min.js"></script>
<style>
@font-face { font-family: "Space Grotesk"; src: url("SpaceGrotesk.ttf"); font-weight: 300 700; }
* { margin:0; padding:0; box-sizing:border-box; } html, body { width:1080px; height:1080px; overflow:hidden; background:#0B1220; }
#root { position:relative; width:1080px; height:1080px; overflow:hidden;
  background: radial-gradient(circle at 50% 46%, rgba(242,181,68,.30) 0%, rgba(242,181,68,.08) 38%, rgba(11,18,32,0) 62%), radial-gradient(circle at 85% 90%, rgba(108,140,213,.25) 0%, rgba(11,18,32,0) 45%), #0B1220; }
#bit { position:absolute; left:170px; top:190px; width:740px; height:740px; }
svg { width:100%; height:100%; overflow:visible; }
#tag { position:absolute; left:0; right:0; bottom:118px; text-align:center; font-family:"Space Grotesk"; font-weight:700; font-size:62px; letter-spacing:.16em; color:#F3EFE6; }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1080">
  <div id="bit"><svg viewBox="-60 -40 420 380">
    <!-- waving arm (right side) -->
    <g id="arm"><path d="M250 215 C 300 205, 322 170, 318 120" fill="none" stroke="#F2B544" stroke-width="16" stroke-linecap="round"/>
      <circle cx="318" cy="104" r="26" fill="#F2B544"/>
      <path d="M306 88 l-4 -18 M318 84 l0 -20 M330 88 l5 -17" stroke="#F2B544" stroke-width="9" stroke-linecap="round"/></g>
    <!-- antenna -->
    <line x1="150" y1="48" x2="150" y2="10" stroke="#F2B544" stroke-width="9" stroke-linecap="round"/><circle cx="150" cy="4" r="15" fill="#F2B544"/>
    <!-- body -->
    <rect x="36" y="48" width="228" height="216" rx="96" fill="#131C2E" stroke="#F2B544" stroke-width="9"/>
    <rect x="62" y="88" width="176" height="122" rx="52" fill="#0B1220"/>
    <!-- left eye open, right eye wink -->
    <circle cx="112" cy="138" r="24" fill="#F3EFE6"/><circle cx="115" cy="140" r="11" fill="#0B1220"/><circle cx="119" cy="134" r="4" fill="#F3EFE6"/>
    <path d="M168 140 Q184 122 204 140" fill="none" stroke="#F3EFE6" stroke-width="9" stroke-linecap="round"/>
    <!-- big smile -->
    <path d="M108 176 Q150 214 192 176 Q150 192 108 176 Z" fill="#F2B544" stroke="#F2B544" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="80" cy="180" r="11" fill="#E5735F" opacity=".5"/><circle cx="220" cy="180" r="11" fill="#E5735F" opacity=".5"/>
    <!-- sparkles -->
    <path d="M-30 60 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z" fill="#F3EFE6" opacity=".9"/>
    <path d="M330 250 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z" fill="#F2B544"/>
  </svg></div>
</div>
<script>const tl = gsap.timeline({ paused: true }); tl.to("#bit", { rotation: 0, duration: 0.5 }, 0); window.__timelines["main"] = tl;</script>
</body></html>
