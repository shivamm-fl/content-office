<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LearnAI cover</title>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      :root { --bg: #0B1220; --text: #F3EFE6; --muted: #8FA0B8; --accent: #F2B544; }
      html, body { margin: 0; width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
      #root { position: relative; width: 1080px; height: 1920px; color: var(--text); font-family: "Space Grotesk", sans-serif; overflow: hidden;
        background: radial-gradient(circle at 50% 66%, rgba(242,181,68,.30) 0%, rgba(242,181,68,.09) 34%, rgba(11,18,32,0) 62%), radial-gradient(circle at 92% 96%, rgba(108,140,213,.22) 0%, rgba(11,18,32,0) 42%), var(--bg); }
      /* pill: filled gold, navy text */
      #pillrow { position: absolute; left: 0; right: 0; top: 190px; display: flex; justify-content: center; }
      #pill { padding: 20px 44px; border-radius: 999px; background: var(--accent); color: #0B1220; font-size: 40px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; white-space: nowrap; }
      /* headline: centred question, the last words in gold (wrap them in <em>) */
      #headline { position: absolute; left: 70px; right: 70px; top: 330px; height: 620px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 126px; line-height: 1.07; font-weight: 700; letter-spacing: -1px; }
      #headline div { max-width: 940px; }
      #headline em { font-style: normal; color: var(--accent); }
      /* mascot Bit (inline SVG, transparent) */
      #bit { position: absolute; left: 190px; top: 1000px; width: 700px; height: 640px; filter: drop-shadow(0 0 60px rgba(242,181,68,.35)); }
      #bit svg { width: 100%; height: 100%; overflow: visible; }
      #handle { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; color: var(--muted); font-size: 46px; font-weight: 500; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="pillrow"><div id="pill">AI ENGINEER ROADMAP &middot; 01</div></div>
      <div id="headline"><div>Your headline <em>goes here</em></div></div>
      <div id="bit"><svg viewBox="-60 -40 420 380">
        <g><path d="M250 215 C 300 205, 322 170, 318 120" fill="none" stroke="#F2B544" stroke-width="16" stroke-linecap="round"/>
          <circle cx="318" cy="104" r="26" fill="#F2B544"/>
          <path d="M306 88 l-4 -18 M318 84 l0 -20 M330 88 l5 -17" stroke="#F2B544" stroke-width="9" stroke-linecap="round"/></g>
        <line x1="150" y1="48" x2="150" y2="10" stroke="#F2B544" stroke-width="9" stroke-linecap="round"/><circle cx="150" cy="4" r="15" fill="#F2B544"/>
        <rect x="36" y="48" width="228" height="216" rx="96" fill="#131C2E" stroke="#F2B544" stroke-width="9"/>
        <rect x="62" y="88" width="176" height="122" rx="52" fill="#0B1220"/>
        <circle cx="112" cy="138" r="24" fill="#F3EFE6"/><circle cx="115" cy="140" r="11" fill="#0B1220"/><circle cx="119" cy="134" r="4" fill="#F3EFE6"/>
        <path d="M168 140 Q184 122 204 140" fill="none" stroke="#F3EFE6" stroke-width="9" stroke-linecap="round"/>
        <path d="M108 176 Q150 214 192 176 Q150 192 108 176 Z" fill="#F2B544" stroke="#F2B544" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="80" cy="180" r="11" fill="#E5735F" opacity=".5"/><circle cx="220" cy="180" r="11" fill="#E5735F" opacity=".5"/>
        <path d="M-30 60 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z" fill="#F3EFE6" opacity=".9"/>
        <path d="M330 250 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z" fill="#F2B544"/>
      </svg></div>
      <div id="handle">@ig.learnai</div>
    </div>
  </body>
</html>
