<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Rotate Array</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="131" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
        <div class="beat" id="sI"></div>
        <div class="beat" id="sJ"></div>
        <div class="beat" id="sK"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="131" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="131" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="131" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J","K"], tag: "DSA 020/150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M; const ST = M.S;
      const AMB = "#E9B44C", VIO = "#9A8CEB";
      const $s = (k) => M.$("#s" + k);
      const [A, B, C, D, E, F, G, H, I, J, K] = "ABCDEFGHIJK".split("").map($s);
      const cp = (sc, i) => REEL.hi.caps.filter((c) => c.scene === sc)[i].s;
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:16px;font-size:34px;color:${col}`; } return d; };
      const tile = (host, x, y, w, h, txt, col, fs) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px solid ${M.ca(col || CYAN, .55)};background:${M.ca(col || CYAN, .12)};font:700 ${fs || 38}px var(--code);display:flex;align-items:center;justify-content:center;white-space:nowrap`, txt);
      const lab = (host, css, txt, col, size) => el(host, css + `;font:700 ${size || 44}px var(--code);color:${col || "#B8C4DC"};text-align:center;white-space:nowrap`, txt);
      const counter = (host, css, from, segs, col, size, ts) => { const d = el(host, css + `;font:800 ${size || 96}px var(--code);color:${col};text-align:center;white-space:nowrap`, String(from)); const o = { v: from };
        show(d, ts == null ? segs[0][0] - 0.3 : ts, { opacity: 0 });
        segs.forEach(([t0, t1, to]) => tl.to(o, { v: to, duration: t1 - t0, ease: "power2.inOut", immediateRender: false, onUpdate: () => { d.textContent = Math.round(o.v).toLocaleString("en-US"); } }, t0));
        return d; };
      const ring = (d, t, col) => tl.to(d, { borderColor: col, backgroundColor: M.ca(col, .35), duration: 0.25, immediateRender: false }, t);
      const tint = (d, t, col, fill) => tl.to(d, { borderColor: M.ca(col, .9), backgroundColor: M.ca(col, fill == null ? .28 : fill), duration: 0.3, immediateRender: false }, t);
      const dim = (d, t, op) => tl.to(d, { opacity: op == null ? 0.15 : op, duration: 0.35, immediateRender: false }, t);
      const dimIn = (d, t, op) => { tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: op, duration: 0.4, immediateRender: false }, t); return d; };
      const lit = (d, t) => tl.to(d, { opacity: 1, duration: 0.35, immediateRender: false }, t);
      const hide = (d, t) => tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, t);
      const bigtxt = (host, css, txt, col, size, t) => show(lab(host, css, txt, col, size), t, { opacity: 0 });
      const ghost = (host, x, y, w, h) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px dashed rgba(150,175,215,.35)`);
      const chip = (host, x, y, w, h, txt, col, t, fs) => show(tile(host, x, y, w, h, txt, col, fs || 56), t, { opacity: 0, y: 18 });
      const base = (sc, h) => { const p = panel(sc, 60, 230, 960, h || 1010, CYAN, null); show(p, ST[sc.id.slice(1)] + 0.05); return p; };
      // a lit tile: dim from the start, lit on its word
      const lt = (host, x, y, w, h, txt, col, fs, t, s0) => { const d = tile(host, x, y, w, h, txt, col, fs); dimIn(d, s0 + 0.1, 0.5); lit(d, t); return d; };

      const CX = (i) => 24 + i * 92;
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const code = (host, x, y, w, lines, fs, lh, s0) => {
        const h = lines.length * lh + 36;
        show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:16px;background:rgba(8,13,26,.9);border:2px solid ${M.ca(CYAN, .35)}`), s0 + 0.1);
        const Ls = lines.map((s, i) => show(el(host, `left:${x + 10}px;top:${y + 18 + i * lh}px;width:${w - 20}px;height:${lh}px;border-radius:8px;font:500 ${fs}px/${lh}px var(--code);color:#9FB0CC;white-space:pre;padding-left:12px;box-sizing:border-box`, esc(s)), s0 + 0.15, { opacity: 0 }));
        const on = (a, b, t) => { for (let i = a; i <= b; i++) tl.to(Ls[i], { backgroundColor: M.ca(ACC, .25), color: "#FFFFFF", duration: 0.3, immediateRender: false }, t); };
        const off = (a, b, t) => { for (let i = a; i <= b; i++) tl.to(Ls[i], { backgroundColor: "rgba(233,180,76,0)", color: "#9FB0CC", duration: 0.3, immediateRender: false }, t); };
        return { on, off, h }; };
      const seqTile = (host, x, y, w, h, col, fs, seq) => seq.map(([txt, t], k) => { const d = tile(host, x, y, w, h, txt, col, fs); show(d, t, { opacity: 0, scale: k ? 1.06 : 1 });
        const nt = seq[k + 1]; if (nt) tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, nt[1]); return d; });

      const GREY = "#B8C4DC", DIMC = "#5C6B88";
      // swap: one tile slot whose text changes; items [txt, colour, time]
      const swap = (host, x, y, w, h, fs, items) => items.map(([txt, col, t], k) => { const d = tile(host, x, y, w, h, txt, col, fs); show(d, t, { opacity: 0, scale: k ? 1.06 : 1 });
        const nt = items[k + 1]; if (nt) tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, nt[2]); return d; });
      // ring that moves between cells
      const mkRing = (host, x, y, w, h, t) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:18px;border:5px solid ${ACC};box-sizing:border-box`);
        tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: 1, duration: 0.3, immediateRender: false }, t); return d; };
      const hop = (d, x, y, t, dur) => tl.to(d, { left: x, top: y, duration: dur || 0.35, ease: "power2.inOut", immediateRender: false }, t);      const V = [1, 2, 3, 4, 5, 6, 7], R = [5, 6, 7, 1, 2, 3, 4], REV = [7, 6, 5, 4, 3, 2, 1], MID = [5, 6, 7, 4, 3, 2, 1];
      const AX = (i) => 24 + i * 134;
      const vc = (v) => (v >= 5 ? AMB : CYAN);
      // row of 7 cells; col = "val" (amber for 5,6,7) or a colour; times = per-cell lit times
      const row7v = (host, arr, y, h, fs, s0, times, col) => arr.map((v, i) => { ghost(host, AX(i), y, 124, h); const c = col || vc(v);
        if (times) return lt(host, AX(i), y, 124, h, String(v), c, fs, times[i], s0);
        return show(tile(host, AX(i), y, 124, h, String(v), c, fs), s0 + 0.05, { opacity: 0 }); });
      const bar = (host, x, y, w, hh, col, t, tOut) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${hh}px;border-radius:4px;background:${col}`);
        tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: 1, duration: 0.3, immediateRender: false }, t); if (tOut != null) tl.to(d, { opacity: 0, duration: 0.25, immediateRender: false }, tOut); return d; };
      const arc = (host, a, b, hh, y, col, t, tOut) => { const d = el(host, `left:${AX(a) + 62}px;top:${y}px;width:${AX(b) - AX(a)}px;height:${hh}px;border:8px solid ${col};border-top:none;border-radius:0 0 60px 60px;box-sizing:border-box`);
        tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: 1, duration: 0.3, immediateRender: false }, t); if (tOut != null) tl.to(d, { opacity: 0, duration: 0.25, immediateRender: false }, tOut); return d; };

      // diagram: A
      // ===== A: hook, rotate right by k, in the same array
      M.hook(["ROTATE ARRAY", "IN PLACE"], { size: 88, top: 250 });
      const pa = panel(A, 60, 500, 960, 780, CYAN, null); show(pa, 0.02);
      bigtxt(pa, "left:0;width:960px;top:12px", "GIVEN ARRAY", GREY, 40, 0.1);
      const aR = row7v(pa, V, 150, 110, 60, 0, null, CYAN);
      [4, 5, 6].forEach((i) => tint(aR[i], cp("A", 22), AMB, 0.4));
      [[4, 0], [5, 1], [6, 2]].forEach(([f, t], k) => { arc(pa, t, f, 60, 82, AMB, cp("A", 23) + k * 0.15).style.transform = "scaleY(-1)"; });
      lt(pa, 24, 280, 300, 80, "k = 3", ACC, 50, cp("A", 12), 0);
      lt(pa, 350, 280, 590, 80, "LAST 3 TO FRONT", AMB, 44, cp("A", 22), 0);
      bigtxt(pa, "left:0;width:960px;top:385px", "RESULT", GREY, 40, cp("A", 23));
      row7v(pa, R, 440, 110, 60, 0, R.map((v, i) => cp("A", 23) + 0.15 + i * 0.12));
      lt(pa, 24, 590, 440, 90, "SAME ARRAY", GOOD, 46, cp("A", 29), 0);
      lt(pa, 498, 590, 440, 90, "NO RETURN", CYAN, 46, cp("A", 34), 0);
      M.fit(A, { y: 460, h: 840 });

      // diagram: B
      // ===== B: given array, k, result
      const b0 = ST.B; const pb = base(B, 800);
      bigtxt(pb, "left:0;width:960px;top:14px", "GIVEN ARRAY", GREY, 44, cp("B", 0));
      M.pill(pb, "EXAMPLE", cp("B", 0) + 0.2, { x: 690, y: 12, w: 250, kind: "out", size: 30 });
      row7v(pb, V, 80, 130, 68, b0, [2, 3, 4, 5, 6, 7, 8].map((k) => cp("B", k)), CYAN);
      lt(pb, 24, 250, 300, 100, "k = 3", ACC, 60, cp("B", 12), b0);
      lt(pb, 350, 250, 590, 100, "LAST 3 TO FRONT", AMB, 44, cp("B", 15), b0);
      bigtxt(pb, "left:0;width:960px;top:390px", "RESULT", GREY, 44, cp("B", 14));
      row7v(pb, R, 450, 130, 68, b0, [15, 16, 17, 18, 19, 20, 21].map((k) => cp("B", k)));
      M.fit(B, { y: 200, h: 1100 });

      // diagram: C
      // ===== C: the slice line builds a new list, the name moves, the caller's array is unchanged
      const c0 = ST.C; const pc = base(C, 960);
      const cc = code(pc, 24, 20, 916, ["nums = nums[-k:] + nums[:-k]"], 44, 76, c0);
      cc.on(0, 0, cp("C", 3)); cc.off(0, 0, cp("C", 24));
      const CXr = (i) => 190 + i * 108;
      const rowC = (y, arr, times, col) => arr.map((v, i) => { ghost(pc, CXr(i), y, 104, 100); return times ? lt(pc, CXr(i), y, 104, 100, String(v), vc(v), 54, times[i], c0) : show(tile(pc, CXr(i), y, 104, 100, String(v), vc(v), 54), c0 + 0.05, { opacity: 0 }); });
      bigtxt(pc, "left:190px;width:756px;top:150px;text-align:left", "CALLER ARRAY", GREY, 40, c0 + 0.2);
      const cOld = rowC(205, V, null);
      bigtxt(pc, "left:190px;width:756px;top:400px;text-align:left", "NEW LIST", GREY, 40, cp("C", 8));
      rowC(455, R, R.map((v, i) => cp("C", 9) + i * 0.1));
      const tag = lt(pc, 10, 220, 176, 76, "nums >", ACC, 42, c0 + 0.2, c0);
      hop(tag, 14, 470, cp("C", 18));
      bigtxt(pc, "left:0;width:960px;top:620px", "CALLER ARRAY AFTER CALL", GREY, 40, cp("C", 28));
      [0, 1, 2, 3, 4, 5, 6].forEach((i) => lt(pc, CXr(i), 720, 104, 100, String(V[i]), vc(V[i]), 54, cp("C", 32) + i * 0.05, c0));
      lt(pc, 24, 840, 916, 100, "NOT CHANGED", HOT, 70, cp("C", 36), c0);
      M.fit(C, { y: 200, h: 1100 });

      // diagram: D
      // ===== D: one step at a time costs k x n, a copy costs n cells
      const d0 = ST.D; const pd = base(D, 1000);
      const DX = (i) => 190 + i * 108;
      const rowS = (y, arr, t, lab) => { bigtxt(pd, `left:14px;width:170px;top:${y + 22}px`, lab, GREY, 40, t);
        arr.forEach((v, i) => { ghost(pd, DX(i), y, 104, 96); lt(pd, DX(i), y, 104, 96, String(v), vc(v), 54, t, d0); }); };
      rowS(30, V, cp("D", 0), "START"); rowS(150, [7, 1, 2, 3, 4, 5, 6], cp("D", 2), "+1"); rowS(270, [6, 7, 1, 2, 3, 4, 5], cp("D", 6), "+2"); rowS(390, R, cp("D", 8), "+3");
      lt(pd, 24, 520, 916, 90, "EACH STEP: n MOVES", CYAN, 50, cp("D", 9), d0);
      lt(pd, 24, 630, 916, 100, "k x n  =  3 x 7  MOVES", HOT, 56, cp("D", 14), d0);
      bigtxt(pd, "left:24px;width:500px;top:760px;text-align:left", "NEW LIST", GREY, 40, cp("D", 18));
      R.forEach((v, i) => lt(pd, 24 + i * 90, 815, 82, 82, String(v), vc(v), 42, cp("D", 19) + i * 0.08, d0));
      lt(pd, 24, 915, 916, 80, "O(n) SPACE", HOT, 54, cp("D", 24), d0);
      M.fit(D, { y: 200, h: 1100 });

      // diagram: E
      // ===== E: reverse all, then reverse each part
      const e0 = ST.E; const pe = base(E, 940);
      bigtxt(pe, "left:24px;width:500px;top:6px;text-align:left", "START", GREY, 36, e0 + 0.1);
      row7v(pe, V, 50, 100, 56, e0, null);
      bar(pe, AX(4), 160, 392, 8, AMB, cp("E", 9));
      lt(pe, 24, 190, 916, 70, "REVERSE ALL", CYAN, 48, cp("E", 6), e0);
      row7v(pe, REV, 280, 100, 56, e0, REV.map((v, i) => cp("E", 7) + i * 0.08));
      bar(pe, AX(0), 392, 392, 8, AMB, cp("E", 12));
      lt(pe, 24, 410, 520, 70, "LAST 3 NOW FRONT", AMB, 40, cp("E", 12), e0);
      lt(pe, 560, 410, 380, 70, "BACKWARDS", HOT, 44, cp("E", 17), e0);
      lt(pe, 24, 520, 916, 70, "REVERSE EACH PART", VIO, 48, cp("E", 26), e0);
      bar(pe, 24, 612, 392, 8, AMB, cp("E", 21)); bar(pe, 442, 612, 510, 8, VIO, cp("E", 22));
      row7v(pe, R, 635, 100, 56, e0, R.map((v, i) => cp("E", 28) + i * 0.1));
      lt(pe, 24, 770, 916, 90, "ORDER FIXED", GOOD, 56, cp("E", 29), e0);
      M.fit(E, { y: 200, h: 1100 });

      // diagram: F
      // ===== F: the three steps, each with its array
      const f0 = ST.F; const pf = base(F, 1020);
      const FXs = (i) => 44 + i * 118;
      const fcard = (y, n, col, k) => { lt(pf, 24, y, 916, 260, "", col, 30, cp("F", k), f0); bigtxt(pf, `left:40px;width:200px;top:${y + 12}px;text-align:left`, "STEP " + n, GREY, 36, cp("F", k)); };
      fcard(20, 1, CYAN, 0);
      lt(pf, 44, 105, 330, 100, "k = k % n", ACC, 48, cp("F", 2), f0); lt(pf, 400, 105, 520, 100, "n TURNS = SAME", GREY, 42, cp("F", 8), f0);
      fcard(300, 2, VIO, 18);
      bigtxt(pf, "left:250px;width:600px;top:312px;text-align:left", "WHOLE ARRAY", VIO, 36, cp("F", 20));
      V.forEach((v, i) => lt(pf, FXs(i), 390, 106, 100, String(v), VIO, 54, cp("F", 21) + i * 0.05, f0));
      fcard(580, 3, GOOD, 24);
      bigtxt(pf, "left:250px;width:300px;top:592px;text-align:left", "FIRST k", AMB, 36, cp("F", 26));
      bigtxt(pf, "left:520px;width:400px;top:592px;text-align:left", "LAST n - k", VIO, 36, cp("F", 33));
      REV.forEach((v, i) => lt(pf, FXs(i), 670, 106, 100, String(v), i < 3 ? AMB : VIO, 54, i < 3 ? cp("F", 27) + i * 0.1 : cp("F", 34) + i * 0.1, f0));
      M.fit(F, { y: 200, h: 1100 });

      // diagram: G
      // ===== G: dry run, one row that changes three times, swap arcs under it
      const g0 = ST.G; const pg = base(G, 760);
      bigtxt(pg, "left:0;width:960px;top:12px", "DRY RUN   k = 3", GREY, 40, g0 + 0.1);
      const gT = [cp("G", 7) - 0.3, cp("G", 20) - 0.3, cp("G", 34) - 0.3];
      V.forEach((v, i) => { ghost(pg, AX(i), 100, 124, 130);
        swap(pg, AX(i), 100, 124, 130, 68, [[String(V[i]), vc(V[i]), g0 + 0.1], [String(REV[i]), vc(REV[i]), gT[0]], [String(MID[i]), vc(MID[i]), gT[1]], [String(R[i]), vc(R[i]), gT[2]]]); });
      bar(pg, 24, 82, 912, 8, CYAN, cp("G", 4) - 0.2, cp("G", 14));
      bar(pg, 24, 82, 392, 8, AMB, cp("G", 16) - 0.2, cp("G", 27));
      bar(pg, 442, 82, 510, 8, VIO, cp("G", 29) - 0.2, cp("G", 41));
      arc(pg, 0, 6, 190, 236, CYAN, cp("G", 4), cp("G", 14)); arc(pg, 1, 5, 130, 236, CYAN, cp("G", 4) + 0.2, cp("G", 14)); arc(pg, 2, 4, 70, 236, CYAN, cp("G", 4) + 0.4, cp("G", 14));
      arc(pg, 0, 2, 90, 236, AMB, cp("G", 17), cp("G", 27));
      arc(pg, 3, 6, 130, 236, VIO, cp("G", 31), cp("G", 41)); arc(pg, 4, 5, 70, 236, VIO, cp("G", 31) + 0.2, cp("G", 41));
      swap(pg, 24, 460, 916, 90, 44, [["REVERSE ALL", CYAN, cp("G", 3)], ["REVERSE FIRST 3", AMB, cp("G", 14)], ["REVERSE LAST 4", VIO, cp("G", 27)]]);
      lt(pg, 24, 590, 916, 110, "ANSWER", GOOD, 70, cp("G", 42), g0);
      M.fit(G, { y: 200, h: 1100 });

      // diagram: H
      // ===== H: the code, run (two chunks, large type)
