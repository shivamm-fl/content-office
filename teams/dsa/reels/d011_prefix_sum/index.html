<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Prefix sum: range queries O(1) mein</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="141" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
                <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
        <div class="beat" id="sI"></div>
        <div class="beat" id="sJ"></div>
        <div class="beat" id="sK"></div>
        <div class="beat" id="sL"></div>
        </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="141" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="141" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="141" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J","K","L"], tag: "DSA 011/150" });
      Viz.install(M);
      const { tl } = M; const at = (sc, w, n) => M.W(sc, w, n); const { ACC, CYAN, HOT, GOOD } = M; const ST = M.S;
      const $s = (k) => M.$("#s" + k);
      const A = $s("A"), B = $s("B"), C = $s("C"), D = $s("D"), E = $s("E"), F = $s("F"), G = $s("G"), H = $s("H"), I = $s("I"), J = $s("J"), K = $s("K"), L = $s("L");
      const cp = (sc, i) => REEL.hi.caps.filter((c) => c.scene === sc)[i].s;
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:16px;font-size:34px;color:${col}`; } return d; };
      const tile = (host, x, y, w, h, txt, col, fs) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px solid ${M.ca(col || CYAN, .55)};background:${M.ca(col || CYAN, .12)};font:700 ${fs || 38}px var(--code);display:flex;align-items:center;justify-content:center;white-space:nowrap`, txt);
      const stamp = (host, txt, x, y, col, t) => { const d = el(host, `left:${x}px;top:${y}px;padding:12px 30px;border:3px solid ${col};border-radius:12px;background:rgba(14,18,30,.96);font:700 52px var(--code);color:${col};white-space:nowrap`, txt);
        gsap.set(d, { xPercent: -50 }); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const lab = (host, css, txt, col, size) => el(host, css + `;font:700 ${size || 44}px var(--code);color:${col || "#B8C4DC"};text-align:center;white-space:nowrap`, txt);
      const counter = (host, css, from, segs, col, size, ts) => { const d = el(host, css + `;font:800 ${size || 96}px var(--code);color:${col};text-align:center;white-space:nowrap`, String(from)); const o = { v: from };
        show(d, ts == null ? segs[0][0] - 0.3 : ts, { opacity: 0 });
        segs.forEach(([t0, t1, to]) => tl.to(o, { v: to, duration: t1 - t0, ease: "power2.inOut", immediateRender: false, onUpdate: () => { d.textContent = Math.round(o.v).toLocaleString("en-US"); } }, t0));
        return d; };
      const ring = (d, t, col) => tl.to(d, { borderColor: col, backgroundColor: M.ca(col, .35), duration: 0.25, immediateRender: false }, t);
      const dim = (d, t, op) => tl.to(d, { opacity: op == null ? 0.15 : op, duration: 0.35, immediateRender: false }, t);
      const dimIn = (d, t, op) => { tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: op, duration: 0.4, immediateRender: false }, t); return d; };
      const lit = (d, t) => tl.to(d, { opacity: 1, duration: 0.35, immediateRender: false }, t);
      const hide = (d, t) => tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, t);
      const drop = (d, t, fx, fy) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, { opacity: 0, x: fx, y: fy }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "power3.inOut", immediateRender: false }, t); return d; };
      const bigtxt = (host, css, txt, col, size, t) => show(lab(host, css, txt, col, size), t, { opacity: 0 });
      const AV = [3, 1, 4, 1, 5, 9], PV = [0, 3, 4, 8, 9, 14, 23];
      const ghost = (host, x, y, w, h) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px dashed rgba(150,175,215,.35)`);
      const AX = (i) => 87 + i * 134, PX = (j) => 20 + j * 134;
      // array row: ghosts always there, value tiles land at times[i]
      const arrRow = (host, ya, times, lbl) => {
        if (lbl) bigtxt(host, `left:20px;width:240px;top:${ya - 58}px`, "ARRAY", CYAN, 38, Math.max(0.05, times[0] - 0.3)).style.textAlign = "left";
        const ix = AV.map((v, i) => { const l = lab(host, `left:${AX(i)}px;width:124px;top:${ya + 104}px`, i, "#8FA0BE", 36); return show(l, Math.max(0.05, times[0] - 0.3), { opacity: 0 }); });
        AV.forEach((v, i) => ghost(host, AX(i), ya, 124, 100));
        const c = AV.map((v, i) => show(tile(host, AX(i), ya, 124, 100, v, CYAN, 56), times[i], { opacity: 0, y: 18 }));
        return { c, ix };
      };
      const preRow = (host, yp, times, lbl) => {
        if (lbl) bigtxt(host, `left:20px;width:240px;top:${yp - 58}px`, "PREFIX", ACC, 38, 0.3).style.textAlign = "left";
        const ix = PV.map((v, j) => { const l = lab(host, `left:${PX(j)}px;width:124px;top:${yp + 104}px`, j, "#8FA0BE", 36); return show(l, 0.3, { opacity: 0 }); });
        PV.forEach((v, j) => ghost(host, PX(j), yp, 124, 100));
        const p = PV.map((v, j) => times[j] == null ? null : show(tile(host, PX(j), yp, 124, 100, v, ACC, 56), times[j], { opacity: 0, y: 18 }));
        return { p, ix };
      };
      const brk = (host, i0, i1, y, col, t, text) => {
        const b = el(host, `left:${AX(i0)}px;top:${y}px;width:${(i1 - i0) * 134 + 124}px;height:12px;border-radius:6px;background:${col}`);
        show(b, t, { opacity: 0, scaleX: 0.3 });
        if (text) show(lab(host, `left:${AX(i0)}px;width:${(i1 - i0) * 134 + 124}px;top:${y - 56}px`, text, col, 40), t, { opacity: 0 });
        return b;
      };
      const stepRow = (host, y, on) => [1, 2, 3].map((k, i) => { const d = tile(host, 20 + i * 320, y, 280, 90, "STEP " + k, k === on ? ACC : CYAN, 44); return d; });
      const chipRow = (host, y, items, col) => items.map(([x, w, txt, c]) => tile(host, x, y, w, 100, txt, c || col, 56));

      // diagram: A  (hook: array, a range, no loop)
      M.hook(["INTERVIEWER:", "Range sum, no loop?"], { size: 80, top: 250 });
      const pa = panel(A, 60, 500, 960, 790, CYAN, null); show(pa, 0.02);
      arrRow(pa, 230, AV.map((v, i) => 0.02 + i * 0.05), true);
      brk(pa, 2, 4, 190, ACC, cp("A", 5), "RANGE");
      const aS = tile(pa, 220, 440, 520, 120, "SUM = ?", ACC, 64); dimIn(aS, 0.1, 0.3); lit(aS, cp("A", 8));
      const aN = tile(pa, 220, 600, 520, 120, "NO LOOP", HOT, 60); dimIn(aN, 0.1, 0.25); lit(aN, cp("A", 13));
      M.fit(A, { y: 460, h: 840 });

      // diagram: B  (answer: running total row, then one subtraction)
      const b0 = ST.B;
      const pb = panel(B, 60, 230, 960, 1010, CYAN, null); show(pb, b0 + 0.05);
      const bAr = arrRow(pb, 130, AV.map((v, i) => b0 + 0.1 + i * 0.06), true);
      const bT = PV.map((v, j) => cp("B", 9) + j * ((cp("B", 12) - cp("B", 9)) / 6));
      const bPr = preRow(pb, 440, bT, true);
      brk(pb, 2, 4, 90, ACC, cp("B", 16), null);
      ring(bPr.p[5], cp("B", 20), ACC); ring(bPr.p[2], cp("B", 20), ACC);
      const bS = tile(pb, 20, 700, 920, 150, "1 SUBTRACTION", GOOD, 64); dimIn(bS, b0 + 0.1, 0.25); lit(bS, cp("B", 21));
      M.fit(B, { y: 200, h: 1100 });

      // diagram: C  (the array, the query, the loop: 4 + 1 + 5 = 10)
      const c0 = ST.C;
      const pc = panel(C, 60, 230, 960, 1010, CYAN, null); show(pc, c0 + 0.05);
      const cAr = arrRow(pc, 150, [2, 3, 4, 5, 6, 7].map((i) => cp("C", i)), true);
      [2, 3, 4].forEach((i) => ring(cAr.c[i], cp("C", 11 + (i - 2)), ACC));
      brk(pc, 2, 4, 110, ACC, cp("C", 13), "QUERY");
      bigtxt(pc, "left:20px;width:920px;top:350px", "LOOP", CYAN, 44, cp("C", 17));
      const cR = chipRow(pc, 410, [[10, 110, 4, ACC], [130, 90, "+", CYAN], [230, 110, 1, ACC], [350, 90, "+", CYAN], [450, 110, 5, ACC], [570, 90, "=", CYAN], [670, 270, 10, GOOD]], CYAN);
      [19, 20, 21, 22, 23, 24, 25].forEach((t, k) => show(cR[k], cp("C", t), { opacity: 0, y: 18 }));
      [2, 3, 4].forEach((i) => ring(cAr.c[i], cp("C", 25), GOOD));
      const cO = tile(pc, 20, 640, 920, 120, "1 QUERY: OK", GOOD, 54); dimIn(cO, c0 + 0.1, 0.2); lit(cO, cp("C", 28));
      M.fit(C, { y: 200, h: 1100 });

      // diagram: D  (1 lakh queries each re-scan the array: 10 arab additions)
      const d0 = ST.D;
      const pd = panel(D, 60, 230, 960, 1010, CYAN, null); show(pd, d0 + 0.05);
      const dN = tile(pd, 20, 20, 920, 90, "100,000 NUMBERS", CYAN, 46); dimIn(dN, d0 + 0.1, 0.3); lit(dN, cp("D", 3));
      const dQ = tile(pd, 20, 125, 920, 90, "100,000 QUERIES", ACC, 46); dimIn(dQ, d0 + 0.1, 0.3); lit(dQ, cp("D", 8));
      const dRows = ["Q1", "Q2", "Q3", "Q4", "Q100,000"].map((q, k) => {
        const y = 245 + k * 95;
        el(pd, `left:20px;top:${y}px;width:920px;height:66px;border-radius:12px;border:2px dashed rgba(150,175,215,.3)`);
        const l = lab(pd, `left:30px;top:${y + 8}px;width:210px;text-align:left`, q, "#B8C4DC", 38); l.style.textAlign = "left";
        const b = el(pd, `left:250px;top:${y + 8}px;width:680px;height:50px;border-radius:8px;background:${M.ca(CYAN, .5)};transform-origin:0 50%`);
        tl.set(b, { scaleX: 0 }, 0);
        tl.to(b, { scaleX: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, cp("D", 12) + k * 0.7);
        tl.to(b, { backgroundColor: M.ca(HOT, .55), duration: 0.3, immediateRender: false }, cp("D", 31) + k * 0.12);
        return b; });
      bigtxt(pd, "left:20px;width:920px;top:725px", "SAME ADDS AGAIN", HOT, 44, cp("D", 31));
      bigtxt(pd, "left:20px;width:920px;top:790px", "ADDITIONS", CYAN, 40, cp("D", 18));
      counter(pd, "left:20px;width:920px;top:840px", 0, [[cp("D", 18), cp("D", 21) + 0.4, 10000000000]], HOT, 96, cp("D", 17));
      M.pill(pd, "EXAMPLE", cp("D", 18), { x: 690, y: 960, w: 250, kind: "out", size: 30 });
      M.fit(D, { y: 200, h: 1100 });

      // diagram: E  (step 1: the prefix array; prefix[i] = first i elements; starts at 0)
      const e0 = ST.E;
      const pe = panel(E, 60, 230, 960, 1010, CYAN, null); show(pe, e0 + 0.05);
      const eSt = stepRow(pe, 20, 1); eSt.forEach((d, i) => { dimIn(d, e0 + 0.1, i === 0 ? 0.3 : 0.3); }); lit(eSt[0], cp("E", 5)); ring(eSt[0], cp("E", 5), ACC);
      arrRow(pe, 240, AV.map((v, i) => e0 + 0.1 + i * 0.06), true);
      const ePr = preRow(pe, 520, [cp("E", 26), null, null, null, null, null, null], true);
      brk(pe, 0, 2, 222, ACC, cp("E", 17), "FIRST i");
      bigtxt(pe, "left:20px;width:920px;top:740px", "prefix[i]", ACC, 64, cp("E", 13));
      ring(ePr.p[0], cp("E", 27), GOOD);
      bigtxt(pe, "left:20px;width:920px;top:850px", "EMPTY = 0", GOOD, 54, cp("E", 31));
      M.fit(E, { y: 200, h: 1100 });

      // diagram: F  (step 2: one pass, the running total; last value is the whole sum; O(n))
      const f0 = ST.F;
      const pf = panel(F, 60, 230, 960, 1010, CYAN, null); show(pf, f0 + 0.05);
      const fSt = stepRow(pf, 20, 2); fSt.forEach((d) => dimIn(d, f0 + 0.1, 0.3)); lit(fSt[1], f0 + 0.7); ring(fSt[1], f0 + 0.7, ACC);
      const fA = arrRow(pf, 240, AV.map((v, i) => f0 + 0.1 + i * 0.06), true);
      const fT = [16, 17, 18, 19, 20, 21, 22].map((i) => cp("F", i));
      const fPr = preRow(pf, 520, fT, true);
      AV.forEach((v, i) => { ring(fA.c[i], fT[i + 1], ACC); tl.to(fA.c[i], { borderColor: M.ca(CYAN, .55), backgroundColor: M.ca(CYAN, .12), duration: 0.25, immediateRender: false }, fT[i + 1] + 0.4); });
      bigtxt(pf, "left:20px;width:920px;top:770px", "PREV + CURRENT", ACC, 54, cp("F", 11));
      ring(fPr.p[6], cp("F", 25), GOOD);
      bigtxt(pf, "left:560px;width:380px;top:672px", "WHOLE SUM", GOOD, 40, cp("F", 26));
      const fB = tile(pf, 20, 870, 920, 120, "BUILD: O(n)", GOOD, 58); dimIn(fB, f0 + 0.1, 0.25); lit(fB, cp("F", 38));
      M.fit(F, { y: 200, h: 1100 });

      // diagram: G  (step 3: the formula)
      const g0 = ST.G;
      const pg = panel(G, 60, 230, 960, 1010, CYAN, null); show(pg, g0 + 0.05);
      const gSt = stepRow(pg, 20, 3); gSt.forEach((d) => dimIn(d, g0 + 0.1, 0.3)); lit(gSt[2], g0 + 0.7); ring(gSt[2], g0 + 0.7, ACC);
      const gA = arrRow(pg, 290, AV.map((v, i) => g0 + 0.1 + i * 0.06), true);
      brk(pg, 2, 2, 230, ACC, cp("G", 6), null); brk(pg, 4, 4, 230, ACC, cp("G", 8), null);
      show(lab(pg, `left:${AX(2)}px;width:124px;top:165px`, "l", ACC, 52), cp("G", 6), { opacity: 0 });
      show(lab(pg, `left:${AX(4)}px;width:124px;top:165px`, "r", ACC, 52), cp("G", 8), { opacity: 0 });
      const gS = tile(pg, 200, 520, 560, 110, "SUM(l..r)", ACC, 56); dimIn(gS, g0 + 0.1, 0.3); lit(gS, cp("G", 11));
      bigtxt(pg, "left:20px;width:920px;top:650px", "=", CYAN, 60, cp("G", 12));
      const gF = [tile(pg, 20, 740, 400, 120, "prefix[r+1]", CYAN, 46), tile(pg, 440, 740, 80, 120, "−", HOT, 60), tile(pg, 540, 740, 400, 120, "prefix[l]", CYAN, 46)];
      [13, 18, 19].forEach((t, k) => show(gF[k], cp("G", t), { opacity: 0, y: 20 }));
      M.fit(G, { y: 200, h: 1100 });

      // diagram: H  (the example on real numbers: 14 - 4 = 10)
      const h0 = ST.H;
      const ph = panel(H, 60, 230, 960, 1010, CYAN, null); show(ph, h0 + 0.05);
      const hA = arrRow(ph, 150, AV.map((v, i) => h0 + 0.1 + i * 0.06), true);
      const hP = preRow(ph, 440, PV.map((v, j) => h0 + 0.1 + j * 0.06), true);
      brk(ph, 2, 4, 110, ACC, cp("H", 5), "RANGE");
      ring(hP.p[5], cp("H", 10), ACC); ring(hP.p[2], cp("H", 15), ACC);
      const hC = chipRow(ph, 700, [[10, 200, 14, ACC], [230, 100, "−", HOT], [340, 200, 4, ACC], [560, 100, "=", CYAN], [670, 270, 10, GOOD]], CYAN);
      [18, 19, 20, 21, 22].forEach((t, k) => show(hC[k], cp("H", t), { opacity: 0, y: 24 }));
      [2, 3, 4].forEach((i) => ring(hA.c[i], cp("H", 22), GOOD));
      bigtxt(ph, "left:20px;width:920px;top:860px", "NO LOOP", GOOD, 60, cp("H", 25));
      M.fit(H, { y: 200, h: 1100 });

      // diagram: I  (why it works: prefix[5] minus prefix[2] leaves index 2 to 4)
      const i0 = ST.I;
      const pi = panel(I, 60, 260, 960, 800, CYAN, null); show(pi, i0 + 0.05);
      const iC = AV.map((v, i) => { const t = tile(pi, 60 + i * 140, 40, 130, 150, v, CYAN, 64); tl.set(t, { opacity: 0.35 }, 0); show(t, i0 + 0.1, { opacity: 0 }); tl.to(t, { opacity: 0.35, duration: 0.01, immediateRender: false }, i0 + 0.6);
        show(lab(pi, `left:${60 + i * 140}px;width:130px;top:196px`, i, "#8FA0BE", 36), i0 + 0.1, { opacity: 0 }); return t; });
      [0, 1, 2, 3, 4].forEach((i) => { tl.to(iC[i], { opacity: 1, duration: 0.3, immediateRender: false }, cp("I", 6)); });
      const iB1 = tile(pi, 60, 290, 690, 110, "prefix[5]=14", CYAN, 46); dimIn(iB1, i0 + 0.1, 0.25); lit(iB1, cp("I", 6));
      const iB2 = tile(pi, 60, 430, 270, 110, "prefix[2]=4", HOT, 30); dimIn(iB2, i0 + 0.1, 0.25); lit(iB2, cp("I", 17));
      [0, 1].forEach((i) => { ring(iC[i], cp("I", 19), HOT); tl.to(iC[i], { opacity: 0.4, duration: 0.3, immediateRender: false }, cp("I", 20)); });
      [2, 3, 4].forEach((i) => ring(iC[i], cp("I", 25), GOOD));
      const iB3 = tile(pi, 340, 570, 410, 120, "10", GOOD, 64); dimIn(iB3, i0 + 0.1, 0.25); lit(iB3, cp("I", 25));
      M.pill(pi, "EXAMPLE", i0 + 0.2, { x: 690, y: 720, w: 250, kind: "out", size: 30 });
      M.fit(I, { y: 200, h: 1100 });

      // diagram: J  (cost: O(1) per query, O(n) space; 200,000 steps against 10 billion)
      const j0 = ST.J;
      const pj = panel(J, 60, 230, 960, 1010, CYAN, null); show(pj, j0 + 0.05);
      const jq = tile(pj, 20, 20, 450, 110, "QUERY O(1)", GOOD, 46); dimIn(jq, j0 + 0.1, 0.3); lit(jq, cp("J", 6));
      const js = tile(pj, 490, 20, 450, 110, "SPACE O(n)", ACC, 46); dimIn(js, j0 + 0.1, 0.3); lit(js, cp("J", 19));
