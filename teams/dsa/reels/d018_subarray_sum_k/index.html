    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J","K"], tag: "DSA 018/150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M; const ST = M.S;
      const AMB = "#E9B44C", VIO = "#9A8CEB";
      const $s = (k) => M.$("#s" + k);
      const [A, B, C, D, E, F, G, H, I, J, K] = "ABCDEFGHIJK".split("").map($s);
      const cp = (sc, i) => REEL.hi.caps.filter((c) => c.scene === sc)[i].s;
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:16px;font-size:34px;color:${col}`; } return d; };
      const tile = (host, x, y, w, h, txt, col, fs) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px solid ${M.ca(col || CYAN, .55)};background:${M.ca(col || CYAN, .12)};font:700 ${fs || 38}px var(--code);display:flex;align-items:center;justify-content:center;white-space:nowrap`, txt);
      const lab = (host, css, txt, col, size) => el(host, css + `;font:700 ${size || 44}px var(--code);color:${col || "#B8C4DC"};text-align:center;white-space:nowrap`, txt);
      const counter = (host, css, from, segs, col, size, ts) => { const d = el(host, css + `;font:800 ${size || 96}px var(--code);color:${col};text-align:center;white-space:nowrap`, String(from)); const o = { v: from };
        show(d, ts == null ? segs[0][0] - 0.3 : ts, { opacity: 0 });
        segs.forEach(([t0, t1, to]) => tl.to(o, { v: to, duration: t1 - t0, ease: "power2.inOut", immediateRender: false, onUpdate: () => { d.textContent = Math.round(o.v).toLocaleString("en-US"); } }, t0));
        return d; };
      const ring = (d, t, col) => tl.to(d, { borderColor: col, backgroundColor: M.ca(col, .35), duration: 0.25, immediateRender: false }, t);
      const tint = (d, t, col, fill) => tl.to(d, { borderColor: M.ca(col, .9), backgroundColor: M.ca(col, fill == null ? .28 : fill), duration: 0.3, immediateRender: false }, t);
      const dim = (d, t, op) => tl.to(d, { opacity: op == null ? 0.15 : op, duration: 0.35, immediateRender: false }, t);
      const dimIn = (d, t, op) => { tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: op, duration: 0.4, immediateRender: false }, t); return d; };
      const lit = (d, t) => tl.to(d, { opacity: 1, duration: 0.35, immediateRender: false }, t);
      const hide = (d, t) => tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, t);
      const bigtxt = (host, css, txt, col, size, t) => show(lab(host, css, txt, col, size), t, { opacity: 0 });
      const ghost = (host, x, y, w, h) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px dashed rgba(150,175,215,.35)`);
      const chip = (host, x, y, w, h, txt, col, t, fs) => show(tile(host, x, y, w, h, txt, col, fs || 56), t, { opacity: 0, y: 18 });
      const base = (sc, h) => { const p = panel(sc, 60, 230, 960, h || 1010, CYAN, null); show(p, ST[sc.id.slice(1)] + 0.05); return p; };
      // a lit tile: dim from the start, lit on its word
      const lt = (host, x, y, w, h, txt, col, fs, t, s0) => { const d = tile(host, x, y, w, h, txt, col, fs); dimIn(d, s0 + 0.1, 0.28); lit(d, t); return d; };

      const CX = (i) => 24 + i * 92;
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const code = (host, x, y, w, lines, fs, lh, s0) => {
        const h = lines.length * lh + 36;
        show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:16px;background:rgba(8,13,26,.9);border:2px solid ${M.ca(CYAN, .35)}`), s0 + 0.1);
        const Ls = lines.map((s, i) => show(el(host, `left:${x + 10}px;top:${y + 18 + i * lh}px;width:${w - 20}px;height:${lh}px;border-radius:8px;font:500 ${fs}px/${lh}px var(--code);color:#9FB0CC;white-space:pre;padding-left:12px;box-sizing:border-box`, esc(s)), s0 + 0.15, { opacity: 0 }));
        const on = (a, b, t) => { for (let i = a; i <= b; i++) tl.to(Ls[i], { backgroundColor: M.ca(ACC, .25), color: "#FFFFFF", duration: 0.3, immediateRender: false }, t); };
        const off = (a, b, t) => { for (let i = a; i <= b; i++) tl.to(Ls[i], { backgroundColor: "rgba(233,180,76,0)", color: "#9FB0CC", duration: 0.3, immediateRender: false }, t); };
        return { on, off, h }; };
      const seqTile = (host, x, y, w, h, col, fs, seq) => seq.map(([txt, t], k) => { const d = tile(host, x, y, w, h, txt, col, fs); show(d, t, { opacity: 0, scale: k ? 1.06 : 1 });
        const nt = seq[k + 1]; if (nt) tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, nt[1]); return d; });

      const GREY = "#B8C4DC", DIMC = "#5C6B88";
      // swap: one tile slot whose text changes; items [txt, colour, time]
      const swap = (host, x, y, w, h, fs, items) => items.map(([txt, col, t], k) => { const d = tile(host, x, y, w, h, txt, col, fs); show(d, t, { opacity: 0, scale: k ? 1.06 : 1 });
        const nt = items[k + 1]; if (nt) tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, nt[2]); return d; });
      // ring that moves between cells
      const mkRing = (host, x, y, w, h, t) => { const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:18px;border:5px solid ${ACC};box-sizing:border-box`);
        tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: 1, duration: 0.3, immediateRender: false }, t); return d; };
      const hop = (d, x, y, t, dur) => tl.to(d, { left: x, top: y, duration: dur || 0.35, ease: "power2.inOut", immediateRender: false }, t);

      const ARR = [3, 4, -3, 2, 1, 1]; const AX = (i) => 24 + i * 152;
      const fmt = (v) => (v < 0 ? "-" + Math.abs(v) : String(v));
      // array row: ghost + tile per cell; visible from the scene start, lit on its word if times are given
      const arrRow = (host, y, h, fs, s0, times) => ARR.map((v, i) => { ghost(host, AX(i), y, 140, h);
        if (times) return lt(host, AX(i), y, 140, h, fmt(v), CYAN, fs, times[i], s0);
        return show(tile(host, AX(i), y, 140, h, fmt(v), CYAN, fs), s0 + 0.05, { opacity: 0 }); });
      // bracket over cells a..b of an array row at y
      const brk = (host, a, b, y, h, col, t, t2) => { const d = el(host, `left:${AX(a) - 8}px;top:${y - 8}px;width:${(b - a) * 152 + 156}px;height:${h + 16}px;border-radius:18px;border:5px solid ${col};box-sizing:border-box`);
        tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: 1, duration: 0.3, immediateRender: false }, t); if (t2 != null) hide(d, t2); return d; };

      // diagram: A
      // ===== A: hook, the question, a subarray is continuous
      M.hook(["SUBARRAYS WITH", "SUM = k ?"], { size: 88, top: 250 });
      const pa = panel(A, 60, 500, 960, 720, CYAN, null); show(pa, 0.02);
      bigtxt(pa, "left:0;width:960px;top:12px", "SUBARRAY", GREY, 36, 0.1);
      arrRow(pa, 60, 100, 56, 0);
      const aB = brk(pa, 1, 3, 60, 100, ACC, cp("A", 13) - 0.2);
      lt(pa, AX(1), 190, 440, 90, "SUM = k", ACC, 54, cp("A", 6), 0);
      bigtxt(pa, "left:0;width:960px;top:300px", "NOT A SUBARRAY", GREY, 36, cp("A", 15));
      ARR.forEach((v, i) => { ghost(pa, AX(i), 345, 140, 100); if (i === 0 || i === 3) lt(pa, AX(i), 345, 140, 100, fmt(v), HOT, 56, cp("A", 17), 0); else lt(pa, AX(i), 345, 140, 100, fmt(v), CYAN, 56, cp("A", 15), 0); });
      lt(pa, 24, 470, 916, 90, "SKIPS CELLS = NOT CONTINUOUS", HOT, 44, cp("A", 17), 0);
      lt(pa, 24, 590, 440, 100, "HOW MANY?", HOT, 54, cp("A", 3), 0);
      lt(pa, 498, 590, 440, 100, "NEGATIVES OK", AMB, 46, cp("A", 10), 0);
      M.fit(A, { y: 460, h: 840 });

      // diagram: B
      // ===== B: given array, k = 3, three matching subarrays
      const b0 = ST.B; const pb = base(B, 880);
      bigtxt(pb, "left:0;width:960px;top:12px", "GIVEN ARRAY", GREY, 36, cp("B", 0));
      arrRow(pb, 60, 100, 52, b0, [cp("B", 2), cp("B", 3), cp("B", 4), cp("B", 6), cp("B", 7), cp("B", 8)]);
      lt(pb, 330, 185, 300, 90, "k = 3", ACC, 54, cp("B", 10), b0);
      const strip = (y, idx, t, lbl) => { ARR.forEach((v, i) => { if (idx.includes(i)) lt(pb, AX(i), y, 140, 90, fmt(v), ACC, 48, t, b0); else ghost(pb, AX(i), y, 140, 90); }); };
      strip(345, [1, 2, 3], cp("B", 13)); strip(455, [0], cp("B", 22)); strip(565, [3, 4], cp("B", 26));
      lt(pb, 24, 700, 916, 120, "ANSWER = 3", GOOD, 68, cp("B", 30), b0);
      M.pill(pb, "SUM = 3 EACH", cp("B", 17), { x: 650, y: 200, w: 290, kind: "out", size: 30 });
      M.fit(B, { y: 200, h: 1100 });

      // diagram: C
      // ===== C: brute force, the real sum of every start/end pair
      const c0 = ST.C; const pc = base(C, 1010);
      const CXo = 204, CC = (c) => CXo + c * 92;
      ARR.forEach((v, c) => { ghost(pc, CC(c), 20, 86, 70); lt(pc, CC(c), 20, 86, 70, fmt(v), CYAN, 38, c0, c0); });
      bigtxt(pc, "left:24px;width:170px;top:130px", "START", GREY, 30, cp("C", 2));
      const cSum = []; for (let r = 0; r < 6; r++) { let s = 0; for (let c = r; c < 6; c++) { s += ARR[c]; cSum.push([r, c, s]); } }
      cSum.forEach(([r, c, s], n) => { const y = 120 + r * 76; const d = tile(pc, CC(c), y, 86, 70, fmt(s), HOT, 38); dimIn(d, c0 + 0.1, 0.15); lit(d, cp("C", 2) + 0.15 + n * 0.08); if (s === 3) tint(d, cp("C", 8) + 0.3, GOOD, 0.4); });
      lt(pc, 24, 600, 916, 90, "n = 20,000", CYAN, 56, cp("C", 10), c0);
      counter(pc, "left:24px;width:916px;top:720px", 0, [[cp("C", 15), cp("C", 17) + 0.5, 200010000]], HOT, 100, cp("C", 14));
      bigtxt(pc, "left:24px;width:500px;top:845px", "SUBARRAYS", GREY, 44, cp("C", 18));
      M.pill(pc, "EXAMPLE", cp("C", 23), { x: 690, y: 840, w: 250, kind: "out", size: 30 });
      M.fit(C, { y: 200, h: 1100 });

      // diagram: D
      // ===== D: sliding window, its running sums, the missed subarray
      const d0 = ST.D; const pd = base(D, 900);
      bigtxt(pd, "left:0;width:960px;top:12px", "SLIDING WINDOW", GREY, 36, cp("D", 0));
      const dA = arrRow(pd, 60, 100, 52, d0);
      const dW = el(pd, `left:${AX(0) - 8}px;top:52px;width:156px;height:116px;border-radius:18px;border:5px solid ${GOOD};box-sizing:border-box`);
      tl.set(dW, { opacity: 0 }, 0); tl.to(dW, { opacity: 1, duration: 0.3, immediateRender: false }, cp("D", 7));
      tl.to(dW, { width: 308, borderColor: HOT, duration: 0.4, immediateRender: false }, cp("D", 11));
      tl.to(dW, { opacity: 0, duration: 0.3, immediateRender: false }, cp("D", 15) + 0.3);
      [0, 1].forEach((i) => dim(dA[i], cp("D", 15) + 0.1, 0.25));
      bigtxt(pd, "left:0;width:960px;top:176px", "WINDOW SUM", GREY, 34, cp("D", 7));
      ARR.forEach((v, i) => ghost(pd, AX(i), 218, 140, 90));
      swap(pd, AX(0), 218, 140, 90, 52, [["3", GOOD, cp("D", 7)]]);
      swap(pd, AX(1), 218, 140, 90, 52, [["7", HOT, cp("D", 11)], ["0", AMB, cp("D", 15)]]);
      [["-3", 2], ["-1", 3], ["0", 4], ["1", 5]].forEach(([t, i]) => swap(pd, AX(i), 218, 140, 90, 52, [[t, CYAN, cp("D", 26) + (i - 2) * 0.4]]));
      tint(dA[2], cp("D", 26), HOT);
      lt(pd, 24, 350, 916, 90, "ASSUMES SUM GROWS", AMB, 50, cp("D", 19), d0);
      lt(pd, 24, 465, 916, 90, "-3 LOWERS SUM", HOT, 54, cp("D", 29), d0);
      const dM = brk(pd, 1, 3, 60, 100, GOOD, cp("D", 45) - 0.2);
      lt(pd, 24, 600, 440, 110, "WINDOW: 1", HOT, 54, cp("D", 41), d0);
      lt(pd, 498, 600, 440, 110, "TRUE: 3", GOOD, 54, cp("D", 47), d0);
      lt(pd, 24, 735, 916, 90, "MISSED 4, -3, 2", HOT, 50, cp("D", 47), d0);
      M.fit(D, { y: 200, h: 1100 });

      // diagram: E
      // ===== E: prefix sums, the difference, the lookup of s - k
      const e0 = ST.E; const pe = base(E, 980);
      const PX = (j) => 24 + j * 132, AX2 = (i) => 90 + i * 132; const PRE = [0, 3, 7, 4, 6, 7, 8];
      bigtxt(pe, "left:0;width:960px;top:10px", "ARRAY", GREY, 34, cp("E", 3));
      const eA = ARR.map((v, i) => { ghost(pe, AX2(i), 55, 120, 90); return lt(pe, AX2(i), 55, 120, 90, fmt(v), CYAN, 46, cp("E", 3), e0); });
      bigtxt(pe, "left:0;width:960px;top:175px", "PREFIX", GREY, 34, cp("E", 4));
      const eP = PRE.map((v, j) => { ghost(pe, PX(j), 220, 120, 90); return lt(pe, PX(j), 220, 120, 90, fmt(v), VIO, 46, cp("E", 7) + j * 0.35, e0); });
      const eB = brk(pe, 0, 0, 55, 90, ACC, cp("E", 17)); tl.set(eB, { left: AX2(1) - 8, width: 3 * 132 + 120 + 12 }, 0);
      const eR1 = mkRing(pe, PX(1) - 5, 215, 130, 100, cp("E", 28)); const eR2 = mkRing(pe, PX(4) - 5, 215, 130, 100, cp("E", 25));
      swap(pe, 24, 360, 916, 100, 50, [["PREFIX = RUNNING SUM", VIO, cp("E", 12)], ["SUM = P[j] - P[i]", ACC, cp("E", 22)], ["6 - 3 = 3 = k", GOOD, cp("E", 29)]]);
      swap(pe, 24, 500, 440, 100, 50, [["s = 6", VIO, cp("E", 30)]]);
      swap(pe, 498, 500, 440, 100, 50, [["s - k = 3", AMB, cp("E", 39)]]);
      const eG = el(pe, `left:${PX(1) - 8}px;top:212px;width:136px;height:106px;border-radius:18px;border:6px solid ${GOOD};box-sizing:border-box`);
      tl.set(eG, { opacity: 0 }, 0); tl.to(eG, { opacity: 1, duration: 0.3, immediateRender: false }, cp("E", 43));
      lt(pe, 24, 640, 916, 110, "3 ALREADY SEEN: x1", GOOD, 50, cp("E", 44), e0);
      lt(pe, 24, 780, 916, 100, "COUNT = SUBARRAYS ENDING HERE", AMB, 40, cp("E", 46), e0);
      M.fit(E, { y: 200, h: 1100 });

      // diagram: F
      // ===== F: hash map of prefix counts, seeded with 0 -> 1
      const f0 = ST.F; const pf = base(F, 960);
      bigtxt(pf, "left:0;width:960px;top:10px", "PREFIXES", GREY, 34, cp("F", 7));
      [0, 3, 7, 4, 6, 7, 8].forEach((v, j) => { ghost(pf, PX(j), 55, 120, 90); const d = lt(pf, PX(j), 55, 120, 90, v, VIO, 46, cp("F", 7) + j * 0.08, f0); if (v === 7) tint(d, cp("F", 15) + (j === 2 ? 0 : 0.5), AMB, 0.4); });
      bigtxt(pf, "left:24px;width:440px;top:180px", "PREFIX", GREY, 40, cp("F", 2)); bigtxt(pf, "left:496px;width:440px;top:180px", "COUNT", GREY, 40, cp("F", 9));
      ghost(pf, 24, 235, 440, 110); ghost(pf, 496, 235, 440, 110); ghost(pf, 24, 365, 440, 110); ghost(pf, 496, 365, 440, 110);
      lt(pf, 24, 235, 440, 110, "0", CYAN, 56, cp("F", 33), f0); lt(pf, 496, 235, 440, 110, "1", GOOD, 56, cp("F", 35), f0);
      lt(pf, 24, 365, 440, 110, "7", VIO, 56, cp("F", 14), f0);
      swap(pf, 496, 365, 440, 110, 56, [["1", CYAN, cp("F", 14)], ["2", GOOD, cp("F", 17)]]);
      const fR = mkRing(pf, PX(0) - 5, 50, 130, 100, cp("F", 37));
      lt(pf, 24, 520, 916, 100, "SEEN TWICE", AMB, 54, cp("F", 16), f0);
      lt(pf, 24, 650, 916, 100, "+1 SUBARRAY EACH", GOOD, 54, cp("F", 24), f0);
      lt(pf, 24, 780, 916, 100, "0 : 1 = INDEX 0 START", ACC, 46, cp("F", 37), f0);
      M.fit(F, { y: 200, h: 1100 });

      // dry run builder: array row, s / s-k / result tiles, seen slots, answer, 2 code lines
      const SX = (i) => 24 + i * 152;
      const dry = (sc, k0, o) => { const p = base(sc, 800);
        const cells = ARR.map((v, i) => { ghost(p, AX(i), 20, 140, 90); const t = tile(p, AX(i), 20, 140, 90, fmt(v), CYAN, 48); show(t, k0 + 0.05, { opacity: 0 }); return t; });
        (o.done || []).forEach((i) => dim(cells[i], k0 + 0.1, 0.3));
        bigtxt(p, "left:0;width:960px;top:300px", "SEEN MAP", GREY, 34, k0 + 0.1);
