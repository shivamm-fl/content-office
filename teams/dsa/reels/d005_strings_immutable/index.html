<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Strings: array jaisi, par badal nahi sakte</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="171.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
        <div class="beat" id="sI"></div>
        <div class="beat" id="sJ"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="171.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="171.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="171.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J"], tag: "DSA 005/150" });
      Viz.install(M);
      const { tl } = M; const at = (sc, w, n) => M.W(sc, w, n); const { ACC, CYAN, HOT, GOOD } = M; const ST = M.S;
      const $s = (k) => M.$("#s" + k);
      const A = $s("A"), B = $s("B"), C = $s("C"), D = $s("D"), E = $s("E"), F = $s("F"), G = $s("G"), H = $s("H"), I = $s("I"), J = $s("J");
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:16px;font-size:34px;color:${col}`; } return d; };
      const tile = (host, x, y, w, h, txt, col, fs) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px solid ${M.ca(col || CYAN, .55)};background:${M.ca(col || CYAN, .12)};font:700 ${fs || 38}px var(--code);display:flex;align-items:center;justify-content:center;white-space:nowrap`, txt);
      const stamp = (host, txt, x, y, col, t) => { const d = el(host, `left:${x}px;top:${y}px;padding:12px 30px;border:3px solid ${col};border-radius:12px;background:rgba(14,18,30,.96);font:700 52px var(--code);color:${col};white-space:nowrap`, txt);
        gsap.set(d, { xPercent: -50 }); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const lab = (host, css, txt, col, size) => el(host, css + `;font:700 ${size || 44}px var(--code);color:${col || "#B8C4DC"};text-align:center;white-space:nowrap`, txt);
      const counter = (host, css, from, segs, col, size) => { const d = el(host, css + `;font:800 ${size || 96}px var(--code);color:${col};text-align:center;white-space:nowrap`, from.toLocaleString("en-US")); const o = { v: from };
        show(d, segs[0][0] - 0.3, { opacity: 0 });
        segs.forEach(([t0, t1, to]) => tl.to(o, { v: to, duration: t1 - t0, ease: "power2.inOut", immediateRender: false, onUpdate: () => { d.textContent = Math.round(o.v).toLocaleString("en-US"); } }, t0));
        return d; };
      const ring = (d, t, col) => tl.to(d, { borderColor: col, backgroundColor: M.ca(col, .35), duration: 0.25, immediateRender: false }, t);
      const dim = (d, t, op) => tl.to(d, { opacity: op == null ? 0.15 : op, duration: 0.35, immediateRender: false }, t);
      const dimIn = (d, t, op) => { tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: op, duration: 0.4, immediateRender: false }, t); return d; };
      const lit = (d, t) => tl.to(d, { opacity: 1, duration: 0.35, immediateRender: false }, t);
      const grow = (d, t, dur) => { tl.set(d, { scaleX: 0 }, 0); tl.to(d, { scaleX: 1, duration: dur || 0.6, ease: "power3.out", immediateRender: false }, t); return d; };
      const LET = ["h", "e", "l", "l", "o"];
      const row5 = (host, x, y, w, h, letters, col, fs, idxCol) => letters.map((c, i) => { const t = tile(host, x + i * w, y, w, h, c, col, fs); if (idxCol) lab(host, `left:${x + i * w}px;top:${y + h + 8}px;width:${w}px`, String(i), idxCol, 40); return t; });

      // diagram: A  (hook: five letter boxes with index; a gold j tries to land on box 0 and is bounced)
      M.hook(["CHANGE ONE LETTER,", "ERROR?"], { size: 88, top: 250 });
      const pa = panel(A, 80, 520, 920, 600, CYAN, "STRING"); show(pa, 0.05);
      const aT = row5(pa, 60, 270, 160, 170, LET, CYAN, 80, null); aT.forEach((t, i) => show(t, 0.1 + i * 0.06));
      LET.forEach((_, i) => { const l = lab(pa, `left:${60 + i * 160}px;top:452px;width:160px`, String(i), ACC, 44); show(l, 0.4 + i * 0.05); });
      const aj = tile(pa, 60, 90, 160, 150, "j", ACC, 80); tl.set(aj, { opacity: 0, borderColor: M.ca(ACC, .9), backgroundColor: M.ca(ACC, .3) }, 0);
      tl.to(aj, { opacity: 1, duration: 0.3, immediateRender: false }, at("A", "badalne") - 0.4);
      tl.to(aj, { y: 120, duration: 0.35, ease: "power3.in", immediateRender: false }, at("A", "badalne") + 0.2);
      tl.to(aj, { y: -40, x: 120, opacity: 0.35, duration: 0.45, ease: "power3.out", immediateRender: false }, at("A", "error"));
      const cr = M.icon(pa, "cross", 200, 160, 120, HOT); cr.show(at("A", "error"));
      ring(aT[0], at("A", "error"), HOT);
      M.pill(A, "ERROR", at("A", "error"), { x: 340, y: 1170, w: 400, kind: "acc", size: 56 });
      M.fit(A, { y: 460, h: 840 });

      // diagram: B  (s[0] = "j" aims at box 0 and fails with the real TypeError; index counts from 0)
      const b0 = ST.B;
      const pb = panel(B, 60, 230, 960, 440, CYAN, "STRING"); show(pb, b0 + 0.1);
      const bT = row5(pb, 80, 150, 160, 150, LET, CYAN, 72, null); bT.forEach((t, i) => show(t, at("B", "hello"), { opacity: 0, y: 20 }));
      LET.forEach((_, i) => { const l = lab(pb, `left:${80 + i * 160}px;top:310px;width:160px`, String(i), ACC, 50); show(l, at("B", "index") + i * 0.1); });
      lab(pb, "left:0;width:960px;top:372px", "INDEX", ACC, 40); show(pb.lastChild, at("B", "index"));
      const bj = tile(pb, 80, 56, 160, 80, "j", ACC, 52); tl.set(bj, { opacity: 0, borderColor: M.ca(ACC, .9), backgroundColor: M.ca(ACC, .3) }, 0);
      tl.to(bj, { opacity: 1, duration: 0.3, immediateRender: false }, at("B", "likhte"));
      tl.to(bj, { y: 55, duration: 0.3, ease: "power3.in", immediateRender: false }, at("B", "TypeError") - 0.3);
      tl.to(bj, { y: -10, x: 100, opacity: 0.3, duration: 0.4, ease: "power3.out", immediateRender: false }, at("B", "TypeError"));
      ring(bT[0], at("B", "index"), ACC); ring(bT[0], at("B", "TypeError"), HOT);
      const pc = panel(B, 60, 720, 960, 520, "#8FA3C8", "PYTHON"); show(pc, b0 + 0.1);
      const code = (y, html, t, col) => show(el(pc, `left:40px;top:${y}px;width:880px;font:700 58px var(--code);color:${col || "#E8EDF6"};white-space:nowrap`, html), t);
      code(80, 's = "hello"', at("B", "hello"));
      code(170, 's[0] = "j"', at("B", "likhte"), ACC);
      const er = el(pc, `left:40px;top:290px;width:880px;padding:20px 24px;border:3px solid ${HOT};border-radius:14px;background:${M.ca(HOT, .14)};font:700 46px var(--code);color:${HOT};line-height:1.3`, "TypeError: 'str' object does not support item assignment"); show(er, at("B", "TypeError"), { opacity: 0, scale: 1.05 });
      M.fit(B, { y: 200, h: 1100 });

      // diagram: C  (reading by index is fine, array-like; changing is blocked: immutable)
      const c0 = ST.C;
      M.pill(C, "PYTHON", c0 + 0.1, { x: 380, y: 215, w: 320, kind: "out", size: 40 });
      const pcc = panel(C, 60, 330, 960, 520, GOOD, "READ: OK"); show(pcc, c0 + 0.1);
      const cT = row5(pcc, 80, 150, 160, 170, LET, CYAN, 80, null); cT.forEach((t, i) => show(t, c0 + 0.2 + i * 0.05));
      LET.forEach((_, i) => show(lab(pcc, `left:${80 + i * 160}px;top:332px;width:160px`, String(i), ACC, 46), c0 + 0.3 + i * 0.05));
      const cp = el(pcc, "left:80px;top:78px;width:160px;font:800 76px var(--code);color:" + GOOD + ";text-align:center", "▼"); show(cp, at("C", "padh"), { opacity: 0 });
      tl.to(cp, { x: 640, duration: 0.5, ease: "power3.inOut", immediateRender: false }, at("C", "4"));
      ring(cT[0], at("C", "h"), GOOD); ring(cT[4], at("C", "4") + 0.4, GOOD);
      M.pill(C, "READ BY INDEX", at("C", "jaise"), { x: 250, y: 880, w: 580, kind: "acc", size: 52 });
      const pbd = panel(C, 60, 980, 960, 330, HOT, "CHANGE: NO"); dimIn(pbd, c0 + 0.1, 0.5); lit(pbd, at("C", "badal"));
      const lt = tile(pbd, 100, 110, 160, 150, "h", HOT, 72); const lk = M.icon(pbd, "lock", 320, 100, 170, HOT); lk.show(at("C", "badal") + 0.3);
      M.pill(pbd, "IMMUTABLE", at("C", "immutable"), { x: 520, y: 140, w: 400, kind: "acc", size: 46 });
      M.fit(C, { y: 200, h: 1100 });

      // diagram: D  (a new string is built; the old one stays)
      const d0 = ST.D;
      const po = panel(D, 60, 300, 960, 400, CYAN, "OLD"); show(po, d0 + 0.1);
      const oT = row5(po, 80, 130, 160, 170, LET, CYAN, 80, null); oT.forEach((t, i) => show(t, d0 + 0.2 + i * 0.05));
      const pn = panel(D, 60, 760, 960, 400, GOOD, "NEW"); dimIn(pn, d0 + 0.1, 0.5); lit(pn, at("D", "nayi"));
      const nj = tile(pn, 80, 130, 160, 170, "j", ACC, 80); tl.set(nj, { opacity: 0, y: -60 }, 0); tl.to(nj, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, at("D", "j"));
      const nT = [1, 2, 3, 4].map((i) => { const t = tile(pn, 80 + i * 160, 130, 160, 170, LET[i], GOOD, 80); tl.set(t, { opacity: 0, y: -380 }, 0); tl.to(t, { opacity: 1, y: 0, duration: 0.55, ease: "power3.inOut", immediateRender: false }, at("D", "baaki") + (i - 1) * 0.15); return t; });
      M.pill(D, "j + ello", at("D", "jodo"), { x: 340, y: 1200, w: 400, kind: "acc", size: 52 });
      dim(po, at("D", "purani", 1) + 0.5, 1);
      ring(oT[0], at("D", "purani", 1), CYAN);
      M.fit(D, { y: 200, h: 1100 });

      // diagram: E  (wedding card: reprint the whole card; the same for a string: the changed letter is the typo)
      const e0 = ST.E;
      const card = (host, x, y, col, txt, bad) => { const c = el(host, `left:${x}px;top:${y}px;width:420px;height:360px;border-radius:20px;border:3px solid ${M.ca(col, .6)};background:${M.ca(col, .1)}`); lab(c, "left:0;width:420px;top:50px", "WEDDING", col, 52); lab(c, "left:0;width:420px;top:150px", txt, "#E8EDF6", 44); return c; };
      const c1 = card(E, 80, 250, HOT, "Rahul ♥ Rhaul"); show(c1, e0 + 0.1);
      M.pill(E, "TYPO", at("E", "ghalat"), { x: 110, y: 490, w: 240, kind: "acc", size: 44 });
      const ccr = M.icon(E, "cross", 375, 480, 90, HOT); ccr.show(at("E", "directly"));
      const c2 = card(E, 580, 250, GOOD, "Rahul ♥ Rohan"); tl.set(c2, { opacity: 0 }, 0); tl.to(c2, { opacity: 1, duration: 0.5, immediateRender: false }, at("E", "naya"));
      M.pill(E, "NEW CARD", at("E", "padega"), { x: 620, y: 630, w: 340, kind: "acc", size: 46 });
      const pe = panel(E, 60, 760, 960, 560, ACC, "PYTHON STRING"); dimIn(pe, e0 + 0.1, 0.7); lit(pe, at("E", "Python"));
      const e1 = row5(pe, 155, 90, 130, 130, LET, CYAN, 64, null);
      ring(e1[0], at("E", "change", 1), HOT);
      lab(pe, "left:0;width:960px;top:235px", "↓", ACC, 70);
      const e2 = row5(pe, 155, 330, 130, 130, ["j", "e", "l", "l", "o"], GOOD, 64, null);
      e2.forEach((t) => { tl.set(t, { opacity: 0 }, 0); tl.to(t, { opacity: 1, duration: 0.4, immediateRender: false }, at("E", "nayi")); });
      show(lab(pe, "left:0;width:960px;top:480px", "1 LETTER = NEW STRING", ACC, 42), at("E", "nayi"));
      M.fit(E, { y: 200, h: 1100 });

      // diagram: F  (each + copies the whole current string: rows of 1, 2, 3, 4 letters; the running total grows)
      const f0 = ST.F;
      M.pill(F, "EXAMPLE", f0 + 0.1, { x: 780, y: 215, w: 240, kind: "out", size: 30 });
      const pf = panel(F, 60, 280, 960, 960, HOT, "EACH + COPIES ALL"); show(pf, f0 + 0.1);
      show(lab(pf, "left:0;width:960px;top:70px", "TARGET: 10 LAKH LETTERS", ACC, 44), at("F", "10"));
      show(el(pf, "left:0;width:960px;top:140px;text-align:center;font:700 58px var(--code);color:#E8EDF6;white-space:nowrap", "s = s + letter"), at("F", "equals"));
      const tms = [at("F", "pehle"), at("F", "agle"), at("F", "teen") - 0.2, at("F", "teen") + 0.8];
      const tot = [1, 3, 6, 10];
      [1, 2, 3, 4].forEach((n, r) => { const y = 250 + r * 115;
        for (let k = 0; k < n; k++) { const t = tile(pf, 40 + k * 100, y, 92, 100, "abcd"[k], HOT, 52); tl.set(t, { opacity: 0 }, 0); tl.to(t, { opacity: 1, duration: 0.3, immediateRender: false }, tms[r] + k * 0.08); }
        show(lab(pf, `left:${60 + n * 100}px;top:${y + 25}px`, "COPY " + n, "#E8EDF6", 48), tms[r] + 0.15, { opacity: 0 });
        const tt = el(pf, `left:620px;top:${y + 25}px;width:300px;font:800 48px var(--code);color:${HOT};text-align:right;white-space:nowrap`, "TOTAL " + tot[r]); show(tt, tms[r] + 0.3, { opacity: 0 }); });
      show(lab(pf, "left:0;width:960px;top:705px", "· · ·", "#B8C4DC", 64), at("F", "aise"));
      const last = el(pf, `left:40px;top:790px;width:880px;height:120px;border-radius:12px;background:${M.ca(HOT, .5)};border:2px solid ${HOT};transform-origin:0 50%;font:800 56px var(--code);display:flex;align-items:center;justify-content:center`, "LAST COPY = ALL n"); grow(last, at("F", "aage"), 0.5);
      M.fit(F, { y: 200, h: 1100 });

      // diagram: G  (the staircase summed: 1 + 2 + ... + 1000 = n x (n+1) / 2; a model)
      const g0 = ST.G;
      M.pill(G, "MODEL", g0 + 0.1, { x: 380, y: 200, w: 320, kind: "out", size: 40 });
      const pfm = panel(G, 60, 270, 960, 260, ACC, "ADD ALL COPIES"); show(pfm, at("G", "1") - 0.3);
      show(el(pfm, `left:0;width:960px;top:80px;text-align:center;font:800 54px var(--code);color:#B8C4DC`, "1 + 2 + 3 + … + 1000"), at("G", "1"));
      show(el(pfm, `left:0;width:960px;top:160px;text-align:center;font:800 62px var(--code);color:#E8EDF6`, "n × (n + 1) / 2"), at("G", "formula"));
      for (let i = 1; i <= 10; i++) { const st = el(G, `left:140px;top:${560 + (i - 1) * 28}px;width:${i * 80}px;height:26px;background:${M.ca(HOT, .4)};border:1px solid ${HOT}`); show(st, at("G", "1") + 0.2 + i * 0.07, { opacity: 0 }); }
      counter(G, "left:60px;top:860px;width:960px", 0, [[at("G", "500500") - 0.2, at("G", "500500") + 0.9, 500500]], HOT, 100);
      lab(G, "left:60px;top:975px;width:960px", "LETTERS COPIED", HOT, 44); show(G.lastChild, at("G", "500500") + 0.3);
      M.pill(G, "NOT REAL TIME", at("G", "dhyaan"), { x: 290, y: 1050, w: 500, kind: "acc", size: 46 });
      counter(G, "left:60px;top:1150px;width:960px", 500500, [[at("G", "10") - 0.1, at("G", "500", 0) + 0.9, 500000000000]], HOT, 80);
      lab(G, "left:60px;top:1245px;width:960px", "10 LAKH LETTERS", HOT, 44); show(G.lastChild, at("G", "10"));
      M.fit(G, { y: 200, h: 1100 });

      // diagram: H  (join: list, one join, each letter copied once)
      const h0 = ST.H;
      const p1 = panel(H, 60, 280, 960, 300, CYAN, "STEP 1/3: LIST"); dimIn(p1, h0 + 0.1, 0.6); lit(p1, at("H", "pehle"));
      ["h", "e", "l", "l", "o"].forEach((c, i) => { const t = tile(p1, 60 + i * 170, 110, 150, 150, c, CYAN, 64); tl.set(t, { opacity: 0, y: -40 }, 0); tl.to(t, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, at("H", "list") + i * 0.2); });
      const p2 = panel(H, 60, 620, 960, 250, ACC, "STEP 2/3: JOIN ONCE"); dimIn(p2, h0 + 0.1, 0.6); lit(p2, at("H", "end"));
      M.pill(p2, "JOIN", at("H", "join", 0), { x: 330, y: 110, w: 300, kind: "acc", size: 56 });
      const p3 = panel(H, 60, 910, 960, 360, GOOD, "STEP 3/3: ONE JOIN"); dimIn(p3, h0 + 0.1, 0.6); lit(p3, at("H", "pieces"));
      ["h", "e", "l", "l", "o"].forEach((c, i) => { const t = tile(p3, 40 + i * 120, 110, 110, 120, c, GOOD, 52); tl.set(t, { opacity: 0 }, 0); tl.to(t, { opacity: 1, duration: 0.3, immediateRender: false }, at("H", "final", 1) + i * 0.15); });
      show(lab(p3, "left:660px;top:130px;width:260px", "ONE ROW", GOOD, 46), at("H", "operation"));
      M.fit(H, { y: 200, h: 1100 });

      // diagram: I  (true-scale bars: 500,500 against 1,000)
      const i0 = ST.I;
      const bx = (y, col, label, val, w, t) => { const p = panel(I, 60, y, 960, 330, col, label); show(p, i0 + 0.1);
        el(p, `left:50px;top:130px;width:860px;height:70px;border-radius:10px;border:2px solid ${M.ca(col, .35)}`);
        grow(el(p, `left:50px;top:130px;width:${w}px;height:70px;border-radius:10px;background:${col};transform-origin:0 50%`), t, 0.8);
