<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pivot Index: left aur right ka sum barabar kahan</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="144" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
        <div class="beat" id="sI"></div>
        <div class="beat" id="sJ"></div>
        <div class="beat" id="sK"></div>
        <div class="beat" id="sL"></div>
        <div class="beat" id="sM"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="144" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="144" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="144" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J","K","L","M"], tag: "DSA 012/150" });
      Viz.install(M);
      const { tl } = M; const at = (sc, w, n) => M.W(sc, w, n); const { ACC, CYAN, HOT, GOOD } = M; const ST = M.S;
      const AMB = "#E9B44C";
      const $s = (k) => M.$("#s" + k);
      const [A, B, C, D, E, F, G, H, I, J, K, L, MM] = "ABCDEFGHIJKLM".split("").map($s);
      const cp = (sc, i) => REEL.hi.caps.filter((c) => c.scene === sc)[i].s;
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:16px;font-size:34px;color:${col}`; } return d; };
      const tile = (host, x, y, w, h, txt, col, fs) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px solid ${M.ca(col || CYAN, .55)};background:${M.ca(col || CYAN, .12)};font:700 ${fs || 38}px var(--code);display:flex;align-items:center;justify-content:center;white-space:nowrap`, txt);
      const lab = (host, css, txt, col, size) => el(host, css + `;font:700 ${size || 44}px var(--code);color:${col || "#B8C4DC"};text-align:center;white-space:nowrap`, txt);
      const counter = (host, css, from, segs, col, size, ts) => { const d = el(host, css + `;font:800 ${size || 96}px var(--code);color:${col};text-align:center;white-space:nowrap`, String(from)); const o = { v: from };
        show(d, ts == null ? segs[0][0] - 0.3 : ts, { opacity: 0 });
        segs.forEach(([t0, t1, to]) => tl.to(o, { v: to, duration: t1 - t0, ease: "power2.inOut", immediateRender: false, onUpdate: () => { d.textContent = Math.round(o.v).toLocaleString("en-US"); } }, t0));
        return d; };
      const ring = (d, t, col) => tl.to(d, { borderColor: col, backgroundColor: M.ca(col, .35), duration: 0.25, immediateRender: false }, t);
      const tint = (d, t, col, fill) => tl.to(d, { borderColor: M.ca(col, .9), backgroundColor: M.ca(col, fill == null ? .28 : fill), duration: 0.3, immediateRender: false }, t);
      const dim = (d, t, op) => tl.to(d, { opacity: op == null ? 0.15 : op, duration: 0.35, immediateRender: false }, t);
      const dimIn = (d, t, op) => { tl.set(d, { opacity: 0 }, 0); tl.to(d, { opacity: op, duration: 0.4, immediateRender: false }, t); return d; };
      const lit = (d, t) => tl.to(d, { opacity: 1, duration: 0.35, immediateRender: false }, t);
      const hide = (d, t) => tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, t);
      const bigtxt = (host, css, txt, col, size, t) => show(lab(host, css, txt, col, size), t, { opacity: 0 });
      const ghost = (host, x, y, w, h) => el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:14px;border:2px dashed rgba(150,175,215,.35)`);
      const chip = (host, x, y, w, h, txt, col, t, fs) => show(tile(host, x, y, w, h, txt, col, fs || 56), t, { opacity: 0, y: 18 });
      // swap the text of a tile: the old tile fades out, a twin with the new text fades in
      const swap = (host, x, y, w, h, a, b, col, t, fs) => { const o = tile(host, x, y, w, h, a, col, fs), n = tile(host, x, y, w, h, b, col, fs); tl.set(o, { opacity: 1 }, 0); tl.to(o, { opacity: 0, duration: 0.2, immediateRender: false }, t); show(n, t, { opacity: 0, scale: 1.06 }); return { o, n }; };
      const AV = [1, 7, 3, 6, 5, 6];
      const AX = (i) => 22 + i * 152;
      // an array row: dashed ghosts + value tiles + index numbers. cells appear at times[i]
      const arr = (host, ya, vals, times, o) => { o = o || {}; const x = o.x || AX, w = o.w || 140, h = o.h || 110, fs = o.fs || 58;
        const ix = vals.map((v, i) => show(lab(host, `left:${x(i)}px;width:${w}px;top:${ya + h + 6}px`, i, "#8FA0BE", 36), 0.1, { opacity: 0 }));
        vals.forEach((v, i) => ghost(host, x(i), ya, w, h));
        const c = vals.map((v, i) => show(tile(host, x(i), ya, w, h, v, CYAN, fs), times[i], { opacity: 0, y: 18 }));
        return { c, ix, x, w, h }; };
      const bk = (host, x0, x1, y, col, t, text) => { const b = el(host, `left:${x0}px;top:${y}px;width:${x1 - x0}px;height:12px;border-radius:6px;background:${col}`); show(b, t, { opacity: 0, scaleX: 0.3 });
        if (text) show(lab(host, `left:${x0}px;width:${x1 - x0}px;top:${y - 56}px`, text, col, 40), t, { opacity: 0 }); return b; };
      const stepRow = (host, y, on) => [1, 2, 3].map((k, i) => tile(host, 20 + i * 320, y, 280, 90, "STEP " + k, k === on ? ACC : CYAN, 44));
      const base = (sc, h) => { const p = panel(sc, 60, 230, 960, h || 1010, CYAN, null); show(p, ST[sc.id.slice(1)] + 0.05); return p; };
      // the three-value state under the array: LEFT | CUR | RIGHT
      const stateTiles = (host, y) => { [["LEFT", 22, CYAN], ["CURRENT", 340, ACC], ["RIGHT", 658, AMB]].forEach(([t, x, c]) => bigtxt(host, `left:${x}px;width:280px;top:${y}px`, t, c, 38, 0.1)); return [22, 340, 658]; };
      const tintRow = (cells, t, cur, ls) => cells.forEach((d, i) => tint(d, t, i < cur ? CYAN : i === cur ? ACC : AMB));

      // diagram: A  (hook: array, left part, right part, are they equal?)
      M.hook(["PIVOT INDEX", "Left sum = right sum?"], { size: 80, top: 250 });
      const pa = panel(A, 60, 500, 960, 800, CYAN, null); show(pa, 0.02);
      const aR = arr(pa, 270, AV, AV.map((v, i) => 0.02 + i * 0.05), { h: 160, fs: 80 });
      bk(pa, AX(0), AX(2) + 140, 220, CYAN, cp("A", 3), "LEFT");
      bk(pa, AX(4), AX(5) + 140, 220, AMB, cp("A", 5), "RIGHT");
      ring(aR.c[3], cp("A", 3), ACC);
      const aQ = tile(pa, 100, 560, 760, 150, "LEFT = RIGHT ?", ACC, 66); dimIn(aQ, 0.1, 0.3); lit(aQ, cp("A", 8));
      M.fit(A, { y: 460, h: 840 });

      // diagram: B  (the definition: index 3 splits 1 7 3 | 6 | 5 6, both sides 11)
      const b0 = ST.B; const pb = base(B, 900);
      const bR = arr(pb, 170, AV, AV.map((v, i) => b0 + 0.1 + i * 0.06), { h: 150, fs: 76 });
      bk(pb, AX(0), AX(2) + 140, 120, CYAN, cp("B", 3), "LEFT");
      bk(pb, AX(4), AX(5) + 140, 120, AMB, cp("B", 10), "RIGHT");
      AV.forEach((v, i) => { tl.to(bR.c[i], { borderColor: ACC, duration: 0.15, immediateRender: false }, cp("B", 22 + i)); tl.to(bR.c[i], { borderColor: M.ca(CYAN, .55), duration: 0.2, immediateRender: false }, cp("B", 22 + i) + 0.3); });
      ring(bR.c[3], cp("B", 29), ACC);
      [0, 1, 2].forEach((i) => tint(bR.c[i], cp("B", 31), CYAN)); [4, 5].forEach((i) => tint(bR.c[i], cp("B", 37), AMB));
      const bL = tile(pb, 22, 400, 440, 150, "1+7+3 = 11", CYAN, 54); dimIn(bL, b0 + 0.1, 0.25); lit(bL, cp("B", 34));
      const bRt = tile(pb, 500, 400, 438, 150, "5+6 = 11", AMB, 54); dimIn(bRt, b0 + 0.1, 0.25); lit(bRt, cp("B", 41));
      const bE = tile(pb, 22, 620, 916, 190, "11 = 11", GOOD, 90); dimIn(bE, b0 + 0.1, 0.2); lit(bE, cp("B", 41) + 0.4);
      tint(bR.c[3], cp("B", 41) + 0.4, GOOD);
      M.fit(B, { y: 200, h: 1100 });

      // diagram: C  (brute force: every index re-adds both sides; 10 billion reads)
      const c0 = ST.C; const pc = base(C, 970);
      const cT = tile(pc, 22, 20, 916, 90, "BRUTE FORCE", ACC, 48); dimIn(cT, c0 + 0.1, 0.3); lit(cT, cp("C", 0));
      const cCells = [];
      [1, 2, 3].forEach((idx, r) => { const y = 135 + r * 110;
        const l = lab(pc, `left:22px;width:110px;top:${y + 16}px;text-align:left`, "i=" + idx, "#B8C4DC", 38); l.style.textAlign = "left"; dimIn(l, c0 + 0.1, 0.3); lit(l, cp("C", 2));
        AV.forEach((v, k) => { const d = tile(pc, 150 + k * 133, y, 120, 90, v, k < idx ? CYAN : k === idx ? ACC : AMB, 46); tint(d, c0 + 0.01, k < idx ? CYAN : k === idx ? ACC : AMB, .25); dimIn(d, c0 + 0.1, 0.3); lit(d, cp("C", 4 + r * 2)); if (k < idx) cCells.push(d); }); });
      bigtxt(pc, "left:22px;width:916px;top:490px", "READS", CYAN, 40, cp("C", 17));
      counter(pc, "left:22px;width:916px;top:535px", 0, [[cp("C", 18), cp("C", 20) + 0.4, 10000000000]], HOT, 96, cp("C", 17));
      M.pill(pc, "EXAMPLE", cp("C", 22), { x: 690, y: 655, w: 250, kind: "out", size: 30 });
      const cO = tile(pc, 22, 735, 916, 110, "O(n²)", HOT, 64); dimIn(cO, c0 + 0.1, 0.2); lit(cO, cp("C", 27));
      cCells.forEach((d) => tint(d, cp("C", 37), HOT));
      bigtxt(pc, "left:22px;width:916px;top:870px", "LEFT SUM AGAIN", HOT, 46, cp("C", 37));
      M.fit(C, { y: 200, h: 1100 });

      // diagram: D  (step 1: total of the whole array once, 28)
      const d0 = ST.D; const pd = base(D, 990);
      const dS = stepRow(pd, 20, 1); dS.forEach((d) => dimIn(d, d0 + 0.1, 0.3)); lit(dS[0], cp("D", 5)); ring(dS[0], cp("D", 5), ACC);
      const dR = arr(pd, 190, AV, AV.map((v, i) => d0 + 0.1 + i * 0.06), { h: 150, fs: 76 });
      AV.forEach((v, i) => { const t = cp("D", 7) + i * 0.9; ring(dR.c[i], t, ACC); tl.to(dR.c[i], { borderColor: M.ca(CYAN, .55), backgroundColor: M.ca(CYAN, .12), duration: 0.25, immediateRender: false }, t + 0.6); });
      bigtxt(pd, "left:22px;width:916px;top:480px", "TOTAL", CYAN, 48, cp("D", 10));
      counter(pd, "left:22px;width:916px;top:550px", 0, [[cp("D", 7), cp("D", 16), 28]], ACC, 200, cp("D", 7) - 0.2);
      const dB = tile(pd, 22, 830, 916, 130, "ONE PASS", GOOD, 60); dimIn(dB, d0 + 0.1, 0.2); lit(dB, cp("D", 11));
      M.fit(D, { y: 200, h: 1100 });

      // diagram: E  (step 2: walk the array, LEFT starts at 0)
      const e0 = ST.E; const pe = base(E, 960);
      const eS = stepRow(pe, 20, 2); eS.forEach((d) => dimIn(d, e0 + 0.1, 0.3)); lit(eS[1], cp("E", 0)); ring(eS[1], cp("E", 0), ACC);
      const eR = arr(pe, 190, AV, AV.map((v, i) => e0 + 0.1 + i * 0.06), { h: 150, fs: 76 });
      const eW = el(pe, `left:${AX(0) - 6}px;top:184px;width:152px;height:162px;border-radius:18px;border:5px solid ${ACC}`); dimIn(eW, e0 + 0.5, 1);
      tl.to(eW, { left: AX(5) - 6, duration: 1.4, ease: "none", immediateRender: false }, cp("E", 3));
      tl.to(eW, { left: AX(0) - 6, duration: 0.5, ease: "power3.inOut", immediateRender: false }, cp("E", 10));
      bigtxt(pe, "left:22px;width:916px;top:480px", "LEFT SUM", CYAN, 48, cp("E", 6));
      const eV = tile(pe, 270, 550, 420, 220, "0", CYAN, 130); dimIn(eV, e0 + 0.1, 0.3); lit(eV, cp("E", 14)); ring(eV, cp("E", 14), GOOD);
      bigtxt(pe, "left:22px;width:916px;top:810px", "NOTHING COUNTED YET", GOOD, 48, cp("E", 18));
      M.fit(E, { y: 200, h: 1100 });

      // diagram: F  (step 3: right = total - left - current; total = three parts, to scale at index 3)
      const f0 = ST.F; const pf = base(F, 960);
      const fS = stepRow(pf, 20, 3); fS.forEach((d) => dimIn(d, f0 + 0.1, 0.3)); lit(fS[2], cp("F", 0)); ring(fS[2], cp("F", 0), ACC);
      const fT = [[22, 190, "RIGHT", AMB, 8], [222, 60, "=", CYAN, 9], [292, 190, "TOTAL", CYAN, 10], [492, 60, "−", HOT, 11], [562, 150, "LEFT", CYAN, 12], [722, 60, "−", HOT, 13], [792, 146, "CUR", ACC, 14]];
      fT.forEach(([x, w, t, c, k]) => { const d = tile(pf, x, 170, w, 130, t, c, 44); dimIn(d, f0 + 0.1, 0.25); lit(d, cp("F", k)); });
      bk(pf, 22, 922, 470, CYAN, cp("F", 16), "TOTAL = 28");
      const U = 900 / 28; let xs = 22;
      [["LEFT", 11, CYAN, 21], ["CUR", 6, ACC, 22], ["RIGHT", 11, AMB, 24]].forEach(([t, n, c, k]) => { const w = n * U; const d = tile(pf, xs, 520, w - 4, 220, t, c, 44); dimIn(d, f0 + 0.1, 0.25); lit(d, cp("F", k)); xs += w; });
      M.pill(pf, "EXAMPLE: INDEX 3", cp("F", 16), { x: 250, y: 790, w: 460, kind: "out", size: 30 });
      M.fit(F, { y: 200, h: 1100 });

      // a value tile that shows a sequence of texts: [[text, t], ...]
      const seqTile = (host, x, y, w, h, col, fs, seq) => seq.map(([txt, t], k) => { const d = tile(host, x, y, w, h, txt, col, fs); show(d, t, { opacity: 0, scale: k ? 1.06 : 1 });
        if (k < seq.length) { const nt = seq[k + 1]; if (nt) tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, nt[1]); } return d; });
      // the shared state view for the dry run: array row, LEFT / CURRENT / RIGHT value tiles, calc chips
      const stateView = (host, s0) => { const r = arr(host, 60, AV, AV.map((v, i) => s0 + 0.1 + i * 0.06)); const X = stateTiles(host, 250); return { r, X }; };
      const calc = (host, y, toks, ts) => { let x = 40; return toks.map(([txt, w, c], k) => { const d = chip(host, x, y, w, 110, txt, c, ts[k], 60); x += w + 10; return d; }); };

      // diagram: G  (index 0: left 0, current 1, right 28-0-1 = 27, not equal; then left becomes 1)
      const g0 = ST.G; const pg = base(G);
      const gv = stateView(pg, g0); tintRow(gv.r.c, g0 + 0.6, 0);
      seqTile(pg, 22, 295, 280, 130, CYAN, 76, [["0", g0 + 0.1], ["1", cp("G", 18)]]);
      seqTile(pg, 340, 295, 280, 130, ACC, 76, [["1", g0 + 0.1]]);
      seqTile(pg, 658, 295, 280, 130, AMB, 76, [["?", g0 + 0.1], ["27", cp("G", 13)]]);
      calc(pg, 470, [[28, 150, AMB], ["−", 80, HOT], [0, 130, CYAN], ["−", 80, HOT], [1, 130, ACC], ["=", 80, CYAN], [27, 170, AMB]].map((a) => a), [7, 8, 9, 10, 11, 12, 13].map((k) => cp("G", k)));
      const gN = tile(pg, 22, 640, 916, 110, "NOT EQUAL", HOT, 60); dimIn(gN, g0 + 0.1, 0.2); lit(gN, cp("G", 14));
      const gAdd = chip(pg, 22, 790, 916, 110, "LEFT + 1  →  1", CYAN, cp("G", 16), 56);
      tint(gv.r.c[0], cp("G", 18), CYAN);
      M.fit(G, { y: 200, h: 1100 });

      // diagram: H  (index 1 right 20, index 2 right 17, left now 11; both not equal)
      const h0 = ST.H; const ph = base(H);
      const hv = stateView(ph, h0); tintRow(hv.r.c, h0 + 0.6, 1);
      tintRow(hv.r.c, cp("H", 4), 2);
      tint(hv.r.c[2], cp("H", 8), CYAN);
      seqTile(ph, 22, 295, 280, 130, CYAN, 76, [["1", h0 + 0.1], ["8", cp("H", 4)], ["11", cp("H", 10)]]);
      seqTile(ph, 340, 295, 280, 130, ACC, 76, [["7", h0 + 0.1], ["3", cp("H", 4)]]);
      seqTile(ph, 658, 295, 280, 130, AMB, 76, [["?", h0 + 0.1], ["20", cp("H", 3)], ["17", cp("H", 7)]]);
      const hC1 = calc(ph, 470, [[28, 150, AMB], ["−", 80, HOT], [1, 130, CYAN], ["−", 80, HOT], [7, 130, ACC], ["=", 80, CYAN], [20, 170, AMB]], [2, 2, 2, 2, 2, 2, 3].map((k) => h0 + 0.2 + (k === 3 ? cp("H", 3) - h0 - 0.2 : 0)));
      hC1.forEach((d) => tl.to(d, { opacity: 0, duration: 0.2, immediateRender: false }, cp("H", 4)));
      const hC2 = calc(ph, 470, [[28, 150, AMB], ["−", 80, HOT], [8, 130, CYAN], ["−", 80, HOT], [3, 130, ACC], ["=", 80, CYAN], [17, 170, AMB]], [4, 4, 4, 4, 4, 4, 7].map((k) => cp("H", k) + (k === 4 ? 0.3 : 0)));
      const hN = tile(ph, 22, 640, 916, 110, "NOT EQUAL", HOT, 60); dimIn(hN, h0 + 0.1, 0.2); lit(hN, cp("H", 12));
      M.fit(H, { y: 200, h: 1100 });

      // diagram: I  (index 3: left 11, current 6, right 28-11-6 = 11, equal, answer 3)
      const i0 = ST.I; const pi = base(I);
      const iv = stateView(pi, i0); tintRow(iv.r.c, i0 + 0.6, 3);
      seqTile(pi, 22, 295, 280, 130, CYAN, 76, [["11", i0 + 0.1]]);
