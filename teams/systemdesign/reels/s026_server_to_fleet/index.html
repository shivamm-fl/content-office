    <script>
      const SC = ["A","B","C","D","E","F","G","H","I","J"];
      const M = Mo.init({ order: SC, tag: "SYSTEM DESIGN · DAY 026 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M;
      const [A, B, C, D, E, F, G, H, I, J] = SC.map((k) => M.$("#s" + k));
      const ST = window.REEL.hi.starts;
      const at = (sc, w, n) => M.W(sc, w, n);
      const GREY = "#8592AD", INK = "#E8EDF6", AMB = "#F2B84B", DEAD = "#5B6577";
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (a, t) => a.forEach((d) => gone(d, t));
      let MP = { a: 400, b: 1165, A: 330, B: 1160, sx: 0.88 };
      const setMap = (a, b, A, B) => { MP = { a, b, A, B, sx: 0.88 }; };
      const ident = () => { MP = { a: 0, b: 1000, A: 0, B: 1000, sx: 1 }; };
      const MX = (x) => 540 + (x - 540) * MP.sx, MW = (w) => w * MP.sx, KY = () => (MP.B - MP.A) / (MP.b - MP.a), MY = (y) => MP.A + (y - MP.a) * KY();
      const chip = (host, txt, cx, y, w, col, t, size, h) => show(el(host, `left:${MX(cx) - MW(w) / 2}px;width:${MW(w)}px;top:${MY(y)}px;height:${h || 72}px;border-radius:14px;border:3px solid ${col};background:#16203A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 ${size || 36}px var(--code);color:${INK};white-space:nowrap`, txt), t, { opacity: 0, y: 10 });
      const stamp = (host, txt, cx, y, w, col, t) => show(el(host, `left:${MX(cx) - MW(w) / 2}px;width:${MW(w)}px;top:${MY(y)}px;height:76px;border-radius:14px;border:3px solid ${col};background:rgba(14,18,30,.95);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 40px var(--code);color:${col};white-space:nowrap`, txt), t, { opacity: 0, scale: 1.08 });
      const meter = (host, x, y, w, lv, col, t) => {
        const W = MW(w), tr = el(host, `left:${MX(x)}px;top:${MY(y)}px;width:${W}px;height:24px;border-radius:12px;background:rgba(150,175,215,.2);overflow:hidden`);
        const f = el(tr, `left:0;top:0;width:${W}px;height:24px;transform-origin:0 50%;background:${col}`);
        tl.set(f, { scaleX: lv, backgroundColor: col }, 0); show(tr, t, { opacity: 0, y: 0 });
        return { tr, set: (tt, l, c, d) => tl.to(f, { scaleX: l, backgroundColor: c, duration: d || 0.7, ease: "power2.out", immediateRender: false }, tt) };
      };
      const line = (host, X1, Y1, X2, Y2, col, w, t, dash) => {
        const x1 = MX(X1), y1 = MY(Y1), x2 = MX(X2), y2 = MY(Y2);
        const L = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        const d = el(host, `left:${x1}px;top:${y1 - w / 2}px;width:${L}px;height:${w}px;` + (dash ? `border-top:${w}px dashed ${col}` : `background:${col};border-radius:${w / 2}px`));
        gsap.set(d, { rotation: a, transformOrigin: "0 50%" }); return show(d, t, { opacity: 0 });
      };
      const dot = (host, X1, Y1, X2, Y2, col, t, dur, hollow) => {
        const x1 = MX(X1), y1 = MY(Y1), x2 = MX(X2), y2 = MY(Y2);
        const d = el(host, `left:${x1 - 14}px;top:${y1 - 14}px;width:28px;height:28px;border-radius:50%;box-sizing:border-box;` + (hollow ? `border:4px solid ${col}` : `background:${col}`));
        tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.05, immediateRender: false }, t);
        tl.to(d, { x: x2 - x1, y: y2 - y1, duration: dur, ease: "none", immediateRender: false }, t); tl.to(d, { opacity: 0, duration: 0.15, immediateRender: false }, t + dur); return d;
      };
      const crowd = (host, cx, y, n, perRow, t, col) => {
        const rows = Math.ceil(n / perRow), w = perRow * 40, wrap = el(host, `left:${MX(cx) - w / 2}px;top:${MY(y)}px;width:${w}px;height:${rows * 40}px`);
        for (let i = 0; i < n; i++) el(wrap, `left:${(i % perRow) * 40 + 7}px;top:${Math.floor(i / perRow) * 40 + 7}px;width:26px;height:26px;border-radius:50%;background:${col || CYAN};opacity:.85`);
        return show(wrap, t, { opacity: 0, y: 10 });
      };
      const ic = (host, kind, x, y, size, col) => M.icon(host, kind, MX(x + size / 2) - size / 2, MY(y), size, col);
      const SHOW0 = (sc) => ST[sc] + 0.15;
      // a flat tile: icon + label, any size; o.col stacks the icon above the label
      const T = (host, x, y, w, h, label, icon, col, t, o) => { o = o || {};
        const d = el(host, `left:${MX(x)}px;top:${MY(y)}px;width:${MW(w)}px;height:${h * KY()}px;border-radius:22px;border:3px solid ${M.ca(col, 0.6)};background:#16203A;box-sizing:border-box;display:flex;flex-direction:${o.col ? "column" : "row"};align-items:center;justify-content:center;gap:${o.col ? 2 : 14}px;font:800 ${o.size || 40}px var(--lat);color:${INK};white-space:nowrap`,
          `<svg viewBox="0 0 64 64" width="${o.is || 48}" height="${o.is || 48}" style="flex:none;overflow:visible">${icon ? Viz.ICONS[icon](col) : ""}</svg><span>${label}</span>`);
        return show(d, t, { opacity: 0, scale: 0.92, y: 0 }); };
      const RING = (host, x, y, w, h, col, t, t2) => { const r = el(host, `left:${MX(x) - 7}px;top:${MY(y) - 7}px;width:${MW(w) + 14}px;height:${h * KY() + 14}px;border-radius:26px;border:4px solid ${col};box-sizing:border-box;pointer-events:none`);
        tl.set(r, { opacity: 0 }, 0); tl.to(r, { opacity: 1, duration: 0.25, immediateRender: false }, t); if (t2 != null) tl.to(r, { opacity: 0, duration: 0.25, immediateRender: false }, t2); return r; };
      const SLOT = (host, x, y, w, h, t, lab) => show(el(host, `left:${MX(x)}px;top:${MY(y)}px;width:${MW(w)}px;height:${h * KY()}px;border-radius:22px;border:3px dashed ${M.ca(GREY, 0.6)};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:800 ${lab && lab.length < 5 ? 30 : 38}px var(--lat);color:#7F8BAA;white-space:nowrap`, lab || ""), t, { opacity: 0, y: 0 });
      const SW = "<svg viewBox='0 0 64 64' width='44' height='44'>";

      // ===== the route frame (same place in every scene C to G) =====
      const ROW = { cdn: 350, gw: 495, lb: 640, app: 785, cache: 930, db: 1075, rep: 1220 }, TH = 110, TX = 70, TWD = 500, TC = 320, RCX = 810, RW = 380;
      const KEYS = { app: ["APP SERVERS", "gear"], cdn: ["CDN", "globe"], gw: ["API GATEWAY", "shield"], lb: ["LOAD BALANCER", "bolt"], cache: ["CACHE", "bolt"], db: ["DATABASE", "db"] };
      const RM = () => { setMap(250, 1330, 330, 1160); MP.sx = 1; };
      const mkT = (host, key, t, col) => T(host, TX, ROW[key], TWD, TH, KEYS[key][0], KEYS[key][1], col || CYAN, t);
      const slotK = (host, key, t) => SLOT(host, TX, ROW[key], TWD, TH, t, KEYS[key][0]);
      const AX = (i) => TX + i * 129;
      const mkApp = (host, i, t) => T(host, AX(i), ROW.app, 112, TH, "APP", "gear", CYAN, t, { col: 1, size: 32, is: 36 });
      const slotApp = (host, i, t) => SLOT(host, AX(i), ROW.app, 112, TH, t, "APP");
      const wire = (host, a, b, t) => line(host, TC, ROW[a] + TH, TC, ROW[b], GREY, 5, t);
      const lbLine = (host, i, t) => line(host, TC, ROW.lb + TH, AX(i) + 56, ROW.app, GREY, 4, t);
      const cacheLine = (host, i, t) => line(host, AX(i) + 56, ROW.app + TH, TC, ROW.cache, GREY, 4, t);
      const userIc = (host, t) => ic(host, "user", 275, 240, 90, CYAN).show(t);

      // diagram: A
      ident();
      M.hook(["100 servers,", "1 box can sink it."], { size: 88, top: 250 });
      const gridCells = (host, x0, y0, t, P, CS) => { P = P || 36; CS = CS || 28; const w = el(host, `left:${x0}px;top:${y0}px;width:${P * 10}px;height:${P * 10}px`); const cs = [];
        for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) cs.push(el(w, `left:${c * P}px;top:${r * P}px;width:${CS}px;height:${CS}px;border-radius:6px;background:${GOOD}`));
        show(w, t, { opacity: 0, y: 8 }); return { w, cs, grey: (tt, d) => tl.to(cs, { backgroundColor: DEAD, duration: d || 0.5, stagger: { each: 0.004, from: "random" }, ease: "none", immediateRender: false }, tt), green: (tt, d) => tl.to(cs, { backgroundColor: GOOD, duration: d || 0.5, stagger: { each: 0.004, from: "random" }, ease: "none", immediateRender: false }, tt) }; };
      const gA = gridCells(A, 320, 500, 0.05, 44, 36);
      [420, 540, 660].forEach((x, i) => line(A, x, 945, x, 1010, GREY, 5, 0.3 + i * 0.1));
      const aBox = T(A, 240, 1010, 600, 150, "ONE BOX", "gear", GREY, 0.1);
      RING(A, 240, 1010, 600, 150, AMB, at("A", "akela", 0), at("A", "gira", 0) - 0.1);
      tl.to(aBox, { borderColor: M.ca(HOT, 0.9), duration: 0.3, immediateRender: false }, at("A", "gira", 0));
      ic(A, "cross", 740, 1045, 80, HOT).show(at("A", "gira", 0));
      gA.grey(at("A", "gira", 0) + 0.3, 0.6);
      M.fit(A, { y: 460, h: 800 });

      // diagram: B
      ident();
      const gB = gridCells(B, 360, 520, SHOW0("B"));
      const b1 = T(B, 190, 960, 300, 120, "BOX", "gear", GREY, SHOW0("B"));
      const bL1 = line(B, 440, 890, 340, 960, GREY, 5, SHOW0("B"));
      const bL2 = line(B, 640, 890, 740, 960, GREY, 5, at("B", "bachne", 0) + 0.1);
      const bSp = stamp(B, "SPOF", 540, 1130, 260, HOT, at("B", "point", 0));
      tl.to(b1, { borderColor: M.ca(HOT, 0.9), duration: 0.3, immediateRender: false }, at("B", "girne", 0));
      const bX = ic(B, "cross", 410, 975, 60, HOT); bX.show(at("B", "girne", 0));
      gB.grey(at("B", "system", 0), 0.6);
      gone(bSp, at("B", "isi", 0)); bX.hide(at("B", "isi", 0));
      const b2 = T(B, 590, 960, 300, 120, "COPY", "gear", GOOD, at("B", "bachne", 0));
      gB.green(at("B", "bachne", 0) + 0.3, 0.6);
      const bFrame = show(el(B, `left:343px;top:503px;width:394px;height:394px;border-radius:18px;border:4px dashed ${AMB};box-sizing:border-box`), at("B", "fleet", 0), { opacity: 0, y: 0 });
      const bFleet = chip(B, "FLEET", 540, 440, 240, AMB, at("B", "fleet", 0), 36, 64);
      const tB3 = at("B", "ek", 0) - 0.2;
      goneAll([gB.w, b1, b2, bFrame, bFleet, bL1, bL2], tB3 - 0.1);
      RM();
      const bU = userIc(B, tB3 + 0.1);
      ["cdn", "gw", "lb", "cache", "db"].forEach((k, i) => slotK(B, k, tB3 + 0.1 + i * 0.1));
      slotK(B, "app", tB3 + 0.3);
      dot(B, TC, 335, TC, 1130, AMB, at("B", "raasta", 0), 2.9);
      ["cdn", "gw", "lb", "app", "cache", "db"].forEach((k, i) => show(el(B, `left:${MX(RCX) - 30}px;top:${MY(ROW[k] + 20)}px;font:800 56px var(--code);color:${AMB}`, "?"), at("B", "har", 0) + i * 0.22, { opacity: 0, y: 0 }));
      chip(B, "WHY HERE?", RCX, 252, 340, AMB, at("B", "kyun", 0) - 0.2, 40, 60);
      M.fit(B, { y: 230, h: 1010 });

      // diagram: C
      ident();
      chip(C, "MORE TRAFFIC", 540, 310, 420, CYAN, at("C", "Traffic", 0), 34, 64);
      crowd(C, 540, 390, 8, 8, SHOW0("C"), CYAN); crowd(C, 540, 430, 8, 8, at("C", "badhta", 0), CYAN); crowd(C, 540, 470, 8, 8, at("C", "badhta", 0) + 0.2, CYAN);
      line(C, 540, 520, 540, 640, GREY, 5, at("C", "Traffic", 0) + 0.2);
      const cT = T(C, 190, 640, 700, 170, "ONE PART", "gear", CYAN, SHOW0("C")); const cM = meter(C, 190, 835, 700, 0.25, GOOD, SHOW0("C"));
      const cF = chip(C, "FILLS FIRST", 540, 890, 420, AMB, at("C", "pehle", 0), 34, 64);
      cM.set(at("C", "bharti", 0), 1, HOT, 0.8);
      const tJ = at("C", "judta", 0) - 0.9;
      goneAll([cT, cM.tr, cF], tJ);
      const cT1 = T(C, 190, 640, 330, 170, "PART", "gear", CYAN, tJ + 0.3); const cM1 = meter(C, 190, 835, 330, 1, HOT, tJ + 0.3);
      const cT2 = T(C, 560, 640, 330, 170, "+ BOX", "bolt", GOOD, at("C", "judta", 0) - 0.2); const cM2 = meter(C, 560, 835, 330, 0.3, GOOD, at("C", "judta", 0) - 0.2);
      cM1.set(at("C", "judta", 0) + 0.2, 0.3, GOOD, 0.7);
      chip(C, "6 STOPS", 540, 955, 340, CYAN, at("C", "6", 0) - 0.1, 36, 64);
      [1, 2, 3, 4, 5, 6].forEach((n, i) => { const bd = el(C, `left:${160 + i * 152 - 48}px;top:1040px;width:96px;height:96px;border-radius:50%;border:4px solid ${AMB};background:#16203A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:800 52px var(--code);color:${AMB}`, String(n)); show(bd, at("C", "6", 0) + i * 0.12, { opacity: 0, scale: 0.6, y: 0 }); });
      M.fit(C, { y: 230, h: 1010 });

      // diagram: D
      RM();
      userIc(D, SHOW0("D"));
      ["cdn", "gw", "lb", "cache", "db"].forEach((k) => D["s_" + k] = slotK(D, k, SHOW0("D")));
      [0, 1, 2].forEach((i) => slotApp(D, i, SHOW0("D")));
      const tCdn = at("D", "CDN", 0) - 0.15, tGw = at("D", "gateway", 0) - 0.25;
      gone(D.s_cdn, tCdn - 0.4); gone(D.s_gw, tGw - 0.4);
      mkT(D, "cdn", tCdn); line(D, TC, 330, TC, ROW.cdn, GREY, 5, tCdn + 0.1); RING(D, TX, ROW.cdn, TWD, TH, AMB, tCdn + 0.1, tGw - 0.3);
      const dM = meter(D, 620, ROW.cdn + 78, 380, 1, HOT, tCdn + 0.4);
      const imgEl = show(el(D, `left:${MX(RCX) - 45}px;top:${MY(ROW.cdn)}px;width:90px;height:90px`, `<svg viewBox="0 0 64 64" width="90" height="90">${Viz.ICONS.image(CYAN)}</svg>`), at("D", "images", 0), { opacity: 0, y: 0 });
      tl.to(imgEl, { x: MX(TC + 60) - MX(RCX), y: MY(262) - MY(ROW.cdn), duration: 0.7, ease: "power2.inOut", immediateRender: false }, at("D", "de", 0));
      gone(imgEl, at("D", "de", 0) + 0.75);
      chip(D, "FILE LOAD", RCX, ROW.cdn, RW, HOT, tCdn + 0.4, 40, 60); dM.set(at("D", "bojh", 0) + 0.2, 0.25, GOOD, 0.8);
      mkT(D, "gw", tGw); wire(D, "cdn", "gw", tGw + 0.1); RING(D, TX, ROW.gw, TWD, TH, AMB, tGw + 0.1);
      const dC1 = chip(D, "ONE ENTRY", RCX, ROW.gw, RW, CYAN, at("D", "single", 0) - 0.1, 40, 60);
      gone(dC1, at("D", "login", 0) - 0.4);
      const dC2 = chip(D, "LOGIN CHECK", RCX, ROW.gw, RW, CYAN, at("D", "login", 0), 40, 60);
      gone(dC2, at("D", "rate", 0) - 0.35);
      const dC3 = chip(D, "RATE LIMIT", RCX, ROW.gw, RW, AMB, at("D", "rate", 0), 40, 60);
      gone(dC3, at("D", "429", 0) - 0.3);
      [0, 1, 2, 3].forEach((i) => dot(D, TC, 330, TC, ROW.gw, HOT, at("D", "zyada", 0) + 0.1 + i * 0.22, 0.45));
      [0, 1].forEach((i) => dot(D, TC, ROW.gw, TC, 330, HOT, at("D", "429", 0) + 0.1 + i * 0.15, 0.45, true));
      stamp(D, "429", RCX, ROW.gw, 220, HOT, at("D", "429", 0));
      chip(D, "TOO MANY", RCX, ROW.gw + 80, RW, HOT, at("D", "bahut", 0), 38, 56);
      M.fit(D, { y: 230, h: 1010 });

      // diagram: E
      RM();
      userIc(E, SHOW0("E")); mkT(E, "cdn", SHOW0("E")); mkT(E, "gw", SHOW0("E")); line(E, TC, 330, TC, ROW.cdn, GREY, 5, SHOW0("E")); wire(E, "cdn", "gw", SHOW0("E"));
      const eSl = {}; ["lb", "cache", "db"].forEach((k) => eSl[k] = slotK(E, k, SHOW0("E")));
      const eSa = [0, 1, 2].map((i) => slotApp(E, i, SHOW0("E")));
      const tLb = at("E", "balancer", 0) - 0.3;
