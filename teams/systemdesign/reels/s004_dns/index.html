<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},
  {"id":"bedSrc","type":"string","label":"Music bed (ducked)","default":"audio/hi/bed.wav"},
  {"id":"sfxSrc","type":"string","label":"SFX track","default":"audio/hi/sfx.wav"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DNS: naam se machine ka address</title>
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <link rel="stylesheet" href="kit/motion.css" />
    <script src="kit/motion.js"></script>
    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="111" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="111" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="111" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="111" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H"], tag: "SYSTEM DESIGN · DAY 004 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M;
      const [A, B, C, D, E, F, G, H] = ["A","B","C","D","E","F","G","H"].map((k) => M.$("#s" + k));
      const at = (sc, w, n) => M.W(sc, w, n);
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:22px;font-size:40px;color:${col}`; } return d; };
      const kick = (host, txt, t) => show(el(host, `left:0;width:1080px;text-align:center;top:196px;font:700 46px var(--code);letter-spacing:.14em;color:${ACC}`, txt), t, { opacity: 0, y: 0 });
      const lab = (host, x, y, w, col, txt, t, size) => show(el(host, `left:${x}px;width:${w}px;text-align:center;top:${y}px;font:600 ${size || 38}px var(--code);letter-spacing:.06em;color:${col};white-space:nowrap`, txt), t, { opacity: 0, y: 12 });
      const stamp = (host, txt, cx, y, col, t, size) => { const d = el(host, `left:${cx - 230}px;width:460px;text-align:center;top:${y}px;padding:14px 0;border:3px solid ${col};border-radius:14px;background:rgba(14,18,30,.95);font:700 ${size || 52}px var(--code);color:${col};white-space:nowrap`, txt); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const dim = (b, t, op) => tl.to([b.el, b.parts[1]], { opacity: op || 0.5, duration: 0.3, immediateRender: false }, t);
      Viz.ICONS.phone = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="17" y="4" width="30" height="56" rx="7"/><path d="M28 52h8"/></g>`;
      Viz.ICONS.server = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="8" width="48" height="16" rx="4"/><rect x="8" y="28" width="48" height="16" rx="4"/><rect x="8" y="48" width="48" height="12" rx="4"/><path d="M16 16h4M16 36h4"/></g>`;
      const IP = "93.184.216.34";
      // chain geometry shared by scenes C, D, E, H (x 90, w 560); each scene picks box height and gap
      const CX = 90, CW = 560, KEYS = ["phone", "res", "root", "tld", "auth"];
      const mkChain = (h, gap) => { const y = (k) => 280 + KEYS.indexOf(k) * (h + gap);
        return { h, y,
          node: (host, key, label, icon, col, t, size) => { const b = M.box(host, { x: CX, y: y(key), w: CW, h, label, icon, color: col, size: size || 48 }); b.show(t); return b; },
          down: (host, a, b, t, col) => { const r = M.arrow(host, { from: [250, y(a) + h], to: [250, y(b)], color: col || ACC, w: 10 }); r.show(t, 0.2); return r; },
          up: (host, a, b, t) => { const r = M.arrow(host, { from: [490, y(a)], to: [490, y(b) + h], color: GOOD, w: 10 }); r.show(t, 0.2); return r; },
          chip: (host, key, txt, t, col) => show(el(host, `left:690px;top:${y(key) + (h - 110) / 2}px;width:330px;height:110px;border:3px solid ${col || GOOD};border-radius:18px;background:${M.ca(col || GOOD, 0.14)};display:flex;align-items:center;justify-content:center;font:700 38px var(--code);color:${col || GOOD};white-space:nowrap`, txt), t, { opacity: 0, x: -30, y: 0 }),
          tag: (host, key, txt, t, col) => lab(host, 690, y(key) + (h - 50) / 2, 330, col, txt, t, 38) };
      };
      // ===== A: the phone knows only the name =====
      // diagram: A
      M.hook(["Phone ko pata nahi:", "google.com ka address"], { size: 88, top: 250 });
      const aP = M.box(A, { x: 70, y: 520, w: 400, h: 440, label: "PHONE", icon: "phone", color: ACC, size: 56, isize: 160 }); aP.show(0.05);
      const aS = M.box(A, { x: 610, y: 520, w: 400, h: 440, label: "SERVER", icon: "server", color: CYAN, size: 56, isize: 160 }); aS.show(0.1);
      const aAr = M.arrow(A, { from: [480, 740], to: [600, 740], color: "#8592AD", w: 8, dash: true }); aAr.show(0.3, 0.3);
      const aN = M.pill(A, "google.com", 0.2, { x: 85, y: 990, kind: "acc", size: 48 });
      const aQ = lab(A, 590, 985, 440, HOT, "?.?.?.?", 0.3, 60);
      const aIpL = lab(A, 590, 1075, 440, ACC, "IP ADDRESS", at("A", "IP"), 46);
      tl.to(aQ, { color: ACC, duration: 0.3, immediateRender: false }, at("A", "number", 0));
      const aD = M.box(A, { x: 70, y: 1160, w: 440, h: 180, label: "DNS", icon: "search", color: GOOD, size: 60 }); aD.show(at("A", "DNS"));
      [0, 1, 2].forEach((k) => M.pill(A, "?", at("A", "kai") + k * 0.2, { x: 570 + k * 150, y: 1205, kind: "out", size: 54 }));
      M.fit(A, { y: 460, h: 900 });

      // ===== B: contacts, then the first place = own memory (cache) =====
      // diagram: B
      kick(B, "LIKE CONTACTS", M.S.B + 0.1);
      const bC = show(panel(B, 90, 330, 900, 520, CYAN, "CONTACTS"), M.S.B + 0.2);
      const bRow = el(bC, `left:40px;top:150px;width:820px;height:200px;border-radius:18px;border:3px solid rgba(150,175,215,.3)`);
      show(bRow, M.S.B + 0.4, { opacity: 0, y: 0 });
      const bName = show(el(bRow, `left:40px;top:50px;font:700 80px var(--lat)`, "Mom"), M.S.B + 0.4, { opacity: 0, y: 0 });
      const bNum = show(el(bRow, `right:40px;top:60px;font:700 72px var(--code);color:${ACC}`, "• • • • •"), at("B", "number"), { opacity: 0, y: 0 });
      tl.to(bRow, { borderColor: M.ca(ACC, 0.95), backgroundColor: M.ca(ACC, 0.14), duration: 0.25, immediateRender: false }, at("B", "naam"));
      const bTap = lab(B, 90, 910, 900, ACC, "NAME  >  NUMBER", at("B", "tum"), 54);
      const bCt = [bC, bRow, bName, bNum, bTap];
      bCt.forEach((d) => gone(d, at("B", "pahli") - 0.1));
      const bPh = show(panel(B, 90, 300, 900, 960, ACC, "PHONE"), at("B", "pahli"));
      const bCa = show(panel(B, 130, 420, 820, 650, CYAN, "CACHE"), at("B", "apni"));
      const rows = [["example.com", IP], ["mozilla.org", "192.0.2.172"]];
      const bR = rows.map(([n, ip], i) => { const r = el(bCa, `left:30px;top:${110 + i * 250}px;width:760px;height:230px;border-radius:18px;border:3px solid rgba(150,175,215,.3)`);
        el(r, `left:30px;top:24px;font:700 56px var(--lat)`, n); el(r, `left:30px;top:116px;font:700 64px var(--code);color:${ACC}`, ip); show(r, at("B", "copy") + i * 0.25, { opacity: 0, y: 12 }); return r; });
      M.pill(B, "EXAMPLE", at("B", "copy") + 0.3, { x: 395, y: 1100, kind: "out", size: 44 });
      tl.to(bR[0], { borderColor: M.ca(GOOD, 0.95), backgroundColor: M.ca(GOOD, 0.16), duration: 0.25, immediateRender: false }, at("B", "gaya"));
      const bOk = M.icon(B, "check", 800, 545, 100, GOOD); bOk.show(at("B", "gaya"));
      stamp(B, "FOUND", 540, 1170, GOOD, at("B", "vahin"), 60);
      M.fit(B);

      // ===== C: resolver and root =====
      // diagram: C
      kick(C, "ASK, ASK, ASK", M.S.C + 0.1);
      const K = mkChain(220, 110);
      const cP = K.node(C, "phone", "PHONE", "phone", ACC, M.S.C + 0.15, 60);
      const cR = K.node(C, "res", "RESOLVER", "search", CYAN, at("C", "resolver"), 60);
      const cd1 = K.down(C, "phone", "res", at("C", "resolver") + 0.2); cd1.travel(at("C", "resolver") + 0.3, 0.5, "#fff");
      const cRt = K.node(C, "root", "ROOT", "globe", CYAN, at("C", "root"), 60);
      const cd2 = K.down(C, "res", "root", at("C", "root") + 0.2); cd2.travel(at("C", "root") + 0.3, 0.5, "#fff");
      const cx = K.tag(C, "root", "FULL ADDRESS ?", at("C", "Root"), HOT);
      gone(cx, at("C", "com") - 0.1);
      K.chip(C, "root", ".COM SERVER", at("C", "com"));
      const cu2 = K.up(C, "root", "res", at("C", "com") + 0.1); cu2.travel(at("C", "com") + 0.2, 0.5, GOOD);
      M.fit(C);

      // ===== D: the TLD =====
      // diagram: D
      kick(D, "TLD = LAST PART", M.S.D + 0.1);
      const K2 = mkChain(170, 90);
      const dName = show(el(D, `left:670px;top:290px;width:370px;text-align:center;font:700 46px var(--code);color:${M.TEXT};white-space:nowrap`, 'example<span class="tl" style="color:#E8EDF6">.com</span>'), M.S.D + 0.2);
      tl.to(dName.querySelector(".tl"), { color: ACC, duration: 0.3, immediateRender: false }, at("D", "aakhiri"));
      const dTl = lab(D, 670, 355, 370, ACC, "TLD", at("D", "TLD", 0), 54);
      const dP = K2.node(D, "phone", "PHONE", "phone", ACC, M.S.D + 0.15); dim(dP, M.S.D + 0.7, 0.55);
      const dR = K2.node(D, "res", "RESOLVER", "search", CYAN, M.S.D + 0.2);
      const dRt = K2.node(D, "root", "ROOT", "globe", CYAN, M.S.D + 0.25); dim(dRt, M.S.D + 0.7, 0.55);
      const dT = K2.node(D, "tld", "TLD", "book", GOOD, at("D", "TLD", 1));
      const dd = M.arrow(D, { from: [250, K2.y("res") + 170], to: [250, K2.y("tld")], color: ACC, w: 10 }); dd.show(at("D", "TLD", 1) + 0.2, 0.2); dd.travel(at("D", "TLD", 1) + 0.3, 0.5, "#fff");
      const dx = K2.tag(D, "tld", "NO ADDRESS", at("D", "address", 0), HOT); gone(dx, at("D", "batata") - 0.1);
      K2.chip(D, "tld", "NAME SERVER", at("D", "batata", 0), GOOD);
      const du = M.arrow(D, { from: [490, K2.y("tld")], to: [490, K2.y("res") + 170], color: GOOD, w: 10 }); du.show(at("D", "domain", 1) - 0.4, 0.2); du.travel(at("D", "domain", 1) - 0.3, 0.5, GOOD);
      M.fit(D);

      // ===== E: authoritative server, the IP, back to the phone =====
      // diagram: E
      kick(E, "THE REAL RECORD", M.S.E + 0.1);
      const K3 = mkChain(150, 62);
      const eP = K3.node(E, "phone", "PHONE", "phone", ACC, M.S.E + 0.1); dim(eP, M.S.E + 0.6, 0.7);
      const eR = K3.node(E, "res", "RESOLVER", "search", CYAN, M.S.E + 0.15); dim(eR, M.S.E + 0.6, 0.7);
      const eRt = K3.node(E, "root", "ROOT", "globe", CYAN, M.S.E + 0.2); dim(eRt, M.S.E + 0.6, 0.45);
      const eT = K3.node(E, "tld", "TLD", "book", CYAN, M.S.E + 0.25); dim(eT, M.S.E + 0.6, 0.45);
      const eA = K3.node(E, "auth", "AUTH SERVER", "db", GOOD, at("E", "authoritative"));
      const ed = M.arrow(E, { from: [250, K3.y("res") + 150], to: [250, K3.y("root")], color: "#8592AD", w: 6 }); ed.show(M.S.E + 0.4, 0.2);
      const ed3 = M.arrow(E, { from: [250, K3.y("root") + 150], to: [250, K3.y("tld")], color: "#8592AD", w: 6 }); ed3.show(M.S.E + 0.45, 0.2);
      const ed2 = M.arrow(E, { from: [250, K3.y("tld") + 150], to: [250, K3.y("auth")], color: ACC, w: 10 }); ed2.show(at("E", "authoritative") + 0.2, 0.2); ed2.travel(at("E", "authoritative") + 0.3, 0.5, "#fff");
      const recY = K3.y("auth") - 20;
      const rec = show(panel(E, 690, recY, 330, 190, GOOD, "RECORD"), at("E", "record")); gone(rec, at("E", "IP") - 0.1);
      el(rec, `left:10px;top:78px;width:310px;text-align:center;font:700 38px var(--lat)`, "example.com");
      el(rec, `left:10px;top:130px;width:310px;text-align:center;font:700 36px var(--code);color:${ACC}`, IP);
      M.pill(E, "EXAMPLE", at("E", "record"), { x: 725, y: recY - 80, kind: "out", size: 40 });
      // the IP travels up the right side to the phone
      const ipTop = K3.y("auth") + 25;
      const eIp = el(E, `left:690px;top:${ipTop}px;width:330px;height:100px;border-radius:18px;border:3px solid ${ACC};background:rgba(14,18,30,.95);display:flex;align-items:center;justify-content:center;font:700 36px var(--code);color:${ACC};white-space:nowrap`, IP);
      tl.set(eIp, { opacity: 0 }, 0);
      tl.to(eIp, { opacity: 1, duration: 0.3, immediateRender: false }, at("E", "IP") + 0.3);
      tl.to(eIp, { y: -(K3.y("auth") - K3.y("phone")), duration: 1.1, ease: "power2.inOut", immediateRender: false }, at("E", "Resolver"));
      tl.to(eP.el, { opacity: 1, duration: 0.3, immediateRender: false }, at("E", "lauta"));
      lab(E, 690, K3.y("phone") + 120, 330, GOOD, "GOT IT", at("E", "lauta") + 0.3, 56);
      M.fit(E);

      // ===== F: TTL, answers are cached for a limited time =====
      // diagram: F
      kick(F, "CACHE + TIME LIMIT", M.S.F + 0.1);
      const fPh = show(panel(F, 90, 320, 900, 640, ACC, "CACHE"), M.S.F + 0.2);
      const mkRow = (host, col) => { const r = el(host, `left:40px;top:110px;width:820px;height:210px;border-radius:18px;border:3px solid ${M.ca(col, 0.9)};background:${M.ca(col, 0.14)}`);
        el(r, `left:30px;top:22px;font:700 56px var(--lat)`, "example.com"); el(r, `left:30px;top:106px;font:700 66px var(--code);color:${ACC}`, IP); return r; };
      const fRow = mkRow(fPh, GOOD); show(fRow, at("F", "jawab"), { opacity: 0, y: 12 });
      const fClk = M.icon(F, "clock", 140, 690, 130, ACC); fClk.show(at("F", "tay"));
      const fTrack = el(F, `left:320px;top:735px;width:600px;height:44px;border-radius:22px;background:rgba(133,146,173,.25)`);
      const fBar = el(F, `left:320px;top:735px;width:600px;height:44px;border-radius:22px;background:${ACC};transform-origin:0 50%`);
      show(fTrack, at("F", "tay"), { opacity: 0, y: 0 });
      tl.set(fBar, { opacity: 0, scaleX: 1 }, 0); tl.to(fBar, { opacity: 1, duration: 0.2, immediateRender: false }, at("F", "tay"));
      tl.to(fBar, { scaleX: 0.02, duration: at("F", "khatam") - at("F", "tay"), ease: "none", immediateRender: false }, at("F", "tay"));
      lab(F, 320, 805, 600, ACC, "TTL", at("F", "TTL", 0), 60);
      tl.to(fRow, { borderColor: M.ca(HOT, 0.95), backgroundColor: M.ca(HOT, 0.14), duration: 0.25, immediateRender: false }, at("F", "khatam"));
      const fSt = stamp(F, "EXPIRED", 540, 880, HOT, at("F", "khatam"), 56);
      // the old row goes, a fresh one arrives after the new question
      const tNew = at("F", "poocha") + 0.5;
      gone(fRow, tNew - 0.1); gone(fSt, tNew - 0.1); [fClk.el || fClk, fTrack, fBar].forEach((d) => gone(d, tNew - 0.1));
      const fRow2 = mkRow(fPh, GOOD); show(fRow2, tNew, { opacity: 0, y: 12 });
      const fR = M.box(F, { x: 90, y: 1060, w: 900, h: 190, label: "RESOLVER", sub: "ASK AGAIN", subsize: 42, icon: "search", color: CYAN, size: 56 }); fR.show(at("F", "naya") - 0.2);
      const fa = M.arrow(F, { from: [540, 1060], to: [540, 965], color: GOOD, w: 10 }); fa.show(at("F", "poocha") - 0.3, 0.2); fa.travel(at("F", "poocha") - 0.2, 0.5, GOOD);
      M.fit(F);

      // ===== G: the address changes, old copies live until TTL ends =====
      // diagram: G
      kick(G, "ADDRESS CHANGED", M.S.G + 0.1);
      const gA = M.box(G, { x: 90, y: 300, w: 380, h: 190, label: "AUTH", sub: "example.com", subsize: 36, icon: "db", color: GOOD, size: 46 }); gA.show(M.S.G + 0.15);
      const gOld = show(el(G, `left:540px;top:310px;width:440px;height:170px;border-radius:18px;border:3px solid #8592AD;display:flex;align-items:center;justify-content:center;font:700 52px var(--code);color:#A9B6D0`, "OLD IP"), M.S.G + 0.3);
      const gNew = el(G, `left:540px;top:310px;width:440px;height:170px;border-radius:18px;border:3px solid ${ACC};background:${M.ca(ACC, 0.16)};display:flex;align-items:center;justify-content:center;font:700 52px var(--code);color:${ACC}`, "NEW IP");
      tl.set(gNew, { opacity: 0 }, 0); tl.to(gNew, { opacity: 1, duration: 0.25, immediateRender: false }, at("G", "badlo")); tl.to(gOld, { opacity: 0, duration: 0.2, immediateRender: false }, at("G", "badlo"));
      const ends = [at("G", "khatam"), at("G", "badlav") + 0.2, at("G", "samay") + 0.5];
      ["BROWSER", "COMPUTER", "RESOLVER"].forEach((nm, i) => {
        const y = 580 + i * 240; const c = show(panel(G, 90, y, 900, 210, CYAN, null), at("G", "cache") - 0.2 + i * 0.15);
        el(c, `left:30px;top:20px;font:700 40px var(--code);color:${CYAN}`, nm);
