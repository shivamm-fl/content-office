    <script>
      const SC = ["A","B","C","D","E","F","G","H","I","J"];
      const M = Mo.init({ order: SC, tag: "SYSTEM DESIGN · DAY 024 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M;
      const [A, B, C, D, E, F, G, H, I, J] = SC.map((k) => M.$("#s" + k));
      const S = M.S;
      const at = (sc, w, n) => M.W(sc, w, n);
      const GREY = "#8592AD", INK = "#E8EDF6";
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const goneAll = (a, t) => a.forEach((d) => gone(d, t));
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:22px;font-size:40px;color:${col}`; } return d; };
      const stamp = (host, txt, cx, y, col, t, size, w) => { const W = w || 460; const d = el(host, `left:${cx - W / 2}px;width:${W}px;text-align:center;top:${y}px;padding:14px 0;border:3px solid ${col};border-radius:14px;background:rgba(14,18,30,.95);font:700 ${size || 52}px var(--code);color:${col};white-space:nowrap;box-sizing:border-box`, txt); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const chip = (host, txt, cx, y, w, col, t, size, h) => show(el(host, `left:${cx - w / 2}px;width:${w}px;top:${y}px;height:${h || 76}px;border-radius:14px;border:3px solid ${col};background:#16203A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 ${size || 40}px var(--code);color:${INK};white-space:nowrap`, txt), t, { opacity: 0, y: 10 });
      const ring = (host, x, y, w, h, col, t, tOff) => { const d = show(el(host, `left:${x - 6}px;top:${y - 6}px;width:${w + 12}px;height:${h + 12}px;border-radius:20px;border:5px solid ${col};box-sizing:border-box`), t, { opacity: 0, y: 0 }); if (tOff != null) gone(d, tOff); return d; };
      const sv = (kind, size, col) => `<svg viewBox="0 0 64 64" width="${size}" height="${size}" style="overflow:visible">${Viz.ICONS[kind](col)}</svg>`;
      const ico = (host, kind, cx, cy, size, col, t) => show(el(host, `left:${cx - size / 2}px;top:${cy - size / 2}px;width:${size}px;height:${size}px`, sv(kind, size, col)), t, { opacity: 0, scale: 0.8, y: 0 });
      const dot = (host, x0, y0, x1, y1, t, col, dur, o) => { o = o || {}; const d = el(host, `left:${x0 - 22}px;top:${y0 - 22}px;width:44px;height:44px;border-radius:50%;box-sizing:border-box;${o.hollow ? `border:6px solid ${col}` : `background:${col}`}`);
        tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.1, immediateRender: false }, t);
        tl.to(d, { x: x1 - x0, y: y1 - y0, duration: dur, ease: "power1.inOut", immediateRender: false }, t);
        if (!o.stay) tl.to(d, { opacity: 0, duration: 0.15, immediateRender: false }, t + dur); return d; };
      Viz.ICONS.server = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="8" width="48" height="16" rx="4"/><rect x="8" y="28" width="48" height="16" rx="4"/><rect x="8" y="48" width="48" height="12" rx="4"/><path d="M16 16h4M16 36h4"/></g>`;
      Viz.ICONS.phone = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="16" y="4" width="32" height="56" rx="7"/><path d="M28 52h8"/></g>`;
      Viz.ICONS.door = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M16 56V8h32v48M8 56h48"/></g><circle cx="40" cy="34" r="3.5" fill="${c}"/>`;
      Viz.ICONS.bell = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M10 48h44M16 48a16 16 0 0 1 32 0M32 24v-8M26 16h12"/></g>`;
      Viz.ICONS.gauge = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M8 46a24 24 0 0 1 48 0"/><path d="M32 46l12-16"/></g>`;
      Viz.ICONS.balancer = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="12" r="6"/><circle cx="10" cy="52" r="6"/><circle cx="32" cy="52" r="6"/><circle cx="54" cy="52" r="6"/><path d="M32 18v28M9 17L12 46M35 17l17 29"/></g>`;

      // tile: bordered card with an icon and a label (row) or a tall gateway card (col)
      const tile = (host, x, y, w, h, label, icon, col, t, size, o) => { o = o || {};
        const d = el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:18px;border:3px solid ${col};background:#16203A;box-sizing:border-box;display:flex;${o.col ? "flex-direction:column;justify-content:center;" : ""}align-items:center;gap:${o.col ? 18 : 14}px;${o.col ? "" : "padding:0 18px;"}font:700 ${size || 34}px var(--code);color:${INK};white-space:nowrap`, sv(icon, o.isz || 56, col) + `<span>${label}</span>`);
        return show(d, t, { opacity: 0, y: 12 }); };
      // ===== s024 helpers =====
      Viz.ICONS.shield = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M32 6l20 8v16c0 14-9 24-20 28C21 54 12 44 12 30V14z"/><path d="M23 32l7 7 12-14"/></g>`;
      const GOLD = "#F2B84B";
      const BT = 800, XS = (t) => 60 + t * 46;
      const swap = (host, items, cx, y, w, h, size) => { // items [[text,t,col]]: one chip at a time, old one fades 0.01 s before the next
        const out = []; items.forEach(([txt, t, col], k) => { const d = chip(host, txt, cx, y, w, col, t, size || 36, h || 80); if (k > 0) tl.to(out[k - 1], { opacity: 0, duration: 0.01, immediateRender: false }, t - 0.01); out.push(d); }); return out; };
      // TLF: the timeline frame: two blocks (0-10 s, 10-20 s), gold edge line, tick labels
      const TLF = (host, o) => {
        o = o || {}; const dy = o.dy || 0, t0 = o.t0, BH = o.bh || 170, f = { dy, BH };
        f.b1 = show(el(host, `left:60px;top:${BT + dy}px;width:460px;height:${BH}px;border-radius:14px 0 0 14px;border:3px solid ${CYAN};background:${M.ca(CYAN, 0.1)};box-sizing:border-box`), t0, { opacity: 0, y: 0 });
        f.b2 = show(el(host, `left:520px;top:${BT + dy}px;width:460px;height:${BH}px;border-radius:0 14px 14px 0;border:3px solid ${CYAN};background:${M.ca(CYAN, 0.1)};box-sizing:border-box`), t0, { opacity: 0, y: 0 });
        if (o.edge !== false) f.edge = show(el(host, `left:514px;top:${BT + dy - 215}px;width:12px;height:${215 + BH + 8}px;border-radius:5px;background:${GOLD}`), t0, { opacity: 0, y: 0 });
        f.tk = {}; (o.ticks || [[0, "0 s"], [9, "9"], [10, "10"], [11, "11"], [20, "20 s"]]).forEach(([t, l]) => {
          f.tk[t] = show(el(host, `left:${XS(t) - 50}px;width:100px;text-align:center;top:${BT + dy + BH + 14 + (t === 10 ? 48 : 0)}px;font:700 40px var(--code);color:#B4BFD6`, l), t0, { opacity: 0, y: 0 }); });
        f.sq = (side, t, col, each, n) => { const cx = side === "L" ? 474 : 566, arr = [];
          for (let i = 0; i < (n || 10); i++) { const r = Math.floor(i / 2), c = i % 2;
            arr.push(show(el(host, `left:${cx - 38 + c * 40}px;top:${BT + dy - 44 - r * 40}px;width:36px;height:36px;border-radius:7px;background:${col || CYAN}`), t + (each || 0.04) * i, { opacity: 0, scale: 0.6, y: 0 })); }
          return arr; };
        f.ctr = (idx, items) => swap(host, items, idx ? 750 : 290, BT + dy + BH + 100, 340, 100, 44);
        f.bracket = (t, label, col, lw) => { const L = el(host, `left:436px;top:${BT + dy - 232}px;width:168px;height:6px;border-radius:3px;background:${col}`);
          const l1 = el(host, `left:436px;top:${BT + dy - 232}px;width:6px;height:26px;border-radius:3px;background:${col}`), l2 = el(host, `left:598px;top:${BT + dy - 232}px;width:6px;height:26px;border-radius:3px;background:${col}`);
          [L, l1, l2].forEach((d) => show(d, t, { opacity: 0, y: 0 })); const c = chip(host, label, 520, BT + dy - 330, lw || 320, col, t, 38, 72); return [L, l1, l2, c]; };
        f.win = (t, x0, x1, col) => show(el(host, `left:${x0}px;top:${BT + dy - 24}px;width:${x1 - x0}px;height:${BH + 48}px;border-radius:14px;border:5px solid ${col || GOLD};background:${M.ca(col || GOLD, 0.07)};box-sizing:border-box`), t, { opacity: 0, y: 0 });
        return f; };

      // ===== A: hook =====
      // diagram: A
      M.hook(["100 per minute:", "200 in 2 sec?"], { size: 92, top: 230 });
      const ta = TLF(A, { t0: 0.05 });
      ta.sq("L", at("A", "100"), CYAN, 0.04); ta.sq("R", at("A", "200") - 0.2, CYAN, 0.04);
      ta.ctr(0, [["COUNTER 100", at("A", "100") + 0.45, CYAN]]); ta.ctr(1, [["COUNTER 100", at("A", "200") + 0.3, CYAN]]);
      chip(A, "LIMIT 100 / MIN", 540, 1215, 600, GOLD, 0.3, 40, 80);
      ta.bracket(at("A", "kaise") - 0.4, "200 IN 2 S", HOT, 340);
      M.fit(A, { y: 460, h: 840 });

      // ===== B: counter resets at the edge; window = time block; 100 before, 100 after =====
      // diagram: B
      const tb = TLF(B, { t0: M.P("B", 0) });
      const edgeB = chip(B, "EDGE", 520, 470, 170, GOLD, at("B", "edge"), 36, 64); gone(edgeB, at("B", "Window") - 0.1);
      const bw1 = tb.ctr(0, [["COUNTER", at("B", "counter"), CYAN], ["COUNTER 100", at("B", "100") + 0.4, GOOD]]);
      const bw2 = tb.ctr(1, [["COUNTER 0", at("B", "zero"), GOLD], ["COUNTER 100", at("B", "100", 1) + 0.6, GOOD]]);
      const bwin = tb.win(at("B", "Window"), 60, 520);
      const bwl = chip(B, "WINDOW", 250, 640, 240, GOLD, at("B", "Window"), 36, 66);
      tl.to(bwin, { x: 460, duration: 0.5, ease: "power2.inOut", immediateRender: false }, at("B", "har", 1));
      goneAll([bwin, bwl], at("B", "edge", 1) - 0.2);
      tb.sq("L", at("B", "100"), CYAN, 0.04); tb.sq("R", at("B", "100", 1), CYAN, 0.04);
      M.fit(B);

      // ===== C: rate limiter = guard in front of the server =====
      // diagram: C
      const c0 = M.P("C", 0), GX = 390;
      tile(C, GX - 140, 215, 280, 130, "CLIENT", "phone", CYAN, c0, 34);
      const gd = tile(C, GX - 210, 560, 420, 150, "GUARD", "shield", GOLD, c0 + 0.05, 40);
      tile(C, GX - 140, 1000, 280, 130, "SERVER", "server", CYAN, c0 + 0.1, 34);
      [[345, 215], [710, 290]].forEach(([y0, h0]) => show(el(C, `left:${GX - 3}px;top:${y0}px;width:6px;height:${h0}px;background:repeating-linear-gradient(180deg,${GREY} 0 14px,transparent 14px 28px)`), c0, { opacity: 0, y: 0 }));
      const gaugeLab = show(el(C, `left:640px;width:380px;text-align:center;top:690px;font:700 34px var(--code);color:${GREY}`, "COUNTER"), c0 + 0.1);
      const gslots = [], gfill = [];
      for (let i = 0; i < 5; i++) { const x = 650 + i * 72;
        gslots.push(show(el(C, `left:${x}px;top:604px;width:62px;height:62px;border-radius:10px;border:3px dashed ${GREY};box-sizing:border-box`), c0 + 0.1, { opacity: 0, y: 0 }));
        const f = el(C, `left:${x}px;top:604px;width:62px;height:62px;border-radius:10px;background:${GOLD}`); tl.set(f, { opacity: 0 }, 0); gfill.push(f); }
      ring(C, GX - 210, 560, 420, 150, GOLD, at("C", "gaard"), at("C", "ginta") - 0.1);
      [20.7, 21.1, 21.5, 21.9].forEach((t, i) => { dot(C, GX, 345, GX, 995, t, CYAN, 0.85); tl.fromTo(gfill[i], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, immediateRender: false }, t + 0.35); });
      tl.fromTo(gfill[4], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, immediateRender: false }, at("C", "limit") + 0.1);
      const rd = el(C, `left:${GX - 22}px;top:${345 - 22}px;width:44px;height:44px;border-radius:50%;background:${HOT}`);
      tl.set(rd, { opacity: 0 }, 0); tl.fromTo(rd, { opacity: 0, y: 0 }, { opacity: 1, duration: 0.1, immediateRender: false }, at("C", "upar") - 0.1);
      tl.to(rd, { y: 170, duration: 0.4, ease: "power2.in", immediateRender: false }, at("C", "upar") - 0.1); tl.to(rd, { y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, at("C", "upar") + 0.3);
      tl.to(rd, { opacity: 0, duration: 0.2, immediateRender: false }, at("C", "deta") + 0.1);
      stamp(C, "BLOCKED", 800, 225, HOT, at("C", "rok"), 44, 300);
      M.fit(C);

      // ===== D: the example: 10 per 10 s; 10 at second 9, 10 at second 11 =====
      // diagram: D
      const d0 = M.P("D", 0);
      M.pill(D, "EXAMPLE", d0, { x: 380, y: 190, size: 44 });
      const td = TLF(D, { t0: d0, dy: -60, bh: 120 });
      chip(D, "LIMIT 10 / 10 S", 540, 285, 520, GOLD, at("D", "10"), 40, 76);
      [[9, "9"], [10, "Second", 1], [11, "11"]].forEach(([k, w, n]) => { const word = k === 10 ? "10" : w; tl.to(td.tk[k], { color: GOLD, duration: 0.2, immediateRender: false }, k === 9 ? at("D", "9") : k === 10 ? at("D", "10", 3) : at("D", "11")); });
      td.sq("L", at("D", "9"), CYAN, 0.04);
      td.ctr(0, [["COUNTER 10", at("D", "9") + 0.5, GOOD]]);
      const newW = chip(D, "NEW WINDOW", 520, 470, 330, GOLD, at("D", "nayi"), 38, 70); gone(newW, at("D", "Second", 2) - 0.1);
      td.ctr(1, [["COUNTER 0", at("D", "zero") - 0.2, GOLD], ["COUNTER 10", at("D", "10", 4) + 0.5, GOOD]]);
      td.sq("R", at("D", "10", 4), CYAN, 0.04);
      td.bracket(at("D", "yaani"), "20 IN 2 S", HOT, 330);
      chip(D, "2X LIMIT", 860, 425, 240, HOT, at("D", "double"), 36, 72);
      const sim = panel(D, 90, 1085, 900, 170, GOOD, "SIMULATION"); show(sim, at("D", "code"), { opacity: 0, y: 0 });
      const simL = show(el(D, `left:130px;top:1170px;font:700 44px var(--code);color:${INK};white-space:nowrap`, 'fixed window allowed: <span class="s20">20</span>'), at("D", "code") + 0.3, { opacity: 0, y: 0 });
      tl.to(simL.querySelector(".s20"), { color: HOT, duration: 0.2, immediateRender: false }, at("D", "20", 1));
      M.fit(D);

      // ===== E: the fix: a moving window, last 10 s from now =====
      // diagram: E
      const e0 = M.P("E", 0);
      const te = TLF(E, { t0: e0, bh: 120 });
      te.sq("L", e0, CYAN, 0); te.sq("R", e0, CYAN, 0);
      tl.to(te.edge, { opacity: 0, duration: 0.3, immediateRender: false }, at("E", "block"));
      tl.to([te.b1, te.b2], { opacity: 0.35, duration: 0.3, immediateRender: false }, at("E", "nahi"));
      const ew = te.win(at("E", "chalti"), 60, 520);
      tl.to(ew, { x: 46, duration: 1.2, ease: "power2.inOut", immediateRender: false }, at("E", "abhi") - 0.2);
      chip(E, "LAST 10 S", 250, 640, 330, GOLD, at("E", "peechhe"), 36, 70);
      tl.to(te.tk[11], { color: GOLD, duration: 0.2, immediateRender: false }, at("E", "abhi"));
      chip(E, "NOW", 566, 1030, 150, GOLD, at("E", "abhi"), 36, 66);
      stamp(E, "SLIDING WINDOW", 540, 330, GOLD, at("E", "sliding"), 48, 600);
      const mt = at("E", "do");
      show(panel(E, 70, 1120, 440, 190, CYAN, null), mt, { opacity: 0, y: 0 });
      show(el(E, `left:70px;width:440px;text-align:center;top:1132px;font:700 38px var(--code);color:${INK}`, "1 · LOG"), mt, { opacity: 0, y: 0 });
      [0, 1, 2].forEach((k) => chip(E, "9", 150 + k * 140, 1230, 110, CYAN, mt + 0.3 + 0.12 * k, 38, 60));
      show(panel(E, 570, 1120, 440, 190, GOLD, null), mt + 0.4, { opacity: 0, y: 0 });
      show(el(E, `left:570px;width:440px;text-align:center;top:1132px;font:700 38px var(--code);color:${INK}`, "2 · COUNTER"), mt + 0.4, { opacity: 0, y: 0 });
      chip(E, "PREV", 690, 1230, 180, GOLD, mt + 0.8, 36, 60); chip(E, "NOW", 890, 1230, 180, GOLD, mt + 0.95, 36, 60);
      M.fit(E);

      // ===== F: sliding window log =====
      // diagram: F
      const f0 = M.P("F", 0), FD = -170;
      stamp(F, "SLIDING LOG", 540, 190, GOLD, f0, 46, 520);
