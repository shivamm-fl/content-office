    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H"], tag: "SYSTEM DESIGN · DAY 001 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD, VIOLET } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH");
      const at = (sc, w, n) => M.W(sc, w, n);
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:22px;font-size:40px;color:${col}`; } return d; };
      const kick = (host, txt, t) => show(el(host, `left:0;width:1080px;text-align:center;top:196px;font:700 46px var(--code);letter-spacing:.14em;color:${ACC}`, txt), t, { opacity: 0, y: 0 });
      const center = (host, y, size, col, txt, t, w) => show(el(host, `left:${540 - (w || 900) / 2}px;width:${w || 900}px;text-align:center;top:${y}px;font:700 ${size}px var(--code);color:${col};white-space:nowrap`, txt), t);
      const lab = (host, x, y, w, col, txt, t, size) => show(el(host, `left:${x}px;width:${w}px;text-align:center;top:${y}px;font:600 ${size || 38}px var(--code);letter-spacing:.06em;color:${col};white-space:nowrap`, txt), t, { opacity: 0, y: 12 });
      const stamp = (host, txt, cx, y, col, t, size) => { const d = el(host, `left:${cx - 230}px;width:460px;text-align:center;top:${y}px;padding:14px 0;border:3px solid ${col};border-radius:14px;background:rgba(14,18,30,.95);font:700 ${size || 52}px var(--code);color:${col};white-space:nowrap`, txt); return show(d, t, { opacity: 0, scale: 1.08 }); };

      // ===== A: the interviewer's question, the answer "ask first", then 4 steps =====
      // diagram: A
      M.hook(["Interviewer ka sawal:", "Pehle kya karoge?"], { size: 96, top: 250 });
      kick(A, "INTERVIEW QUESTION", 3.1);
      panel(A, 70, 480, 940, 810, ACC, null);
      const iv = M.icon(A, "user", 110, 530, 230, ACC); iv.show(0.05);
      const ivl = lab(A, 60, 775, 330, ACC, "INTERVIEWER", 0.1, 38);
      const bub = show(panel(A, 400, 530, 560, 250, CYAN, null), 0.1);
      const bq = show(el(A, `left:400px;width:560px;text-align:center;top:530px;font:700 200px var(--lat);color:${ACC};line-height:250px`, "?"), 0.15, { opacity: 0, y: 0 });
      const me = M.icon(A, "user", 110, 910, 230, GOOD); me.show(at("A", "jawab"));
      const mel = lab(A, 60, 1155, 330, GOOD, "YOU", at("A", "jawab") + 0.05, 48);
      const ab = show(panel(A, 400, 910, 560, 250, GOOD, null), at("A", "jawab"));
      const dts = show(el(A, `left:400px;width:560px;text-align:center;top:910px;font:800 150px var(--lat);color:${GOOD};line-height:230px`, "..."), at("A", "jawab") + 0.1, { opacity: 0, y: 0 }); gone(dts, at("A", "sawal") - 0.05);
      const at1 = show(el(A, `left:400px;width:560px;text-align:center;top:910px;font:800 84px var(--lat);color:${GOOD};white-space:nowrap;line-height:250px`, "ASK FIRST"), at("A", "sawal") - 0.1, { opacity: 0, scale: 0.92 });
      const tA = at("A", "aao") - 0.15;
      [iv.el, me.el, ivl, mel, bub, bq, ab, at1].forEach((d) => gone(d, tA));
      const nm = ["REQUIREMENTS", "DESIGN", "DETAIL", "TRADE-OFFS"];
      const tiles = nm.map((n, i) => M.box(A, { x: 90 + (i % 2) * 470, y: 530 + Math.floor(i / 2) * 340, w: 440, h: 310, label: String(i + 1), sub: n, color: ACC, size: 170, subsize: 40 }));
      tiles.forEach((b, i) => b.show(at("A", "4") + i * 0.16));
      lab(A, 70, 1225, 940, ACC, "4 STEPS", at("A", "steps"), 48);
      M.fit(A, { y: 460, h: 840 });

      // ===== B: the running example, one simple design: fine for 100 users, 10 lakh crowd it =====
      // diagram: B
      kick(B, "EXAMPLE · FOOD APP", (M.S.B + 0.1));
      const bA = M.box(B, { x: 110, y: 560, w: 560, h: 190, label: "APP", icon: "user", color: CYAN, size: 50 });
      const bS = M.box(B, { x: 110, y: 830, w: 560, h: 190, label: "SERVER", icon: "chip", color: CYAN, size: 50 });
      const bD = M.box(B, { x: 110, y: 1100, w: 560, h: 190, label: "DATABASE", icon: "db", sub: "STORES DATA", subsize: 34, color: CYAN, size: 46 });
      bA.show((M.S.B + 0.15)); bS.show(at("B", "server")); bD.show(at("B", "database"));
      const aDown = M.arrow(B, { from: [230, 750], to: [230, 830], color: ACC, w: 10 }), aUp = M.arrow(B, { from: [550, 830], to: [550, 750], color: GOOD, w: 10 });
      const bDown = M.arrow(B, { from: [230, 1020], to: [230, 1100], color: ACC, w: 10 }), bUp = M.arrow(B, { from: [550, 1100], to: [550, 1020], color: GOOD, w: 10 });
      aDown.show(at("B", "server") + 0.2); aUp.show(at("B", "server") + 0.35); bDown.show(at("B", "database") + 0.2); bUp.show(at("B", "database") + 0.35);
      aDown.travel(at("B", "Server"), 0.7, "#fff"); aUp.travel(at("B", "jawab"), 0.7, GOOD);
      const u0 = M.icon(B, "user", 455, 340, 170, ACC); u0.show(M.S.B + 0.3); const uTag = lab(B, 60, 270, 960, ACC, "USERS", M.S.B + 0.35, 48); gone(uTag, at("B", "100") - 0.1);
      gone(u0.el, at("B", "100") - 0.1);
      const dots = []; for (let i = 0; i < 48; i++) dots.push(el(B, `left:${60 + (i % 16) * 60}px;top:${330 + Math.floor(i / 16) * 60}px;width:46px;height:46px;border-radius:50%;background:${M.ca(ACC, 0.85)}`));
      const sp = [23, 24, 25]; let k2 = 0;
      dots.forEach((d, i) => { const j = sp.indexOf(i); show(d, j >= 0 ? at("B", "100") + j * 0.1 : at("B", "10") + (k2++) * 0.02, { opacity: 0, scale: 0.4 }); });
      const u1 = lab(B, 60, 270, 960, ACC, "100 USERS", at("B", "100"), 48); gone(u1, at("B", "10") - 0.1);
      lab(B, 60, 270, 960, ACC, "10 LAKH USERS", at("B", "10") + 0.1, 48);
      const gtr = show(el(B, `left:740px;top:560px;width:110px;height:730px;border:4px solid rgba(133,146,173,.7);border-radius:20px`), M.S.B + 0.4, { opacity: 0, y: 0 });
      lab(B, 690, 490, 210, ACC, "LOAD", M.S.B + 0.45, 46);
      const gfill = el(B, `left:748px;top:568px;width:94px;height:714px;border-radius:12px;background:${GOOD};transform-origin:50% 100%`);
      tl.set(gfill, { opacity: 0, scaleY: 0.04 }, 0); tl.to(gfill, { opacity: 1, duration: 0.2, immediateRender: false }, at("B", "100"));
      tl.to(gfill, { scaleY: 1, backgroundColor: HOT, duration: 0.9, ease: "power2.in", immediateRender: false }, at("B", "10"));
      const fine = lab(B, 860, 1215, 190, GOOD, "FINE ✓", at("B", "theek"), 46); gone(fine, at("B", "10") - 0.1);
      lab(B, 860, 580, 190, HOT, "HOLD ?", at("B", "jhel"), 46);
      M.fit(B);

      // ===== C: step 1, requirements and scale =====
      // diagram: C
      kick(C, "STEP 1/4 · REQUIREMENTS", (M.S.C + 0.1));
      const s1 = [];
      const cp = show(panel(C, 100, 290, 880, 560, CYAN, "REQUIREMENTS"), (M.S.C + 0.15)); s1.push(cp);
      [["ORDER FOOD", "order", 0, "dena"], ["ACCEPT ORDER", "restaurant", 0, "karna", 1], ["REQUESTS / SEC", "second", 0, "requests"]].forEach(([txt, w, n, w2, n2], i) => {
        const rt = el(cp, `left:60px;top:${110 + i * 150}px;font:700 62px var(--lat);white-space:nowrap`, txt); show(rt, M.S.C + 0.3 + i * 0.15, { opacity: 0, y: 0 }); tl.set(rt, { color: "#6F7C99" }, 0); tl.to(rt, { color: "#E8EDF6", duration: 0.25, immediateRender: false }, at("C", w, n) - 0.05);
        if (i < 2) show(el(cp, `right:60px;top:${110 + i * 150}px;font:800 70px var(--lat);color:${GOOD}`, "✓"), at("C", w2, n2), { opacity: 0, scale: 1.2 });
        else show(el(cp, `right:60px;top:${110 + i * 150}px;font:800 84px var(--lat);color:${ACC}`, "?"), at("C", w2, n2), { opacity: 0, scale: 0.8 });
      });
      s1.push(lab(C, 270, 880, 540, ACC, "REQUEST", at("C", "Request"), 46));
      const cA = M.box(C, { x: 120, y: 920, w: 300, h: 180, label: "APP", icon: "user", color: CYAN });
      const cS = M.box(C, { x: 660, y: 920, w: 300, h: 180, label: "SERVER", icon: "chip", color: CYAN });
      const cr = M.arrow(C, { from: [420, 1010], to: [660, 1010], color: ACC, w: 10 });
      cA.show(M.S.C + 0.5); cS.show(M.S.C + 0.65); cr.show(at("C", "Request") + 0.2); cr.travel(at("C", "sawal"), 0.7, "#fff");
      const t2 = at("C", "maan") - 0.15;
      s1.forEach((d) => gone(d, t2)); [cA, cS].forEach((b) => b.hide(t2)); cr.hide(t2);
      M.pill(C, "EXAMPLE", at("C", "maan"), { x: 395, y: 270, kind: "out", size: 40 });
      center(C, 360, 126, M.TEXT, "1,00,000", at("C", "100000"), 900); lab(C, 90, 510, 900, ACC, "ORDERS / DAY", at("C", "orders", 0), 46);
      center(C, 580, 126, M.TEXT, "÷ 86,400", at("C", "86400"), 900); lab(C, 90, 725, 900, ACC, "SECONDS / DAY", at("C", "seconds"), 46);
      const hr = el(C, `left:150px;top:810px;width:780px;height:6px;border-radius:3px;background:#8592AD;transform-origin:0 50%`); tl.set(hr, { opacity: 0, scaleX: 0 }, 0); tl.to(hr, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, at("C", "average"));
      center(C, 830, 168, ACC, "= 1.16", at("C", "116"), 900); lab(C, 90, 1015, 900, ACC, "ORDERS / SEC", at("C", "orders", 1), 46);
      const cSv = M.box(C, { x: 220, y: 1110, w: 640, h: 200, label: "1 SERVER", sub: "ENOUGH ?", subsize: 40, icon: "chip", color: CYAN, size: 42 }); cSv.show(at("C", "server", 1));
      M.fit(C);

      // ===== D: step 2, design (only the necessary parts) =====
      // diagram: D
      kick(D, "STEP 2/4 · DESIGN", (M.S.D + 0.1));
      const dA = M.box(D, { x: 360, y: 300, w: 300, h: 210, label: "APP", icon: "user", color: CYAN, size: 50 });
      const dS = M.box(D, { x: 360, y: 640, w: 300, h: 250, label: "SERVER", icon: "chip", color: CYAN, size: 50, sub: "1.16 / SEC", subsize: 38 });
      const dD = M.box(D, { x: 360, y: 1020, w: 300, h: 210, label: "DATABASE", icon: "db", color: CYAN, size: 40 });
      dA.show(M.S.D + 0.25); dS.show(M.S.D + 0.5); dD.show(M.S.D + 0.75);
      const d1 = M.arrow(D, { from: [510, 510], to: [510, 640], color: ACC, w: 10 }), d2 = M.arrow(D, { from: [510, 890], to: [510, 1020], color: ACC, w: 10 });
      d1.show(M.S.D + 0.6); d2.show(M.S.D + 0.9);
      const gh = [M.box(D, { x: 40, y: 640, w: 250, h: 250, label: "RATINGS", icon: "star", sub: "LATER", subsize: 36, color: "#8592AD", size: 40 }), M.box(D, { x: 790, y: 640, w: 250, h: 250, label: "CHAT", icon: "chat", sub: "LATER", subsize: 36, color: "#8592AD", size: 44 })];
      gh.forEach((b, i) => { b.show(at("D", "sirf") + i * 0.15); tl.to([b.el, b.parts[1]], { opacity: 0.55, duration: 0.3, immediateRender: false }, at("D", "zaruri") + i * 0.15); });
      const gx = [M.icon(D, "cross", 205, 650, 80, HOT), M.icon(D, "cross", 955, 650, 80, HOT)]; gx[0].show(at("D", "zaruri")); gx[1].show(at("D", "zaruri") + 0.15);
      lab(D, 60, 1260, 960, GOOD, "ONLY NEEDED", at("D", "parts"), 56);
      M.fit(D);

      // ===== E: step 3, detail of each part =====
      // diagram: E
      kick(E, "STEP 3/4 · DETAIL", (M.S.E + 0.05));
      const eD = M.box(E, { x: 340, y: 320, w: 400, h: 230, label: "DATABASE", icon: "db", color: CYAN, size: 48 }); eD.show((M.S.E + 0.1));
      const eA = M.arrow(E, { from: [540, 555], to: [540, 670], color: ACC, w: 11 }); eA.show(M.S.E + 0.3);
      const tp = show(panel(E, 50, 680, 980, 540, CYAN, "ORDERS TABLE"), M.S.E + 0.4);
      tp.firstChild.style.fontSize = "40px";
      M.pill(E, "EXAMPLE", at("E", "order"), { x: 390, y: 1245, kind: "out", size: 40 });
      const hdr = (x, w, txt, val, val2, w0) => { show(el(tp, `left:${x}px;width:${w}px;top:120px;text-align:center;font:700 64px var(--code);color:${ACC}`, txt), at("E", w0), { opacity: 0, y: 0 });
        show(el(tp, `left:${x}px;width:${w}px;top:290px;text-align:center;font:600 56px var(--code);color:${M.TEXT}`, val), at("E", w0) + 0.3);
        show(el(tp, `left:${x}px;width:${w}px;top:410px;text-align:center;font:600 56px var(--code);color:#A9B6D0`, val2), at("E", w0) + 0.5); };
      hdr(20, 250, "ID", "1042", "1043", "id"); hdr(290, 380, "ITEMS", "biryani", "pizza", "items"); hdr(690, 270, "STATUS", "PLACED", "SENT", "status");
      show(el(tp, `left:30px;top:225px;width:920px;height:3px;background:rgba(150,175,215,.35)`), at("E", "database") + 0.2, { opacity: 0, y: 0 });
      show(el(tp, `left:30px;top:380px;width:920px;height:2px;background:rgba(150,175,215,.2)`), at("E", "items"), { opacity: 0, y: 0 });
      M.fit(E);

      // ===== F: step 4, the balance scale FRESH vs FAST =====
      // diagram: F
      kick(F, "STEP 4/4 · TRADE-OFFS", (M.S.F + 0.15));
      const BX = 540, BY = 440;
      const post = el(F, `left:${BX - 9}px;top:${BY}px;width:18px;height:210px;border-radius:6px;background:#52617F`), base = el(F, `left:${BX - 100}px;top:${BY + 205}px;width:200px;height:20px;border-radius:8px;background:#52617F`);
      const beam = el(F, `left:${BX - 260}px;top:${BY - 8}px;width:520px;height:16px;border-radius:8px;background:#A9B6D0`);
      const piv = el(F, `left:${BX - 22}px;top:${BY - 22}px;width:44px;height:44px;border-radius:50%;background:${ACC}`);
      const pan = (x, txt) => el(F, `left:${x}px;top:${BY}px;width:240px;height:210px`, `<svg width="240" height="150" viewBox="0 0 240 150" style="position:absolute;left:0;top:0"><path d="M120 0 L10 150 M120 0 L230 150" stroke="#A9B6D0" stroke-width="5" fill="none"/></svg><div class="tray" style="position:absolute;left:0;top:150px;width:240px;height:70px;border:3px solid rgba(133,146,173,.8);border-radius:14px;background:rgba(133,146,173,.12);display:flex;align-items:center;justify-content:center;font:800 46px var(--lat);color:#E8EDF6;letter-spacing:.04em">${txt}</div>`);
      const pL = pan(BX - 260 - 120, "FRESH"), pR = pan(BX + 260 - 120, "FAST");
      const t0 = M.S.F + 0.35;
      [post, base, beam, piv, pL, pR].forEach((d, i) => show(d, t0 + i * 0.07, { opacity: 0, y: 0 }));
      tl.set(beam, { rotation: 0, transformOrigin: "50% 50%" }, 0);
      const tip = (t, dir) => { // dir -1: FRESH side down, +1: FAST side down, 0: level
        tl.to(beam, { rotation: dir * 9, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t);
        tl.to(pL, { y: -dir * 40, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t); tl.to(pR, { y: dir * 40, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t); };
      const trayCol = (p, t, on) => tl.to(p.querySelector(".tray"), { borderColor: on ? M.ca(GOOD, 0.95) : "rgba(133,146,173,.8)", backgroundColor: on ? M.ca(GOOD, 0.2) : "rgba(133,146,173,.12)", duration: 0.3, immediateRender: false }, t);
      const fA = M.box(F, { x: 50, y: 960, w: 260, h: 190, label: "APP", icon: "user", color: CYAN, size: 46 });
      const fC = M.box(F, { x: 410, y: 960, w: 260, h: 190, label: "CACHE", icon: "bolt", color: ACC, size: 44 });
      const fD = M.box(F, { x: 770, y: 960, w: 260, h: 190, label: "DATABASE", icon: "db", color: CYAN, size: 36 });
      const fl = M.arrow(F, { from: [310, 1010], to: [770, 1010], color: ACC, w: 9, bend: -230 });
      fA.show(at("F", "Menu")); fD.show(at("F", "database")); fl.show(at("F", "database") + 0.3);
      tip(at("F", "fresh", 0), -1); trayCol(pL, at("F", "fresh", 0), true);
      const slow = M.icon(F, "clock", 800, 1160, 90, HOT); slow.show(at("F", "dheema")); const slowl = lab(F, 740, 1260, 320, HOT, "SLOW", at("F", "dheema"), 46);
