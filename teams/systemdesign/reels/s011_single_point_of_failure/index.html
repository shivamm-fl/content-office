<!doctype html>

    <script>
      const SC = ["A","B","C","D","E","F","G","H","I","J","K","L","M"];
      const M = Mo.init({ order: SC, tag: "SYSTEM DESIGN · DAY 011 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M;
      const [A, B, C, D, E, F, G, H, I, J, K, L, N] = SC.map((k) => M.$("#s" + k));
      const at = (sc, w, n) => M.W(sc, w, n);
      const GREY = "#8592AD", INK = "#E8EDF6";
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:22px;font-size:40px;color:${col}`; } return d; };
      const lab = (host, x, y, w, col, txt, t, size, al) => show(el(host, `left:${x}px;width:${w}px;text-align:${al || "center"};top:${y}px;font:600 ${size || 38}px var(--code);letter-spacing:.06em;color:${col};white-space:nowrap`, txt), t, { opacity: 0, y: 12 });
      const stamp = (host, txt, cx, y, col, t, size, w) => { const W = w || 460; const d = el(host, `left:${cx - W / 2}px;width:${W}px;text-align:center;top:${y}px;padding:14px 0;border:3px solid ${col};border-radius:14px;background:rgba(14,18,30,.95);font:700 ${size || 52}px var(--code);color:${col};white-space:nowrap;box-sizing:border-box`, txt); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const card = (host, w, h, cx, y, col, html, size) => el(host, `left:${cx - w / 2}px;top:${y}px;width:${w}px;height:${h}px;border-radius:16px;border:3px solid ${col};background:#16203A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 ${size || 44}px var(--code);color:${INK};white-space:nowrap`, html);
      const num = (host, w, h, cx, y, col, html, t, size) => show(card(host, w, h, cx, y, col, html, size), t, { opacity: 0, y: 14 });
      const op = (host, txt, cx, y, t, col) => show(el(host, `left:${cx - 60}px;width:120px;text-align:center;top:${y}px;font:800 72px var(--code);color:${col || GREY};white-space:nowrap`, txt), t, { opacity: 0, y: 6 });
      const ring = (host, x, y, w, h, col, t, tOff) => { const d = show(el(host, `left:${x - 6}px;top:${y - 6}px;width:${w + 12}px;height:${h + 12}px;border-radius:20px;border:5px solid ${col};box-sizing:border-box`), t, { opacity: 0, y: 0 }); if (tOff != null) gone(d, tOff); return d; };
      const cover = (host, x, y, w, h, t) => show(el(host, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:16px;background:rgba(14,18,30,.62)`), t, { opacity: 0, y: 0 });
      Viz.ICONS.server = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="8" width="48" height="16" rx="4"/><rect x="8" y="28" width="48" height="16" rx="4"/><rect x="8" y="48" width="48" height="12" rx="4"/><path d="M16 16h4M16 36h4"/></g>`;
      Viz.ICONS.balancer = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="12" r="6"/><circle cx="10" cy="52" r="6"/><circle cx="32" cy="52" r="6"/><circle cx="54" cy="52" r="6"/><path d="M32 18v28M29 17L12 46M35 17l17 29"/></g>`;
      const S = M.S;

      // single chain, left layout (right column x 660-1020 is for stamps)
      const CX = 360, CW = 580, CXL = 70;
      const ROWS = { u: [220, 160], lb: [450, 190], sv: [710, 190], db: [970, 190] };
      const chain = (host, ts, o) => { o = o || {}; const b = {};
        [["u", "user", "USER"], ["lb", "balancer", "LOAD BALANCER"], ["sv", "server", "SERVER"], ["db", "db", "DATABASE"]].forEach(([k, ic, lb], i) => {
          b[k] = M.box(host, { x: CXL, y: ROWS[k][0], w: CW, h: ROWS[k][1], label: lb, icon: ic, color: CYAN, size: 46, isize: 70 }); b[k].show(ts[i]);
          if (i > 0) { const pk = ["u", "lb", "sv", "db"][i - 1]; b["a" + k] = M.arrow(host, { from: [CX, ROWS[pk][0] + ROWS[pk][1] + 2], to: [CX, ROWS[k][0] - 4], color: GREY, w: 8 }); b["a" + k].show(ts[i] - 0.1, 0.25); } });
        return b; };
      const rowRing = (host, k, col, t, tOff) => ring(host, CXL, ROWS[k][0], CW, ROWS[k][1], col, t, tOff);
      const rowCover = (host, k, t) => cover(host, CXL, ROWS[k][0], CW, ROWS[k][1], t);
      const RC = 850; // right column centre x (660..1020)

      // ===== A: hook, the chain, the server goes red, app down =====
      // diagram: A
      M.hook(["Ek server gira,", "poora app band"], { size: 80, top: 230 });
      chain(A, [0.05, 0.1, 0.15, 0.2]);
      rowRing(A, "sv", HOT, at("A", "gira"));
      ["u", "lb", "db"].forEach((k) => rowCover(A, k, at("A", "band")));
      stamp(A, "APP DOWN", RC, 290, HOT, at("A", "band"), 44, 340);
      M.fit(A, { y: 460, h: 840 });

      // ===== B: shop with one counter =====
      // diagram: B
      const shelf = panel(B, 90, 230, 900, 250, GREY, ""); show(shelf, S.B + 0.05, { opacity: 0, y: 14 });
      const sq = []; for (let r = 0; r < 2; r++) for (let c = 0; c < 8; c++) sq.push(show(el(B, `left:${150 + c * 100}px;top:${270 + r * 100}px;width:70px;height:70px;border-radius:10px;border:3px solid ${M.ca(GREY, 0.7)};box-sizing:border-box`), S.B + 0.1, { opacity: 0, y: 0 }));
      tl.to(sq, { borderColor: GOOD, backgroundColor: M.ca(GOOD, 0.45), duration: 0.4, immediateRender: false }, at("B", "bhara"));
      lab(B, 90, 495, 900, INK, "FULL SHELF", at("B", "bhara"), 46);
      [200, 440, 680].forEach((x, i) => { M.icon(B, "user", x + 20, 620, 130, CYAN).show(at("B", "dukan") + 0.3 + i * 0.15); M.arrow(B, { from: [x + 85, 765], to: [540, 850], color: GREY, w: 6 }).show(at("B", "counter") - 0.1 + i * 0.1, 0.3); });
      const cnt = M.box(B, { x: 190, y: 870, w: 700, h: 190, label: "ONE COUNTER", icon: "coin", color: ACC, size: 46, isize: 80 }); cnt.show(at("B", "counter"));
      ring(B, 190, 870, 700, 190, HOT, at("B", "ruk"));
      stamp(B, "NO SALE", 540, 1110, HOT, at("B", "nahi"), 56, 520);
      M.icon(B, "cross", 440, 735, 80, HOT).show(at("B", "nahi"));
      M.fit(B);

      // ===== C: the request path =====
      // diagram: C
      Object.values(ROWS).forEach(([y, hh]) => show(el(C, `left:${CXL}px;top:${y}px;width:${CW}px;height:${hh}px;border-radius:16px;border:3px dashed ${M.ca(GREY, 0.6)};box-sizing:border-box`), 0.05, { opacity: 0, y: 0 }));
      lab(C, 680, 270, 340, GREY, "REQUEST", 0.1, 44);
      const c = chain(C, [S.C + 0.1, at("C", "load"), at("C", "server"), at("C", "database")]);
      c.alb.travel(at("C", "Request"), 0.5, ACC);
      c.asv.travel(at("C", "phir"), 0.4, ACC);
      c.adb.travel(at("C", "database") - 0.3, 0.4, ACC);
      lab(C, 680, 520, 340, ACC, "SPLITS", at("C", "baantta"), 52);
      M.fit(C);

      // ===== D: server down, SPOF =====
      // diagram: D
      const d0 = chain(D, [0.05, 0.1, 0.15, 0.2]);
      rowRing(D, "sv", HOT, at("D", "gir"));
      d0.adb.hide(at("D", "gir")); M.arrow(D, { from: [CX, 904], to: [CX, 966], color: HOT, w: 8, dash: true }).show(at("D", "gir"), 0.25);
      M.icon(D, "cross", 545, 735, 100, HOT).show(at("D", "gir"));
      const dDown = stamp(D, "DOWN", RC, 745, HOT, at("D", "gir"), 52, 340); gone(dDown, at("D", "single"));
      stamp(D, "APP DOWN", RC, 290, HOT, at("D", "band"), 44, 340);
      stamp(D, "SPOF", RC, 745, ACC, at("D", "single") + 0.2, 52, 340);
      const slot = show(el(D, `left:680px;top:850px;width:340px;height:90px;border-radius:14px;border:3px dashed ${M.ca(INK, 0.8)};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:600 40px var(--code);color:${INK};white-space:nowrap`, "NO BACKUP"), at("D", "backup"), { opacity: 0, y: 8 });
      M.fit(D);

      // ===== E: three steps =====
      // diagram: E
      const eMini = (i, t, y) => { const ps = [
          [["server", CYAN], ["server", HOT], ["server", CYAN]],
          [["server", CYAN], ["server", GOOD]],
          [["balancer", CYAN], ["balancer", GOOD]]][i];
        const x0 = 540 - (ps.length * 150 - 30) / 2;
        ps.forEach(([ic, col], k) => { M.box(E, { x: x0 + k * 150, y: y + 100, w: 120, h: 110, label: "", icon: ic, color: col, size: 24, isize: 70 }).show(t + 0.15 + k * 0.1); });
        if (i === 0) M.icon(E, "search", x0 + 380, y + 105, 100, ACC).show(t + 0.5); };
      [["1", "FIND SPOF", "dhoondhna"], ["2", "ADD COPY", "hatana"], ["3", "CHECK COPY", "steps"]].forEach(([n, lb, w], i) => {
        const y = 230 + i * 330, t = at("E", w);
        const r = panel(E, 90, y, 900, 290, i === 2 ? ACC : CYAN, ""); show(r, t, { opacity: 0, y: 18 });
        show(el(E, `left:130px;top:${y + 20}px;width:84px;height:84px;border-radius:42px;border:4px solid ${ACC};display:flex;align-items:center;justify-content:center;font:800 52px var(--code);color:${ACC}`, n), t, { opacity: 0, y: 18 });
        show(el(E, `left:240px;top:${y + 32}px;font:700 56px var(--code);color:${INK};white-space:nowrap`, lb), t + 0.1, { opacity: 0, y: 10 });
        eMini(i, t, y); });
      M.fit(E);

      // ===== F: step 1, ask each part =====
      // diagram: F
      chain(F, [0.05, 0.1, 0.15, 0.2]);
      ["u", "lb", "sv", "db"].forEach((k, i) => rowRing(F, k, ACC, at("F", "request") + i * 0.6, at("F", "request") + i * 0.6 + 0.55));
      lab(F, 680, 640, 340, ACC, "IF IT DIES?", at("F", "poochho"), 42);
      rowRing(F, "sv", HOT, at("F", "mar"));
      stamp(F, "DIES", RC, 745, HOT, at("F", "mar"), 52, 340);
      ["u", "lb", "db"].forEach((k) => rowCover(F, k, at("F", "sab")));
      stamp(F, "ALL STOP", RC, 290, HOT, at("F", "sab"), 44, 340);
      stamp(F, "YES = SPOF", RC, 880, ACC, at("F", "haan"), 40, 340); rowRing(F, "sv", ACC, at("F", "haan"));
      M.fit(F);

      // ===== G: step 2, a twin and failover =====
      // diagram: G
      const GU = [390, 190, 300, 110], GL = [330, 370, 420, 140], GS1 = [90, 640, 420, 160], GS2 = [570, 640, 420, 160], GD = [330, 930, 420, 140];
      const bx = (host, p, lb, ic, col, t) => { const b = M.box(host, { x: p[0], y: p[1], w: p[2], h: p[3], label: lb, icon: ic, color: col, size: 38, isize: 54 }); b.show(t); return b; };
      bx(G, GU, "USER", "user", CYAN, 0.05); bx(G, GL, "LOAD BALANCER", "balancer", CYAN, 0.1); bx(G, GS1, "SERVER 1", "server", CYAN, 0.15); bx(G, GD, "DATABASE", "db", CYAN, 0.2);
      M.arrow(G, { from: [540, 302], to: [540, 366], color: GREY, w: 8 }).show(0.1, 0.25);
      const g1 = M.arrow(G, { from: [450, 512], to: [300, 636], color: GREY, w: 8 }); g1.show(0.15, 0.25);
      const g1d = M.arrow(G, { from: [300, 802], to: [450, 926], color: GREY, w: 8 }); g1d.show(0.2, 0.25);
      const gslot = el(G, `left:570px;top:640px;width:420px;height:160px;border-radius:16px;border:3px dashed ${M.ca(GREY, 0.8)};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 60px var(--code);color:${GREY}`, "+"); show(gslot, S.G + 0.3, { opacity: 0, y: 0 }); gone(gslot, at("G", "copy"));
      bx(G, GS2, "SERVER 2", "server", CYAN, at("G", "copy"));
      const g2 = M.arrow(G, { from: [630, 512], to: [780, 636], color: GREY, w: 8 }); g2.show(at("G", "copy") + 0.1, 0.25);
      const g2d = M.arrow(G, { from: [780, 802], to: [630, 926], color: GREY, w: 8 }); g2d.show(at("G", "copy") + 0.1, 0.25);
      const gRed = stamp(G, "REDUNDANCY", 540, 1115, GOOD, at("G", "redundancy"), 52, 600); gone(gRed, at("G", "ruke"));
      ring(G, GS1[0], GS1[1], GS1[2], GS1[3], HOT, at("G", "ruke")); cover(G, GS1[0], GS1[1], GS1[2], GS1[3], at("G", "ruke"));
      g1.hide(at("G", "ruke"));
      const g1x = M.arrow(G, { from: [450, 512], to: [300, 636], color: HOT, w: 8, dash: true }); g1x.show(at("G", "ruke"), 0.25);
      g2.travel(at("G", "doosre") - 0.2, 0.5, GOOD);
      stamp(G, "FAILOVER", 540, 1115, ACC, at("G", "failover"), 52, 600);
      M.fit(G);

      // ===== H: the arithmetic =====
      // diagram: H
      M.pill(H, "EXAMPLE", at("H", "EXAMPLE"), { x: 390, y: 200, kind: "out", size: 46 });
      const hs = [];
      const yb = (y, t, sx, label) => { hs.push(lab(H, 60, y - 74, 700, INK, label, t, 46, "left"));
        hs.push(show(el(H, `left:60px;top:${y}px;width:960px;height:110px;border-radius:12px;border:3px solid ${M.ca(GOOD, 0.8)};background:${M.ca(GOOD, 0.5)};box-sizing:border-box`), t, { opacity: 0, y: 0 }));
        if (sx != null) hs.push(show(el(H, `left:${sx}px;top:${y - 6}px;width:12px;height:122px;background:${HOT};border-radius:3px`), at("H", "99%"), { opacity: 0, y: 0 })); };
      yb(380, S.H + 0.1, 250, "SERVER 1 · 99%"); yb(590, S.H + 0.25, 700, "SERVER 2 · 99%");
      hs.push(lab(H, 640, 308, 380, HOT, "1% DOWN ▼", at("H", "99%"), 40, "right"), lab(H, 640, 518, 380, HOT, "1% DOWN ▼", at("H", "99%"), 40, "right"));
      yb(800, at("H", "servers"), null, "BOTH AT ONCE?");
      [250, 700].forEach((gx) => hs.push(show(el(H, `left:${gx}px;top:794px;width:12px;height:122px;border:2px dashed ${M.ca(HOT, 0.7)};box-sizing:border-box;border-radius:3px`), at("H", "donon", 0), { opacity: 0, y: 0 })));
      hs.push(show(el(H, `left:480px;top:794px;width:4px;height:122px;background:${HOT};border-radius:2px`), at("H", "saath"), { opacity: 0, y: 0 }));
      hs.push(lab(H, 300, 930, 480, HOT, "≈ NEVER", at("H", "saath"), 52));
      gone(hs, at("H", "1", 0) - 0.15);
      const s3 = [];
      s3.push(num(H, 300, 170, 200, 380, HOT, "1%", at("H", "1", 0), 90), op(H, "×", 540, 405, at("H", "times")), num(H, 300, 170, 880, 380, HOT, "1%", at("H", "1", 1), 90),
        op(H, "=", 540, 600, at("H", "001") - 0.3, GOOD), num(H, 640, 200, 540, 700, HOT, "0.01%", at("H", "001"), 110));
      gone(s3, at("H", "availability") - 0.1);
      num(H, 800, 210, 540, 330, GOOD, "99.99%", at("H", "9999%"), 120);
      lab(H, 60, 606, 600, INK, "1 YEAR", at("H", "saal", 1), 46, "left");
      show(el(H, `left:60px;top:680px;width:960px;height:120px;border-radius:12px;border:3px solid ${M.ca(GOOD, 0.8)};background:${M.ca(GOOD, 0.5)};box-sizing:border-box`), at("H", "saal", 1), { opacity: 0, y: 0 });
      show(el(H, `left:600px;top:674px;width:4px;height:132px;background:${HOT};border-radius:2px`), at("H", "53"), { opacity: 0, y: 0 });
      num(H, 600, 150, 540, 860, HOT, "53 MIN DOWN", at("H", "53"), 64);
      M.fit(H);

      // ===== I: failures must be independent =====
      // diagram: I
      const IS1 = [90, 300, 420, 230], IS2 = [570, 300, 420, 230];
      M.box(I, { x: IS1[0], y: IS1[1], w: IS1[2], h: IS1[3], label: "SERVER 1", icon: "server", color: CYAN, size: 44, isize: 80 }).show(S.I + 0.1);
      M.box(I, { x: IS2[0], y: IS2[1], w: IS2[2], h: IS2[3], label: "SERVER 2", icon: "server", color: CYAN, size: 44, isize: 80 }).show(S.I + 0.15);
