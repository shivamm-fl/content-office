<!doctype html>
<html lang="hi" data-composition-variables='[
  {"id":"lang","type":"enum","label":"Language","default":"hi","options":[{"value":"hi","label":"Hindi (Hinglish)"}]},
  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},

]'>
  <head>

    <link rel="stylesheet" href="kit/motion.css" />

    <script src="kit/viz.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }

      /* ===== reel-specific CSS ===== */

  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="112" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="112" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="112" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="112" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H"], tag: "SYSTEM DESIGN · DAY 001 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD, VIOLET } = M;
      const A = M.$("#sA"), B = M.$("#sB"), C = M.$("#sC"), D = M.$("#sD"), E = M.$("#sE"), F = M.$("#sF"), G = M.$("#sG"), H = M.$("#sH");
      const at = (sc, w, n) => M.W(sc, w, n);
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:22px;font-size:30px;color:${col}`; } return d; };
      const kick = (host, txt, t) => show(el(host, `left:0;width:1080px;text-align:center;top:196px;font:700 40px var(--code);letter-spacing:.14em;color:${ACC}`, txt), t, { opacity: 0, y: 0 });
      const center = (host, y, size, col, txt, t, w) => show(el(host, `left:${540 - (w || 900) / 2}px;width:${w || 900}px;text-align:center;top:${y}px;font:700 ${size}px var(--code);color:${col};white-space:nowrap`, txt), t);
      const lab = (host, x, y, w, col, txt, t, size) => show(el(host, `left:${x}px;width:${w}px;text-align:center;top:${y}px;font:600 ${size || 38}px var(--code);letter-spacing:.06em;color:${col};white-space:nowrap`, txt), t, { opacity: 0, y: 12 });
      const stamp = (host, txt, cx, y, col, t, size) => { const d = el(host, `left:${cx - 230}px;width:460px;text-align:center;top:${y}px;padding:14px 0;border:3px solid ${col};border-radius:14px;background:rgba(14,18,30,.95);font:700 ${size || 52}px var(--code);color:${col};white-space:nowrap`, txt); return show(d, t, { opacity: 0, scale: 1.08 }); };

      // ===== A: ask first, then parts + links =====
      // diagram: A
      M.hook(["Interviewer ka sawal:", "Pehle kya karoge?"], { size: 96, top: 250 });
      panel(A, 70, 480, 940, 780, ACC, null);
      const iv = M.icon(A, "user", 110, 520, 170, ACC); iv.show(0.05);
      const ivl = lab(A, 70, 700, 290, ACC, "INTERVIEWER", 0.1, 34);
      const bub = show(panel(A, 340, 520, 620, 190, CYAN, null), 0.1);
      const bq = show(el(A, `left:340px;width:620px;text-align:center;top:520px;font:700 170px var(--lat);color:${ACC};line-height:1.1`, "?"), 0.15, { opacity: 0, y: 0 });
      const q1 = show(el(A, `left:70px;width:940px;text-align:center;top:800px;font:700 330px var(--lat);color:#5B6A8C;line-height:1`, "?"), 0.2, { opacity: 0, y: 0 });
      gone(q1, at("A", "boxes") - 0.1);
      const rb = [[110, 790, 300, 170], [640, 790, 300, 170], [370, 1010, 320, 170]].map(([x, y, w, h]) => M.box(A, { x, y, w, h, color: "#8592AD" }));
      const rx = rb.map((b) => M.icon(A, "cross", b.cx - 70, b.cy - 70, 140, HOT));
      rb.forEach((b, i) => b.show(at("A", "boxes") + i * 0.12));
      rx.forEach((x, i) => x.show(at("A", "banane") + 0.1 + i * 0.13));
      rb.forEach((b) => b.hide(at("A", "sawal") - 0.35)); rx.forEach((x) => x.hide(at("A", "sawal") - 0.35));
      const askl = show(el(A, `left:70px;width:940px;text-align:center;top:860px;font:800 120px var(--lat);color:${GOOD};white-space:nowrap`, "ASK FIRST"), at("A", "sawal"), { opacity: 0, scale: 0.92 });
      const askq = show(el(A, `left:70px;width:940px;text-align:center;top:1030px;font:600 44px var(--code);color:#A9B6D0;letter-spacing:.06em`, "THEN DRAW"), at("A", "poochho"), { opacity: 0, y: 12 });
      [askl, askq, iv.el, bub, bq, ivl].forEach((d) => gone(d, at("A", "System") - 0.15));
      A.querySelectorAll(":scope > .abs, :scope > .lab").forEach(() => {});
      const pA = M.box(A, { x: 110, y: 640, w: 330, h: 200, label: "APP", icon: "user", color: CYAN, size: 46 });
      const pS = M.box(A, { x: 640, y: 640, w: 330, h: 200, label: "SERVER", icon: "chip", color: CYAN, size: 46 });
      const pD = M.box(A, { x: 375, y: 1000, w: 330, h: 200, label: "DATABASE", icon: "db", color: CYAN, size: 42 });
      const sdl = center(A, 530, 60, ACC, "SYSTEM DESIGN", at("A", "System"), 900);
      pA.show(at("A", "parts") - 0.4); pS.show(at("A", "parts") - 0.2); pD.show(at("A", "parts"));
      const l1 = M.arrow(A, { from: [440, 740], to: [640, 740], color: ACC, w: 12 });
      const l2 = M.arrow(A, { from: [760, 840], to: [640, 1000], color: ACC, w: 12 });
      const l3 = M.arrow(A, { from: [320, 840], to: [440, 1000], color: ACC, w: 12 });
      l1.show(at("A", "jodna")); l2.show(at("A", "jodna") + 0.2); l3.show(at("A", "jodna") + 0.35);
      const linkl = lab(A, 440, 760, 200, ACC, "LINKS", at("A", "jodna") + 0.1, 40);
      const t4a = at("A", "4") - 0.15;
      [pA, pS, pD].forEach((b) => b.hide(t4a)); [l1, l2, l3].forEach((a) => a.hide(t4a)); gone(linkl, t4a); gone(sdl, t4a);
      const tiles = [1, 2, 3, 4].map((n, i) => M.box(A, { x: 100 + (i % 2) * 450, y: 600 + Math.floor(i / 2) * 330, w: 400, h: 290, label: String(n), color: ACC, size: 150 }));
      tiles.forEach((b, i) => b.show(at("A", "4") + i * 0.16));
      lab(A, 70, 1230, 940, ACC, "STEPS", at("A", "steps"), 48).style.top = "1200px";
      M.fit(A, { y: 460, h: 840 });

      // ===== B: the running example, boxes drawn blindly =====
      // diagram: B
      kick(B, "EXAMPLE · FOOD APP", (M.S.B + 0.1));
      const bA = M.box(B, { x: 470, y: 320, w: 500, h: 210, label: "APP", icon: "user", color: CYAN, size: 50 });
      const bS = M.box(B, { x: 470, y: 650, w: 500, h: 210, label: "SERVER", icon: "chip", color: CYAN, size: 50 });
      const bD = M.box(B, { x: 470, y: 980, w: 500, h: 210, label: "DATABASE", icon: "db", color: CYAN, size: 46 });
      bA.show((M.S.B + 0.15)); bS.show(at("B", "server")); bD.show(at("B", "database"));
      const aDown = M.arrow(B, { from: [570, 530], to: [570, 650], color: ACC, w: 10 }), aUp = M.arrow(B, { from: [870, 650], to: [870, 530], color: GOOD, w: 10 });
      const bDown = M.arrow(B, { from: [570, 860], to: [570, 980], color: ACC, w: 10 }), bUp = M.arrow(B, { from: [870, 980], to: [870, 860], color: GOOD, w: 10 });
      aDown.show(at("B", "server") + 0.2); aUp.show(at("B", "server") + 0.35); bDown.show(at("B", "database") + 0.2); bUp.show(at("B", "database") + 0.35);
      aDown.travel(at("B", "Server"), 0.7, "#fff"); aUp.travel(at("B", "jawab"), 0.7, GOOD);
      lab(B, 470, 1205, 500, ACC, "STORES DATA", at("B", "data"), 42);
      const dots = []; for (let i = 0; i < 20; i++) dots.push(el(B, `left:${60 + (i % 4) * 82}px;top:${340 + Math.floor(i / 4) * 82}px;width:58px;height:58px;border-radius:50%;background:${M.ca(ACC, 0.85)}`));
      dots.forEach((d, i) => show(d, i < 3 ? at("B", "100") + i * 0.1 : at("B", "10") + (i - 3) * 0.03, { opacity: 0, scale: 0.4 }));
      const uA = M.arrow(B, { from: [395, 430], to: [468, 430], color: ACC, w: 9 }); uA.show(at("B", "100") + 0.3);
      const u1 = lab(B, 40, 780, 380, ACC, "100 USERS", at("B", "users"), 44); gone(u1, at("B", "10") - 0.1);
      lab(B, 40, 780, 380, ACC, "10 CRORE", at("B", "10") + 0.1, 44);
      const same = stamp(B, "SAME ✓", 235, 960, GOOD, at("B", "wahi"), 60);
      M.fit(B);

      // ===== C: step 1, requirements and scale =====
      // diagram: C
      kick(C, "STEP 1/4 · REQUIREMENTS", (M.S.C + 0.1));
      const s1 = [];
      const cp = show(panel(C, 120, 300, 840, 500, CYAN, "REQUIREMENTS"), (M.S.C + 0.15)); s1.push(cp);
      [["ORDER FOOD", "order", 0, "dena"], ["ACCEPT ORDER", "restaurant", 0, "karna", 1], ["REQUESTS / SEC", "second", 0, "requests"]].forEach(([txt, w, n, w2, n2], i) => {
        show(el(cp, `left:60px;top:${100 + i * 130}px;font:700 52px var(--lat);white-space:nowrap`, txt), at("C", w, n) - 0.05);
        if (i < 2) show(el(cp, `right:60px;top:${100 + i * 130}px;font:800 60px var(--lat);color:${GOOD}`, "✓"), at("C", w2, n2), { opacity: 0, scale: 1.2 });
        else show(el(cp, `right:60px;top:${100 + i * 130}px;font:800 72px var(--lat);color:${ACC}`, "?"), at("C", w2, n2), { opacity: 0, scale: 0.8 });
      });
      s1.push(lab(C, 270, 840, 540, ACC, "REQUEST", at("C", "Request"), 40));
      const cA = M.box(C, { x: 120, y: 920, w: 300, h: 180, label: "APP", icon: "user", color: CYAN });
      const cS = M.box(C, { x: 660, y: 920, w: 300, h: 180, label: "SERVER", icon: "chip", color: CYAN });
      const cr = M.arrow(C, { from: [420, 1010], to: [660, 1010], color: ACC, w: 10 });
      cA.show(at("C", "Request") - 0.3); cS.show(at("C", "Request") - 0.1); cr.show(at("C", "Request") + 0.2); cr.travel(at("C", "sawal"), 0.7, "#fff");
      const t2 = at("C", "maan") - 0.15;
      s1.forEach((d) => gone(d, t2)); [cA, cS].forEach((b) => b.hide(t2)); cr.hide(t2);
      M.pill(C, "EXAMPLE", at("C", "maan"), { x: 395, y: 270, kind: "out", size: 40 });
      center(C, 335, 126, M.TEXT, "1,00,000", at("C", "100000"), 900); lab(C, 90, 480, 900, ACC, "ORDERS / DAY", at("C", "orders", 0), 40);
      center(C, 550, 126, M.TEXT, "÷ 86,400", at("C", "86400"), 900); lab(C, 90, 695, 900, ACC, "SECONDS / DAY", at("C", "seconds"), 40);
      const hr = el(C, `left:150px;top:780px;width:780px;height:6px;border-radius:3px;background:#8592AD;transform-origin:0 50%`); tl.set(hr, { opacity: 0, scaleX: 0 }, 0); tl.to(hr, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, at("C", "average"));
      center(C, 800, 168, ACC, "= 1.16", at("C", "116"), 900); lab(C, 90, 985, 900, ACC, "ORDERS / SEC", at("C", "orders", 1), 40);
      const cSv = M.box(C, { x: 220, y: 1130, w: 640, h: 170, label: "1 SERVER", sub: "ENOUGH ?", subsize: 36, icon: "chip", color: CYAN, size: 42 }); cSv.show(at("C", "server", 1));
      M.fit(C);

      // ===== D: step 2, boxes (only the necessary) =====
      // diagram: D
      kick(D, "STEP 2/4 · BOXES", (M.S.D + 0.1));
      const dA = M.box(D, { x: 50, y: 330, w: 290, h: 300, label: "APP", icon: "user", color: CYAN, size: 48 });
      const dS = M.box(D, { x: 395, y: 330, w: 290, h: 300, label: "SERVER", icon: "chip", color: CYAN, size: 48, sub: "1.16 / SEC", subsize: 36 });
      const dD = M.box(D, { x: 740, y: 330, w: 290, h: 300, label: "DATABASE", icon: "db", color: CYAN, size: 40 });
      dA.show((M.S.D + 0.2)); dS.show(at("D", "boxes") - 0.1); dD.show(at("D", "boxes") + 0.2);
      const d1 = M.arrow(D, { from: [340, 480], to: [395, 480], color: ACC, w: 10 }), d2 = M.arrow(D, { from: [685, 480], to: [740, 480], color: ACC, w: 10 });
      d1.show(at("D", "boxes") + 0.1); d2.show(at("D", "boxes") + 0.4);
      const ghost = (x) => el(D, `left:${x}px;top:900px;width:330px;height:260px;border:5px dashed rgba(133,146,173,.7);border-radius:30px;display:flex;align-items:center;justify-content:center;font:700 54px var(--lat);color:#8592AD`, "EXTRA");
      show(ghost(110), at("D", "sirf")); show(ghost(640), at("D", "sirf") + 0.15);
      const dg1 = M.arrow(D, { from: [470, 630], to: [330, 900], color: "#8592AD", w: 7, dash: true }), dg2 = M.arrow(D, { from: [610, 630], to: [750, 900], color: "#8592AD", w: 7, dash: true });
      dg1.show(at("D", "sirf")); dg2.show(at("D", "sirf") + 0.15);
      const gx = [M.icon(D, "cross", 205, 960, 160, HOT), M.icon(D, "cross", 735, 960, 160, HOT)]; gx[0].show(at("D", "zaruri")); gx[1].show(at("D", "zaruri") + 0.15);
      lab(D, 60, 1215, 960, GOOD, "ONLY NEEDED", at("D", "zaruri") + 0.2, 56);
      M.fit(D);

      // ===== E: step 3, detail of each box =====
      // diagram: E
      kick(E, "STEP 3/4 · DETAIL", (M.S.E + 0.05));
      const eD = M.box(E, { x: 340, y: 320, w: 400, h: 230, label: "DATABASE", icon: "db", color: CYAN, size: 48 }); eD.show((M.S.E + 0.1));
      const eA = M.arrow(E, { from: [540, 555], to: [540, 670], color: ACC, w: 11 }); eA.show(at("E", "database"));
      const tp = show(panel(E, 50, 680, 980, 540, CYAN, "ORDERS TABLE"), at("E", "database"));
      tp.firstChild.style.fontSize = "40px";
      M.pill(E, "EXAMPLE", at("E", "order"), { x: 390, y: 1245, kind: "out", size: 40 });
      const hdr = (x, w, txt, val, val2, w0) => { show(el(tp, `left:${x}px;width:${w}px;top:120px;text-align:center;font:700 64px var(--code);color:${ACC}`, txt), at("E", w0), { opacity: 0, y: 0 });
        show(el(tp, `left:${x}px;width:${w}px;top:290px;text-align:center;font:600 56px var(--code);color:${M.TEXT}`, val), at("E", w0) + 0.3);
        show(el(tp, `left:${x}px;width:${w}px;top:410px;text-align:center;font:600 56px var(--code);color:#A9B6D0`, val2), at("E", w0) + 0.5); };
      hdr(20, 250, "ID", "1042", "1043", "id"); hdr(290, 380, "ITEMS", "biryani", "pizza", "items"); hdr(690, 270, "STATUS", "PLACED", "SENT", "status");
      show(el(tp, `left:30px;top:225px;width:920px;height:3px;background:rgba(150,175,215,.35)`), at("E", "database") + 0.2, { opacity: 0, y: 0 });
      show(el(tp, `left:30px;top:380px;width:920px;height:2px;background:rgba(150,175,215,.2)`), at("E", "items"), { opacity: 0, y: 0 });
      M.fit(E);

      // ===== F: step 4, the balance scale FRESH vs FAST =====
      // diagram: F
      kick(F, "STEP 4/4 · TRADE-OFFS", (M.S.F + 0.15));
      const BX = 540, BY = 440;
      const post = el(F, `left:${BX - 9}px;top:${BY}px;width:18px;height:210px;border-radius:6px;background:#52617F`), base = el(F, `left:${BX - 100}px;top:${BY + 205}px;width:200px;height:20px;border-radius:8px;background:#52617F`);
      const beam = el(F, `left:${BX - 260}px;top:${BY - 8}px;width:520px;height:16px;border-radius:8px;background:#A9B6D0`);
      const piv = el(F, `left:${BX - 22}px;top:${BY - 22}px;width:44px;height:44px;border-radius:50%;background:${ACC}`);
      const pan = (x, txt) => el(F, `left:${x}px;top:${BY}px;width:240px;height:210px`, `<svg width="240" height="150" viewBox="0 0 240 150" style="position:absolute;left:0;top:0"><path d="M120 0 L10 150 M120 0 L230 150" stroke="#A9B6D0" stroke-width="5" fill="none"/></svg><div class="tray" style="position:absolute;left:0;top:150px;width:240px;height:60px;border:3px solid rgba(133,146,173,.8);border-radius:14px;background:rgba(133,146,173,.12);display:flex;align-items:center;justify-content:center;font:800 40px var(--lat);color:#E8EDF6;letter-spacing:.06em">${txt}</div>`);
      const pL = pan(BX - 260 - 120, "FRESH"), pR = pan(BX + 260 - 120, "FAST");
      const t0 = 69.3;
      [post, base, beam, piv, pL, pR].forEach((d, i) => show(d, t0 + i * 0.07, { opacity: 0, y: 0 }));
      tl.set(beam, { rotation: 0, transformOrigin: "50% 50%" }, 0);
      const tip = (t, dir) => { // dir -1: FRESH side down, +1: FAST side down, 0: level
        tl.to(beam, { rotation: dir * 9, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t);
        tl.to(pL, { y: -dir * 40, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t); tl.to(pR, { y: dir * 40, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t); };
      const trayCol = (p, t, on) => tl.to(p.querySelector(".tray"), { borderColor: on ? M.ca(GOOD, 0.95) : "rgba(133,146,173,.8)", backgroundColor: on ? M.ca(GOOD, 0.2) : "rgba(133,146,173,.12)", duration: 0.3, immediateRender: false }, t);
      const fA = M.box(F, { x: 60, y: 960, w: 240, h: 170, label: "APP", icon: "user", color: CYAN, size: 40 });
      const fC = M.box(F, { x: 420, y: 960, w: 240, h: 170, label: "CACHE", icon: "bolt", color: ACC, size: 38 });
