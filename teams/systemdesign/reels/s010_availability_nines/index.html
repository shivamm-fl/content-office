<!doctype html>
<html lang="hi" data-composition-variables='[

  {"id":"voiceSrc","type":"string","label":"Voice track","default":"audio/hi/voice.wav"},

]'>
  <head>

      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }

      /* ===== reel-specific CSS ===== */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="143.5" data-width="1080" data-height="1920">
      <div id="bg" data-layout-allow-overflow>
        <div class="orb" id="orb1" data-layout-allow-overflow></div><div class="orb" id="orb2" data-layout-allow-overflow></div><div class="orb" id="orb3" data-layout-allow-overflow></div>
        <div id="floorwrap" data-layout-allow-overflow><div id="floor" data-layout-allow-overflow></div></div><div id="floorfade"></div>
        <div id="dust" data-layout-allow-overflow></div><div id="scan"></div><div id="vig"></div>
      </div>

      <div id="cam">
        <!-- ===== BEATS: one <div class="beat" id="sX"> per scene id in spec.json (order must match). Content lives at absolute px inside the 1080x1920 canvas, y 170-1300.
             Each beat is a PICTURE of the idea (diagram, map, flow, chart, metaphor), not the spoken sentence: see docs-notes/diagram-first-visuals.md ===== -->
        <div class="beat" id="sA"></div>
        <div class="beat" id="sB"></div>
        <div class="beat" id="sC"></div>
        <div class="beat" id="sD"></div>
        <div class="beat" id="sE"></div>
        <div class="beat" id="sF"></div>
        <div class="beat" id="sG"></div>
        <div class="beat" id="sH"></div>
        <div class="beat" id="sI"></div>
        <div class="beat" id="sJ"></div>
        <div class="beat" id="sK"></div>
        <div class="beat" id="sL"></div>
      </div>

      <div id="prog"><div id="progfill"></div></div>
      <div id="tag"><div id="tagdot"></div><span id="tagtxt"></span></div><div id="handle"></div>
      <div class="brk" id="b1"></div><div class="brk" id="b2"></div><div class="brk" id="b3"></div><div class="brk" id="b4"></div>
      <div id="caps"></div>
      <div id="flash"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="wipe"></div>

      <audio id="voice" src="audio/hi/voice.wav" data-var-src="voiceSrc" data-start="0" data-duration="143.5" data-track-index="20" data-volume="1"></audio>
      <audio id="bed" src="audio/hi/bed.wav" data-var-src="bedSrc" data-start="0" data-duration="143.5" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx" src="audio/hi/sfx.wav" data-var-src="sfxSrc" data-start="0" data-duration="143.5" data-track-index="22" data-volume="1"></audio>
    </div>

    <script>
      const M = Mo.init({ order: ["A","B","C","D","E","F","G","H","I","J","K","L"], tag: "SYSTEM DESIGN · DAY 010 / 150" });
      Viz.install(M);
      const { tl } = M; const { ACC, CYAN, HOT, GOOD } = M;
      const [A, B, C, D, E, F, G, H, I, J, K, L] = ["A","B","C","D","E","F","G","H","I","J","K","L"].map((k) => M.$("#s" + k));
      const at = (sc, w, n) => M.W(sc, w, n);
      const GREY = "#8592AD", INK = "#E8EDF6";
      const el = (host, css, html) => { const d = M.mk("abs", host); d.style.cssText += ";" + css; if (html != null) d.innerHTML = html; return d; };
      const show = (d, t, from) => { tl.set(d, { opacity: 0 }, 0); tl.fromTo(d, from || { opacity: 0, y: 24 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t); return d; };
      const gone = (d, t) => { tl.to(d, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t); return d; };
      const panel = (host, x, y, w, h, col, label) => { const d = M.mk("glass", host); d.style.cssText += `;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${M.ca(col, 0.45)}`;
        if (label) { const l = M.mk("lab", d, label); l.style.cssText += `;left:0;width:${w}px;top:22px;font-size:40px;color:${col}`; } return d; };
      const kick = (host, txt, t, col) => show(el(host, `left:190px;width:700px;text-align:center;top:196px;font:700 46px var(--code);letter-spacing:.14em;color:${col || ACC}`, txt), t, { opacity: 0, y: 0 });
      const lab = (host, x, y, w, col, txt, t, size) => show(el(host, `left:${x}px;width:${w}px;text-align:center;top:${y}px;font:600 ${size || 38}px var(--code);letter-spacing:.06em;color:${col};white-space:nowrap`, txt), t, { opacity: 0, y: 12 });
      const stamp = (host, txt, cx, y, col, t, size, w) => { const W = w || 460; const d = el(host, `left:${cx - W / 2}px;width:${W}px;text-align:center;top:${y}px;padding:14px 0;border:3px solid ${col};border-radius:14px;background:rgba(14,18,30,.95);font:700 ${size || 52}px var(--code);color:${col};white-space:nowrap`, txt); return show(d, t, { opacity: 0, scale: 1.08 }); };
      const card = (host, w, h, cx, y, col, html, size) => el(host, `left:${cx - w / 2}px;top:${y}px;width:${w}px;height:${h}px;border-radius:16px;border:3px solid ${col};background:#16203A;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 ${size || 44}px var(--code);color:${INK};white-space:nowrap`, html);
      const op = (host, txt, cx, y, t, col) => show(el(host, `left:${cx - 60}px;width:120px;text-align:center;top:${y}px;font:800 72px var(--code);color:${col || GREY};white-space:nowrap`, txt), t, { opacity: 0, y: 6 });
      const num = (host, w, h, cx, y, col, html, t, size) => show(card(host, w, h, cx, y, col, html, size), t, { opacity: 0, y: 14 });
      Viz.ICONS.server = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="8" width="48" height="16" rx="4"/><rect x="8" y="28" width="48" height="16" rx="4"/><rect x="8" y="48" width="48" height="12" rx="4"/><path d="M16 16h4M16 36h4"/></g>`;
      Viz.ICONS.phone = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><rect x="16" y="4" width="32" height="56" rx="7"/><path d="M28 52h8"/></g>`;
      Viz.ICONS.balancer = (c) => `<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="12" r="6"/><circle cx="10" cy="52" r="6"/><circle cx="32" cy="52" r="6"/><circle cx="54" cy="52" r="6"/><path d="M32 18v28M29 17L12 46M35 17l17 29"/></g>`;
      const BAR = { x: 60, w: 960 };
      const yearBar = (host, y, t) => { const o = [];
        o.push(show(el(host, `left:${BAR.x}px;top:${y}px;width:${BAR.w}px;height:130px;border-radius:14px;border:3px solid ${M.ca(GOOD, 0.8)};background:${M.ca(GOOD, 0.5)};box-sizing:border-box`), t, { opacity: 0, y: 0 }));
        for (let i = 1; i < 12; i++) o.push(show(el(host, `left:${BAR.x + i * 80}px;top:${y}px;width:2px;height:130px;background:${M.ca("#0E121E", 0.45)}`), t, { opacity: 0, y: 0 }));
        return o; };
      const sliver = (host, x, y, w, t) => show(el(host, `left:${x}px;top:${y - 8}px;width:${w}px;height:146px;background:${HOT};border-radius:3px`), t, { opacity: 0, y: 0 });
      const TIME = ["3.65 DAYS", "8.76 HOURS", "52.6 MIN", "5.26 MIN"];
      const PCT = ["99%", "99.9%", "99.99%", "99.999%"], DOWN = ["1% DOWN", "0.1% DOWN", "0.01% DOWN", "0.001% DOWN"];
      const BW = [520, 52, 5.2, 3], PITCH = 240, ROW0 = 290;
      const ladderRowFull = (host, i, tCard, tBar, tLab, dim) => { const y = ROW0 + i * PITCH, o = [];
        o.push(show(card(host, 380, 190, 250, y, CYAN, `<div style="text-align:center;line-height:1.15"><div style="font-size:70px">${PCT[i]}</div><div style="font-size:40px;color:${HOT}">${DOWN[i]}</div></div>`), tCard, { opacity: 0, y: 14 }));
        o.push(show(el(host, `left:470px;top:${y + 112}px;width:520px;height:64px;border-radius:8px;border:2px solid ${M.ca(GREY, 0.5)};box-sizing:border-box`), tCard, { opacity: 0, y: 0 }));
        const b = el(host, `left:470px;top:${y + 112}px;width:${BW[i]}px;height:64px;border-radius:4px;background:${HOT};transform-origin:0 50%`); tl.set(b, { opacity: 0, scaleX: 0 }, 0); tl.to(b, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, tBar); o.push(b);
        const l = lab(host, 470, y + 22, 520, ACC, TIME[i], tLab, 50); l.style.textAlign = "left"; o.push(l);
        if (dim) tl.to(o, { opacity: 0.3, duration: 0.3, immediateRender: false }, dim);
        return o; };
      const box3 = (host, y, w, labels, t, h, isz, fs) => labels.map(([ic, lb, col], i) => M.box(host, { x: 540 - w / 2 + (i - 1) * (w + 60), y, w, h: h || 190, label: lb, icon: ic, color: col, size: fs || 38, isize: isz || 76 }).show(t[i]));

      // (yearBar/sliver above)
      // ===== A: hook, a year bar with a red sliver, a payment on that day =====
      // diagram: A
      M.hook(["99.9% uptime ka matlab:", "saal mein kitna band?"], { size: 70, top: 230 });
      const aBar = [show(el(A, `left:60px;top:640px;width:960px;height:220px;border-radius:16px;border:3px solid ${M.ca(GOOD, 0.8)};background:${M.ca(GOOD, 0.5)};box-sizing:border-box`), 0.05, { opacity: 0, y: 0 })];
      for (let i = 1; i < 12; i++) aBar.push(show(el(A, `left:${60 + i * 80}px;top:640px;width:2px;height:220px;background:${M.ca("#0E121E", 0.45)}`), 0.05, { opacity: 0, y: 0 }));
      lab(A, 60, 570, 300, GREY, "1 YEAR", 0.1, 46).style.textAlign = "left";
      show(el(A, `left:700px;top:628px;width:14px;height:244px;background:${HOT};border-radius:3px`), at("A", "9", 0), { opacity: 0, y: 0 });
      lab(A, 480, 560, 450, HOT, "≈ 9 HOURS", at("A", "9", 0), 50);
      show(el(A, `left:705px;top:880px;width:0;height:130px;border-left:5px dashed ${M.ca(HOT, 0.8)}`), at("A", "din", 0), { opacity: 0, y: 0 });
      const aPay = panel(A, 424, 1010, 560, 250, HOT, ""); show(aPay, at("A", "payment"), { opacity: 0, y: 14 });
      M.icon(aPay, "phone", 40, 60, 130, GREY).show(at("A", "payment"));
      show(el(aPay, `left:205px;top:92px;font:800 64px var(--code);color:${INK};white-space:nowrap`, "PAYMENT"), at("A", "payment"), { opacity: 0, y: 6 });
      M.icon(A, "cross", 220, 1070, 150, HOT).show(at("A", "karna"));
      M.fit(A, { y: 460, h: 840 });

      // ===== B: uptime and total =====
      // diagram: B
      kick(B, "UPTIME", M.S.B + 0.1, GOOD);
      show(el(B, `left:60px;top:300px;width:960px;height:150px;border-radius:14px;border:3px solid ${M.ca(GREY, 0.6)};box-sizing:border-box`), M.S.B + 0.15, { opacity: 0, y: 0 });
      const bUp = show(el(B, `left:60px;top:300px;width:720px;height:150px;border-radius:14px 0 0 14px;background:${M.ca(GOOD, 0.55)};border:3px solid ${GOOD};box-sizing:border-box`), at("B", "Uptime"), { opacity: 0, y: 0 });
      show(el(B, `left:780px;top:300px;width:240px;height:150px;border-radius:0 14px 14px 0;background:${M.ca(HOT, 0.45)};border:3px solid ${HOT};box-sizing:border-box`), at("B", "Uptime"), { opacity: 0, y: 0 });
      M.icon(B, "check", 110, 330, 90, "#E8EDF6").show(at("B", "chaalu", 0));
      show(el(B, `left:60px;top:470px;width:720px;height:0;border-top:5px solid ${GOOD}`), at("B", "Uptime"), { opacity: 0, y: 0 });
      lab(B, 60, 490, 720, GOOD, "UPTIME", at("B", "Uptime"), 46);
      show(el(B, `left:60px;top:580px;width:960px;height:0;border-top:5px solid ${ACC}`), at("B", "kul"), { opacity: 0, y: 0 });
      lab(B, 60, 600, 960, ACC, "TOTAL TIME", at("B", "kul"), 46);
      lab(B, 60, 345, 720, "#E8EDF6", "UP", at("B", "chaalu", 0), 56); lab(B, 780, 345, 240, "#E8EDF6", "DOWN", at("B", "chaalu", 0), 50);
      num(B, 880, 150, 540, 780, CYAN, "UPTIME ÷ TOTAL", at("B", "Availability", 0), 62);
      op(B, "=", 540, 960, at("B", "Availability", 0) + 0.8);
      num(B, 880, 170, 540, 1060, GOOD, "AVAILABILITY %", at("B", "percent"), 66);
      M.fit(B);

      // ===== C: hours in a year =====
      // diagram: C
      kick(C, "HOURS IN A YEAR", M.S.C + 0.1, ACC);
      num(C, 700, 150, 540, 300, CYAN, "", M.S.C + 0.2);
      M.icon(C, "globe", 230, 320, 110, CYAN).show(M.S.C + 0.2);
      show(el(C, `left:370px;top:337px;font:800 66px var(--code);color:${INK};white-space:nowrap`, "365 DAYS"), at("C", "365"), { opacity: 0, y: 8 });
      op(C, "×", 540, 470, at("C", "times"));
      num(C, 700, 150, 540, 580, ACC, "", at("C", "24"));
      M.icon(C, "clock", 230, 600, 110, ACC).show(at("C", "24"));
      show(el(C, `left:370px;top:617px;font:800 66px var(--code);color:${INK};white-space:nowrap`, "24 HOURS"), at("C", "24"), { opacity: 0, y: 8 });
      op(C, "=", 540, 750, at("C", "yaani"), GOOD);
      num(C, 880, 190, 540, 870, GOOD, "8,760 HOURS", at("C", "8760"), 84);
      M.fit(C);

      // ===== D: 0.1 percent of 8,760 =====
      // diagram: D
      kick(D, "99.9% UP", M.S.D + 0.1, GOOD);
      num(D, 440, 180, 280, 290, GOOD, "99.9% UP", M.S.D + 0.15, 56);
      num(D, 440, 180, 800, 290, HOT, "0.1% DOWN", at("D", "01", 0), 56);
      num(D, 440, 180, 260, 540, ACC, "8,760 H", at("D", "8760", 0), 62);
      op(D, "×", 540, 565, at("D", "01", 1));
      num(D, 440, 180, 820, 540, HOT, "0.1%", at("D", "01", 1), 62);
      op(D, "=", 540, 760, at("D", "876"), GOOD);
      num(D, 860, 210, 540, 860, HOT, "8.76 HOURS", at("D", "876"), 92);
      yearBar(D, 1180, M.S.D + 0.2);
      sliver(D, 700, 1180, 10, at("D", "yahi"));
      lab(D, 470, 1120, 470, HOT, "≈ 9 HOURS", at("D", "9"), 46);
      M.fit(D);

      // ===== E: one more nine, same scale =====
      // diagram: E
      kick(E, "SAME SCALE", M.S.E + 0.1, GREY);
      ladderRowFull(E, 0, M.S.E + 0.15, M.S.E + 0.2, M.S.E + 0.2, M.S.E + 0.7);
      ladderRowFull(E, 1, M.S.E + 0.2, M.S.E + 0.3, M.S.E + 0.3);
      ladderRowFull(E, 2, at("E", "9999%"), at("E", "001"), at("E", "526", 0));
      ladderRowFull(E, 3, at("E", "99999%"), at("E", "0001"), at("E", "526", 1));
      M.fit(E);

      // ===== F: down the ladder, every nine is 10x =====
      // diagram: F
      kick(F, "SAME SCALE", M.S.F + 0.1, GREY);
      const f0 = ladderRowFull(F, 0, M.S.F + 0.15, M.S.F + 0.2, M.S.F + 0.2, M.S.F + 0.7);
      tl.to(f0, { opacity: 1, duration: 0.4, immediateRender: false }, at("F", "99%"));
      [1, 2, 3].forEach((i) => ladderRowFull(F, i, M.S.F + 0.15, M.S.F + 0.2, M.S.F + 0.2));
      [1, 2, 3].forEach((i) => { const y = ROW0 + i * PITCH; const d = el(F, `left:830px;width:190px;text-align:right;top:${y + 22}px;font:800 58px var(--code);color:${GOOD};white-space:nowrap`, "÷ 10"); show(d, at("F", "10") + (i - 1) * 0.18, { opacity: 0, y: 6 }); });
      stamp(F, "EACH NINE = ÷ 10", 540, 1250, ACC, at("F", "nine"), 56, 800);
      M.fit(F);

      // ===== G: the chain of parts =====
      // diagram: G
      M.icon(G, "phone", 440, 230, 110, GREY).show(M.S.G + 0.1);
      const gW = 640, gX = 220;
      const gB = [["balancer", "LOAD BALANCER", "load", 410], ["server", "APP SERVER", "app", 620], ["db", "DATABASE", "database", 830]];
      gB.forEach(([ic, lb, w, y], i) => { M.box(G, { x: gX, y, w: gW, h: 160, label: lb, icon: ic, color: CYAN, size: 40, isize: 56 }).show(i === 0 ? at("G", w, 0) : at("G", w, i === 1 ? 1 : 0));
        M.arrow(G, { from: [540, y - 55], to: [540, y - 4], color: GREY, w: 8 }).show(i === 0 ? M.S.G + 0.2 : at("G", w, i === 1 ? 1 : 0) - 0.2, 0.25); });
      const gR = [410, 620, 830].map((y) => show(el(G, `left:${gX}px;top:${y}px;width:${gW}px;height:160px;border-radius:16px;border:5px solid ${GOOD};box-sizing:border-box`), at("G", "teenon"), { opacity: 0, y: 0 }));
      stamp(G, "ALL 3 NEEDED", 540, 1040, GOOD, at("G", "teenon"), 56, 640);
      M.icon(G, "check", 700, 1170, 90, GOOD).show(at("G", "payment"));
      lab(G, 300, 1180, 400, GOOD, "PAYMENT", at("G", "payment"), 46).style.textAlign = "right";
      M.fit(G);

      // ===== H: multiply =====
      // diagram: H
      M.pill(H, "EXAMPLE", at("H", "EXAMPLE"), { x: 390, y: 200, kind: "out", size: 46 });
      box3(H, 320, 270, [["balancer", "BALANCER", CYAN], ["server", "APP", CYAN], ["db", "DATABASE", CYAN]], [M.S.H + 0.1, M.S.H + 0.15, M.S.H + 0.2], 250, 100, 40);
      [210, 540, 870].forEach((cx, i) => num(H, 270, 160, cx, 630, GOOD, "0.999", at("H", "0999", i), 60));
      op(H, "×", 375, 650, at("H", "times", 0));
      op(H, "×", 705, 650, at("H", "times", 1));
      op(H, "=", 540, 820, at("H", "yaani"), GOOD);
      num(H, 760, 210, 540, 930, GOOD, "0.997", at("H", "0997"), 100);
      stamp(H, "MULTIPLY", 540, 1190, ACC, at("H", "multiply"), 60, 540);
      M.fit(H);

      // ===== I: 26 hours against 9 =====
      // diagram: I
      num(I, 520, 140, 540, 220, GOOD, "99.7%", at("I", "997%"), 84);
      num(I, 520, 120, 540, 400, HOT, "0.3% DOWN", at("I", "03"), 52);
      lab(I, 60, 580, 400, GREY, "3 PARTS", at("I", "26"), 46).style.textAlign = "left";
      const iB1 = el(I, `left:60px;top:640px;width:867px;height:100px;border-radius:10px;background:${HOT};transform-origin:0 50%;display:flex;align-items:center;padding-left:28px;box-sizing:border-box;font:800 56px var(--code);color:#fff`, "26 H"); tl.set(iB1, { opacity: 0, scaleX: 0 }, 0); tl.to(iB1, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, at("I", "26"));
      lab(I, 60, 790, 400, GREY, "1 PART", at("I", "9")  - 0.2, 46).style.textAlign = "left";
      const iB2 = el(I, `left:60px;top:850px;width:300px;height:100px;border-radius:10px;background:${M.ca(HOT, 0.75)};transform-origin:0 50%;display:flex;align-items:center;padding-left:28px;box-sizing:border-box;font:800 56px var(--code);color:#fff`, "9 H"); tl.set(iB2, { opacity: 0, scaleX: 0 }, 0); tl.to(iB2, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, at("I", "9"));
      stamp(I, "≈ 3× MORE DOWN", 540, 1040, HOT, at("I", "teen"), 54, 700);
      M.fit(I);

      // ===== J: more parts, less availability =====
      // diagram: J
      show(el(J, `left:70px;top:513px;width:940px;height:6px;background:${M.ca(GREY, 0.5)}`), M.S.J + 0.1, { opacity: 0, y: 0 });
      const jS = [0, 1, 2, 3, 4, 5].map((i) => M.icon(J, "server", 70 + i * 160, 440, 150, CYAN));
